function safeNum(v){
  const n=Number(String(v??"").replace(/,/g,""));
  return Number.isFinite(n)?n:0;
}

function fmtNum(v){
  const n=safeNum(v);
  return n.toLocaleString("zh-TW");
}

function fmtPrice(v){
  const n=safeNum(v);
  if(!n) return "-";
  return n.toFixed(2);
}

function pct(a,b){
  a=safeNum(a); b=safeNum(b);
  if(!b) return 0;
  return (a/b-1)*100;
}

function average(arr){
  const x=arr.map(Number).filter(Number.isFinite);
  return x.length?x.reduce((a,b)=>a+b,0)/x.length:0;
}

function calcMA(rows,n){
  const prices=rows.map(r=>safeNum(r.close??r.Close??r.收盤價)).filter(v=>v>0);
  if(prices.length<n) return 0;
  return average(prices.slice(-n));
}

function normalizeDate(v){
  if(!v) return "";
  const s=String(v);
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  if(/^\d{8}$/.test(s)) return s.slice(0,4)+"-"+s.slice(4,6)+"-"+s.slice(6,8);
  return s.slice(0,10);
}

function getRowDate(r){
  return normalizeDate(r.date??r.Date??r.日期??r.年月日);
}

function getClose(r){
  return safeNum(r.close??r.Close??r.收盤價??r.close_price);
}

function getOpen(r){
  return safeNum(r.open??r.Open??r.開盤價??r.open_price);
}

function getHigh(r){
  return safeNum(r.max??r.high??r.High??r.最高價??r.high_price);
}

function getLow(r){
  return safeNum(r.min??r.low??r.Low??r.最低價??r.low_price);
}

function getVolume(r){
  return safeNum(r.Trading_Volume??r.volume??r.Volume??r.成交股數??r.成交量);
}

function normalizePriceRows(data){
  const rows=Array.isArray(data)?data:(data&&Array.isArray(data.data)?data.data:[]);
  return rows.map(r=>({
    date:getRowDate(r),
    open:getOpen(r),
    high:getHigh(r),
    low:getLow(r),
    close:getClose(r),
    volume:getVolume(r),
    raw:r
  })).filter(r=>r.date);
}

function calcIndicators(rows){
  const x=normalizePriceRows(rows).sort((a,b)=>a.date.localeCompare(b.date));
  const closes=x.map(r=>r.close).filter(v=>v>0);
  const last=closes.length?closes[closes.length-1]:0;
  const ma5=closes.length>=5?average(closes.slice(-5)):0;
  const ma20=closes.length>=20?average(closes.slice(-20)):0;
  const ma60=closes.length>=60?average(closes.slice(-60)):0;
  const ma120=closes.length>=120?average(closes.slice(-120)):0;
  const ma240=closes.length>=240?average(closes.slice(-240)):0;
  return {rows:x,close:last,ma5,ma20,ma60,ma120,ma240};
}

function levelPrice(price,step){
  price=safeNum(price);
  step=safeNum(step)||3;
  return {
    up1:price*(1+step/100),
    up2:price*(1+step*2/100),
    up3:price*(1+step*3/100),
    down1:price*(1-step/100),
    down2:price*(1-step*2/100),
    down3:price*(1-step*3/100)
  };
}

function renderStockCard(stock){
  const box=document.getElementById("stockResult");
  if(!box) return;
  const price=safeNum(stock.price);
  const prev=safeNum(stock.prev);
  const change=price-prev;
  const changePct=prev?change/prev*100:0;
  const cls=change>0?"up":change<0?"down":"flat";
  const ma5=safeNum(stock.ma5);
  const ma20=safeNum(stock.ma20);
  box.innerHTML=`
    <div class="stockHero">
      <div>
        <div class="stockCode">${stock.id||"-"}</div>
        <div class="stockName">${stock.name||"-"}</div>
      </div>
      <div class="stockPrice ${cls}">
        ${fmtPrice(price)}
        <small>${change>=0?"+":""}${change.toFixed(2)} (${changePct.toFixed(2)}%)</small>
      </div>
    </div>
    <div class="metricGrid">
      <div><span>開盤</span><b>${fmtPrice(stock.open)}</b></div>
      <div><span>最高</span><b>${fmtPrice(stock.high)}</b></div>
      <div><span>最低</span><b>${fmtPrice(stock.low)}</b></div>
      <div><span>成交量</span><b>${fmtNum(stock.volume)}</b></div>
      <div><span>5日均線</span><b>${fmtPrice(ma5)}</b></div>
      <div><span>20日均線</span><b>${fmtPrice(ma20)}</b></div>
    </div>
  `;
}

async function searchStock(){
  const input=document.getElementById("searchInput");
  const q=String(input?.value||"").trim();
  if(!q){
    renderEmptyResult("請輸入股票代號或名稱");
    return;
  }

  dashLog("搜尋："+q);
  const btn=document.getElementById("searchBtn");
  if(btn){
    btn.disabled=true;
    btn.classList.add("loading");
  }

  try{
    const universe=await loadFullUniverse(false);
    const s=universe.find(x=>{
      const id=String(x.id||"").toUpperCase();
      const name=String(x.name||"");
      return id===q.toUpperCase() || name.includes(q);
    });

    if(!s){
      renderEmptyResult("找不到符合的股票／ETF");
      dashLog("搜尋不到："+q);
      return;
    }

    const data=await buildStock(s.id);
    if(data){
      renderStockCard(data);
      window.M1391_CURRENT_STOCK=data;
      dashLog(`${s.id} ${s.name||""} 資料完成`);
    }else{
      renderEmptyResult("資料讀取失敗：Load failed");
      dashLog(`${s.id} 資料讀取失敗`);
    }
  }catch(e){
    console.error(e);
    renderEmptyResult("資料讀取失敗："+(e?.message||"Load failed"));
    dashLog("搜尋失敗："+(e?.message||"Load failed"));
  }finally{
    if(btn){
      btn.disabled=false;
      btn.classList.remove("loading");
    }
  }
}

  const input=document.getElementById("searchInput");

  if(btn) btn.addEventListener("click",searchStock);
  if(input){
    input.addEventListener("keydown",e=>{
      if(e.key==="Enter") searchStock();
    });
  }
}

function renderScanRows(rows,targetId){
  const box=document.getElementById(targetId);
  if(!box) return;
  if(!rows.length){
    box.innerHTML=`<div class="scanEmpty">目前沒有符合條件的標的</div>`;
    return;
  }
  box.innerHTML=rows.map((r,i)=>`
    <div class="scanRow">
      <div class="rank">${i+1}</div>
      <div class="scanCode">${r.id||"-"}</div>
      <div class="scanName">${r.name||""}</div>
      <div class="scanPrice">${fmtPrice(r.price)}</div>
      <div class="scanPct">${safeNum(r.changePct).toFixed(2)}%</div>
    </div>
  `).join("");
}

async function scanInstitution(){
  const status=document.getElementById("institutionStatus");
  if(status) status.textContent="分析中…";
  dashLog("開始三大法人掃描");
  try{
    const universe=await loadFullUniverse(false);
    const result=[];
    let done=0;
    for(const s of universe){
      try{
        const d=await buildStock(s.id);
        if(d){
          const total=safeNum(d.foreign)+safeNum(d.investment)+safeNum(d.dealer);
          if(total>0) result.push({...d,total});
        }
      }catch(e){}
      done++;
      if(done%10===0){
        dashLog(`法人掃描 ${done}/${universe.length}`);
      }
    }
    result.sort((a,b)=>b.total-a.total);
    renderScanRows(result.slice(0,20),"institutionResults");
    if(status) status.textContent=`完成｜全市場 ${universe.length} 檔｜符合 ${result.length} 檔`;
    dashLog(`法人掃描完成｜符合 ${result.length} 檔`);
  }catch(e){
    if(status) status.textContent="掃描失敗";
    dashLog("法人掃描失敗："+(e?.message||""));
  }
}

async function scanETF(){
  const status=document.getElementById("etfStatus");
  if(status) status.textContent="分析中…";
  dashLog("開始 ETF 掃描");
  try{
    const universe=await loadFullUniverse(false);
    const etfs=universe.filter(s=>s.type==="ETF" || /^00\d{3,4}[A-Z]?$/.test(String(s.id||"")));
    const result=[];
    let done=0;
    for(const s of etfs){
      try{
        const d=await buildStock(s.id);
        if(d) result.push(d);
      }catch(e){}
      done++;
      if(done%10===0) dashLog(`ETF 掃描 ${done}/${etfs.length}`);
    }
    result.sort((a,b)=>safeNum(b.volume)-safeNum(a.volume));
    renderScanRows(result.slice(0,20),"etfResults");
    if(status) status.textContent=`完成｜全市場 ${etfs.length} 檔｜符合 ${result.length} 檔`;
    dashLog(`ETF 掃描完成｜符合 ${result.length} 檔`);
  }catch(e){
    if(status) status.textContent="掃描失敗";
    dashLog("ETF 掃描失敗："+(e?.message||""));
  }
}

function initQuickButtons(){
  document.querySelectorAll("[data-action]").forEach(btn=>{
    btn.addEventListener("click",()=>{
      const action=btn.dataset.action;
      if(action==="search"){
        document.getElementById("searchInput")?.focus();
      }else if(action==="today"){
        fetchTodaySnapshot(false);
      }else if(action==="institution"){
        scanInstitution();
      }else if(action==="etf"){
        scanETF();
      }
    });
  });
}

function updateTime(){
  const el=document.getElementById("liveTime");
  if(el){
    const d=new Date();
    el.textContent=d.toLocaleTimeString("zh-TW",{hour12:false});
  }
}

function initClock(){
  updateTime();
  setInterval(updateTime,1000);
}

function initNav(){
  document.querySelectorAll(".navItem").forEach(item=>{
    item.addEventListener("click",()=>{
      document.querySelectorAll(".navItem").forEach(x=>x.classList.remove("active"));
      item.classList.add("active");
      const target=item.dataset.target;
      if(target){
        const el=document.getElementById(target);
        if(el) el.scrollIntoView({behavior:"smooth",block:"start"});
      }
    });
  });
}

function init(){
  bindSearch();
  initQuickButtons();
  initClock();
  initNav();

  const fetchBtn=document.getElementById("fetchTodayBtn");
  const refreshBtn=document.getElementById("refreshCloseBtn");

  if(fetchBtn){
    fetchBtn.addEventListener("click",()=>{
      fetchTodaySnapshot(false);
    });
  }

  if(refreshBtn){
    refreshBtn.addEventListener("click",()=>{
      fetchTodaySnapshot(true);
    });
  }

  dashLog("M1391 V17 已啟動");
  dashLog("等待建立今日資料庫");
  updateDashboardSummary();
}

document.addEventListener("DOMContentLoaded",init);

window.M1391={
  search:searchStock,
  refresh:()=>fetchTodaySnapshot(true),
  scanInstitution,
  scanETF,
  loadFullUniverse,
  buildStock
};

</script>

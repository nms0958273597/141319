<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080a0c">

<title>m1491｜動態台股法人籌碼與突破分析 V1491</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

:root{
  --bg:#080a0c;
  --panel:#101419;
  --panel2:#151a20;
  --panel3:#1b222a;
  --line:#28313a;
  --text:#f2f5f7;
  --muted:#8e9aa5;
  --green:#21d07a;
  --red:#ff5263;
  --yellow:#ffc857;
  --blue:#4da3ff;
  --cyan:#35d6e7;
  --orange:#ff9f43;
  --purple:#a77bff;
  --shadow:0 10px 30px rgba(0,0,0,.28);
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  padding:0;
  background:
    radial-gradient(circle at top,#141a20 0,#080a0c 42%);
  color:var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "PingFang TC",
    "Noto Sans TC",
    "Microsoft JhengHei",
    sans-serif;
  min-height:100vh;
}

button,
input,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

button:disabled{
  cursor:not-allowed;
  opacity:.5;
}

/* =========================
   頂部
========================= */

.topbar{
  position:sticky;
  top:0;
  z-index:1000;
  padding:
    calc(10px + env(safe-area-inset-top))
    14px
    10px;
  background:rgba(8,10,12,.94);
  backdrop-filter:blur(16px);
  border-bottom:1px solid rgba(255,255,255,.06);
}

.topbar-inner{
  max-width:1180px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.brand{
  min-width:0;
}

.brand-title{
  font-size:20px;
  font-weight:900;
  letter-spacing:.5px;
}

.brand-sub{
  margin-top:3px;
  color:var(--muted);
  font-size:11px;
}

.status{
  display:flex;
  align-items:center;
  gap:6px;
  white-space:nowrap;
  font-size:11px;
  color:var(--muted);
}

.status-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--green);
  box-shadow:0 0 10px rgba(33,208,122,.7);
}

/* =========================
   主容器
========================= */

.container{
  width:min(1180px,calc(100% - 20px));
  margin:14px auto 50px;
}

/* =========================
   搜尋區
========================= */

.search-panel{
  position:relative;
  background:linear-gradient(
    145deg,
    rgba(21,26,32,.98),
    rgba(13,17,21,.98)
  );
  border:1px solid var(--line);
  border-radius:18px;
  padding:14px;
  box-shadow:var(--shadow);
}

.search-row{
  display:flex;
  gap:8px;
}

.search-input-wrap{
  position:relative;
  flex:1;
}

#searchInput{
  width:100%;
  height:46px;
  padding:0 14px;
  border-radius:12px;
  border:1px solid #313b45;
  outline:none;
  color:var(--text);
  background:#090c0f;
  transition:.2s;
}

#searchInput:focus{
  border-color:var(--blue);
  box-shadow:0 0 0 3px rgba(77,163,255,.12);
}

#searchInput::placeholder{
  color:#65717d;
}

.primary-btn{
  min-width:82px;
  height:46px;
  border:0;
  border-radius:12px;
  padding:0 16px;
  color:#fff;
  font-weight:800;
  background:linear-gradient(135deg,#1677ff,#315dff);
  box-shadow:0 7px 18px rgba(49,93,255,.22);
}

.primary-btn:active{
  transform:translateY(1px);
}

.search-candidates{
  display:none;
  margin-top:8px;
  border:1px solid var(--line);
  border-radius:12px;
  overflow:hidden;
  background:#0b0f13;
}

.search-candidates.show{
  display:block;
}

.search-candidate{
  width:100%;
  border:0;
  border-bottom:1px solid rgba(255,255,255,.06);
  padding:11px 13px;
  text-align:left;
  color:var(--text);
  background:transparent;
}

.search-candidate:last-child{
  border-bottom:0;
}

.search-candidate:active,
.search-candidate:hover{
  background:#151c23;
}

.candidate-code{
  display:inline-block;
  min-width:58px;
  color:var(--cyan);
  font-weight:800;
}

.candidate-name{
  color:#e9edf0;
}

/* =========================
   快速按鈕
========================= */

.quick-panel{
  margin-top:12px;
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.quick-btn{
  border:1px solid #303943;
  background:#11161b;
  color:#dce2e7;
  border-radius:10px;
  min-height:38px;
  padding:0 13px;
  font-size:13px;
  font-weight:700;
}

.quick-btn:hover{
  border-color:#4b5966;
  background:#182027;
}

.quick-btn:active{
  transform:scale(.98);
}

/* =========================
   熱門20
========================= */

.hot20-wrap{
  margin-top:12px;
}

.hot20-btn{
  width:100%;
  min-height:48px;
  border:1px solid rgba(255,159,67,.45);
  border-radius:13px;
  color:#fff;
  font-weight:900;
  font-size:15px;
  background:
    linear-gradient(
      135deg,
      rgba(255,87,34,.95),
      rgba(255,159,67,.9)
    );
  box-shadow:
    0 8px 22px rgba(255,100,30,.18);
}

.hot20-btn:active{
  transform:translateY(1px);
}

.hot20-btn.loading{
  opacity:.72;
  pointer-events:none;
}

/* =========================
   Loading
========================= */

.loading-box{
  display:none;
  margin-top:12px;
  padding:14px;
  border:1px solid var(--line);
  border-radius:13px;
  background:#0d1217;
  color:var(--muted);
  text-align:center;
  font-size:13px;
}

.loading-box.show{
  display:block;
}

.loading-dot{
  display:inline-block;
  width:7px;
  height:7px;
  margin-right:5px;
  border-radius:50%;
  background:var(--cyan);
  animation:pulse 1s infinite alternate;
}

@keyframes pulse{
  from{opacity:.25}
  to{opacity:1}
}

/* =========================
   股票主資訊
========================= */

.stock-card{
  margin-top:14px;
  background:
    linear-gradient(
      145deg,
      rgba(20,25,31,.98),
      rgba(12,16,20,.98)
    );
  border:1px solid var(--line);
  border-radius:18px;
  padding:16px;
  box-shadow:var(--shadow);
}

.stock-head{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:12px;
}

.stock-name{
  font-size:25px;
  font-weight:950;
  line-height:1.2;
}

.stock-code{
  color:var(--cyan);
  font-size:13px;
  font-weight:800;
  margin-top:5px;
}

.stock-market{
  color:var(--muted);
  font-size:11px;
  margin-top:3px;
}

.price-box{
  text-align:right;
}

.current-price{
  font-size:30px;
  line-height:1;
  font-weight:950;
}

.price-change{
  margin-top:6px;
  font-size:13px;
  font-weight:800;
}

.up{
  color:var(--red);
}

.down{
  color:var(--green);
}

.flat{
  color:var(--muted);
}

/* =========================
   資訊格
========================= */

.info-grid{
  margin-top:15px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
}

.info-item{
  min-height:65px;
  padding:10px;
  border-radius:11px;
  border:1px solid rgba(255,255,255,.055);
  background:#0b0f13;
}

.info-label{
  color:var(--muted);
  font-size:10px;
  margin-bottom:5px;
}

.info-value{
  color:#f1f4f6;
  font-size:14px;
  font-weight:850;
}

/* =========================
   區塊標題
========================= */

.section-title{
  display:flex;
  align-items:center;
  gap:8px;
  margin:18px 0 9px;
  font-size:16px;
  font-weight:900;
}

.section-title::before{
  content:"";
  width:4px;
  height:18px;
  border-radius:3px;
  background:var(--blue);
}

.section-title.orange::before{
  background:var(--orange);
}

.section-title.green::before{
  background:var(--green);
}

.section-title.red::before{
  background:var(--red);
}

/* =========================
   技術分析
========================= */

.level-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
}

.level-card{
  padding:13px 10px;
  border-radius:13px;
  border:1px solid var(--line);
  background:#0d1217;
  text-align:center;
}

.level-label{
  color:var(--muted);
  font-size:11px;
  margin-bottom:6px;
}

.level-value{
  font-size:18px;
  font-weight:950;
}

.support1{
  color:#48d6a0;
}

.support2{
  color:#22b981;
}

.resistance1{
  color:#ffbd69;
}

.resistance2{
  color:#ff6f78;
}

/* =========================
   交易策略
========================= */

.trade-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
}

.trade-card{
  padding:13px 10px;
  border-radius:13px;
  background:#0d1217;
  border:1px solid var(--line);
  text-align:center;
}

.trade-label{
  color:var(--muted);
  font-size:11px;
}

.trade-value{
  margin-top:6px;
  font-size:19px;
  font-weight:950;
}

.entry{
  color:var(--blue);
}

.stop{
  color:var(--red);
}

.tp1{
  color:var(--yellow);
}

.tp2{
  color:var(--green);
}

/* =========================
   法人籌碼
========================= */

.chip-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
}

.chip-card{
  padding:12px 10px;
  border:1px solid var(--line);
  border-radius:13px;
  background:#0d1217;
}

.chip-label{
  color:var(--muted);
  font-size:11px;
}

.chip-value{
  margin-top:6px;
  font-size:17px;
  font-weight:900;
}

.chip-sub{
  margin-top:4px;
  font-size:10px;
  color:#697681;
}

/* =========================
   熱門20結果
========================= */

.hot20-panel{
  margin-top:14px;
  display:none;
  background:#0d1217;
  border:1px solid var(--line);
  border-radius:16px;
  overflow:hidden;
}

.hot20-panel.show{
  display:block;
}

.hot20-head{
  padding:13px 14px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid var(--line);
}

.hot20-title{
  font-weight:900;
}

.hot20-time{
  color:var(--muted);
  font-size:10px;
}

.hot20-list{
  display:flex;
  flex-direction:column;
}

.hot-row{
  display:grid;
  grid-template-columns:38px 1fr 72px 72px;
  gap:8px;
  align-items:center;
  padding:11px 12px;
  border-bottom:1px solid rgba(255,255,255,.05);
}

.hot-row:last-child{
  border-bottom:0;
}

.hot-rank{
  color:var(--yellow);
  font-weight:950;
  text-align:center;
}

.hot-name{
  min-width:0;
}

.hot-name strong{
  display:block;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.hot-name small{
  color:var(--muted);
  font-size:10px;
}

.hot-price{
  text-align:right;
  font-weight:850;
}

.hot-change{
  text-align:right;
  font-weight:850;
}

/* =========================
   錯誤提示
========================= */

.message{
  display:none;
  margin-top:12px;
  padding:12px 14px;
  border-radius:12px;
  border:1px solid rgba(255,82,99,.28);
  background:rgba(255,82,99,.08);
  color:#ff9aa5;
  font-size:13px;
  line-height:1.6;
}

.message.show{
  display:block;
}

.empty{
  padding:25px 15px;
  text-align:center;
  color:var(--muted);
}

/* =========================
   Footer
========================= */

.footer{
  margin-top:25px;
  padding:18px 8px 35px;
  color:#58636d;
  font-size:10px;
  line-height:1.7;
  text-align:center;
}

/* =========================
   RWD
========================= */

@media(max-width:760px){

  .container{
    width:calc(100% - 12px);
    margin-top:9px;
  }

  .topbar{
    padding-left:10px;
    padding-right:10px;
  }

  .brand-title{
    font-size:17px;
  }

  .brand-sub{
    font-size:9px;
  }

  .search-panel{
    padding:10px;
    border-radius:15px;
  }

  .search-row{
    gap:6px;
  }

  #searchInput{
    height:44px;
    padding:0 11px;
    font-size:14px;
  }

  .primary-btn{
    min-width:70px;
    padding:0 11px;
  }

  .quick-panel{
    gap:6px;
  }

  .quick-btn{
    min-height:35px;
    padding:0 10px;
    font-size:12px;
  }

  .stock-card{
    padding:13px;
    border-radius:15px;
  }

  .stock-name{
    font-size:21px;
  }

  .current-price{
    font-size:25px;
  }

  .info-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .level-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .trade-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .chip-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .hot-row{
    grid-template-columns:32px 1fr 64px 64px;
    gap:5px;
    padding:10px 8px;
  }

}

@media(max-width:390px){

  .info-item{
    padding:9px;
  }

  .info-value{
    font-size:13px;
  }

  .level-value,
  .trade-value{
    font-size:17px;
  }

  .hot-row{
    grid-template-columns:28px 1fr 58px 58px;
    font-size:12px;
  }

}
</style>

<header class="topbar">
  <div class="topbar-inner">

    <div class="brand">

<main class="container">

    <!-- 搜尋候選 -->
    <div

    ></div>


    <!-- =========================
         快速股票
    ========================== -->

    <div
      id="quickButtons"

      <button

      <button

    ========================== -->

    <div
      class="quick-panel"

  <!-- =====================================================

  <!-- =====================================================

  <footer class="footer">

</main>

     JavaScript 開始

<script>

"use strict";


/* =========================================================
   DOM
========================================================= */

const $ = id =>
  document.getElementById(id);


const searchInput =
  $("searchInput");

const searchBtn =
  $("searchBtn");

const searchCandidates =
  $("searchCandidates");

const hot20ScanBtn =
  $("hot20ScanBtn");

const hot20DynamicBtn =
  $("hot20DynamicBtn");

const original30ScanBtn =
  $("original30ScanBtn");

const confirmedBreakoutBtn =
  $("confirmedBreakoutBtn");

const readyBreakoutBtn =
  $("readyBreakoutBtn");

const bullishScanBtn =
  $("bullishScanBtn");

const scanResultPanel =
  $("scanResultPanel");

const scanResultTitle =
  $("scanResultTitle");

const scanResultTime =
  $("scanResultTime");

const scanResultList =
  $("scanResultList");

const hot20Panel =
  $("hot20Panel");

const hot20List =
  $("hot20List");

const hot20Time =
  $("hot20Time");

const stockCard =
  $("stockCard");

const loadingBox =
  $("loadingBox");

const loadingText =
  $("loadingText");

const messageBox =
  $("message");

const systemStatus =
  $("systemStatus");


/* =========================================================
   官方資料來源

/* =========================================================
   工具：數字
========================================================= */

function num(value){

  if(
    value === null ||
    value === undefined ||
    value === "" ||
    value === "--" ||
    value === "-"
  ){

    return NaN;

  }


  const n =
    Number(
      String(value)
        .replace(/,/g,"")
        .replace(/%/g,"")
        .trim()
    );


  return Number.isFinite(n)
    ? n
    : NaN;

}


/* =========================================================
   工具：安全數字
========================================================= */

function safeNum(
  value,
  fallback=0
){

  const n =
    num(value);

  return Number.isFinite(n)
    ? n
    : fallback;

}


/* =========================================================
   工具：格式化
========================================================= */

function fmt(
  value,
  digits=2
){

  const n =
    num(value);


  if(
    !Number.isFinite(n)
  ){

    return "--";

  }


  return n.toLocaleString(
    "zh-TW",
    {
      minimumFractionDigits:
        digits,

      maximumFractionDigits:
        digits
    }
  );

}


function fmtInt(value){

  const n =
    num(value);


  if(
    !Number.isFinite(n)
  ){

    return "--";

  }


  return Math.round(n)
    .toLocaleString(
      "zh-TW"
    );

}


/* =========================================================
   工具：百分比
========================================================= */

function pct(
  value,
  digits=2
){

  const n =
    num(value);


  if(
    !Number.isFinite(n)
  ){

    return "--";

  }


  return (
    n.toFixed(digits) +
    "%"
  );

}


/* =========================================================
   工具：HTML Escape
========================================================= */

function esc(value){

  return String(
    value ?? ""
  )
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");

}

function isStockCode(

){

    .test(
      normalizeCode(value)
    );

}


/* =========================================================
   API Fetch
========================================================= */

async function fetchJSON(
  url,
  options={}
){

  const controller =
    new AbortController();


  const timeout =
    setTimeout(
      ()=>{
        controller.abort();
      },
      options.timeout || 15000
    );


  try{

    const response =
      await fetch(
        url,
        {
          ...options,
          signal:
            controller.signal,
          cache:"no-store"
        }
      );


    if(
      !response.ok
    ){

      throw new Error(
        `HTTP ${response.status}`
      );

    }


    return await response.json();

  }
  finally{

    clearTimeout(
      timeout
    );

  }

}


/* =========================================================
   API URL 建立
========================================================= */

function apiURL(
  base,
  params={}
){

  const url =
    new URL(base);


  Object.entries(
    params
  )
  .forEach(
    ([key,value])=>{

      if(
        value !== undefined &&
        value !== null &&
        value !== ""
      ){

        url.searchParams.set(
          key,
          value
        );

      }

    }
  );


  /*
   * 防止瀏覽器快取舊資料。
   */

  url.searchParams.set(
    "_",
    Date.now().toString()
  );


  return url.toString();

}

/* =========================================================
   官方資料欄位工具
========================================================= */

function pick(
  obj,
  ...keys
){

  if(!obj){
    return undefined;
  }


  for(
    const key of keys
  ){

    if(
      Object.prototype.hasOwnProperty.call(
        obj,
        key
      )
    ){

      const value =
        obj[key];


      if(
        value !== undefined &&
        value !== null &&
        value !== ""
      ){

        return value;

      }

    }

  }


  return undefined;

}

/* =========================================================
   建立搜尋資料
========================================================= */

function makeUniverseItem(
  row,
  market=""
){

  const code =
    normalizeCode(
      getCode(row)
    );


  const name =
    normalizeName(
      getName(row)
    );


  if(
    !code ||
    !isStockCode(code)
  ){

    return null;

  }


  return {

    code,
    name,
    market:
      market ||
      pick(
        row,
        "market",
        "Market",
        "市場別"
      ) ||
      "",

    raw:row

  };

}


/* =========================================================
   合併 KNOWN
   ---------------------------------------------------------
   KNOWN 只能當補充。
   不能把搜尋範圍限制在 KNOWN。
========================================================= */

function mergeKnownUniverse(
  list
){

  const map =
    new Map();


  for(
    const item of list || []
  ){

    if(
      !item ||
      !item.code
    ){

      continue;

    }


    const old =
      map.get(
        item.code
      );


    if(!old){

      map.set(
        item.code,
        item
      );

      continue;

    }


    /*
     * 如果官方資料沒有名稱，
     * 用 KNOWN 補名稱。
     */

    if(
      (!old.name ||
       old.name === old.code) &&
      item.name
    ){

      old.name =
        item.name;

    }

  }


  Object.values(
    KNOWN
  )
  .forEach(
    known=>{

      if(
        !known ||
        !known.code
      ){

        return;

      }


      const code =
        normalizeCode(
          known.code
        );


      const old =
        map.get(
          code
        );


      if(!old){

        map.set(
          code,
          {
            ...known,
            code
          }
        );

        return;

      }


      if(
        !old.name &&
        known.name
      ){

        old.name =
          known.name;

      }


      if(
        !old.market &&
        known.market
      ){

        old.market =
          known.market;

      }

    }
  );


  return Array.from(
    map.values()
  );

}

/* =========================================================
   建立完整搜尋資料庫
========================================================= */

async function getStockUniverse(
  force=false
){

  /*
   * 已有資料且沒有超過快取時間，
   * 直接使用。
   */

  if(
    !force &&
    state.universeLoaded &&
    state.universe.length &&
    state.universeLoadedAt &&
    (
      Date.now() -
      state.universeLoadedAt <
      CACHE.universeTTL
    )
  ){

    return state.universe;

  }


  if(
    state.universeLoading
  ){

    return state.universe;

  }


  state.universeLoading =
    true;


  try{

    showLoading(
      "建立台股搜尋資料庫…"
    );


    /*
     * 上市＋上櫃
     *
     * 平行抓取，
     * 不要讓單一市場失敗就整個搜尋失效。
     */

    const [
      twse,
      tpex
    ] =
      await Promise.all([
        getTWSEUniverse(),
        getTPExUniverse()
      ]);


    let list = [
      ...twse,
      ...tpex
    ];


    /*
     * 補入 KNOWN。
     *
     * 這是 fallback，
     * 不是主要搜尋來源。
     */

    list =
      mergeKnownUniverse(
        list
      );


    /*
     * 補 ETF 標籤
     */

    list.forEach(
      item=>{

        if(
          isETFCode(
            item.code
          )
        ){

          item.market =
            item.market ||
            "ETF";

        }

      }
    );


    /*
     * 排序：
     *
     * 先代號，
     * 再名稱。
     */

    list.sort(
      (a,b)=>{

        const ac =
          a.code || "";

        const bc =
          b.code || "";


        return ac.localeCompare(
          bc,
          "zh-Hant"
        );

      }
    );


    state.universe =
      list;


    state.universeLoaded =
      true;


    state.universeLoadedAt =
      Date.now();


    console.log(
      "V1491 搜尋資料庫：",
      list.length,
      "筆"
    );


    return list;

  }
  finally{

    state.universeLoading =
      false;


    hideLoading();

  }

}

        normalizeCode(
          item.code
        ) ===
        normalizeCode(q)
    );


  if(
    codeHit
  ){

    return codeHit;

  }


  /*
   * 2. 完全符合中文名稱
   */

  const nameHit =
    universe.find(
      item =>
        normalizeName(
          item.name
        ) === q
    );


  if(
    nameHit
  ){

    return nameHit;

  }


  /*
   * 3. KNOWN 補充
   *
   * 即使官方名稱資料尚未載入，
   * 常用股票仍可直接搜尋。
   */

  const known =
    getKnownStock(
      q
    );


  if(
    known
  ){

    return {
      ...known
    };

  }


  return null;

}


/* =========================================================
   模糊搜尋
========================================================= */

function searchUniverse(
  query,
  universe,
  limit=20
){

  const q =
    normalizeName(
      query
    );


  if(!q){
    return [];
  }


  const qUpper =
    normalizeCode(q);


  const result = [];


  /*
   * 先代號開頭
   */

  for(
    const item of universe
  ){

    const code =
      normalizeCode(
        item.code
      );


    if(
      code.startsWith(
        qUpper
      )
    ){

      result.push({
        item,
        score:10
      });

    }

  }


  /*
   * 名稱開頭
   */

  for(
    const item of universe
  ){

    const name =
      normalizeName(
        item.name
      );


    if(
      name.startsWith(q)
    ){

      result.push({
        item,
        score:9
      });

    }

  }


  /*
   * 名稱包含
   */

  for(
    const item of universe
  ){

    const name =
      normalizeName(
        item.name
      );


    if(
      name.includes(q)
    ){

      result.push({
        item,
        score:7
      });

    }

  }


  /*
   * 代號包含
   */

  for(
    const item of universe
  ){

    const code =
      normalizeCode(
        item.code
      );


    if(
      code.includes(qUpper)
    ){

      result.push({
        item,
        score:6
      });

    }

  }


  /*
   * 去重
   */

  const map =
    new Map();


  for(
    const row of result
  ){

    const code =
      row.item.code;


    if(
      !map.has(code) ||
      map.get(code).score <
      row.score
    ){

      map.set(
        code,
        row
      );

    }

  }


  return Array.from(
    map.values()
  )
  .sort(
    (a,b)=>{

      if(
        b.score !==
        a.score
      ){

        return (
          b.score -
          a.score
        );

      }


      return (
        a.item.code
          .localeCompare(
            b.item.code
          )
      );

    }
  )
  .slice(
    0,
    limit
  )
  .map(
    row=>row.item
  );

}


/* =========================================================
   對外搜尋函式
========================================================= */

async function findStock(
  query
){

  const q =
    String(
      query ?? ""
    ).trim();


  if(!q){

    return null;

  }


  /*
   * 先用目前已有資料找。
   */

  let universe =
    state.universe;


  /*
   * 沒資料才建立完整資料庫。
   */

  if(
    !universe.length
  ){

    universe =
      await getStockUniverse();

  }


  /*
   * 精準搜尋。
   */

  const exact =
    exactFindStock(
      q,
      universe
    );


  if(
    exact
  ){

    return exact;

  }


  /*
   * 如果使用者直接輸入4～6碼，
   * 優先直接建立查詢項目。
   *
   * 這樣即使名稱清單暫時失敗，
   * 仍然可以往即時行情查詢。
   */

  if(
    isStockCode(q)
  ){

    const known =
      getKnownStock(q);


    return {

      code:
        normalizeCode(q),

      name:
        known?.name ||
        normalizeCode(q),

      market:
        known?.market ||
        "",

      raw:null

    };

  }


  /*
   * 模糊搜尋。
   */

  const fuzzy =
    searchUniverse(
      q,
      universe,
      20
    );


  return fuzzy[0] ||
    null;

}

/* =========================================================

async function getDailyK(
  code,
  months=4
){

  const c =
    normalizeCode(code);


  const all = [];


  const now =
    new Date();


  for(
    let i=0;
    i<months;
    i++
  ){

    const d =
      new Date(
        now.getFullYear(),
        now.getMonth() - i,
        1
      );


    const year =
      d.getFullYear();


    const month =
      d.getMonth()+1;


    const rocYear =
      year - 1911;


    try{

      const url =
        apiURL(
          API.day,
          {
            response:"json",

            date:
              `${year}${pad2(month)}01`,

            stockNo:c,

            type:"ALL"
          }
        );


      const data =
        await fetchJSON(
          url
        );


      if(
        !data ||
        !Array.isArray(
          data.data
        )
      ){

        continue;

      }


      /*
       * TWSE STOCK_DAY：
       *
       * 日期
       * 成交股數
       * 成交金額
       * 開盤價
       * 最高價
       * 最低價
       * 收盤價
       * 漲跌價差
       * 成交筆數
       */

      for(
        const row of data.data
      ){

        if(
          !Array.isArray(row) ||
          row.length < 7
        ){

          continue;

        }


        const date =
          parseTWSEDate(
            row[0],
            year
          );


        const volume =
          num(row[1]);


        const open =
          num(row[3]);


        const high =
          num(row[4]);


        const low =
          num(row[5]);


        const close =
          num(row[6]);


        if(
          !date ||
          !Number.isFinite(close)
        ){

          continue;

        }


        all.push({

          date,

          volume:

            Number.isFinite(
              volume
            )
              ? volume
              : 0,

          open,

          high,

          low,

          close,

          change:
            num(row[7]),

          trades:
            num(row[8])

        });

      }

    }
    catch(error){

      console.warn(
        "日K資料取得失敗：",
        c,
        rocYear,
        month,
        error
      );

    }

  }


  return cleanKLines(
    all
  );

}

/* =========================================================
   TWSE 日期解析
========================================================= */

function parseTWSEDate(
  value,
  fallbackYear
){

  if(
    !value
  ){

    return "";

  }


  const text =
    String(value)
      .trim();


  /*
   * 115/10/02
   */

  let m =
    text.match(
      /^(\d{2,3})[\/\-](\d{1,2})[\/\-](\d{1,2})$/
    );


  if(m){

    const year =
      Number(m[1]) + 1911;


    return (
      year +
      "-" +
      pad2(m[2]) +
      "-" +
      pad2(m[3])
    );

  }


  /*
   * YYYY/MM/DD
   */

  m =
    text.match(
      /^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})$/
    );


  if(m){

    return (
      m[1] +
      "-" +
      pad2(m[2]) +
      "-" +
      pad2(m[3])
    );

  }


  /*
   * 其他情況直接交給 Date
   */

  const d =
    new Date(text);


  if(
    !Number.isNaN(
      d.getTime()
    )
  ){

    return (
      d.getFullYear() +
      "-" +
      pad2(
        d.getMonth()+1
      ) +
      "-" +
      pad2(
        d.getDate()
      )
    );

  }


  return "";

}


/* =========================================================
   清理日K
========================================================= */

function cleanKLines(
  rows
){

  const map =
    new Map();


  for(
    const row of rows || []
  ){

    if(
      !row ||
      !row.date
    ){

      continue;

    }


    if(
      !Number.isFinite(
        num(row.close)
      )
    ){

      continue;

    }


    map.set(
      row.date,
      {

        date:
          row.date,

        volume:
          safeNum(
            row.volume
          ),

        open:
          safeNum(
            row.open
          ),

        high:
          safeNum(
            row.high
          ),

        low:
          safeNum(
            row.low
          ),

        close:
          safeNum(
            row.close
          ),

        change:
          safeNum(
            row.change
          ),

        trades:
          safeNum(
            row.trades
          )

      }
    );

  }


  return Array.from(
    map.values()
  )
  .sort(
    (a,b)=>
      a.date.localeCompare(
        b.date
      )
  );

}


/* =========================================================
   SMA
========================================================= */

function sma(
  rows,
  field,
  period
){

  const values =
    rows
      .map(
        row =>
          num(
            row[field]
          )
      )
      .filter(
        Number.isFinite
      );


  if(
    values.length <
    period
  ){

    return NaN;

  }


  const slice =
    values.slice(
      -period
    );


  const sum =
    slice.reduce(
      (a,b)=>
        a+b,
      0
    );


  return sum /
    slice.length;

}

function recentHigh(
  rows,
  period=20
){

  const list =
    rows
      .slice(
        -period
      )
      .map(
        row =>
          num(row.high)
      )
      .filter(
        Number.isFinite
      );


  if(
    !list.length
  ){

    return NaN;

  }


  return Math.max(
    ...list
  );

}


/* =========================================================
   近期低點
========================================================= */

function recentLow(
  rows,
  period=20
){

  const list =
    rows
      .slice(
        -period
      )
      .map(
        row =>
          num(row.low)
      )
      .filter(
        Number.isFinite
      );


  if(
    !list.length
  ){

    return NaN;

  }


  return Math.min(
    ...list
  );

}


/* =========================================================
   平均成交量
========================================================= */

function averageVolume(
  rows,
  period=20
){

  const list =
    rows
      .slice(
        -period
      )
      .map(
        row =>
          num(
            row.volume
          )
      )
      .filter(
        Number.isFinite
      );


  if(
    !list.length
  ){

    return NaN;

  }


  return (
    list.reduce(
      (a,b)=>
        a+b,
      0
    ) /
    list.length
  );

}


/* =========================================================
   價格四捨五入
========================================================= */

function roundPrice(
  value
){

  const n =
    num(value);


  if(
    !Number.isFinite(n)
  ){

    return NaN;

  }


  if(
    n < 10
  ){

    return Math.round(
      n * 100
    ) / 100;

  }


  if(
    n < 100
  ){

    return Math.round(
      n * 20
    ) / 20;

  }


  return Math.round(
    n * 10
  ) / 10;

}


/* =========================================================
   計算漲跌
========================================================= */

function calculateChange(
  price,
  previous
){

  if(
    !Number.isFinite(price) ||
    !Number.isFinite(previous) ||
    previous === 0
  ){

    return {

      change:NaN,

      changePct:NaN

    };

  }


  const change =
    price -
    previous;


  return {

    change,

    changePct:
      change /
      previous *
      100

  };

}

async function buildStockData(
  code,
  name=""
){

  const c =
    normalizeCode(code);


  /*
   * 即時行情與日K同時抓。
   */

  const [
    realtime,
    daily
  ] =
    await Promise.all([

      getRealtimeStock(
        c,
        name
      ),

      getDailyK(
        c,
        4
      )

    ]);


  let kLines =
    daily;


  /*
   * 如果上市日K沒有資料，
   * 再嘗試TPEx。
   */

  if(
    !kLines.length
  ){

    kLines =
      await getTPExDailyK(
        c
      );

  }


  const latest =
    latestK(
      kLines
    );


  const previous =
    previousK(
      kLines
    );


  /*
   * 即時價格優先。
   *
   * 如果即時行情暫時沒有，
   * 才使用最後一根日K。
   */

  let price =
    realtime.price;


  if(
    !Number.isFinite(price) ||
    price <= 0
  ){

    price =
      latest?.close ??
      NaN;

  }


  let previousPrice =
    realtime.previous;


  if(
    !Number.isFinite(previousPrice) ||
    previousPrice <= 0
  ){

    previousPrice =
      previous?.close ??
      NaN;

  }


  let open =
    realtime.open;


  let high =
    realtime.high;


  let low =
    realtime.low;


  let volume =
    realtime.volume;


  /*
   * 如果即時資料沒有，
   * 用最後日K補。
   */

  if(
    !Number.isFinite(open)
  ){

    open =
      latest?.open ??
      NaN;

  }


  if(
    !Number.isFinite(high)
  ){

    high =
      latest?.high ??
      NaN;

  }


  if(
    !Number.isFinite(low)
  ){

    low =
      latest?.low ??
      NaN;

  }


  if(
    !Number.isFinite(volume)
  ){

    volume =
      latest?.volume ??
      NaN;

  }


  const change =
    calculateChange(
      price,
      previousPrice
    );


  const ma =
    buildMA(
      kLines
    );


  const avgVolume20 =
    averageVolume(
      kLines,
      20
    );


  const volumeRatio =
    Number.isFinite(volume) &&
    Number.isFinite(avgVolume20) &&
    avgVolume20 > 0

      ? volume /
        avgVolume20

      : NaN;


  return {

    code:c,

    name:
      name ||
      realtime.name ||
      getKnownStock(c)?.name ||
      c,

    market:
      realtime.market ||
      getKnownStock(c)?.market ||
      "",


    price,

    open,

    high,

    low,

    previous:
      previousPrice,


    change:
      change.change,

    changePct:
      change.changePct,


    volume,

    avgVolume20,

    volumeRatio,


    ma5:
      ma.ma5,

    ma10:
      ma.ma10,

    ma20:
      ma.ma20,

    ma60:
      ma.ma60,


    latestDate:
      latest?.date ||
      "",


    kLines,


    realtime,


    latest,

    previous

  };

}

  finally{

    ){

      hideLoading();

    }

  }

}

/* =========================================================
   計算支撐／壓力
   ---------------------------------------------------------
   第一支撐
   第二支撐
   第一壓力
   第二壓力
========================================================= */

function calculateLevels(
  data
){

  if(!data){

    return {

      support1:NaN,
      support2:NaN,

      resistance1:NaN,
      resistance2:NaN

    };

  }


  const price =
    num(data.price);


  const rows =
    Array.isArray(data.kLines)
      ? data.kLines
      : [];


  /*
   * 近期高低點
   */

  const low5 =
    recentLow(
      rows,
      5
    );


  const low10 =
    recentLow(
      rows,
      10
    );


  const low20 =
    recentLow(
      rows,
      20
    );


  const high5 =
    recentHigh(
      rows,
      5
    );


  const high10 =
    recentHigh(
      rows,
      10
    );


  const high20 =
    recentHigh(
      rows,
      20
    );


  /*
   * 均線
   */

  const ma5 =
    num(data.ma5);


  const ma20 =
    num(data.ma20);


  const ma60 =
    num(data.ma60);


  /*
   * -----------------------------
   * 支撐候選
   * -----------------------------
   *
   * 只取低於目前價格的價格。
   */

  const supportCandidates = [

    low5,

    low10,

    low20,

    ma5,

    ma20,

    ma60

  ]
  .filter(
    Number.isFinite
  )
  .filter(
    value =>
      !Number.isFinite(price) ||
      value < price
  )
  .sort(
    (a,b)=>
      b-a
  );


  /*
   * 第一支撐：
   * 最靠近現價、且位於現價下方
   */

  let support1 =
    supportCandidates[0];


  /*
   * 第二支撐：
   * 下一個有效支撐
   */

  let support2 =
    supportCandidates.find(
      value =>
        Number.isFinite(
          support1
        )
        ? value < support1
        : true
    );


  /*
   * -----------------------------
   * 壓力候選
   * -----------------------------
   */

  const resistanceCandidates = [

    high5,

    high10,

    high20,

    ma5,

    ma20,

    ma60

  ]
  .filter(
    Number.isFinite
  )
  .filter(
    value =>
      !Number.isFinite(price) ||
      value > price
  )
  .sort(
    (a,b)=>
      a-b
  );


  /*
   * 第一壓力：
   * 最靠近現價、且位於現價上方
   */

  let resistance1 =
    resistanceCandidates[0];


  /*
   * 第二壓力：
   * 下一個有效壓力
   */

  let resistance2 =
    resistanceCandidates.find(
      value =>
        Number.isFinite(
          resistance1
        )
        ? value > resistance1
        : true
    );


  /*
   * -----------------------------
   * 如果市場資料不足
   * -----------------------------
   *
   * 不讓畫面出現 NaN。
   *
   * 使用現價百分比作為最後 fallback。
   */

  if(
    !Number.isFinite(support1) &&
    Number.isFinite(price)
  ){

    support1 =
      price * 0.97;

  }


  if(
    !Number.isFinite(support2) &&
    Number.isFinite(price)
  ){

    support2 =
      price * 0.94;

  }


  if(
    !Number.isFinite(resistance1) &&
    Number.isFinite(price)
  ){

    resistance1 =
      price * 1.03;

  }


  if(
    !Number.isFinite(resistance2) &&
    Number.isFinite(price)
  ){

    resistance2 =
      price * 1.06;

  }


  return {

    support1:
      roundPrice(
        support1
      ),

    support2:
      roundPrice(
        support2
      ),

    resistance1:
      roundPrice(
        resistance1
      ),

    resistance2:
      roundPrice(
        resistance2
      )

  };

}


/* =========================================================
   交易計畫
   ---------------------------------------------------------
   Entry
   Stop
   TP1
   TP2
========================================================= */

function calculateTradePlan(
  data,
  levels
){

  const price =
    num(data?.price);


  const s1 =
    num(levels?.support1);


  const s2 =
    num(levels?.support2);


  const r1 =
    num(levels?.resistance1);


  const r2 =
    num(levels?.resistance2);


  /*
   * 進場：
   *
   * 有第一支撐時，
   * 使用現價與支撐之間的合理區間。
   *
   * 若現價已經接近突破，
   * 不強行把 Entry 壓到支撐。
   */

  let entry =
    price;


  if(
    Number.isFinite(price) &&
    Number.isFinite(s1)
  ){

    const distance =
      price - s1;


    if(
      distance > 0 &&
      distance / price < 0.08
    ){

      entry =
        s1 +
        distance * 0.35;

    }

  }


  /*
   * 防守：
   * 第一支撐下方約 2%。
   */

  let stop =
    Number.isFinite(s1)
      ? s1 * 0.98
      : price * 0.95;


  /*
   * TP1：
   * 第一壓力
   */

  let tp1 =
    Number.isFinite(r1)
      ? r1
      : price * 1.05;


  /*
   * TP2：
   * 第二壓力
   */

  let tp2 =
    Number.isFinite(r2)
      ? r2
      : price * 1.10;


  /*
   * 如果壓力低於進場，
   * 代表目前壓力資料不合理，
   * 改用百分比目標。
   */

  if(
    Number.isFinite(entry) &&
    Number.isFinite(tp1) &&
    tp1 <= entry
  ){

    tp1 =
      entry * 1.05;

  }


  if(
    Number.isFinite(entry) &&
    Number.isFinite(tp2) &&
    tp2 <= tp1
  ){

    tp2 =
      tp1 * 1.05;

  }


  return {

    entry:
      roundPrice(
        entry
      ),

    stop:
      roundPrice(
        stop
      ),

    tp1:
      roundPrice(
        tp1
      ),

    tp2:
      roundPrice(
        tp2
      )

  };

}

/* =========================================================
   報酬率
========================================================= */

function calcReturn(
  entry,
  target
){

  const e =
    num(entry);


  const t =
    num(target);


  if(
    !Number.isFinite(e) ||
    !Number.isFinite(t) ||
    e === 0
  ){

    return NaN;

  }


  return (
    (t-e) /
    e *
    100
  );

}

/* =========================================================

function getLatestTradingDate(){

  const d =
    new Date();


  /*
   * 先使用目前日期。
   * API 若回傳最新交易日，
   * 後面會以實際資料為準。
   */

  return (
    d.getFullYear() +
    pad2(d.getMonth()+1) +
    pad2(d.getDate())
  );

}


/* =========================================================
   日期轉 YYYY-MM-DD
========================================================= */

function twseDateToYYYYMMDD(
  value
){

  const text =
    String(
      value || ""
    ).trim();


  if(
    /^\d{8}$/.test(text)
  ){

    return (
      text.slice(0,4) +
      "-" +
      text.slice(4,6) +
      "-" +
      text.slice(6,8)
    );

  }


  if(
    /^\d{4}[-/]\d{1,2}[-/]\d{1,2}$/
      .test(text)
  ){

    const parts =
      text.split(
        /[-/]/
      );


    return (
      parts[0] +
      "-" +
      pad2(parts[1]) +
      "-" +
      pad2(parts[2])
    );

  }


  return text;

}

async function getInstitutionData(
  code,
  date=""
){

  const c =
    normalizeCode(code);


  const tradingDate =
    date ||
    getLatestTradingDate();


  try{

    const url =
      apiURL(
        API.institution,
        {
          date:
            tradingDate,

          selectType:"ALL"
        }
      );


    const data =
      await fetchJSON(
        url
      );


    if(
      !data ||
      !Array.isArray(
        data.data
      )
    ){

      return null;

    }


    /*
     * T86 的第一欄通常為證券代號。
     */

    const row =
      data.data.find(
        item => {

          if(
            !Array.isArray(item)
          ){

            return false;

          }


          return normalizeCode(
            item[0]
          ) === c;

        }
      );


    if(
      !row
    ){

      return null;

    }


    /*
     * 不再單純寫死「第4欄就是外資」。
     *
     * T86 欄位可能因資料版本不同而變化，
     * 因此先依官方欄位標題判斷。
     */

    const fields =
      Array.isArray(
        data.fields
      )
        ? data.fields
        : [];


    function findField(
      keywords
    ){

      for(
        let i=0;
        i<fields.length;
        i++
      ){

        const title =
          String(
            fields[i] || ""
          );


        if(
          keywords.some(
            keyword =>
              title.includes(
                keyword
              )
          )
        ){

          return i;

        }

      }


      return -1;

    }


    /*
     * 外資買賣超
     */

    let foreignIndex =
      findField([
        "外陸資",
        "外資",
        "外資及陸資"
      ]);


    /*
     * 投信買賣超
     */

    let trustIndex =
      findField([
        "投信"
      ]);


    /*
     * 自營商買賣超
     */

    let dealerIndex =
      findField([
        "自營商"
      ]);


    /*
     * 若 API 沒有欄位名稱，
     * 才使用常見 T86 欄位位置。
     *
     * 這是 fallback，不是主要解析方式。
     */

    if(
      foreignIndex < 0
    ){

      foreignIndex = 4;

    }


    if(
      trustIndex < 0
    ){

      trustIndex = 10;

    }


    if(
      dealerIndex < 0
    ){

      dealerIndex = 11;

    }


    const foreign =
      safeNum(
        row[foreignIndex],
        NaN
      );


    const trust =
      safeNum(
        row[trustIndex],
        NaN
      );


    const dealer =
      safeNum(
        row[dealerIndex],
        NaN
      );


    return {

      code:c,

      date:
        tradingDate,

      foreign,

      trust,

      dealer,

      total:
        (
          Number.isFinite(foreign)
            ? foreign
            : 0
        ) +

        (
          Number.isFinite(trust)
            ? trust
            : 0
        ) +

        (
          Number.isFinite(dealer)
            ? dealer
            : 0
        ),

      raw:row,

      fields

    };

  }
  catch(error){

    console.warn(
      "三大法人資料取得失敗：",
      c,
      error
    );


    return null;

  }

}

/* =========================================================
   找法人欄位
========================================================= */

function findInstitutionValue(
  institution,
  type
){

  if(
    !institution
  ){

    return NaN;

  }


  const fields =
    institution.fields ||
    [];


  const row =
    institution.raw ||
    [];


  let keywords = [];


  if(
    type === "foreign"
  ){

    keywords = [
      "外陸資",
      "外資",
      "外資及陸資"
    ];

  }
  else if(
    type === "trust"
  ){

    keywords = [
      "投信"
    ];

  }
  else if(
    type === "dealer"
  ){

    keywords = [
      "自營商"
    ];

  }


  for(
    let i=0;
    i<fields.length;
    i++
  ){

    const title =
      String(
        fields[i] || ""
      );


    if(
      keywords.some(
        key =>
          title.includes(key)
      )
    ){

      return safeNum(
        row[i],
        NaN
      );

    }

  }


  /*
   * fallback
   */

  if(
    type === "foreign"
  ){

    return safeNum(
      row[4],
      NaN
    );

  }


  if(
    type === "trust"
  ){

    return safeNum(
      row[10],
      NaN
    );

  }


  if(
    type === "dealer"
  ){

    return safeNum(
      row[11],
      NaN
    );

  }


  return NaN;

}

========================================================= */

function getInstitutionBias(
  data

  if(

      state:"未知",

      score:0

  const foreign =
    num(
      data.foreign
    );


  const trust =
    num(
      data.trust
    );


  const dealer =
    num(
      data.dealer
    );


  let score = 0;


  if(
    Number.isFinite(foreign)
  ){

    score +=
      foreign > 0
        ? 1
        : foreign < 0
          ? -1
          : 0;

  }


  if(
    Number.isFinite(trust)
  ){

    score +=
      trust > 0
        ? 1
        : trust < 0
          ? -1
          : 0;

  }


  if(
    Number.isFinite(dealer)
  ){

    score +=
      dealer > 0
        ? 1
        : dealer < 0
          ? -1
          : 0;

  }


  let stateText =
    "中性";


  if(
    score >= 2
  ){

    stateText =
      "法人偏多";

  }
  else if(
    score <= -2
  ){

    stateText =
      "法人偏空";

  }


  return {

    state:
      stateText,

    score

  };

  ){

    const code =
      normalizeCode(
        pick(
          row,
          "Code",
          "code",
          "SecuritiesCompanyCode",
          "股票代號",
          "證券代號"
        )
      );


    const name =
      String(
        pick(
          row,
          "Name",
          "name",
          "SecuritiesCompanyName",
          "股票名稱",
          "證券名稱"
        ) || ""
      ).trim();


    if(
      !code ||
      !isStockCode(code)
    ){

      return null;

    }


    const close =
      safeNum(
        pick(
          row,
          "ClosingPrice",
          "Close",
          "收盤價",
          "成交價"
        ),
        NaN
      );


    const change =
      safeNum(
        pick(
          row,
          "Change",
          "漲跌價差",
          "漲跌"
        ),
        NaN
      );


    const volume =
      safeNum(
        pick(
          row,
          "TradeVolume",
          "Volume",
          "成交股數",
          "成交量"
        ),
        NaN
      );


    const tradeValue =
      safeNum(
        pick(
          row,
          "TransactionAmount",
          "TradeValue",
          "成交金額"
        ),
        NaN
      );


    const high =
      safeNum(
        pick(
          row,
          "High",
          "最高價"
        ),
        NaN
      );


    const low =
      safeNum(
        pick(
          row,
          "Low",
          "最低價"
        ),
        NaN
      );


    const open =
      safeNum(
        pick(
          row,
          "Open",
          "開盤價"
        ),
        NaN
      );


    /*
     * 如果 API 沒直接給漲跌幅，
     * 嘗試用昨收計算。
     */

    const previous =
      safeNum(
        pick(
          row,
          "PreviousClose",
          "PreviousClosingPrice",
          "昨收"
        ),
        NaN
      );


    let changePct =
      safeNum(
        pick(
          row,
          "ChangePercent",
          "漲跌幅"
        ),
        NaN
      );


    if(
      !Number.isFinite(changePct) &&
      Number.isFinite(close) &&
      Number.isFinite(previous) &&
      previous !== 0
    ){

      changePct =
        (
          close -
          previous
        ) /
        previous *
        100;

    }


    return {

      code,

      name:
        name ||
        getKnownStock(code)?.name ||
        code,

      market,

      close,

      change,

      changePct,

      volume,

      tradeValue,

      high,

      low,

      open,

      previous,

      raw:row

    };

  }


  /*
   * 如果 TPEx 回傳 array，
   * 依常見欄位位置解析。
   */

  const code =
    normalizeCode(
      row[0]
    );


  if(
    !code ||
    !isStockCode(code)
  ){

    return null;

  }


  const name =
    String(
      row[1] || ""
    ).trim();


  const close =
    safeNum(
      row[2],
      NaN
    );


  const change =
    safeNum(
      row[3],
      NaN
    );


  const volume =
    safeNum(
      row[4],
      NaN
    );


  return {

    code,

    name:
      name ||
      getKnownStock(code)?.name ||
      code,

    market,

    close,

    change,

    changePct:
      Number.isFinite(close) &&
      Number.isFinite(change) &&
      close !== change
        ? (
            change /
            (close-change)
          ) *
          100
        : NaN,

    volume,

    tradeValue:
      safeNum(
        row[5],
        NaN
      ),

    high:
      safeNum(
        row[6],
        NaN
      ),

    low:
      safeNum(
        row[7],
        NaN
      ),

    open:
      safeNum(
        row[8],
        NaN
      ),

    previous:NaN,

    raw:row

  };

}


/* =========================================================
   取得全市場
========================================================= */

async function getMarketToday(
  force=false
){

  if(
    !force &&
    state.marketLoaded &&
    state.marketRows.length &&
    (
      Date.now() -
      state.marketLoadedAt <
      CACHE.marketTTL
    )
  ){

    return state.marketRows;

  }


  if(
    state.marketLoading
  ){

    return state.marketRows;

  }


  state.marketLoading =
    true;


  try{

    showLoading(
      "取得今日全市場行情…"
    );


    const [
      twse,
      tpex
    ] =
      await Promise.all([
        getTWSEMarket(),
        getTPExMarket()
      ]);


    /*
     * 合併上市＋上櫃。
     */

    const map =
      new Map();


    [
      ...twse,
      ...tpex
    ]
    .forEach(
      row=>{

        if(
          !row ||
          !row.code
        ){

          return;

        }


        /*
         * 同一代號只保留一筆。
         */

        if(
          !map.has(
            row.code
          )
        ){

          map.set(
            row.code,
            row
          );

        }

      }
    );


    state.marketRows =
      Array.from(
        map.values()
      );


    state.marketLoaded =
      true;


    state.marketLoadedAt =
      Date.now();


    console.log(
      "V1491 全市場：",
      state.marketRows.length,
      "檔"
    );


    return state.marketRows;

  }
  finally{

    state.marketLoading =
      false;


    hideLoading();

  }

}


/* =========================================================
   排除不適合技術掃描的商品
========================================================= */

function isScannableMarketRow(
  row
){

  if(
    !row ||
    !row.code
  ){

    return false;

  }


  /*
   * 必須有價格。
   */

  if(
    !Number.isFinite(
      num(row.close)
    ) ||
    num(row.close) <= 0
  ){

    return false;

  }


  /*
   * 必須有成交量或成交金額。
   */

  if(
    !Number.isFinite(
      num(row.volume)
    ) &&
    !Number.isFinite(
      num(row.tradeValue)
    )
  ){

    return false;

  }


  return true;

}


/* =========================================================
   排除 ETF
   ---------------------------------------------------------
   個股突破掃描不把 ETF 混進去。
========================================================= */

function isETFMarketRow(
  row
){

  const code =
    normalizeCode(
      row?.code
    );


  if(
    isETFCode(code)
  ){

    return true;

  }


  return (
    String(
      row?.name || ""
    )
    .includes("ETF")
  );

}


/* =========================================================
   動態熱門20
   ---------------------------------------------------------
   不使用 SCAN_CODES。
========================================================= */

function rankHot20(
  rows
){

  const candidates =
    (rows || [])
      .filter(
        isScannableMarketRow
      )
      .filter(
        row =>
          !isETFMarketRow(row)
      )
      .map(
        row=>{

          const value =
            num(
              row.tradeValue
            );


          const volume =
            num(
              row.volume
            );


          const changePct =
            num(
              row.changePct
            );


          /*
           * 熱門程度：
           *
           * 成交金額
           * ＋成交量
           * ＋當日漲跌
           *
           * 不直接固定股票。
           */

          const valueScore =
            Number.isFinite(value)
              ? Math.log10(
                  Math.max(
                    value,
                    1
                  )
                )
              : 0;


          const volumeScore =
            Number.isFinite(volume)
              ? Math.log10(
                  Math.max(
                    volume,
                    1
                  )
                )
              : 0;


          const momentumScore =
            Number.isFinite(changePct)
              ? Math.max(
                  -5,
                  Math.min(
                    10,
                    changePct
                  )
                )
              : 0;


          const score =
            valueScore * 5 +
            volumeScore * 2 +
            momentumScore;


          return {

            ...row,

            hotScore:
              score

          };

        }
      )
      .sort(
        (a,b)=>
          b.hotScore -
          a.hotScore
      );


  return candidates.slice(
    0,
    20
  );

}

/* =========================================================
   突破模型
========================================================= */

function breakoutModel(
  item
){

  const data =
    item?.data;


  const levels =
    item?.levels;


  if(
    !data ||
    !levels
  ){

    return {

      state:"資料不足",

      score:0,

      confirmed:false,

      ready:false

    };

  }


  const price =
    num(data.price);


  const r1 =
    num(levels.resistance1);


  const r2 =
    num(levels.resistance2);


  const volumeRatio =
    num(data.volumeRatio);


  const ma20 =
    num(data.ma20);


  const ma60 =
    num(data.ma60);


  let score = 0;


  /*
   * 價格站上第一壓力
   */

  if(
    Number.isFinite(price) &&
    Number.isFinite(r1) &&
    price >= r1
  ){

    score += 30;

  }
  else if(
    Number.isFinite(price) &&
    Number.isFinite(r1) &&
    price >= r1 * 0.985
  ){

    score += 20;

  }


  /*
   * 站上第二壓力
   */

  if(
    Number.isFinite(price) &&
    Number.isFinite(r2) &&
    price >= r2
  ){

    score += 20;

  }


  /*
   * 量能
   */

  if(
    Number.isFinite(volumeRatio)
  ){

    if(
      volumeRatio >= 2
    ){

      score += 25;

    }
    else if(
      volumeRatio >= 1.3
    ){

      score += 18;

    }
    else if(
      volumeRatio >= 1
    ){

      score += 10;

    }

  }


  /*
   * 站上20日均線
   */

  if(
    Number.isFinite(price) &&
    Number.isFinite(ma20) &&
    price > ma20
  ){

    score += 10;

  }


  /*
   * 站上60日均線
   */

  if(
    Number.isFinite(price) &&
    Number.isFinite(ma60) &&
    price > ma60
  ){

    score += 10;

  }


  /*
   * 強勢狀態
   */

  let stateText =
    "等待突破";


  let confirmed =
    false;


  let ready =
    false;


  if(
    score >= 75
  ){

    stateText =
      "突破確認";

    confirmed =
      true;

  }
  else if(
    score >= 55
  ){

    stateText =
      "突破觀察";

    ready =
      true;

  }
  else if(
    score >= 35
  ){

    stateText =
      "接近突破";

    ready =
      true;

  }


  return {

    state:
      stateText,

    score,

    confirmed,

    ready

  };

}


/* =========================================================
   多頭模型
========================================================= */

function bullishModel(
  item
){

  const data =
    item?.data;


  if(!data){

    return {

      state:"資料不足",

      score:0

    };

  }


  const price =
    num(data.price);


  const ma5 =
    num(data.ma5);


  const ma20 =
    num(data.ma20);


  const ma60 =
    num(data.ma60);


  const volumeRatio =
    num(data.volumeRatio);


  let score = 0;


  if(
    Number.isFinite(price) &&
    Number.isFinite(ma5) &&
    price > ma5
  ){

    score += 20;

  }


  if(
    Number.isFinite(price) &&
    Number.isFinite(ma20) &&
    price > ma20
  ){

    score += 25;

  }


  if(
    Number.isFinite(price) &&
    Number.isFinite(ma60) &&
    price > ma60
  ){

    score += 25;

  }


  if(
    Number.isFinite(ma5) &&
    Number.isFinite(ma20) &&
    ma5 > ma20
  ){

    score += 15;

  }


  if(
    Number.isFinite(ma20) &&
    Number.isFinite(ma60) &&
    ma20 > ma60
  ){

    score += 15;

  }


  if(
    Number.isFinite(volumeRatio) &&
    volumeRatio >= 1
  ){

    score += 5;

  }


  return {

    state:
      score >= 80
        ? "多頭排列"
        : score >= 60
          ? "偏多"
          : "多頭觀察",

    score

  };

}

/* =========================================================
   確認突破掃描
========================================================= */

async function scanConfirmedBreakout(){

  showLoading(
    "搜尋目前突破確認股票…"
  );


  try{

    const market =
      await getMarketToday(
        true
      );


    /*
     * 不使用 SCAN_CODES。
     */

    const candidates =
      market
        .filter(
          isScannableMarketRow
        )
        .filter(
          row =>
            !isETFMarketRow(row)
        );


    const result = [];


    /*
     * 依成交金額先取前100檔，
     * 避免一次對整個市場逐檔抓4個月日K。
     *
     * 這只是效率限制，
     * 不是固定股票清單。
     */

    const preselect =
      candidates
        .sort(
          (a,b)=>
            safeNum(
              b.tradeValue
            ) -
            safeNum(
              a.tradeValue
            )
        )
        .slice(
          0,
          100
        );


    for(
      const row of preselect
    ){

      const item =
        await enrichScanStock(
          row
        );


      if(!item){

        continue;

      }


      const model =
        breakoutModel(
          item
        );


      if(
        model.confirmed
      ){

        result.push({

          ...item,

          breakout:model

        });

      }

    }


    result.sort(
      (a,b)=>
        b.breakout.score -
        a.breakout.score
    );


    state.confirmed =
      result;


    renderScanResults(
      result,
      "🚀 確認突破股票推薦",
      "即時市場動態掃描"
    );


    return result;

  }
  finally{

    hideLoading();

  }

}

function preventConcurrentScan(
  fn
){

  return async function(
    ...args
  ){

    if(
      state.scanRunning
    ){

      showMessage(
        "目前正在掃描，請稍候…"
      );


      return null;

    }


    state.scanRunning =
      true;


    try{

      return await fn(
        ...args
      );

    }
    finally{

      state.scanRunning =
        false;

    }

  };

}

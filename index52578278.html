/* =========================================================
   安全數字
   ========================================================= */

function num(v){

  if(v === null || v === undefined || v === ""){

    return 0;

  }

  if(typeof v === "number"){

    return Number.isFinite(v) ? v : 0;

  }

  const n = Number(
    String(v)
      .replace(/,/g,"")
      .replace(/%/g,"")
      .trim()
  );

  return Number.isFinite(n) ? n : 0;

}


/* =========================================================

   ========================================================= */

function fmt(v, digits = 2){

  const n = num(v);

  return n.toLocaleString("zh-TW",{
    minimumFractionDigits: digits,
    maximumFractionDigits: digits
  });

}


/* =========================================================

/* =========================================================

function signText(v){

  if(n > 0) return `+${fmt(n)}`;

  if(n < 0) return fmt(n);

  return "0";

}

/* =========================================================

function formatDate(v){

  const s = String(v || "").replace(/\D/g,"");

  if(s.length !== 8){

    return String(v || "");

  }

  return `${s.slice(0,4)}/${s.slice(4,6)}/${s.slice(6,8)}`;

}

function uniqueCodes(list){

  const result = [];

  for(const item of (list || [])){

      typeof item === "string"

    );

    if(!code) continue;

    if(seen.has(code)) continue;

    seen.add(code);

    result.push(code);

  }

  return result;

}

function withQuery(url, params = {}){

  const u = new URL(url);

  Object.entries(params).forEach(([key,value])=>{

    if(
      value !== undefined &&
      value !== null &&
      value !== ""
    ){

      u.searchParams.set(key,value);

    }

  });

  return u.toString();

}


/* =========================================================
   JSON Fetch
   ★ 統一處理 timeout
   ========================================================= */

async function fetchJSON(url, options = {}){

  const controller = new AbortController();

  const timer = setTimeout(
    ()=>controller.abort(),
    options.timeout || API_TIMEOUT
  );

  try{

    const response = await fetch(
      url,
      {
        ...options,
        signal:controller.signal,
        cache:"no-store"
      }
    );

    if(!response.ok){

      throw new Error(
        `HTTP ${response.status}`
      );

    }

    return await response.json();

  }finally{

    clearTimeout(timer);

  }

}

    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

/* =========================================================
   批次 Promise
   ========================================================= */

async function mapLimit(list, limit, worker){

  const items = Array.isArray(list)
    ? list
    : [];

  const results = new Array(items.length);

  let nextIndex = 0;

  async function runner(){

    while(true){

      const index = nextIndex++;

      if(index >= items.length){

        return;

      }

      try{

        results[index] = {
          status:"fulfilled",
          value:await worker(
            items[index],
            index
          )
        };

      }catch(error){

        results[index] = {
          status:"rejected",
          reason:error
        };

      }

    }

  }

  const count = Math.min(
    Math.max(1,limit || 1),
    items.length
  );

  await Promise.all(
    Array.from(
      {length:count},
      ()=>runner()
    )
  );

  return results;

}

/* =========================================================
   合併上市＋上櫃
   ========================================================= */

function mergeMarketRows(twseRows,tpExRows){

  const map = new Map();

  for(const row of [
    ...(twseRows || []),
    ...(tpExRows || [])
  ]){

    if(!row?.code) continue;

    /*
     * 後進資料只在沒有資料時補上，
     * 避免同一代碼重複。
     */

    const old =
      map.get(row.code);

    if(!old){

      map.set(row.code,row);

      continue;

    }

    map.set(
      row.code,
      {
        ...old,
        ...row,

        name:
          row.name ||
          old.name,

        close:
          row.close ||
          old.close,

        volume:
          row.volume ||
          old.volume,

        tradeValue:
          row.tradeValue ||
          old.tradeValue
      }
    );

  }

  return Array.from(map.values());

}

  if(!row) return false;

  if(!row.code) return false;

  /*

   */

  return true;

}


/* =========================================================

function validRankingRow(row){

  );

   核心市場資料
   ★ 最重要的修正

   ★ 單一 API 失敗不會拖垮全部
   ========================================================= */

async function getMarketToday(force = false){

  const now = Date.now();

  /*
   * 有新鮮資料直接使用
   */

  if(
    !force &&
    state.marketRows.length &&
    now - state.marketTime < MARKET_CACHE_MS
  ){

    return state.marketRows;

  }


  /*
   * 已經有人正在抓市場資料
   * 直接共用同一個 Promise
   */

  if(state.marketPromise){

    return state.marketPromise;

  }


  state.marketLoading = true;

  state.marketPromise =
    (async ()=>{

      try{

        setStatus(
          "正在取得上市＋上櫃市場資料…",
          "loading"
        );

        /*
         * ★ 不使用 Promise.all
         *
         * 其中一個市場 API 失敗，
         * 另一個仍然可以正常使用。
         */

        const settled =
          await Promise.allSettled([
            getTWSEMarket(),
            getTPExMarket()
          ]);

        const twseRows =
          settled[0]?.status === "fulfilled"
            ? settled[0].value
            : [];

        const tpExRows =
          settled[1]?.status === "fulfilled"
            ? settled[1].value
            : [];

        const merged =
          mergeMarketRows(
            twseRows,
            tpExRows
          ).filter(validMarketRow);

        /*
         * 成功取得市場資料
         */

        if(merged.length){

          state.marketRows = merged;

          state.marketTime = Date.now();

          setStatus(
            `市場資料 ${merged.length.toLocaleString()} 檔`,
            "live"
          );

          return merged;

        }


        /*
         * 如果兩邊 API 都沒有資料，
         * 再使用備援候選池。
         *
         * 注意：
         * 備援池不是用來冒充全市場，
         * 只是避免畫面完全空白。
         */

        console.warn(
          "[V1491] 上市／上櫃市場 API 均沒有有效資料"
        );

        throw new Error(
          "市場資料暫時無法取得"
        );

      }finally{

        state.marketLoading = false;

        state.marketPromise = null;

      }

    })();

  return state.marketPromise;

}

/* =========================================================
   建立熱門20
   ★ 每次根據目前市場資料重新計算
   ★ 不使用 SCAN_CODES
   ========================================================= */

function rankHot20(marketRows){

  const rows =
    (marketRows || [])
      .filter(validRankingRow);

  /*
   * 優先成交金額，
   * 成交量作為第二排序，
   * 漲跌幅作為第三排序。
   */

  return rows
    .sort((a,b)=>{

      const valueDiff =
        num(b.tradeValue) -
        num(a.tradeValue);

      if(valueDiff !== 0){

        return valueDiff;

      }

      const volumeDiff =
        num(b.volume) -
        num(a.volume);

      if(volumeDiff !== 0){

        return volumeDiff;

      }

      return (
        num(b.changePct) -
        num(a.changePct)
      );

    })
    .slice(0,20);

}


/* =========================================================

   ========================================================= */

function getBreakoutCandidates(marketRows){

  return (marketRows || [])
    .filter(validRankingRow)
    .filter(row=>{

      const pctValue =
        num(row.changePct);

      const volume =
        num(row.volume);

      const tradeValue =
        num(row.tradeValue);

      /*
       * 初步條件：
       * 當日有明顯漲幅，
       * 或成交活躍。
       *
       * 真正突破要交給 K 線模型判斷。
       */

      return (
        pctValue >= 3 ||
        volume > 0 ||
        tradeValue > 0
      );

    })
    .sort(
      (a,b)=>
        num(b.tradeValue) -
        num(a.tradeValue)
    );

}

/* =========================================================
   市場資料簡短摘要
   ========================================================= */

function marketSummary(rows){

  const list =
    rows || [];

  const up =
    list.filter(
      x => num(x.changePct) > 0
    ).length;

  const down =
    list.filter(
      x => num(x.changePct) < 0
    ).length;

  const flat =
    list.length -
    up -
    down;

  return {

    total:list.length,

    up,

    down,

    flat

  };

}

/* =========================================================
   解析 TWSE STOCK_DAY
   ========================================================= */

function parseStockDayPayload(payload){

  if(!payload) return [];

  const fields =
    Array.isArray(payload.fields)
      ? payload.fields
      : [];

  const data =
    Array.isArray(payload.data)
      ? payload.data
      : [];

  if(!data.length) return [];

  const findIndex = (...names)=>{

    for(const name of names){

      const index =
        fields.indexOf(name);

      if(index >= 0){

        return index;

      }

    }

    return -1;

  };

  const dateIndex =
    findIndex(
      "日期",
      "Date"
    );

  const volumeIndex =
    findIndex(
      "成交股數",
      "成交量",
      "Volume"
    );

  const openIndex =

    );

  const highIndex =
    findIndex(

      "最高",
      "High"
    );

  const lowIndex =
    findIndex(
      "最低價",
      "最低",
      "Low"
    );

  const closeIndex =
    findIndex(

      "收盤",
      "Close"
    );

  const changeIndex =
    findIndex(
      "漲跌價差",
      "漲跌",
      "Change"
    );

  const result = [];

  for(const row of data){

    if(!Array.isArray(row)) continue;

    const date =
      dateIndex >= 0
        ? row[dateIndex]
        : row[0];

    const volume =
      volumeIndex >= 0
        ? num(row[volumeIndex])

    const high =

        : 0;

        : 0;

    if(!close) continue;

    result.push({

      date:String(date || ""),

      high,

      low,

  }

}

/* =========================================================
   取得近 4 個月歷史資料
   ========================================================= */

async function getHistory(code){

  const c =
    cleanCode(code);

  if(!c){

    return [];

  }

  const cached =
    state.historyCache.get(c);

  if(cached){

    return cached;

  }

  const dates = [];

  const base =
    new Date();

  for(let i=0;i<4;i++){

    const d =
      new Date(base);

    d.setMonth(
      d.getMonth() - i,
      1
    );

    dates.push({

      year:d.getFullYear(),

      month:d.getMonth()+1

    });

  }

  const settled =
    await Promise.allSettled(
      dates.map(
        item =>
          getStockMonthHistory(
            c,
            item.year,
            item.month
          )
      )
    );

  const all = [];

  for(const item of settled){

    if(
      item.status === "fulfilled" &&
      Array.isArray(item.value)
    ){

      all.push(...item.value);

    }

  }

  /*
   * 去除重複日期
   */

  const map =
    new Map();

  for(const row of all){

    const key =
      String(row.date || "");

    if(!key) continue;

    map.set(
      key,
      row
    );

  }

  const result =
    Array.from(map.values());

  /*
   * 舊 → 新
   */

  result.sort(
    (a,b)=>
      String(a.date)
        .localeCompare(
          String(b.date)
        )
  );

  state.historyCache.set(
    c,
    result
  );

  return result;

}


/* =========================================================
   移動平均
   ========================================================= */

function calculateMA(
  history,
  period
){

  const rows =
    Array.isArray(history)
      ? history
      : [];

  if(rows.length < period){

    return 0;

  }

  const slice =
    rows.slice(
      -period
    );

  const sum =
    slice.reduce(
      (total,row)=>
        total + num(row.close),
      0
    );

  return sum / period;

}


/* =========================================================
   MA 序列
   ========================================================= */

function calculateMASeries(
  history,
  period
){

  const rows =
    Array.isArray(history)
      ? history
      : [];

  const result = [];

  for(
    let i=period-1;
    i<rows.length;
    i++
  ){

    let sum = 0;

    for(
      let j=i-period+1;
      j<=i;
      j++
    ){

      sum +=
        num(rows[j].close);

    }

    result.push({

      date:rows[i].date,

      value:
        sum / period

    });

  }

  return result;

}


/* =========================================================
   平均成交量
   ========================================================= */

function calculateAverageVolume(
  history,
  period = 20
){

  const rows =
    Array.isArray(history)
      ? history
      : [];

  if(!rows.length){

    return 0;

  }

  const slice =
    rows.slice(-period);

  const sum =
    slice.reduce(
      (total,row)=>
        total + num(row.volume),
      0
    );

  return sum / slice.length;

}


/* =========================================================
   成交量比
   ========================================================= */

function calculateVolumeRatio(
  history,
  period = 20
){

  const rows =
    Array.isArray(history)
      ? history
      : [];

  if(rows.length < 2){

    return 0;

  }

  const current =
    num(
      rows[rows.length-1].volume
    );

  const previous =
    rows.slice(
      -period-1,
      -1
    );

  if(!previous.length){

    return 0;

  }

  const average =
    previous.reduce(
      (sum,row)=>
        sum + num(row.volume),
      0
    ) /
    previous.length;

  if(!average){

    return 0;

  }

  return current / average;

}


/* =========================================================
   近期最高
   ========================================================= */

function recentHigh(
  history,
  period = 20
){

  const rows =
    Array.isArray(history)
      ? history
      : [];

  const slice =
    rows.slice(
      -period
    );

  if(!slice.length){

    return 0;

  }

  return Math.max(
    ...slice.map(
      row=>num(row.high || row.close)
    )
  );

}


/* =========================================================
   近期最低
   ========================================================= */

function recentLow(
  history,
  period = 20
){

    Array.isArray(history)
      ? history
      : [];

  const slice =
    rows.slice(

    ...slice.map(

    )
  );

}


/* =========================================================
   前期最高
   用於判斷「今天是否真正突破」
   ========================================================= */

function previousResistance(
  history,
  period = 20
){

  const rows =
    Array.isArray(history)
      ? history
      : [];

  if(rows.length <= period){

    return 0;

  }

  /*
   * 排除最後一天，
   * 避免拿今天自己跟自己比較。
   */

  const slice =
    rows.slice(
      -(period+1),
      -1
    );

  if(!slice.length){

    return 0;

  }

  return Math.max(
    ...slice.map(
      row=>num(row.high || row.close)
    )
  );

}

function previousSupport(

){

/* =========================================================
   支撐／壓力計算
   ========================================================= */

function calculateLevels(
  history,
  currentPrice
){

  const rows =
    Array.isArray(history)
      ? history
      : [];

  const price =
    num(currentPrice);

  if(!price){

    return {

      support1:0,
      support2:0,
      resistance1:0,
      resistance2:0

    };

  }

  const highs =
    rows
      .map(
        row=>num(
          row.high ||
          row.close
        )
      )
      .filter(Boolean);

  const lows =
    rows
      .map(
        row=>num(
          row.low ||
          row.close
        )
      )
      .filter(Boolean);

  /*
   * 20 日區間
   */

  const recent20 =
    rows.slice(-20);

  const recent40 =
    rows.slice(-40);

  const high20 =
    recent20.length
      ? Math.max(
          ...recent20.map(
            x=>num(
              x.high ||
              x.close
            )
          )
        )
      : 0;

  const low20 =
    recent20.length
      ? Math.min(
          ...recent20.map(
            x=>num(
              x.low ||
              x.close
            )
          )
        )
      : 0;

  const high40 =
    recent40.length
      ? Math.max(
          ...recent40.map(
            x=>num(
              x.high ||
              x.close
            )
          )
        )
      : high20;

  const low40 =
    recent40.length
      ? Math.min(
          ...recent40.map(
            x=>num(
              x.low ||
              x.close
            )
          )
        )
      : low20;

  const ma5 =
    calculateMA(
      rows,
      TECH.MA5
    );

  const ma20 =
    calculateMA(
      rows,
      TECH.MA20
    );

  const ma60 =
    calculateMA(
      rows,
      TECH.MA60
    );

  /*
   * 支撐候選：
   * MA、近期低點都納入。
   */

  const supportCandidates = [
    ma5,
    ma20,
    ma60,
    low20,
    low40
  ]
    .filter(
      x =>
        x > 0 &&
        x < price
    )
    .sort(
      (a,b)=>b-a
    );

  /*
   * 壓力候選：
   * 近期高點與均線上方價格。
   */

  const resistanceCandidates = [
    high20,
    high40
  ]
    .filter(
      x =>
        x > price
    )
    .sort(
      (a,b)=>a-b
    );

  /*
   * 第一支撐
   */

  let support1 =
    supportCandidates[0] ||
    price * 0.97;

  /*
   * 第二支撐
   */

  let support2 =
    supportCandidates.find(
      x =>
        x < support1
    ) ||
    price * 0.94;

  /*
   * 第一壓力
   */

  let resistance1 =
    resistanceCandidates[0] ||
    price * 1.03;

  /*
   * 第二壓力
   */

  let resistance2 =
    resistanceCandidates.find(
      x =>
        x > resistance1
    ) ||
    price * 1.06;

  /*
   * 保證上下關係正確
   */

  if(support1 >= price){

    support1 =
      price * 0.97;

  }

  if(support2 >= support1){

    support2 =
      price * 0.94;

  }

  if(resistance1 <= price){

    resistance1 =
      price * 1.03;

  }

  if(resistance2 <= resistance1){

    resistance2 =
      price * 1.06;

  }

  return {

    support1,

    support2,

    resistance1,

    resistance2

  };

}


/* =========================================================
   技術資料
   ========================================================= */

function buildTechnicalData(
  history,
  quote
){

  const rows =
    Array.isArray(history)
      ? history
      : [];

  const price =
    num(
      quote?.close ||
      rows.at(-1)?.close
    );

  const ma5 =
    calculateMA(
      rows,
      TECH.MA5
    );

  const ma10 =
    calculateMA(
      rows,
      TECH.MA10
    );

  const ma20 =
    calculateMA(
      rows,
      TECH.MA20
    );

  const ma60 =
    calculateMA(
      rows,
      TECH.MA60
    );

  const volumeRatio =
    calculateVolumeRatio(
      rows,
      20
    );

  const levels =
    calculateLevels(
      rows,
      price
    );

  const previousHigh =
    previousResistance(
      rows,
      TECH.BREAKOUT_LOOKBACK
    );

  const previousLow =
    previousSupport(
      rows,
      TECH.SUPPORT_LOOKBACK
    );

  const currentHigh =
    rows.at(-1)
      ? num(
          rows.at(-1).high ||
          rows.at(-1).close
        )
      : price;

  const currentLow =
    rows.at(-1)
      ? num(
          rows.at(-1).low ||
          rows.at(-1).close
        )
      : price;

  const close =
    price;

  /*
   * 是否站上 MA
   */

  const aboveMA5 =
    !!ma5 &&
    close >= ma5;

  const aboveMA20 =
    !!ma20 &&
    close >= ma20;

  const aboveMA60 =
    !!ma60 &&
    close >= ma60;

  /*
   * 均線多頭排列
   */

  const bullishMA =
    !!(
      ma5 &&
      ma20 &&
      ma60 &&
      ma5 >= ma20 &&
      ma20 >= ma60
    );

  /*
   * 是否突破前20日高點
   */

  const breakout =
    !!(
      previousHigh &&
      close > previousHigh
    );

  /*
   * 是否接近壓力
   */

  const nearBreakout =
    !!(
      previousHigh &&
      close < previousHigh &&
      close >= previousHigh * 0.97
    );

  /*
   * 是否放量
   */

  const volumeExpanded =
    volumeRatio >=
    TECH.VOLUME_RATIO;

  /*
   * 當日漲幅
   */

  const changePct =
    num(
      quote?.changePct ||
      (
        quote?.prevClose
          ? (
              (
                close -
                quote.prevClose
              ) /
              quote.prevClose
            ) * 100
          : 0
      )
    );

  return {

    price:close,

    ma5,

    ma10,

    ma20,

    ma60,

    volumeRatio,

    previousHigh,

    previousLow,

    currentHigh,

    currentLow,

    breakout,

    nearBreakout,

    volumeExpanded,

    aboveMA5,

    aboveMA20,

    aboveMA60,

    bullishMA,

    changePct,

    support1:
      levels.support1,

    support2:
      levels.support2,

    resistance1:
      levels.resistance1,

    resistance2:
      levels.resistance2

  };

}


/* =========================================================
   建立交易參考價格
   ========================================================= */

function buildTradeLevels(
  technical
){

  const price =
    num(technical?.price);

  if(!price){

    return {

      entry:0,

      stopLoss:0,

      tp1:0,

      tp2:0

    };

  }

  const support1 =
    num(
      technical.support1
    );

  /*
   * 進場：
   * 若目前價格仍在壓力下，
   * 以現價作參考；
   * 若已突破，
   * 以突破價與現價較高者作參考。
   */

  const breakout =
    num(
      technical.previousHigh
    );

  let entry =
    price;

  if(
    technical.breakout &&
    breakout > 0
  ){

    entry =
      Math.max(
        price,
        breakout
      );

  }

  /*
   * 防守：
   * 優先放在第一支撐下方。
   */

  let stopLoss =
    support1
      ? support1 * 0.985
      : entry * (
          1 -
          TECH.STOP_LOSS_RATE
        );

  /*
   * 如果支撐太靠近，
   * 保留最低風險距離。
   */

  if(
    stopLoss >= entry
  ){

    stopLoss =
      entry *
      (1 - TECH.STOP_LOSS_RATE);

  }

  /*
   * TP1 / TP2
   */

  const tp1 =
    Math.max(
      entry * (1 + TECH.TP1_RATE),
      num(technical.resistance1) || 0
    );

  const tp2 =
    Math.max(
      entry * (1 + TECH.TP2_RATE),
      num(technical.resistance2) || 0,
      tp1 * 1.04
    );

  return {

    entry,

    stopLoss,

    tp1,

    tp2

  };

}


/* =========================================================
   突破模型
   ========================================================= */

function breakoutModel(
  technical,
  quote
){

  if(!technical){

    return {

      score:0,

      confirmed:false,

      ready:false

    };

  }

  let score = 0;

  /*
   * 站上前高
   */

  if(technical.breakout){

    score += 35;

  }

  /*
   * 放量
   */

  if(
    technical.volumeExpanded
  ){

    score += 25;

  }

  /*
   * MA20 上方
   */

  if(
    technical.aboveMA20
  ){

    score += 15;

  }

  /*
   * MA60 上方
   */

  if(
    technical.aboveMA60
  ){

    score += 10;

  }

  /*
   * MA 多頭排列
   */

  if(
    technical.bullishMA
  ){

    score += 15;

  }

  /*
   * 當日有正向動能
   */

  if(
    num(
      quote?.changePct
    ) > 2
  ){

    score += 5;

  }

  /*
   * 確認突破：
   * 分數 70 以上且實際突破
   */

  const confirmed =
    technical.breakout &&
    score >= 70;

  /*
   * 準備突破：
   * 尚未突破但距離前高不遠
   */

  const ready =
    !confirmed &&
    technical.nearBreakout &&
    score >= 45;

  return {

    score,

    confirmed,

    ready

  };

}


/* =========================================================
   多頭模型
   ========================================================= */

function bullishModel(
  technical,
  quote
){

  if(!technical){

    return {

      score:0,

      bullish:false

    };

  }

  let score = 0;

  if(

    score += 15;

  }

  if(
    technical.aboveMA20
  ){

    score += 20;

  }

  if(

    score += 20;

  }

  if(

  ){

    score += 25;

  }

  if(
    technical.volumeExpanded
  ){

    score += 10;

  }

  if(
    num(
      quote?.changePct
    ) > 0
  ){

    score += 10;

  }

  return {

    score,

    bullish:
      score >= 60

  };

}

function technicalTags(

  const tags = [];

  const t =
    analysis?.technical;

  const b =
    analysis?.breakout;

  const bull =
    analysis?.bullish;

  if(!t){

    return tags;

  }

  if(
    b?.confirmed

    tags.push("🚀確認突破");

  }else if(

  ){

    tags.push("👀準備突破");

  if(

    tags.push("📈多頭");

  }

  if(

  ){

    tags.push("🔥放量");

  }

  if(
    t.bullishMA
  ){

    tags.push("均線多頭");

  }

  if(
    t.aboveMA20
  ){

    tags.push("站上MA20");

  }

  return tags;

/* =========================================================

function parseInstitutionNumber(value){

  if(value === null || value === undefined){

    return 0;

  }

  if(typeof value === "number"){

    return Number.isFinite(value)
      ? value
      : 0;

  }

  const text =
    String(value)
      .replace(/,/g,"")
      .replace(/\s/g,"")
      .trim();

  if(
    !text ||
    text === "--" ||
    text === "-"
  ){

    return 0;

  }

  const n =
    Number(text);

  return Number.isFinite(n)
    ? n
    : 0;

}

   ========================================================= */

async function getHistory(code, months = 4){

  const c =
    cleanCode(code);

  const cacheKey =
    `${c}_${months}`;

  if(
    state.historyCache.has(cacheKey)
  ){

    return state.historyCache.get(
      cacheKey
    );

  }

  const allRows = [];

  try{

    const now =
      new Date();

    /*
     * 最多抓最近 6 個月，
     * 避免掃描時過度消耗 API。
     */

    const count =
      Math.min(
        Math.max(
          Number(months) || 1,
          1
        ),
        6
      );

    for(let i=0;i<count;i++){

      const d =
        new Date(
          now.getFullYear(),
          now.getMonth() - i,
          1
        );

      const year =
        d.getFullYear();

      const month =
        String(
          d.getMonth()+1
        ).padStart(2,"0");

      const date =
        `${year}${month}01`;

      try{

        const url =
          withQuery(
            API.day,
            {
              response:"json",
              date,
              stockNo:c
            }
          );

        const payload =
          await fetchJSON(
            url,
            {
              timeout:API_TIMEOUT
            }
          );

        const rows =
          Array.isArray(
            payload?.data
          )
            ? payload.data
            : [];

        for(const row of rows){

          const item =
            normalizeHistoryRow(
              row
            );

          if(
            item &&
            item.close > 0
          ){

            allRows.push(item);

          }

        }

      }catch(error){

        console.warn(
          `[V1491] ${c} ${date} 歷史資料失敗`,
          error
        );

      }

    }

  }catch(error){

    console.warn(
      `[V1491] ${c} 歷史資料錯誤`,
      error
    );

  }

  /*
   * 由舊 → 新排列，
   * 方便計算均線。
   */

  allRows.sort(
    (a,b)=>
      String(a.date)
        .localeCompare(
          String(b.date)
        )
  );

  /*
   * 去除重複日期。
   */

  const unique =
    [];

  const seen =
    new Set();

  for(const row of allRows){

    if(seen.has(row.date)){

      continue;

    }

    seen.add(row.date);

    unique.push(row);

  }

  state.historyCache.set(
    cacheKey,
    unique
  );

  return unique;

}


/* =========================================================
   移動平均
   ========================================================= */

function movingAverage(rows, period){

  const list =
    Array.isArray(rows)
      ? rows
      : [];

  const p =
    Math.max(
      1,
      Number(period) || 1
    );

  if(list.length < p){

    return 0;

  }

  const slice =
    list.slice(
      list.length - p
    );

  const values =
    slice
      .map(
        x => num(x.close)
      )
      .filter(
        x => x > 0
      );

  if(
    values.length < p
  ){

    return 0;

  }

  return (
    values.reduce(
      (sum,v)=>sum+v,
      0
    ) / values.length
  );

}


/* =========================================================
   最高價
   ========================================================= */

function highest(rows, field = "high", period = 20){

  const list =
    Array.isArray(rows)
      ? rows
      : [];

  const slice =
    list.slice(
      Math.max(
        0,
        list.length - period
      )
    );

  const values =
    slice
      .map(
        row => num(row[field])
      )
      .filter(
        value => value > 0
      );

  if(!values.length){

    return 0;

  }

  return Math.max(...values);

}


/* =========================================================
   最低價
   ========================================================= */

function lowest(rows, field = "low", period = 20){

  const list =
    Array.isArray(rows)
      ? rows
      : [];

  const slice =
    list.slice(
      Math.max(
        0,
        list.length - period
      )
    );

  const values =
    slice
      .map(
        row => num(row[field])
      )
      .filter(
        value => value > 0
      );

  if(!values.length){

    return 0;

  }

  return Math.min(...values);

}


/* =========================================================
   平均成交量
   ========================================================= */

function averageVolume(rows, period = 20){

  const list =
    Array.isArray(rows)
      ? rows
      : [];

  const slice =
    list.slice(
      Math.max(
        0,
        list.length - period
      )
    );

  const values =
    slice
      .map(
        row => num(row.volume)
      )
      .filter(
        value => value >= 0
      );

  if(!values.length){

    return 0;

  }

  return (
    values.reduce(
      (sum,v)=>sum+v,
      0
    ) / values.length
  );

}

async function buildStockData(code){

    cleanCode(code);

      "股票代碼不存在"
    );

  }


  /*
   * 第一階段：
   * 即時行情
   */

  const quote =
    await getMarketQuote(c);


  /*
   * 第二階段：
   * K線＋技術分析
   */

  const technicalPromise =
    analyzeTechnical(
      c,
      quote
    );


  /*
   * 第三階段：
   * 法人＋融資同時抓
   *
   * 不使用 Promise.all，
   * 避免其中一個 API 失敗
   * 讓整支股票分析失敗。
   */

  const [technicalResult,
         institutionResult,
         marginResult] =
    await Promise.allSettled([

      technicalPromise,

      getInstitutionData(c),

      getMarginData(c)

    ]);


  const analysis =
    technicalResult.status === "fulfilled"
      ? technicalResult.value
      : {

          code:c,

          quote,

          history:[],

          technical:
            buildTechnicalData(
              [],
              quote
            ),

          trade:
            buildTradeLevels(
              buildTechnicalData(
                [],
                quote
              )
            ),

          breakout:{
            score:0,
            confirmed:false,
            ready:false
          },

          bullish:{
            score:0,
            bullish:false
          }

        };


  const chips =
    institutionResult.status === "fulfilled"
      ? institutionResult.value
      : emptyChipData();


  const margin =
    marginResult.status === "fulfilled"
      ? marginResult.value
      : {

          marginBuy:0,
          marginSell:0,
          marginBalance:0,

          shortBuy:0,
          shortSell:0,
          shortBalance:0,

          marginChange:0,
          shortChange:0,

          date:""

        };


  /*
   * 股票名稱
   */

  const name =
    cleanName(
      quote?.name ||
      KNOWN[c] ||
      ""
    );


  /*
   * 完整資料
   */

  return {

    code:c,

    name,

    market:
      quote?.market ||
      getMarketByCode(c),

    quote,

    history:
      analysis.history || [],

    technical:
      analysis.technical || {},

      analysis.trade || {},

        score:0,

      },

        score:0,

async function buildStocksBatch(
  codes,
  concurrency = 5
){

  const list =
    uniqueCodes(codes);

  if(!list.length){

    return [];

  }

  const settled =
    await mapLimit(
      list,
      concurrency,
      async code =>
        buildStockData(code)
    );

  const result = [];

  for(
    let i=0;
    i<settled.length;
    i++
  ){

    const item =
      settled[i];

    if(
      item &&
      item.status === "fulfilled" &&
      item.value
    ){

      result.push(
        item.value
      );

    }

  }

  return result;

}


/* =========================================================
   根據分析資料判斷結果
   ========================================================= */

function classifyStock(data){

  if(!data){

    return "normal";

  }

  if(
    data.breakout?.confirmed
  ){

    return "confirmed";

  }

  if(
    data.breakout?.ready
  ){

    return "ready";

  }

  if(
    data.bullish?.bullish
  ){

    return "bullish";

  }

  return "normal";

}


/* =========================================================
   計算綜合分數
   ========================================================= */

function calculateOverallScore(data){

  if(!data){

    return 0;

  }

  let score = 0;

  score +=
    num(
      data.breakout?.score
    ) * 0.5;

  score +=
    num(
      data.bullish?.score
    ) * 0.3;

  const change =
    num(
      data.quote?.changePct
    );

  if(change > 0){

    score +=
      Math.min(
        10,
        change * 1.5
      );

  }

  if(
    data.technical?.volumeExpanded
  ){

    score += 5;

  }

  return Math.min(
    100,
    Math.round(score)
  );

}


/* =========================================================
   加入總分
   ========================================================= */

function enrichScore(data){

  if(!data){

    return data;

  }

  data.overallScore =
    calculateOverallScore(data);

  return data;

}

  const record = {

    code:data.code,

    name:data.name || "",

    price:
      num(
        data.quote?.close
      ),

    overallScore:
      num(
        data.overallScore
      ),

    type:
      classifyStock(data),

    time:
      Date.now()

  };

  state.records =
    Array.isArray(state.records)
      ? state.records
      : [];

  /*
   * 同一股票只更新最後一次紀錄，
   * 不會整批刪除。
   */

  const index =
    state.records.findIndex(
      x =>
        cleanCode(x.code) ===
        cleanCode(record.code)
    );

  if(index >= 0){

    state.records[index] =
      record;

  }else{

    state.records.push(
      record
    );

  }

  preserveRecords();

}

  return {

/* =========================================================

function setScanProgress(
  current,
  total,
  message
){

  const safeTotal =
    Math.max(
      1,
      Number(total) || 1
    );

  const safeCurrent =
    Math.min(
      safeTotal,
      Math.max(
        0,
        Number(current) || 0
      )
    );

  const percent =
    Math.round(
      safeCurrent /
      safeTotal *
      100
    );

  const text =
    message ||
    `正在分析 ${safeCurrent}/${safeTotal}`;

  setStatus(
    `${text}　${percent}%`,
    "loading"
  );

  const progress =
    document.querySelector(
      ".scan-progress"
    );

  if(progress){

    progress.style.width =
      `${percent}%`;

  }

}

      [...SCAN_CODES];

    const results =
      [];

    /*
     * 分批分析。
     *
     * 不一次全部打 API，
     * 避免瀏覽器同時建立太多請求。
     */

    const batchSize = 5;

    for(
      let i=0;
      i<codes.length;
      i+=batchSize
    ){

      const batch =
        codes.slice(
          i,
          i + batchSize
        );

      setScanProgress(
        i,
        codes.length,
        "正在分析原始30檔"
      );

      const settled =
        await Promise.allSettled(
          batch.map(
            code =>
              buildStockData(code)
          )
        );

      for(const item of settled){

        if(
          item.status === "fulfilled" &&
          item.value
        ){

          results.push(
            prepareScanResult(
              item.value,
              "original30"
            )
          );

        }

      }

    }

    /*
     * 保持 SCAN_CODES 原始順序
     */

    const order =
      new Map(
        codes.map(
          (code,index)=>
            [cleanCode(code),index]
        )
      );

    results.sort(
      (a,b)=>
        (
          order.get(
            cleanCode(a.code)
          ) ?? 999
        ) -
        (
          order.get(
            cleanCode(b.code)
          ) ?? 999
        )
    );

    saveAnalysisRecords(
      results
    );

    renderScanResults(
      results,
      "📋 原始30檔"
    );

    setStatus(
      `原始30檔分析完成｜成功 ${results.length}/${codes.length} 檔`,
      "live"
    );

    return results;

  }catch(error){

    console.error(
      "[V1491] 原始30檔掃描失敗",

      `原始30檔分析失敗：${error.message || "未知錯誤"}`,

    );

/* =========================================================
   個股載入
   ========================================================= */

async function loadStockInfo(
  code
){

  const c =
    cleanCode(code);

  if(!c){

    return null;

  }

  showLoading(
    `正在分析 ${c}…`
  );

  try{

    const data =
      await buildStockData(c);

    enrichScore(data);

    state.currentStock =
      c;

    state.currentData =
      data;

    saveAnalysisRecord(
      data
    );

    renderStockDetail(
      data
    );

    setStatus(
      `${c} ${data.name || ""} 分析完成`,
      "live"
    );

    return data;

  }catch(error){

    console.error(
      "[V1491] 個股分析失敗",
      error
    );

    setStatus(
      `${c} 分析失敗：${error.message || "未知錯誤"}`,
      "error"
    );

    return null;

  }finally{

    hideLoading();

  }

}


/* =========================================================
   股票搜尋資料
   ========================================================= */

function matchSearch(
  row,
  keyword
){

  if(!row){

    return false;

  }

  const q =
    String(keyword || "")
      .trim()
      .toUpperCase();

  if(!q){

    return false;

  }

  const code =
    cleanCode(
      row.code
    );

  const name =
    cleanName(
      row.name
    ).toUpperCase();

  return (
    code.includes(q) ||
    name.includes(q)
  );

}


/* =========================================================
   股票搜尋
   ★ 代碼、名稱都可以
   ★ 不限制 KNOWN
   ========================================================= */

async function searchStocks(
  keyword
){

  const q =
    String(keyword || "")
      .trim();

  if(!q){

    return [];

  }

  state.searchLoading =
    true;

  try{

    /*
     * 先查目前市場資料。
     */

    let market = [];

    try{

      market =
        await getMarketToday(false);

    }catch(error){

      console.warn(
        "[V1491] 搜尋市場資料取得失敗",
        error
      );

    }


    /*
     * 目前市場資料搜尋。
     */

    let results =
      market.filter(
        row =>
          matchSearch(
            row,
            q
          )
      );


    /*
     * KNOWN 只作為補充，
     * 不作為搜尋限制。
     */

    if(!results.length){

      const knownMatches =
        Object.entries(KNOWN)
          .filter(
            ([code,name]) =>
              code.includes(
                q.toUpperCase()
              ) ||
              name.includes(q)
          )
          .map(
            ([code,name])=>({

              code,

              name,

              market:
                getMarketByCode(code),

              close:0,

              change:0,

              changePct:0,

              volume:0,

              tradeValue:0

            })
          );

      results =
        knownMatches;

    }


    /*
     * 去重
     */

    const map =
      new Map();

    for(const row of results){

      map.set(
        cleanCode(row.code),
        row
      );

    }

    results =
      Array.from(
        map.values()
      );


    /*
     * 最多顯示20個搜尋結果。
     */

    state.searchResults =
      results.slice(0,20);

    renderSearchResults(
      state.searchResults
    );

    return state.searchResults;

  }finally{

    state.searchLoading =
      false;

  }

}

/* =========================================================
   搜尋框初始化
   ========================================================= */

function bindSearch(){

  const input =
    document.getElementById(
      "stockSearch"
    ) ||
    document.querySelector(
      ".search-input"
    );

  const button =
    document.getElementById(
      "searchBtn"
    ) ||
    document.querySelector(
      ".search-btn"
    );

  if(!input){

    return;

  }


  let timer = null;


  input.addEventListener(
    "input",
    ()=>{

      clearTimeout(
        timer
      );

      const value =
        input.value.trim();

      if(!value){

        const result =
          document.getElementById(
            "searchResults"
          );

        if(result){

          result.classList.remove(
            "show"
          );

        }

        return;

      }

      /*
       * 300ms debounce。
       */

      timer =
        setTimeout(
          ()=>{
            searchStocks(
              value
            );
          },
          300
        );

    }
  );


  input.addEventListener(
    "keydown",
    event => {

      if(
        event.key === "Enter"
      ){

        event.preventDefault();

        searchStocks(
          input.value
        );

      }

    }
  );


  if(button){

    button.addEventListener(
      "click",
      event => {

        event.preventDefault();

        searchStocks(
          input.value
        );

      }
    );

  }

}

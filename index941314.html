<script>
"use strict";

/* =========================================================
   m1491 V1491｜完整單檔版
   這一版特別修正：
   1. 所有 JS 統一在一個 script 內
   2. 移除重複 getSearchInput / 搜尋系統
   3. 修正事件綁定
   4. 修正錯誤的 <script> 巢狀問題
   5. 搜尋、快速股票、5 個掃描按鈕都由同一個 init 綁定
   6. 保留 localStorage 記錄，不自動清除
========================================================= */

const VERSION="V1491";
const STORAGE_KEY="V1491_RECORDS";

const SCAN_CODES=[
"1301","1303","1326","2002","2303","2308","2312","2313","2317","2330",
"2367","2481","2606","2618","2891","3324","3481","3711","5314","5425",
"6244","6770","8046","0050","0056","00631L","00685L","00891","00919","00981A"
];

const KNOWN={
"1301":"台塑",
"1303":"南亞",
"1326":"台化",
"2002":"中鋼",
"2303":"聯電",
"2308":"台達電",
"2312":"金寶",
"2313":"華通",
"2317":"鴻海",
"2330":"台積電",
"2367":"燿華",
"2409":"友達",
"2426":"鼎元",
"2481":"強茂",
"2606":"裕民",
"2618":"長榮航",
"2891":"中信金",
"3324":"雙鴻",
"3481":"群創",
"3711":"日月光投控",
"5314":"寶聯通",
"5425":"台半",
"6244":"茂迪",
"6770":"力積電",
"8046":"南電",
"0050":"元大台灣50",
"0056":"元大高股息",
"00631L":"元大台灣50正2",
"00685L":"群益臺灣加權正2",
"00891":"中信關鍵半導體",
"00919":"群益台灣精選高息",
"00981A":"主動野村臺灣優選"
};

const API={
twseAll:"https://openapi.twse.com.tw/v1/exchangeReport/STOCK_DAY_ALL",
tpexAll:"https://www.tpex.org.tw/openapi/v1/tpex_mainboard_quotes",
day:"https://www.twse.com.tw/rwd/zh/afterTrading/STOCK_DAY",
institution:"https://www.twse.com.tw/rwd/zh/fund/T86",
quote:"https://mis.twse.com.tw/stock/api/getStockInfo.jsp"
};
const state={
market:[],marketTime:0,universe:[],universeTime:0,
historyCache:new Map(),institutionCache:new Map(),quoteCache:new Map(),
records:[],scanToken:0,scanning:false
};

function $(id){return document.getElementById(id)}
function text(v){return v==null?"":String(v).trim()}
function code(v){return text(v).replace(/\s+/g,"").toUpperCase()}

function num(v){
if(v==null||v===""||v==="--"||v==="---")return null;
const n=Number(String(v).replace(/,/g,"").replace(/%/g,"").trim());
return Number.isFinite(n)?n:null
}

function esc(v){
return text(v)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;")
}

function fmt(v,d=2){
const n=num(v);
return n==null?"--":n.toLocaleString("zh-TW",{
minimumFractionDigits:d,
maximumFractionDigits:d
})
}

function int(v){
const n=num(v);
return n==null?"--":n.toLocaleString("zh-TW",{
maximumFractionDigits:0
})
}

function pct(v){
const n=num(v);
return n==null?"--":`${n>=0?"+":""}${n.toFixed(2)}%`
}

function pclass(v){
const n=num(v);
return n>0?"up":n<0?"down":"flat"
}

function sleep(ms){
return new Promise(r=>setTimeout(r,ms))
}

function setStatus(v){
if($("systemStatus"))$("systemStatus").textContent=v
}

function loading(on,msg="資料載入中…"){
$("loadingText").textContent=msg;
$("loadingBox").classList.toggle("show",on)
}

function message(v){
$("message").textContent=v||"";
$("message").classList.toggle("show",!!v)
}

function isETF(c){
return /^00\d{3,4}[A-Z]*$/.test(code(c))
}


/* =========================================================
   本地紀錄
========================================================= */

function loadRecords(){
try{
const x=JSON.parse(localStorage.getItem(STORAGE_KEY)||"[]");
state.records=Array.isArray(x)?x:[]
}catch(e){
state.records=[]
}
}

function saveRecords(){
try{
localStorage.setItem(
STORAGE_KEY,
JSON.stringify(state.records)
)
}catch(e){}
}

function addRecord(x){
state.records.unshift({
...x,
savedAt:new Date().toISOString()
});

if(state.records.length>500){
state.records=state.records.slice(0,500)
}

saveRecords()
}

function clearRecords(){
state.records=[];

try{
localStorage.removeItem(STORAGE_KEY)
}catch(e){}
}


/* =========================================================
   API 基礎
========================================================= */

async function fetchJSON(url,timeout=12000){

const controller=new AbortController();

const timer=setTimeout(
()=>controller.abort(),
timeout
);

try{

const r=await fetch(
url,
{
cache:"no-store",
signal:controller.signal
}
);

if(!r.ok){
throw new Error(`HTTP ${r.status}`)
}

return await r.json()

}finally{

clearTimeout(timer)

}

}


/* =========================================================
   市場資料標準化
========================================================= */

function normalizeMarketRow(r,market=""){

if(!r)return null;

const c=code(
r.Code ??
r.code ??
r.股票代號 ??
r.代號 ??
r.SecuritiesCompanyCode
);

if(!c)return null;

return{

...r,

code:c,

name:text(
r.Name ??
r.name ??
r.股票名稱 ??
r.名稱 ??
r.CompanyName ??
KNOWN[c] ??
""
),

price:num(
r.ClosingPrice ??
r.close ??
r.Close ??
r.收盤價 ??
r.成交價
),

change:num(
r.Change ??
r.change ??
r.漲跌 ??
r.漲跌價差
),

changePct:num(
r.ChangePercent ??
r.changePct ??
r.漲跌幅 ??
r.漲跌幅度
),

volume:num(
r.TradeVolume ??
r.Volume ??
r.volume ??
r.成交股數 ??
r.成交量
),

tradeValue:num(
r.TradeValue ??
r.tradeValue ??
r.成交金額 ??
r.成交額
),

open:num(
r.OpeningPrice ??
r.Open ??
r.open ??
r.開盤價
),

high:num(
r.HighestPrice ??
r.High ??
r.high ??
r.最高價
),

low:num(
r.LowestPrice ??
r.Low ??
r.low ??
r.最低價
),

market:text(
r.Market ??
r.market ??
market
)

}

}


/* =========================================================
   TWSE
========================================================= */

async function getTWSEMarket(){

try{

const a=await fetchJSON(
API.twseAll
);

return Array.isArray(a)
?a.map(x=>normalizeMarketRow(x,"TWSE")).filter(Boolean)
:[]

}catch(e){

return[]

}

}


/* =========================================================
   TPEx
========================================================= */

async function getTPExMarket(){

try{

const a=await fetchJSON(
API.tpexAll
);

return Array.isArray(a)
?a.map(x=>normalizeMarketRow(x,"TPEx")).filter(Boolean)
:[]

}catch(e){

return[]

}

}


/* =========================================================
   合併市場資料
========================================================= */

function mergeRows(...lists){

const m=new Map();

for(const list of lists){

for(const r of list||[]){

if(!r?.code)continue;

const k=code(r.code);

m.set(
k,
{
...(m.get(k)||{}),
...r,
code:k
}
)

}

}

return [...m.values()]

}


/* =========================================================
   API 失敗時的保底股票清單
   ★ 這裡是修復「搜尋一檔都沒有」的核心
========================================================= */

function fallbackMarketRows(){

return Object.entries(KNOWN).map(
([c,n])=>({

code:c,
name:n,
market:isETF(c)?"ETF":"TWSE",
type:isETF(c)?"ETF":"STOCK",

price:null,
change:null,
changePct:null,
volume:null,
tradeValue:null,
open:null,
high:null,
low:null

})
)

}


/* =========================================================
   取得市場
========================================================= */

async function getMarket(force=false){

if(
!force &&
state.market.length &&
Date.now()-state.marketTime<30000
){
return state.market
}

const [a,b]=await Promise.all([
getTWSEMarket(),
getTPExMarket()
]);

const merged=mergeRows(a,b);

if(merged.length){

state.market=merged;
state.marketTime=Date.now();

return merged

}


/*
  API 暫時失敗時，
  不讓搜尋與五個掃描按鈕整個失效。
*/

const fallback=mergeRows(
state.market,
fallbackMarketRows()
);

state.market=fallback;
state.marketTime=Date.now();

return fallback

}


/* =========================================================
   建立完整搜尋索引
========================================================= */

async function getUniverse(force=false){

if(
!force &&
state.universe.length &&
Date.now()-state.universeTime<300000
){
return state.universe
}

const market=await getMarket(force).catch(
()=>[]
);

const m=new Map();

for(const r of market){

m.set(
r.code,
{
code:r.code,
name:r.name||KNOWN[r.code]||r.code,
market:r.market||"",
type:isETF(r.code)?"ETF":"STOCK"
}
)

}


/*
  永遠把內建股票名單加入搜尋索引。
  API 失敗時仍然可以搜尋。
*/

for(
const [c,n]
of Object.entries(KNOWN)
){

if(!m.has(c)){

m.set(
c,
{
code:c,
name:n,
market:isETF(c)?"ETF":"TWSE",
type:isETF(c)?"ETF":"STOCK"
}
)

}

}

}


/* =========================================================
   搜尋股票
   ★ 代號 / 股票名稱都可以
========================================================= */

async function searchStocks(keyword){

const k=text(keyword).toUpperCase();

if(!k)return[];

const u=await getUniverse(false).catch(
()=>Object.entries(KNOWN).map(
([c,n])=>({
code:c,
name:n,
market:isETF(c)?"ETF":"TWSE",
type:isETF(c)?"ETF":"STOCK"
})
)
);

const nk=code(k);

const exactCode=u.filter(
x=>code(x.code)===nk
);

const exactName=u.filter(
x=>text(x.name).toUpperCase()===k
);

const codeMatch=u.filter(
x=>code(x.code).includes(nk)
);

const nameMatch=u.filter(
x=>text(x.name).toUpperCase().includes(k)
);

const m=new Map();

for(
const r of [
...exactCode,
...exactName,
...codeMatch,
...nameMatch
]
){

if(!m.has(r.code)){
m.set(r.code,r)
}

}


/*
  使用者直接輸入股票代號時，
  即使市場清單 API 暫時失敗，
  仍然允許直接分析該代號。
*/

if(
/^\d{4,6}[A-Z]*$/.test(nk) &&
!m.has(nk)
){

m.set(
nk,
{
code:nk,
name:KNOWN[nk]||nk,
market:isETF(nk)?"ETF":"TWSE",
type:isETF(nk)?"ETF":"STOCK"
}
)

}

return [...m.values()].slice(0,30)

}

/* =========================================================
   歷史股價
   修正：歷史資料不足時不再拿單筆報價假裝 K 線
========================================================= */

async function getHistory(c,months=3){

const k=code(c);
const safeMonths=Math.max(1,Math.min(12,Math.floor(num(months)||3)));
const cacheKey=`${k}_${safeMonths}`;
const cached=state.historyCache.get(cacheKey);

if(cached&&Date.now()-cached.time<300000){
return cached.data
}

const m=marketStock(k);
const venue=String(m?.market||"").toUpperCase();

const isTPEx=
!isETF(k)&&(
venue.includes("TPEX")||
venue.includes("OTC")||
venue.includes("上櫃")
);

/*
  目前 API.day 是 TWSE STOCK_DAY。
  上櫃股票不可以錯送到上市歷史 API。
  TPEx 歷史 API 尚未接妥時，明確回傳空資料。
*/

if(isTPEx){

state.historyCache.set(cacheKey,{
time:Date.now(),
data:[]
});

return[]

}

const now=new Date();
const rows=[];

for(let i=0;i<safeMonths;i++){

const d=new Date(
now.getFullYear(),
now.getMonth()-i,
1
);

const y=d.getFullYear();
const mm=String(d.getMonth()+1).padStart(2,"0");

const url=
`${API.day}?response=json`+
`&date=${y}${mm}01`+
`&stockNo=${encodeURIComponent(k)}`;

try{

const data=await fetchJSON(url,12000);
const arr=Array.isArray(data?.data)?data.data:[];

for(const r of arr){

if(!Array.isArray(r)||r.length<7)continue;

const date=text(r[0]);
const volume=num(r[1]);
const amount=num(r[2]);
const open=num(r[3]);
const high=num(r[4]);
const low=num(r[5]);
const close=num(r[6]);

if(close==null||close<=0)continue;

rows.push({
date,
volume,
amount,
open,
high,
low,
close,
change:num(r[7]),
transactions:num(r[8])
});

}

}catch(e){
console.warn("歷史資料月份讀取失敗",k,y,mm,e)
}

}

/* 日期排序並去除重複資料。 */

rows.sort((a,b)=>String(a.date).localeCompare(String(b.date)));

const uniqueRows=[];
const seenDates=new Set();

for(const row of rows){
if(seenDates.has(row.date))continue;
seenDates.add(row.date);
uniqueRows.push(row)
}

/* 不再把市場即時資料塞進歷史 K 線。 */

state.historyCache.set(cacheKey,{
time:Date.now(),
data:uniqueRows
});

return uniqueRows

}


/* =========================================================
   三大法人資料
   修正：向前查找交易日、欄位優先依名稱定位
========================================================= */

async function institution(c){

const k=code(c);
const cached=state.institutionCache.get(k);

if(cached&&Date.now()-cached.time<300000){
return cached.data
}

let result=null;
const now=new Date();

/*
  往前查找最近 15 個日曆日。
  非交易日或當日資料尚未發布時，繼續往前查。
*/

for(let offset=0;offset<15;offset++){

const day=new Date(now);
day.setDate(now.getDate()-offset);

const date=
String(day.getFullYear())+
String(day.getMonth()+1).padStart(2,"0")+
String(day.getDate()).padStart(2,"0");

const url=
`${API.institution}?response=json`+
`&date=${date}`+
`&selectType=ALL`;

try{

const data=await fetchJSON(url,12000);
const arr=Array.isArray(data?.data)?data.data:[];

if(!arr.length)continue;

const row=arr.find(
r=>Array.isArray(r)&&code(r[0])===k
);

if(!row)continue;

const fields=Array.isArray(data?.fields)
?data.fields.map(v=>String(v??"").trim())
:[];

const findField=(patterns)=>fields.findIndex(
name=>patterns.some(pattern=>pattern.test(name))
);

const read=(index)=>{
if(index<0||index>=row.length)return null;
return num(row[index])
};

const idxForeign=findField([
/外陸資買賣超股數.*不含外資自營商/,
/外資及陸資買賣超股數.*不含外資自營商/
]);

const idxForeignDealer=findField([
/外資自營商買賣超股數/
]);

const idxTrust=findField([
/投信買賣超股數/
]);

const idxDealerSelf=findField([
/自營商買賣超股數.*自行買賣/
]);

const idxDealerHedge=findField([
/自營商買賣超股數.*避險/
]);

const foreignBase=idxForeign>=0
?read(idxForeign)
:read(2);

const foreignDealer=idxForeignDealer>=0
?read(idxForeignDealer)
:read(3);

const trust=idxTrust>=0
?read(idxTrust)
:read(5);

const dealerSelf=idxDealerSelf>=0
?read(idxDealerSelf)
:read(6);

const dealerHedge=idxDealerHedge>=0
?read(idxDealerHedge)
:read(7);

const foreign=
foreignBase==null&&foreignDealer==null
?null
:(foreignBase??0)+(foreignDealer??0);

const dealer=
dealerSelf==null&&dealerHedge==null
?null
:(dealerSelf??0)+(dealerHedge??0);

const available=[foreign,trust,dealer].filter(v=>v!=null);

result={
code:k,
name:text(row[1])||KNOWN[k]||k,
foreign,
trust,
dealer,
total:available.length
?available.reduce((sum,v)=>sum+v,0)
:null,
date
};

break

}catch(e){
console.warn("法人資料查詢失敗",k,date,e)
}

}

if(!result){

result={
code:k,
name:KNOWN[k]||k,
foreign:null,
trust:null,
dealer:null,
total:null,
date:null
};

}

state.institutionCache.set(k,{
time:Date.now(),
data:result
});

return result

}


/* =========================================================
   基礎技術計算
========================================================= */

function avg(a){

const x=(a||[])
.filter(v=>num(v)!=null)
.map(num);

if(!x.length)return null;

return x.reduce((s,v)=>s+v,0)/x.length

}

function ma(rows,n){

const a=(rows||[])
.slice(-n)
.map(x=>num(x.close))
.filter(v=>v!=null);

return a.length===n?avg(a):null

}

function high(rows,n){

const a=(rows||[])
.slice(-n)
.map(x=>num(x.high))
.filter(v=>v!=null);

return a.length===n?Math.max(...a):null

}

function low(rows,n){

const a=(rows||[])
.slice(-n)
.map(x=>num(x.low))
.filter(v=>v!=null);

return a.length===n?Math.min(...a):null

}

function previousHigh(rows,n=20){

const a=(rows||[])
.slice(-(n+1),-1)
.map(x=>num(x.high))
.filter(v=>v!=null);

return a.length===n?Math.max(...a):null

}

function previousLow(rows,n=20){

const a=(rows||[])
.slice(-(n+1),-1)
.map(x=>num(x.low))
.filter(v=>v!=null);

return a.length===n?Math.min(...a):null

}


/* =========================================================
   ATR
========================================================= */

function atr(rows,n=14){

const r=rows||[];

if(r.length<n+1)return null;

const tr=[];

for(let i=r.length-n;i<r.length;i++){

const h=num(r[i].high);
const l=num(r[i].low);
const pc=num(r[i-1].close);

if(h==null||l==null)continue;

tr.push(Math.max(
h-l,
pc!=null?Math.abs(h-pc):0,
pc!=null?Math.abs(l-pc):0
));

}

return tr.length===n?avg(tr):null

}


/* =========================================================
   成交量放大
========================================================= */

function volRatio(rows,n=5){

if(!rows||rows.length<n*2)return null;

const recent=rows.slice(-n).map(x=>num(x.volume));
const previous=rows.slice(-n*2,-n).map(x=>num(x.volume));

if(
recent.length!==n||
previous.length!==n||
recent.some(v=>v==null)||
previous.some(v=>v==null)
)return null;

const a=avg(recent);
const b=avg(previous);

return b!=null&&b!==0?a/b:null

}


/* =========================================================
   支撐／壓力
========================================================= */

function levels(rows,price){

const p=num(price);

if(p==null){
return{
support1:null,
support2:null,
resistance1:null,
resistance2:null
}
}

const ma5=ma(rows,5);
const ma20=ma(rows,20);
const lo20=low(rows,20);
const hi20=high(rows,20);
const prevHi=previousHigh(rows,20);
const prevLo=previousLow(rows,20);

const supports=[ma5,ma20,prevLo,lo20]
.filter(v=>v!=null&&v<p)
.sort((a,b)=>b-a);

const resistances=[prevHi,hi20,ma5,ma20]
.filter(v=>v!=null&&v>p)
.sort((a,b)=>a-b);

return{
support1:supports[0]??null,
support2:supports[1]??null,
resistance1:resistances[0]??null,
resistance2:resistances[1]??null
}

}


/* =========================================================
   技術面分析
========================================================= */

function technical(rows,price){

const p=num(price);
const history=Array.isArray(rows)?rows:[];
const enough5=history.length>=5;
const enough20=history.length>=20;
const enough60=history.length>=60;

const ma5=enough5?ma(history,5):null;
const ma20=enough20?ma(history,20):null;
const ma60=enough60?ma(history,60):null;
const vRatio=volRatio(history,5);
const a=atr(history,14);
const prevHigh20=enough20?previousHigh(history,20):null;
const prevLow20=enough20?previousLow(history,20):null;
const lv=levels(history,p);

let trend="資料不足";

if(p!=null&&ma5!=null&&ma20!=null&&p>ma5&&ma5>ma20){
trend="多頭"
}else if(p!=null&&ma5!=null&&ma20!=null&&p<ma5&&ma5<ma20){
trend="空頭"
}else if(ma5!=null&&ma20!=null){
trend="震盪"
}

let momentum="資料不足";

if(p!=null&&ma5!=null){
momentum=p>ma5?"偏強":p<ma5?"偏弱":"中性"
}

let breakoutScore=null;

if(enough20&&p!=null){

breakoutScore=0;

if(prevHigh20!=null&&p>=prevHigh20)breakoutScore+=40;
if(ma5!=null&&ma20!=null&&ma5>ma20)breakoutScore+=20;
if(vRatio!=null&&vRatio>=1.3)breakoutScore+=20;
if(ma5!=null&&p>ma5)breakoutScore+=10;
if(ma20!=null&&p>ma20)breakoutScore+=10;

}

return{
price:p,
ma5,
ma20,
ma60,
atr:a,
volumeRatio:vRatio,
previousHigh20:prevHigh20,
previousLow20:prevLow20,
support1:lv.support1,
support2:lv.support2,
resistance1:lv.resistance1,
resistance2:lv.resistance2,
trend,
momentum,
breakoutScore,
historyCount:history.length,
dataSufficient:enough20
}

}


/* =========================================================
   交易計畫
========================================================= */

function trade(t){

const p=num(t?.price);

if(p==null||t?.dataSufficient!==true){
return{
entry:null,
stop:null,
tp1:null,
tp2:null,
risk:null
}
}

const atrValue=num(t?.atr);
const s1=num(t?.support1);
const r1=num(t?.resistance1);
const r2=num(t?.resistance2);
const entry=p;

let stop=null;

if(s1!=null){
stop=s1*0.985
}else if(atrValue!=null){
stop=p-atrValue*1.2
}else{
stop=p*0.95
}

let tp1=r1;
let tp2=r2;

if(tp1==null)tp1=p*1.08;
if(tp2==null)tp2=p*1.12;
if(tp1<=p)tp1=p*1.08;
if(tp2<=tp1)tp2=p*1.12;

return{
entry,
stop,
tp1,
tp2,
risk:entry-stop
}

}


/* =========================================================
   技術判斷條件
========================================================= */

function above(a,b){
return num(a)!=null&&num(b)!=null&&num(a)>num(b)
}

function volumeExpanded(t){
return num(t?.volumeRatio)!=null&&num(t.volumeRatio)>=1.3
}

function bullishMA(t){
return above(t?.ma5,t?.ma20)
}

function breakout(t){

return(
t?.dataSufficient===true&&
num(t?.price)!=null&&
num(t?.previousHigh20)!=null&&
t.price>=t.previousHigh20&&
(volumeExpanded(t)||bullishMA(t))
)

}

function ready(t){

if(
t?.dataSufficient!==true||
num(t?.price)==null||
num(t?.previousHigh20)==null||
t.previousHigh20<=0
)return false;

const distance=(t.previousHigh20-t.price)/t.previousHigh20*100;

return(
distance>=0&&
distance<=5&&
(bullishMA(t)||volumeExpanded(t))
)

}

function bullish(t){

return(
t?.dataSufficient===true&&
t?.trend==="多頭"&&
above(t?.price,t?.ma5)&&
above(t?.ma5,t?.ma20)
)

}


/* =========================================================
   建立單檔股票完整分析資料
========================================================= */

async function analyze(c){

const k=code(c);

if(!k)throw new Error("沒有股票代號");

const base=marketStock(k)||await findStock(k);
const quote=await realtimeQuote(k);
const rows=await getHistory(k,3);

const price=
num(quote?.price) ??
num(base?.price) ??
num(rows.at(-1)?.close);

const t=technical(rows,price);
const plan=trade(t);
const chipData=await institution(k);

return{
code:k,
name:quote?.name||base?.name||KNOWN[k]||k,
market:quote?.market||base?.market||(isETF(k)?"ETF":"TWSE"),
price,
change:num(quote?.change)??num(base?.change)??num(rows.at(-1)?.change),
changePct:num(quote?.changePct)??num(base?.changePct),
volume:num(quote?.volume)??num(base?.volume)??num(rows.at(-1)?.volume),
open:num(quote?.open)??num(base?.open)??num(rows.at(-1)?.open),
high:num(quote?.high)??num(base?.high)??num(rows.at(-1)?.high),
low:num(quote?.low)??num(base?.low)??num(rows.at(-1)?.low),
history:rows,
technical:t,
trade:plan,
institution:chipData,
score:t.breakoutScore,
isBreakout:breakout(t),
isReady:ready(t),
isBullish:bullish(t),
updatedAt:new Date().toISOString()
}

}

/* =========================================================
   執行搜尋
========================================================= */

let searchRequestToken=0;

async function executeSearch(value){

const q=text(value??$("searchInput")?.value);

if(!q){
message("請輸入股票代號或股票名稱");
$("searchInput")?.focus();
return
}

const token=++searchRequestToken;

message("");
loading(true,`正在搜尋 ${q} …`);
setStatus("搜尋中");

try{

const list=await searchStocks(q);

if(token!==searchRequestToken)return;

if(!list.length){

const k=code(q);

if(/^\d{4,6}[A-Z]*$/.test(k)){
await single(k);
return
}

message(`找不到「${q}」；請確認股票代號或名稱。`);
return

}

renderSearch(list);

const exact=list.find(x=>code(x.code)===code(q));

if(exact||/^\d{4,6}[A-Z]*$/.test(code(q))){

$("searchCandidates")?.classList.remove("show");
await single((exact||list[0]).code)

}else{

setStatus(`找到 ${list.length} 檔`);

}

}catch(e){

if(token!==searchRequestToken)return;

console.error(e);
message(`搜尋失敗：${e.message||"資料暫時無法取得"}`);
setStatus("搜尋失敗");

}finally{

if(token===searchRequestToken)loading(false)

}

}

/* =========================================================
   單檔分析
========================================================= */

async function single(c){

const k=code(c);
if(!k)return;

message("");
$("searchCandidates")?.classList.remove("show");
$("searchInput").value=k;

loading(true,`正在分析 ${KNOWN[k]||k} ${k} …`);
setStatus("分析中");

try{

const data=await analyze(k);

renderStock(data);

addRecord({
code:data.code,

/* =========================================================
   掃描條件
========================================================= */

function scanTitle(type){

const map={
original:"📋 原始30檔",
hot20:"🔥 熱門20檔",
breakout:"🚀 確認突破",
ready:"👀 準備突破",
bullish:"📈 多頭股票"
};

return map[type]||"股票掃描"

}


/* =========================================================
   掃描股票
========================================================= */

async function scan(type){

if(state.scanning){
message("目前正在掃描，請稍候…");
return
}

state.scanning=true;
const token=++state.scanToken;

message("");
$("hot20Panel").classList.remove("show");

loading(true,`${scanTitle(type)} 掃描中…`);
setStatus(`${scanTitle(type)} 掃描中`);

try{

/* 原始30檔以固定清單為準，不讓市場 API 過濾掉原始名單。 */

const codes=[...SCAN_CODES];
const results=[];

for(let i=0;i<codes.length;i++){

if(token!==state.scanToken)return;

const c=codes[i];

loading(
true,
`${scanTitle(type)}｜${i+1}/${codes.length}｜${KNOWN[c]||c}`
);

const d=await buildStock(c);

if(d){
results.push(d)
}

await sleep(120)

}

/* 掃描結果分類 */

let selected=[];

if(type==="original"){

selected=results.slice(0,30)

}else if(type==="hot20"){

selected=results
.filter(d=>d.technical?.dataSufficient===true)
.sort((a,b)=>
((num(b.technical?.volumeRatio)||0)*20+
(num(b.changePct)||0)*2+
(num(b.score)||0))-
((num(a.technical?.volumeRatio)||0)*20+
(num(a.changePct)||0)*2+
(num(a.score)||0)
)
)
.slice(0,20)

}else if(type==="breakout"){

selected=results.filter(d=>d.isBreakout)

}else if(type==="ready"){

selected=results.filter(d=>d.isReady)

}else if(type==="bullish"){

selected=results.filter(d=>d.isBullish)

}

if(token!==state.scanToken)return;

renderScanResults(selected,type,results.length);

}catch(e){

console.error(e);
message(`掃描失敗：${e.message||"資料暫時無法取得"}`);
setStatus("掃描失敗");

}finally{

if(token===state.scanToken){
state.scanning=false;
loading(false)
}

}

}

/* =========================================================
   熱門20
========================================================= */

function renderHot20(list){

const panel=$("hot20Panel");
const box=$("hot20List");
const time=$("hot20Time");

if(!panel||!box)return;

panel.classList.add("show");

if(time){
time.textContent=new Date().toLocaleString("zh-TW",{hour12:false});
}

if(!list||!list.length){

box.innerHTML=`<div class="empty">目前沒有符合熱門條件的股票</div>`;
return

}

box.innerHTML=list.map((d,i)=>{

const change=num(d.changePct);
const t=d.technical||{};

const popularity=
num(d.popularity) ??
(
(num(t.volumeRatio)||0)*20+
(num(change)||0)*3+
(num(d.score)||0)*0.35+
(d.isBullish?20:0)+
(d.isBreakout?25:d.isReady?15:0)
);

return`
<div class="hot-row" data-hot-code="${esc(d.code)}" role="button" tabindex="0">
<div class="hot-rank">${i+1}</div>
<div class="hot-name">
<strong>${esc(d.name)}</strong>
<small>${esc(d.code)}</small>
</div>
<div class="hot-num ${pclass(change)}">${change==null?"--":pct(change)}</div>
<div class="hot-num">${t.volumeRatio==null?"--":`${fmt(t.volumeRatio,1)}x`}</div>
<div class="hot-num">${fmt(popularity,1)}</div>
</div>
`

}).join("");

function openHot(e){

const row=e.target.closest("[data-hot-code]");
if(!row)return;

const c=row.getAttribute("data-hot-code");
if(c)single(c)

}

box.onclick=openHot;

box.onkeydown=e=>{

if(e.key==="Enter"||e.key===" "){
e.preventDefault();
openHot(e)
}

}

}

/* =========================================================
   最終資料檢查
========================================================= */

async function finalCheck(c){

const k=code(c);

if(!k){
return{ok:false,message:"股票代號為空"}
}

try{

const d=await analyze(k);

return{
ok:true,
code:d.code,
name:d.name,
price:d.price,
technical:d.technical,
trade:d.trade,
institution:d.institution
}

}catch(e){

return{
ok:false,
code:k,
message:e.message||"分析失敗"
}

}

}


/* =========================================================
   事件綁定
========================================================= */

function bind(){

const searchBtn=$("searchBtn");

if(searchBtn){
searchBtn.addEventListener("click",()=>executeSearch())
}

const searchInput=$("searchInput");

if(searchInput){

searchInput.addEventListener("keydown",e=>{

if(e.key==="Enter"){
e.preventDefault();
executeSearch()
}

});

let liveSearchToken=0;

searchInput.addEventListener("input",async()=>{

const value=text(searchInput.value);
const token=++liveSearchToken;

if(!value){

$("searchCandidates")?.classList.remove("show");
return

}

try{

const list=await searchStocks(value);

if(token!==liveSearchToken)return;

if(list.length){
renderSearch(list)
}else{

const box=$("searchCandidates");

if(box){
box.innerHTML=`<div class="empty">找不到符合的股票</div>`;
box.classList.add("show")
}

}

}catch(e){

console.warn("live search error",e)

}

});

}

const candidateBox=$("searchCandidates");

if(candidateBox){

candidateBox.addEventListener("click",e=>{

const btn=e.target.closest("[data-search-code]");
if(!btn)return;

const c=btn.getAttribute("data-search-code");
if(!c)return;

candidateBox.classList.remove("show");

if($("searchInput")){
$("searchInput").value=c
}

single(c)

});

}

document.querySelectorAll(".quick-btn[data-code]").forEach(btn=>{

btn.addEventListener("click",()=>{

const c=btn.getAttribute("data-code");
if(!c)return;

if($("searchInput")){
$("searchInput").value=c
}

single(c)

})

});

const scanButtons=[
["original30Btn","original"],
["hot20Btn","hot20"],
["breakoutBtn","breakout"],
["readyBtn","ready"],
["bullishBtn","bullish"]
];

scanButtons.forEach(([id,type])=>{

const btn=$(id);

if(btn){
btn.addEventListener("click",()=>scan(type))
}

});

document.addEventListener("click",e=>{

if(
!e.target.closest(".search-input-wrap")&&
!e.target.closest("#searchCandidates")
){

$("searchCandidates")?.classList.remove("show")

}

});

}

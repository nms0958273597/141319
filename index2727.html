<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>SUGO｜視頻直播時數統計</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    padding:0;
    background:#f4f7fc;
    color:#182230;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "PingFang TC",
        "Noto Sans TC",
        "Microsoft JhengHei",
        Arial,
        sans-serif;
}

button,
input,
textarea{
    font:inherit;
}

button{
    cursor:pointer;
}

.container{
    width:min(920px,100%);
    margin:auto;
    padding:24px 16px 60px;
}

/* =========================
   標題
========================= */

.header{
    text-align:center;
    padding:10px 8px 22px;
}

.title-input{
    width:100%;
    max-width:720px;
    border:0;
    outline:0;
    background:transparent;
    text-align:center;
    color:#182230;
    font-size:38px;
    font-weight:900;
    padding:5px 8px;
}

.title-input:focus{
    background:#fff;
    border-radius:16px;
    box-shadow:0 0 0 3px rgba(56,100,229,.12);
}

.subtitle{
    margin-top:4px;
    font-size:19px;
    font-weight:700;
    color:#6d7480;
}

.save-status{
    text-align:center;
    font-size:15px;
    font-weight:800;
    min-height:24px;
    margin-top:8px;
}

/* =========================
   卡片
========================= */

.card{
    background:#fff;
    border:1px solid #e3e7ee;
    border-radius:28px;
    padding:24px;
    margin-bottom:20px;
    box-shadow:0 3px 12px rgba(20,35,60,.04);
}

.card-title{
    display:flex;
    align-items:center;
    gap:9px;
    font-size:27px;
    font-weight:900;
    margin-bottom:20px;
}

/* =========================
   月份
========================= */

.month-selector{
    display:flex;
    gap:10px;
    align-items:center;
    margin-bottom:16px;
}

.month-arrow{
    width:58px;
    height:58px;
    border:0;
    border-radius:18px;
    background:#3864e5;
    color:#fff;
    font-size:30px;
    font-weight:900;
}

.month-arrow:active{
    transform:scale(.96);
}

.current-month{
    flex:1;
    height:58px;
    border-radius:18px;
    background:#edf4ff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:25px;
    font-weight:900;
}

.month-notice{
    background:#f4f7fc;
    border-radius:18px;
    padding:14px;
    text-align:center;
    font-size:16px;
    font-weight:800;
    color:#596270;
    margin-bottom:18px;
}

.month-notice strong{
    color:#3864e5;
}

/* =========================
   表單
========================= */

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
}

.form-label{
    display:block;
    font-size:19px;
    font-weight:900;
    margin-bottom:8px;
}

.input-box{
    width:100%;
    height:66px;
    border:2px solid #dce1e9;
    border-radius:20px;
    background:#fff;
    padding:0 17px;
    font-size:21px;
    font-weight:800;
    color:#182230;
    outline:none;
}

textarea.input-box{
    height:90px;
    padding:14px 17px;
    resize:vertical;
}

.input-box:focus{
    border-color:#3864e5;
    box-shadow:0 0 0 4px rgba(56,100,229,.10);
}

/* =========================
   按鈕
========================= */

.primary-btn,
.secondary-btn,
.danger-btn{
    width:100%;
    height:64px;
    border:0;
    border-radius:20px;
    font-size:21px;
    font-weight:900;
}

.primary-btn{
    background:#3864e5;
    color:#fff;
    box-shadow:0 7px 16px rgba(56,100,229,.18);
}

.secondary-btn{
    background:#edf4ff;
    color:#3864e5;
}

.danger-btn{
    background:#fff0f0;
    color:#d33b3b;
}

.primary-btn:active,
.secondary-btn:active,
.danger-btn:active{
    transform:scale(.985);
}

.button-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-top:16px;
}

/* =========================
   修改提示
========================= */

.editing-banner{
    display:none;
    background:#fff8e8;
    color:#9a6a00;
    border-radius:16px;
    padding:12px;
    font-size:16px;
    font-weight:900;
    margin-bottom:15px;
    text-align:center;
}

.editing-banner.show{
    display:block;
}

/* =========================
   統計
========================= */

.stats-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
}

.stat{
    background:#f4f7fc;
    border-radius:24px;
    min-height:145px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:18px;
}

.stat-icon{
    font-size:34px;
}

.stat-number{
    font-size:43px;
    line-height:1.05;
    font-weight:950;
}

.stat-label{
    font-size:17px;
    color:#6d7480;
    font-weight:800;
    margin-top:7px;
}

/* =========================
   總結
========================= */

.summary{
    background:#edf4ff;
    border-radius:24px;
    padding:20px;
    margin-top:16px;
}

.summary-row{
    display:flex;
    justify-content:space-between;
    gap:12px;
    padding:8px 0;
    font-size:18px;
    font-weight:800;
}

.summary-row strong{
    color:#3864e5;
}

/* =========================
   紀錄
========================= */

.record-list{
    display:flex;
    flex-direction:column;
    gap:12px;
}

.record{
    border:2px solid #e5e9f0;
    border-radius:22px;
    padding:16px;
    background:#fff;
}

.record.today{
    border-color:#3864e5;
    background:#f8fbff;
}

.record-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.record-date{
    font-size:21px;
    font-weight:950;
}

.record-hours{
    font-size:24px;
    font-weight:950;
    color:#3864e5;
}

.record-note{
    margin-top:7px;
    color:#69727f;
    font-size:16px;
    font-weight:700;
    white-space:pre-wrap;
}

.record-actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:9px;
    margin-top:12px;
}

.small-btn{
    height:45px;
    border:0;
    border-radius:14px;
    font-size:16px;
    font-weight:900;
}

.edit-btn{
    background:#edf4ff;
    color:#3864e5;
}

.delete-btn{
    background:#fff0f0;
    color:#d33b3b;
}

.empty{
    text-align:center;
    color:#7b8490;
    font-weight:800;
    padding:24px 8px;
}

/* =========================
   備份
========================= */

.backup-box{
    background:#f4f7fc;
    border-radius:18px;
    padding:15px;
    font-size:14px;
    color:#596270;
    line-height:1.7;
}

/* =========================
   手機版
========================= */

@media(max-width:620px){

    .container{
        padding:18px 12px 45px;
    }

    .title-input{
        font-size:30px;
    }

    .card{
        padding:19px;
        border-radius:24px;
    }

    .card-title{
        font-size:24px;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .stats-grid{
        grid-template-columns:1fr 1fr;
    }

    .stat-number{
        font-size:38px;
    }

    .button-row{
        grid-template-columns:1fr;
    }

}
</style>
</head>

<body>

<div class="container">

<header class="header">

    <input
        id="titleInput"
        class="title-input"
        value="SUGO｜視頻直播時數統計"
        aria-label="標題"
    >

    <div class="subtitle">
        一個月歸一個月｜資料獨立保存
    </div>

    <div id="saveStatus" class="save-status">
        🔒 資料保存在此裝置
    </div>

</header>


<!-- =========================
     月份
========================= -->

<section class="card">

    <div class="card-title">
        📅 月份
    </div>

    <div class="month-selector">

        <button
            class="month-arrow"
            id="prevMonth"
            type="button"
        >
            ‹
        </button>

        <div
            class="current-month"
            id="currentMonth"
        ></div>

        <button
            class="month-arrow"
            id="nextMonth"
            type="button"
        >
            ›
        </button>

    </div>

    <div class="month-notice">

        <strong id="monthNotice"></strong>

        的資料只屬於本月份，
        不會與其他月份合併或覆蓋。

    </div>

</section>


<!-- =========================
     新增 / 修改
========================= -->

<section class="card">

    <div class="card-title">
        ➕ 新增／修改紀錄
    </div>

    <div
        id="editingBanner"
        class="editing-banner"
    >
        ✏️ 正在修改既有紀錄｜
        修改完成後請按「💾 儲存修改」
    </div>

    <div class="form-grid">

        <div>

            <label
                class="form-label"
                for="dateInput"
            >
                直播日期
            </label>

            <input
                id="dateInput"
                class="input-box"
                type="date"
            >

        </div>


        <div>

            <label
                class="form-label"
                for="hoursInput"
            >
                直播時數
            </label>

            <input
                id="hoursInput"
                class="input-box"
                type="number"
                min="0"
                step="0.1"
                placeholder="例如 3.5"
            >

        </div>

    </div>


    <div style="margin-top:16px">

        <label
            class="form-label"
            for="noteInput"
        >
            備註（可選）
        </label>

        <textarea
            id="noteInput"
            class="input-box"
            placeholder="例如：晚上直播、活動場、休息日……"
        ></textarea>

    </div>


    <div class="button-row">

        <button
            id="addBtn"
            class="primary-btn"
            type="button"
        >
            ＋ 新增直播紀錄
        </button>


        <button
            id="saveEditBtn"
            class="secondary-btn"
            type="button"
            style="display:none"
        >
            💾 儲存修改
        </button>

    </div>


    <button
        id="cancelEditBtn"
        class="danger-btn"
        type="button"
        style="display:none;margin-top:10px"
    >
        取消修改
    </button>

</section>


<!-- =========================
     統計
========================= -->

<section class="card">

    <div class="card-title">
        📊 本月統計
    </div>


    <div class="stats-grid">

        <div class="stat">

            <div class="stat-icon">
                🎥
            </div>

            <div
                id="daysStat"
                class="stat-number"
            >
                0
            </div>

            <div class="stat-label">
                直播天數
            </div>

        </div>


        <div class="stat">

            <div class="stat-icon">
                ⏱️
            </div>

            <div
                id="hoursStat"
                class="stat-number"
            >
                0
            </div>

            <div class="stat-label">
                總直播時數
            </div>

        </div>

    </div>


    <div class="summary">

        <div class="summary-row">

            <span>
                平均每日直播
            </span>

            <strong id="avgStat">
                0 小時
            </strong>

        </div>


        <div class="summary-row">

            <span>
                目前月份
            </span>

            <strong id="summaryMonth"></strong>

        </div>


        <div class="summary-row">

            <span>
                最後儲存
            </span>

            <strong id="lastSaved">
                尚未儲存
            </strong>

        </div>

    </div>

</section>


<!-- =========================
     紀錄
========================= -->

<section class="card">

    <div class="card-title">
        📋 本月紀錄
    </div>

    <div
        id="recordList"
        class="record-list"
    ></div>

</section>


<!-- =========================
     資料保護
========================= -->

<section class="card">

    <div class="card-title">
        🛡️ 資料保護
    </div>


    <div class="backup-box">

        每個月份使用完全獨立的儲存空間。

        <br>

        ➕ 新增紀錄會立即自動儲存。

        <br>

        ✏️ 修改既有紀錄必須按
        「💾 儲存修改」才會寫入。

        <br>

        ↩️ 取消修改不會影響原本資料。

        <br>

        🛡️ 建議每月結算後匯出一份備份。

    </div>


    <div class="button-row">

        <button
            id="exportBtn"
            class="secondary-btn"
            type="button"
        >
            📤 匯出目前月份
        </button>


        <button
            id="importBtn"
            class="secondary-btn"
            type="button"
        >
            📥 匯入備份
        </button>

    </div>


    <input
        id="fileInput"
        type="file"
        accept=".json,application/json"
        style="display:none"
    >


    <button
        id="clearBtn"
        class="danger-btn"
        type="button"
        style="margin-top:10px"
    >
        🗑️ 清除目前月份資料
    </button>

</section>

</div>


<script>

"use strict";


/* =====================================================
   SUGO 月份獨立儲存系統

   ① 每個月份完全獨立

   ② 新增紀錄 → 自動儲存

   ③ 修改既有紀錄 → 手動儲存

   ④ 修改中 → 只是暫存草稿

   ⑤ 取消修改 → 原資料完全不變

   ⑥ 刪除 → 確認後立即儲存

   ⑦ 清除 → 只清除目前月份

   ⑧ 絕不使用 localStorage.clear()

===================================================== */


/* =====================================================
   KEY
===================================================== */

const STORAGE_PREFIX =
    "sugo_records_";

const TITLE_KEY =
    "sugo_page_title_v2";

const MONTH_KEY =
    "sugo_current_month_v2";


/* =====================================================
   目前月份
===================================================== */

const NOW =
    new Date();

let currentMonth =
    localStorage.getItem(MONTH_KEY)
    ||
    `${NOW.getFullYear()}-${String(NOW.getMonth()+1).padStart(2,"0")}`;


/* =====================================================
   正式資料
===================================================== */

let records = [];


/* =====================================================
   編輯狀態
===================================================== */

let editingId = null;

let editDraft = null;

let dirtyEdit = false;


/* =====================================================
   DOM
===================================================== */

const $ = id =>
    document.getElementById(id);


/* =====================================================
   月份 KEY
===================================================== */

function monthKey(month){

    return STORAGE_PREFIX +
        month.replace("-","_");

}


/* =====================================================
   月份顯示
===================================================== */

function monthLabel(month){

    const [
        year,
        monthNumber
    ] =
        month.split("-");

    return `${year} 年 ${Number(monthNumber)} 月`;

}


/* =====================================================
   今天
===================================================== */

function todayString(){

    const d =
        new Date();

    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;

}


/* =====================================================
   安全 JSON
===================================================== */

function safeParse(raw){

    try{

        const parsed =
            JSON.parse(raw);

        return Array.isArray(parsed)
            ? parsed
            : [];

    }catch(error){

        console.error(
            "JSON 解析失敗：",
            error
        );

        return [];

    }

}


/* =====================================================
   載入月份
===================================================== */

function loadMonth(month){

    const key =
        monthKey(month);

    const raw =
        localStorage.getItem(key);


    if(raw){

        records =
            safeParse(raw);

    }else{

        records = [];

    }


    /*
       只接受目前月份資料
    */

    records =
        records.filter(
            record =>
                record
                &&
                record.date
                &&
                record.date.startsWith(month)
        );


    records.sort(
        (a,b) =>
            a.date.localeCompare(b.date)
    );


    const savedAt =
        localStorage.getItem(
            key + "_savedAt"
        );


    $("lastSaved").textContent =
        savedAt || "尚未儲存";

}


/* =====================================================
   儲存月份
===================================================== */

function saveMonth(
    month,
    showStatus = true
){

    const key =
        monthKey(month);


    try{

        const monthRecords =
            records.filter(
                record =>
                    record
                    &&
                    record.date
                    &&
                    record.date.startsWith(month)
            );


        localStorage.setItem(
            key,
            JSON.stringify(monthRecords)
        );


        const stamp =
            new Date().toLocaleString(
                "zh-TW",
                {
                    hour12:false
                }
            );


        localStorage.setItem(
            key + "_savedAt",
            stamp
        );


        $("lastSaved").textContent =
            stamp;


        if(showStatus){

            showStatusMsg(
                "🟢 已儲存"
            );

        }


        return true;

    }catch(error){

        console.error(
            "儲存失敗：",
            error
        );


        showStatusMsg(
            "🔴 儲存失敗，請立即匯出備份"
        );


        return false;

    }

}


/* =====================================================
   狀態
===================================================== */

function showStatusMsg(message){

    $("saveStatus").textContent =
        message;


    clearTimeout(
        showStatusMsg.timer
    );


    showStatusMsg.timer =
        setTimeout(
            () => {

                $("saveStatus").textContent =
                    "🔒 資料保存在此裝置";

            },
            3000
        );

}


/* =====================================================
   HTML 安全
===================================================== */

function escapeHtml(str){

    return String(str)

        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


/* =====================================================
   數字
===================================================== */

function formatNumber(value){

    return Number(value || 0)
        .toFixed(1)
        .replace(".0","");

}


/* =====================================================
   渲染
===================================================== */

function render(){

    $("currentMonth").textContent =
        monthLabel(currentMonth);


    $("monthNotice").textContent =
        monthLabel(currentMonth);


    $("summaryMonth").textContent =
        monthLabel(currentMonth);


    const totalHours =
        records.reduce(
            (sum,record) =>
                sum +
                Number(record.hours || 0),
            0
        );


    const days =
        records.length;


    const average =
        days
            ? totalHours / days
            : 0;


    $("daysStat").textContent =
        days;


    $("hoursStat").textContent =
        formatNumber(totalHours);


    $("avgStat").textContent =
        `${formatNumber(average)} 小時`;


    const list =
        $("recordList");


    if(!records.length){

        list.innerHTML = `
            <div class="empty">
                本月份目前沒有直播紀錄
            </div>
        `;

        return;

    }


    const today =
        todayString();


    list.innerHTML =

        records
        .slice()
        .sort(
            (a,b) =>
                b.date.localeCompare(a.date)
        )
        .map(
            record => {

                const isToday =
                    record.date === today;


                return `

                    <div
                        class="record ${isToday ? "today" : ""}"
                    >

                        <div class="record-head">

                            <div class="record-date">

                                ${escapeHtml(record.date)}

                                ${
                                    isToday
                                        ? "　🟢 今天"
                                        : ""
                                }

                            </div>


                            <div class="record-hours">

                                ${formatNumber(record.hours)}

                                小時

                            </div>

                        </div>


                        ${
                            record.note

                            ?

                            `
                            <div class="record-note">
                                ${escapeHtml(record.note)}
                            </div>
                            `

                            :

                            ""
                        }


                        <div class="record-actions">

                            <button
                                class="small-btn edit-btn"
                                type="button"
                                onclick="startEdit('${record.id}')"
                            >
                                ✏️ 修改
                            </button>


                            <button
                                class="small-btn delete-btn"
                                type="button"
                                onclick="deleteRecord('${record.id}')"
                            >
                                🗑️ 刪除
                            </button>

                        </div>

                    </div>

                `;

            }
        )
        .join("");

}


/* =====================================================
   清空表單
===================================================== */

function clearForm(){

    const thisMonth =
        `${NOW.getFullYear()}-${String(NOW.getMonth()+1).padStart(2,"0")}`;


    $("dateInput").value =
        currentMonth === thisMonth
            ? todayString()
            : `${currentMonth}-01`;


    $("hoursInput").value =
        "";


    $("noteInput").value =
        "";

}


/* =====================================================
   新增
===================================================== */

function addRecord(){

    if(editingId !== null){

        return;

    }


    const date =
        $("dateInput").value;


    const hours =
        Number(
            $("hoursInput").value
        );


    const note =
        $("noteInput")
        .value
        .trim();


    if(
        !date
        ||
        !date.startsWith(currentMonth)
    ){

        alert(
            `請輸入 ${monthLabel(currentMonth)} 的日期。`
        );

        return;

    }


    if(
        !Number.isFinite(hours)
        ||
        hours < 0
    ){

        alert(
            "請輸入正確的直播時數。"
        );

        return;

    }


    const duplicate =
        records.some(
            record =>
                record.date === date
        );


    if(duplicate){

        alert(
            "這一天已經有紀錄。\n\n請使用「✏️ 修改」。"
        );

        return;

    }


    const newRecord = {

        id:
            crypto.randomUUID
            ? crypto.randomUUID()
            : `${Date.now()}_${Math.random()}`,

        date:
            date,

        hours:
            hours,

        note:
            note,

        createdAt:
            new Date().toISOString(),

        updatedAt:
            new Date().toISOString()

    };


    const oldRecords =
        records;


    records =
        [
            ...records,
            newRecord
        ];


    records.sort(
        (a,b) =>
            a.date.localeCompare(b.date)
    );


    /*
       ⭐ 新增自動儲存
    */

    const saved =
        saveMonth(
            currentMonth
        );


    if(!saved){

        records =
            oldRecords;

        render();

        return;

    }


    render();

    clearForm();


    showStatusMsg(
        "🟢 新增紀錄並已自動儲存"
    );

}


/* =====================================================
   開始修改
===================================================== */

function startEdit(id){

    const record =
        records.find(
            item =>
                item.id === id
        );


    if(!record){

        return;

    }


    editingId =
        id;


    /*
       ⭐ 建立獨立草稿
    */

    editDraft =
        {
            ...record
        };


    dirtyEdit =
        false;


    $("dateInput").value =
        editDraft.date;


    $("hoursInput").value =
        editDraft.hours;


    $("noteInput").value =
        editDraft.note || "";


    $("editingBanner")
        .classList
        .add("show");


    $("editingBanner").textContent =
        "✏️ 正在修改既有紀錄｜修改完成後請按「💾 儲存修改」";


    $("addBtn").style.display =
        "none";


    $("saveEditBtn").style.display =
        "block";


    $("cancelEditBtn").style.display =
        "block";


    $("dateInput").oninput =
        markDirty;


    $("hoursInput").oninput =
        markDirty;


    $("noteInput").oninput =
        markDirty;


    window.scrollTo({

        top:
            $("dateInput")
            .getBoundingClientRect()
            .top
            +
            window.scrollY
            -
            100,

        behavior:
            "smooth"

    });

}


/* =====================================================
   標記修改
===================================================== */

function markDirty(){

    if(
        editingId === null
    ){

        return;

    }


    dirtyEdit =
        true;


    $("editingBanner").textContent =
        "🟡 已修改但尚未儲存｜請按「💾 儲存修改」";


    $("saveStatus").textContent =
        "🟡 有修改尚未儲存";

}


/* =====================================================
   儲存修改

   ⭐ 正式覆蓋只發生在這裡
===================================================== */

function saveEdit(){

    if(
        editingId === null
        ||
        !editDraft
    ){

        return;

    }


    const date =
        $("dateInput").value;


    const hours =
        Number(
            $("hoursInput").value
        );


    const note =
        $("noteInput")
        .value
        .trim();


    if(
        !date
        ||
        !date.startsWith(currentMonth)
    ){

        alert(
            `修改後日期必須仍在 ${monthLabel(currentMonth)}。`
        );

        return;

    }


    if(
        !Number.isFinite(hours)
        ||
        hours < 0
    ){

        alert(
            "請輸入正確的直播時數。"
        );

        return;

    }


    const duplicate =
        records.find(
            item =>
                item.date === date
                &&
                item.id !== editingId
        );


    if(duplicate){

        alert(
            "這個日期已經有另一筆紀錄，不能重複。"
        );

        return;

    }


    /*
       建立修改後副本
    */

    const updatedRecord = {

        ...editDraft,

        date:
            date,

        hours:
            hours,

        note:
            note,

        updatedAt:
            new Date().toISOString()

    };


    /*
       建立新資料陣列
    */

    const nextRecords =
        records.map(
            item =>
                item.id === editingId
                    ? updatedRecord
                    : item
        );


    const oldRecords =
        records;


    /*
       暫時套用，
       嘗試寫入 localStorage。
    */

    records =
        nextRecords;


    const saved =
        saveMonth(
            currentMonth
        );


    /*
       儲存失敗：
       恢復原資料。
    */

    if(!saved){

        records =
            oldRecords;

        render();

        return;

    }


    /*
       ⭐ 儲存成功才正式結束修改
    */

    editingId =
        null;


    editDraft =
        null;


    dirtyEdit =
        false;


    $("editingBanner")
        .classList
        .remove("show");


    $("addBtn").style.display =
        "block";


    $("saveEditBtn").style.display =
        "none";


    $("cancelEditBtn").style.display =
        "none";


    $("dateInput").oninput =
        null;


    $("hoursInput").oninput =
        null;


    $("noteInput").oninput =
        null;


    render();

    clearForm();


    showStatusMsg(
        "🟢 修改已儲存"
    );

}


/* =====================================================
   取消修改
===================================================== */

function cancelEdit(
    show = true
){

    editingId =
        null;


    editDraft =
        null;


    dirtyEdit =
        false;


    $("editingBanner")
        .classList
        .remove("show");


    $("addBtn").style.display =
        "block";


    $("saveEditBtn").style.display =
        "none";


    $("cancelEditBtn").style.display =
        "none";


    $("dateInput").oninput =
        null;


    $("hoursInput").oninput =
        null;


    $("noteInput").oninput =
        null;


    clearForm();


    if(show){

        render();

    }

}


/* =====================================================
   刪除
===================================================== */

function deleteRecord(id){

    const record =
        records.find(
            item =>
                item.id === id
        );


    if(!record){

        return;

    }


    if(
        editingId === id
        &&
        dirtyEdit
    ){

        alert(
            "目前正在修改這筆紀錄，請先儲存或取消修改。"
        );

        return;

    }


    const confirmed =
        confirm(
            `確定刪除 ${record.date} 的 ${formatNumber(record.hours)} 小時紀錄嗎？`
        );


    if(!confirmed){

        return;

    }


    const oldRecords =
        records;


    records =
        records.filter(
            item =>
                item.id !== id
        );


    /*
       ⭐ 刪除後自動儲存
    */

    const saved =
        saveMonth(
            currentMonth
        );


    if(!saved){

        records =
            oldRecords;

        render();

        return;

    }


    if(
        editingId === id
    ){

        cancelEdit(false);

    }


    render();


    showStatusMsg(
        "🟢 紀錄已刪除並儲存"
    );

}


/* =====================================================
   切換月份
===================================================== */

function changeMonth(delta){

    if(
        editingId !== null
        &&
        dirtyEdit
    ){

        const confirmed =
            confirm(
                "目前有尚未儲存的修改。\n\n確定要放棄修改並切換月份嗎？"
            );


        if(!confirmed){

            return;

        }

    }


    let [
        year,
        month
    ] =
        currentMonth
        .split("-")
        .map(Number);


    month += delta;


    if(month < 1){

        month = 12;

        year--;

    }


    if(month > 12){

        month = 1;

        year++;

    }


    currentMonth =
        `${year}-${String(month).padStart(2,"0")}`;


    localStorage.setItem(
        MONTH_KEY,
        currentMonth
    );


    /*
       放棄編輯草稿
    */

    cancelEdit(false);


    /*
       載入新月份
    */

    loadMonth(
        currentMonth
    );


    clearForm();

    render();


    showStatusMsg(
        `📅 已切換到 ${monthLabel(currentMonth)}`
    );

}


/* =====================================================
   匯出目前月份
===================================================== */

function exportMonth(){

    const payload = {

        app:
            "SUGO Live Hours",

        version:
            3,

        month:
            currentMonth,

        exportedAt:
            new Date().toISOString(),

        records:
            records

    };


    const blob =
        new Blob(
            [
                JSON.stringify(
                    payload,
                    null,
                    2
                )
            ],
            {
                type:
                    "application/json"
            }
        );


    const url =
        URL.createObjectURL(
            blob
        );


    const a =
        document.createElement(
            "a"
        );


    a.href =
        url;


    a.download =
        `SUGO_${currentMonth.replace("-","_")}_備份.json`;


    document.body.appendChild(a);


    a.click();


    a.remove();


    URL.revokeObjectURL(
        url
    );


    showStatusMsg(
        "📤 備份檔已匯出"
    );

}


/* =====================================================
   匯入備份
===================================================== */

function importMonth(file){

    const reader =
        new FileReader();


    reader.onload = () => {

        try{

            const payload =
                JSON.parse(
                    reader.result
                );


            if(
                payload.month !== currentMonth
            ){

                alert(
                    `這份備份是 ${payload.month}，目前正在查看 ${currentMonth}。\n\n請切換到正確月份後再匯入。`
                );

                return;

            }


            if(
                !Array.isArray(
                    payload.records
                )
            ){

                throw new Error(
                    "Invalid records"
                );

            }


            const importedRecords =
                payload.records.filter(
                    record =>
                        record
                        &&
                        record.date
                        &&
                        record.date.startsWith(
                            currentMonth
                        )
                );


            const oldRecords =
                records;


            records =
                importedRecords;


            const saved =
                saveMonth(
                    currentMonth
                );


            if(!saved){

                records =
                    oldRecords;

                render();

                return;

            }


            cancelEdit(false);

            render();


            showStatusMsg(
                "🟢 備份已匯入並儲存"
            );


        }catch(error){

            console.error(
                error
            );


            alert(
                "備份檔案格式不正確。"
            );

        }

    };


    reader.readAsText(
        file
    );

}


/* =====================================================
   清除目前月份
===================================================== */

function clearCurrentMonth(){

    const confirmed =
        confirm(
            `⚠️ 確定要清除 ${monthLabel(currentMonth)} 的全部紀錄嗎？\n\n只有目前月份會被清除。\n其他月份完全不會受到影響。`
        );


    if(!confirmed){

        return;

    }


    /*
       ⭐ 只清目前月份

       絕對不使用：
       localStorage.clear()
    */

    localStorage.removeItem(
        monthKey(currentMonth)
    );


    localStorage.removeItem(
        monthKey(currentMonth)
        +
        "_savedAt"
    );


    records =
        [];


    cancelEdit(false);


    render();


    showStatusMsg(
        `🗑️ ${monthLabel(currentMonth)} 已清除`
    );

}


/* =====================================================
   標題儲存
===================================================== */

$("titleInput").value =
    localStorage.getItem(
        TITLE_KEY
    )
    ||
    "SUGO｜視頻直播時數統計";


$("titleInput")
    .addEventListener(
        "change",
        () => {

            const title =
                $("titleInput")
                .value
                .trim();


            localStorage.setItem(
                TITLE_KEY,
                title
                ||
                "SUGO｜視頻直播時數統計"
            );

        }
    );


/* =====================================================
   事件
===================================================== */

$("addBtn")
    .addEventListener(
        "click",
        addRecord
    );


$("saveEditBtn")
    .addEventListener(
        "click",
        saveEdit
    );


$("cancelEditBtn")
    .addEventListener(
        "click",
        () =>
            cancelEdit(true)
    );


$("prevMonth")
    .addEventListener(
        "click",
        () =>
            changeMonth(-1)
    );


$("nextMonth")
    .addEventListener(
        "click",
        () =>
            changeMonth(1)
    );


$("exportBtn")
    .addEventListener(
        "click",
        exportMonth
    );


$("importBtn")
    .addEventListener(
        "click",
        () =>
            $("fileInput").click()
    );


$("fileInput")
    .addEventListener(
        "change",
        event => {

            const file =
                event.target.files[0];


            if(file){

                importMonth(file);

            }


            event.target.value =
                "";

        }
    );


$("clearBtn")
    .addEventListener(
        "click",
        clearCurrentMonth
    );


/* =====================================================
   離開頁面保護
===================================================== */

window.addEventListener(
    "beforeunload",
    event => {

        if(
            editingId !== null
            &&
            dirtyEdit
        ){

            event.preventDefault();

            event.returnValue =
                "";

        }

    }
);


/* =====================================================
   啟動
===================================================== */

loadMonth(
    currentMonth
);

clearForm();

render();

</script>

</body>
</html>

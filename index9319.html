.progress span{display:block;height:100%;width:0;background:var(--yellow);transition:.2s}
.dataGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);background:rgba(18,20,23,.98);border-top:1px solid #373b41;padding:5px 5px calc(5px + env(safe-area-inset-bottom));backdrop-filter:blur(15px)}
.nav button{border:0;background:transparent;color:#999;min-height:52px}

@media(max-width:700px){

}
@media(max-width:480px){

.actionGrid{grid-template-columns:repeat(2,1fr)}

<script>

"use strict";

const API="https://api.finmindtrade.com/api/v4/data";

const TWSE=
"https://openapi.twse.com.tw/v1/exchangeReport/STOCK_DAY_ALL";

const TPEX=
"https://www.tpex.org.tw/openapi/v1/tpex_mainboard_daily_close_quotes";

const KEY={
universe:"M1391_V16_UNIVERSE",
snapshot:"M1391_V16_SNAPSHOT",
price:"M1391_V16_PRICE_",
law:"M1391_V16_LAW_",
model:"M1391_V16_MODEL_"
};

const TTL={
universe:7*864e5,
snapshot:36*36e5,
price:10*60e3,
law:36*36e5,
model:36*36e5
};

const S={
universe:[],
models:new Map(),
inflight:new Map(),
apiCalls:0,
scan:false
};

const $=id=>document.getElementById(id);

function esc(x){

return String(x??"").replace(
/[&<>"']/g,
c=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"
}[c])
);

}

function num(x){

const n=Number(
String(x??"").replace(/,/g,"")
);

return Number.isFinite(n)?n:0;

}

function avg(a){

return a.length?
a.reduce((x,y)=>x+y,0)/a.length:
0;

}

function sma(a,n){

return a.length>=n?
avg(a.slice(-n)):
0;

}

function pct(x,d=1){

return Number.isFinite(x)?
x.toFixed(d)+"%":
"-";

}

function sign(x,d=0){

const n=num(x);

return (n>0?"+":"")+
n.toFixed(d);

}

function sleep(ms){

return new Promise(r=>setTimeout(r,ms));

}

function ds(d){

return d.toISOString().slice(0,10);

}

function dateAgo(n){

return ds(
new Date(
Date.now()-n*864e5
)
);

}

function status(t,c="loading"){

$("status").textContent=t;

$("status").className=
"status show "+c;

}

function cacheGet(k,ttl){

try{

const o=
JSON.parse(
localStorage.getItem(k)||"null"
);

return o &&
Date.now()-o.t<ttl?
o.d:
null;

}catch(e){

return null;

}

}

function cacheSet(k,d){

try{

localStorage.setItem(
k,
JSON.stringify({
t:Date.now(),
d
})
);

}catch(e){}

}

async function once(k,fn){

if(S.inflight.has(k))
return S.inflight.get(k);

const p=
Promise
.resolve()
.then(fn)
.finally(
()=>S.inflight.delete(k)
);

S.inflight.set(k,p);

return p;

}

async function json(url){

S.apiCalls++;

$("apiStatus").textContent=
"本次頁面 API 請求："+S.apiCalls+
" 次｜相同資料會共用 Cache";

const r=
await fetch(
url,
{
cache:"no-store"
}
);

if(!r.ok)
throw Error("HTTP "+r.status);

return r.json();

}

async function fm(dataset,p={}){

const u=new URL(API);

u.searchParams.set(
"dataset",
dataset
);

Object.entries(p).forEach(
([k,v])=>{

if(
v!==null &&
v!==undefined &&
v!==""
)
u.searchParams.set(k,v);

}
);

const j=await json(u);

if(!Array.isArray(j.data))
throw Error(
j.msg||"API沒有資料"
);

return j.data;

}

function normalize(rows,market){

const a=[];

for(const x of rows||[]){

const id=
String(
x.Code??
x.SecuritiesCompanyCode??
x.code??
x.stock_id??
""
)
.trim()
.toUpperCase();

const name=
String(
x.Name??
x.CompanyName??
x.name??
x.stock_name??
""
)
.trim();

if(
!id||
!name||
!/^[0-9]{4,6}[A-Z]?$/.test(id)
)
continue;

if(
/權證|牛熊證|可轉換公司債|債券/.test(name)
)
continue;

a.push({
id,
name,
market
});

}

return a;

}

async function loadUniverse(force=false){

if(!force){

const c=
cacheGet(
KEY.universe,
TTL.universe
);

if(c?.length>500){

S.universe=c;

return c;

}

}

return once(
"universe",
async()=>{

status(
"⏳ 正在抓取上市＋上櫃完整股票清單…"
);

const [a,b]=
await Promise.all([
json(TWSE),
json(TPEX)
]);

const m=new Map();

normalize(a,"上市")
.forEach(
x=>m.set(x.id,x)
);

normalize(b,"上櫃")
.forEach(
x=>m.set(x.id,x)
);

const arr=
[...m.values()]
.sort(
(a,b)=>a.id.localeCompare(b.id)
);

if(arr.length<500)
throw Error(
"完整市場資料不足，拒絕使用49檔 fallback"
);

S.universe=arr;

cacheSet(
KEY.universe,
arr
);

$("dbStatus").textContent=
`🟢 完整股票池 ${arr.length.toLocaleString()} 檔｜上市＋上櫃｜已 Cache`;

status(
`🟢 完整股票池載入完成｜${arr.length.toLocaleString()} 檔`,
"ok"
);

return arr;

}
);

}

function close(r){

return num(
r.close??
r.Close??
r.ClosingPrice??
r.price
);

}

function open(r){

return num(
r.open??
r.Open??
r.OpeningPrice
);

}

function high(r){

return num(
r.max??
r.high??
r.High??
r.HighestPrice
);

}

function low(r){

return num(
r.min??
r.low??
r.Low??
r.LowestPrice
);

}

function vol(r){

return num(
r.Trading_Volume??
r.volume??
r.Volume??
r.trading_volume??
r.TradingShares
);

}

function sortRows(a){

return [...a].sort(
(x,y)=>
String(x.date??x.Date)
.localeCompare(
String(y.date??y.Date)
)
);

}

async function prices(id,force=false){

const k=KEY.price+id;

if(!force){

const c=
cacheGet(k,TTL.price);

if(c?.length)
return c;

}

return once(
k,
async()=>{

const data=
await fm(
"TaiwanStockPrice",
{
data_id:id,
start_date:dateAgo(520),
end_date:ds(new Date())
}
);

const r=sortRows(data);

if(!r.length)
throw Error("沒有歷史行情");

cacheSet(k,r);

return r;

}
);

}

async function laws(id,force=false){

const k=KEY.law+id;

if(!force){

const c=
cacheGet(k,TTL.law);

if(c)
return c;

}

return once(
k,
async()=>{

let r=[];

try{

r=
await fm(
"TaiwanStockInstitutionalInvestorsBuySell",
{
data_id:id,
start_date:dateAgo(140),
end_date:ds(new Date())
}
);

}catch(e){}

cacheSet(k,r);

return r;

}
);

}

function lawModel(rows){

const m=new Map();

for(const r of rows||[]){

if(!r.date)
continue;

if(!m.has(r.date))
m.set(
r.date,
{
date:r.date,
f:0,
t:0,
d:0
}
);

const x=m.get(r.date);

const n=
num(r.buy)-
num(r.sell);

const name=
String(
r.name??
r.InstitutionalInvestors??
""
);

if(name.includes("外資"))
x.f+=n;

else if(name.includes("投信"))
x.t+=n;

else if(name.includes("自營"))
x.d+=n;

}

const d=
[...m.values()]
.sort(
(a,b)=>
a.date.localeCompare(b.date)
);

const sum=
(n,k)=>
d.slice(-n)
.reduce(
(s,x)=>s+x[k],
0
);

const f5=sum(5,"f");
const t5=sum(5,"t");
const d5=sum(5,"d");

const f20=sum(20,"f");
const t20=sum(20,"t");
const d20=sum(20,"d");

return{

f5,
t5,
d5,

total5:
f5+t5+d5,

f20,
t20,
d20,

total20:
f20+t20+d20,

all3:
f5>0&&
t5>0&&
d5>0

};

}

function weekly(rows){

const m=new Map();

for(const r of sortRows(rows)){

if(!r.date)
continue;

const d=
new Date(
r.date+"T00:00:00"
);

const off=
(d.getDay()+6)%7;

d.setDate(
d.getDate()-off
);

const k=ds(d);

if(!m.has(k)){

m.set(
k,
{
date:k,
o:open(r),
h:high(r),
l:low(r),
c:close(r),
v:vol(r)
}
);

}else{

const x=m.get(k);

x.h=Math.max(
x.h,
high(r)
);

x.l=Math.min(
x.l,
low(r)
);

x.c=close(r);

x.v+=vol(r);

}

}

return [...m.values()];

}

function monthly(rows){

const m=new Map();

for(const r of sortRows(rows)){

const k=
String(r.date).slice(0,7);

if(!m.has(k)){

m.set(
k,
{
h:high(r),
l:low(r),
c:close(r)
}
);

}else{

const x=m.get(k);

x.h=Math.max(
x.h,
high(r)
);

x.l=Math.min(
x.l,
low(r)
);

x.c=close(r);

}

}

return [...m.values()];

}

function tech(rows){

const c=rows.map(close);
const v=rows.map(vol);

const last=rows.at(-1);
const pre=rows.at(-2)||last;

const p=close(last);

const ma5=sma(c,5);
const ma20=sma(c,20);
const ma60=sma(c,60);

const p20=
rows.slice(-21,-1);

const res=
Math.max(
...p20.map(high)
);

const sup=
Math.min(
...p20.map(low)
);

const av=
avg(v.slice(-21,-1))||1;

const vr=
vol(last)/av;

const range=
high(last)-low(last);

const loc=
range?
(p-low(last))/range:
.5;

return{

price:p,

previous:
close(pre),

open:
open(last),

high:
high(last),

low:
low(last),

volume:
vol(last),

ma5,
ma20,
ma60,

resistance:res,
support:sup,

volumeRatio:vr,

closeLocation:loc,

extension:
ma20?
(p-ma20)/ma20*100:
0,

change:
close(pre)?
(p-close(pre))/close(pre)*100:
0,

slope20:
c.length>20?
p-c[c.length-21]:
0,

peak60:
Math.max(
...c.slice(-61,-1)
)

};

}

function model(rows,law){

const t=tech(rows);

const w=weekly(rows);

const m=monthly(rows);

const wc=w.map(x=>x.c);
const mc=m.map(x=>x.c);

const w20=sma(wc,20);
const w40=sma(wc,40);

const m20=sma(mc,20);

const wRes=
Math.max(
...w.slice(-21,-1)
.map(x=>x.h)
);

const wSup=
Math.min(
...w.slice(-21,-1)
.map(x=>x.l)
);

const wUp=
(t.price)?
(wRes-t.price)/
t.price*100:
0;

let week=0;

if(w20>w40)
week+=20;

if(
t.price>=w20*.95&&
t.price<=w20*1.05
)
week+=30;

if(
t.price>wSup&&
t.price<=wSup*1.1
)
week+=20;

if(law.total5>0)
week+=15;

if(t.price<wRes)
week+=15;

week=Math.min(
100,
week
);

let month=0;

if(
mc.length>=20&&
sma(mc,5)>sma(mc,10)&&
sma(mc,10)>m20
)
month+=30;

if(
t.price>=m20*.95&&
t.price<=m20*1.06
)
month+=30;

if(
m20&&
t.price<=m20*1.12
)
month+=15;

month=Math.min(
100,
month
);

let br=0;

if(
t.ma5>t.ma20&&
t.ma20>t.ma60
)
br+=25;

if(t.slope20>0)
br+=15;

if(
t.price>t.resistance&&
t.volumeRatio>=1.2&&
t.closeLocation>=.7
)
br+=40;

if(
t.volumeRatio>=.55&&
t.volumeRatio<=.9
)
br+=10;

if(law.total5>0)
br+=10;

br=Math.min(
100,
br
);

const drop=
t.peak60?
(t.price-t.peak60)/
t.peak60*100:
0;

let reb=0;

if(drop<=-15)
reb+=30;

else if(drop<=-10)
reb+=20;

if(t.extension<=-10)
reb+=20;

if(
t.change>0&&
t.closeLocation>=.6
)
reb+=25;

if(law.total5>=0)
reb+=10;

reb=Math.min(
100,
reb
);

const recent5=
rows.slice(-5);

const prior20=
rows.slice(-21,-1);

const low5=
Math.min(
...recent5.map(low)
);

const low20=
Math.min(
...prior20.map(low)
);

const sh=
avg(
rows.map(vol)
.slice(-6,-1)
)/
(
avg(
rows.map(vol)
.slice(-21,-1)
)||1
);

let base=0;

if(drop<=-15)
base+=25;

else if(drop<=-10)
base+=18;

if(sh<=.75)
base+=25;

else if(sh<=.9)
base+=15;

if(low5>=low20*.985)
base+=25;

if(t.closeLocation>=.6)
base+=10;

if(law.total5>=0)
base+=10;

base=Math.min(
100,
base
);

const range=
t.price?
((t.high-t.low)/
t.price*100):
0;

let day=0;

if(t.volumeRatio>=1.3)
day+=20;

if(range>=3)
day+=20;

if(
t.change>0&&
t.closeLocation>=.7
)
day+=30;

else if(
t.change<0&&
t.closeLocation<.5
)
day+=30;

if(t.price>t.ma5)
day+=15;

else
day+=15;

day+=
law.total5>0?
15:
0;

day=Math.min(
100,
day
);

const total=
Math.round(
week*.20+
month*.15+
br*.20+
reb*.10+
base*.15+
day*.05+
Math.min(
100,
Math.max(
0,
wUp
)
)*.15
);

return{

t,
law,
week,
month,
br,
reb,
base,
day,
total,
wRes,
wSup,
wUp,
drop,
sh

};

}

async function getStock(info,force=false){

const id=
typeof info==="string"?
info:
info.id;

const k=
KEY.model+id;

if(!force){

const c=
cacheGet(
k,
TTL.model
);

if(c)
return c;

}

return once(
"model:"+id,
async()=>{

const rows=
await prices(
id,
force
);

const law=
await laws(
id,
force
);

const d=
model(
rows,
law
);

const info=
S.universe.find(
a=>a.id===id
);

const x={
id,
name:info?.name||id,
market:info?.market||"",
...d
};

cacheSet(
k,
x
);

S.models.set(
id,
x
);

return x;

}
);

}

async function scan(type){

if(S.scan){

status(
"⏳ 已有掃描正在進行",
"loading"
);

return;

}

const c=SCANS[type];

if(!c)
return;

S.scan=true;

try{

const u=
await loadUniverse();

$("home")
.classList.add("hidden");

$("detail")
.classList.add("hidden");

$("searchResults")
.innerHTML="";

$("results")
.classList.remove("hidden");

$("resultTitle").textContent=
c.title+
"｜完整股票池 "+
u.length.toLocaleString()+
" 檔";

$("resultList").innerHTML=
`
<div class="card">
<div class="empty">
⏳ 第一次掃描會建立個股 Cache。
已抓過的個股不再重抓。
</div>
</div>
`;

let out=[];

for(
let i=0;
i<u.length;
i++
){

const x=u[i];

$("progressText").textContent=
`分析 ${i+1}/${u.length}｜${x.id}｜Cache命中會直接使用`;

$("progress").style.width=
((i+1)/u.length*100)+"%";

try{

const d=
await getStock(x);

if(c.ok(d))
out.push(d);

}catch(e){}

if(i%10===0)
await sleep(0);

}

out.sort(
(a,b)=>
c.score(b)-c.score(a)
);

out=
out.slice(
0,
c.show
);

S.models=
new Map(
out.map(
x=>[x.id,x]
)
);

$("resultList").innerHTML=`

<div class="card">

<div class="muted">

掃描完成｜
符合條件 ${out.length} 檔｜
後續點擊直接讀 Cache

</div>

</div>

<div
class="card"
style="padding:0;overflow:hidden"
>

${
out.map(
(x,i)=>`

<div
class="rank"
data-rank="${esc(x.id)}"
>

<div>
${i+1}
</div>

<div>

<div class="rankName">
${esc(x.id)} ${esc(x.name)}
</div>

<div class="muted">
${esc(x.market)}
</div>

</div>

<div class="rankSmall">
${x.t.price.toFixed(2)}
</div>

<div class="rankSmall ${cls(c.score(x))}">
${
typeof c.score(x)==="number"?
c.score(x).toFixed(1):
c.score(x)
}
</div>

<div class="rankSmall ${cls(x.total)}">
${x.total}
</div>

</div>

`
).join("")

||

'<div class="empty">沒有符合條件的股票</div>'

}

</div>

`;

document

r=>
r.onclick=()=>{

const d=
S.models.get(

if(d)

}

status(

"ok"
);

}finally{

S.scan=false;

}

}

async function snapshot(force=false){

if(!force){

const c=
cacheGet(
KEY.snapshot,
TTL.snapshot
);

if(c){

S.universe=
c.universe||
S.universe;

$("dbStatus").textContent=
`🟢 今日市場資料已 Cache｜${S.universe.length.toLocaleString()} 檔`;

return c;

}

}

return once(
"snapshot",
async()=>{

const u=
await loadUniverse(force);

const o={
time:Date.now(),
date:ds(new Date()),
universe:u
};

cacheSet(
KEY.snapshot,
o
);

$("dbStatus").textContent=
`🟢 今日完整市場清單已儲存｜${u.length.toLocaleString()} 檔｜後續搜尋不重抓 API`;

return o;

}
);

}

/* ============================================================

function esc(x){
  return String(x ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");
}

function num(x){
  const n = Number(x);
  return Number.isFinite(n) ? n : 0;
}

function pct(x){
  if(!Number.isFinite(Number(x))) return "-";
  return Number(x).toFixed(2)+"%";
}

function fixed(x,d=2){
  if(!Number.isFinite(Number(x))) return "-";
  return Number(x).toFixed(d);
}

function sleep(ms){
  return new Promise(r=>setTimeout(r,ms));
}

function avg(a){
  a = a.filter(Number.isFinite);
  if(!a.length) return 0;
  return a.reduce((x,y)=>x+y,0)/a.length;
}

function max(a){
  a=a.filter(Number.isFinite);
  return a.length ? Math.max(...a) : 0;
}

function min(a){
  a=a.filter(Number.isFinite);
  return a.length ? Math.min(...a) : 0;
}

function sma(arr,n){
  if(!arr || arr.length<n) return 0;
  return avg(arr.slice(-n));
}

function slope(arr,n=5){
  if(!arr || arr.length<n+1) return 0;
  const a=avg(arr.slice(-n));
  const b=avg(arr.slice(-n*2,-n));
  if(!b) return 0;
  return (a-b)/b*100;
}

function rangePct(high,low){
  if(!low) return 0;
  return (high-low)/low*100;
}

function distancePct(price,level){
  if(!level) return 0;
  return (level-price)/level*100;
}

function upClass(x){
  return num(x)>=0 ? "up" : "down";
}

function setStatus(text,type="ok"){

async function getFinMind(dataset,symbol,days=365){

  const start=new Date();
  start.setDate(start.getDate()-days);

  const d=
    start.getFullYear()+"-"+
    String(start.getMonth()+1).padStart(2,"0")+"-"+
    String(start.getDate()).padStart(2,"0");

  const url=
    FINMIND+
    "?dataset="+encodeURIComponent(dataset)+
    "&data_id="+encodeURIComponent(symbol)+

  const json=await fetchJSON(url);

  return Array.isArray(json.data) ? json.data : [];
}

async function getPrices(symbol){

  if(priceCache[symbol]) return priceCache[symbol];

  let rows=[];

  try{
    rows=await getFinMind("TaiwanStockPrice",symbol,420);
  }catch(e){}

  rows=rows.map(x=>({
    date:x.date,
    open:num(x.open),
    high:num(x.max ?? x.high),
    low:num(x.min ?? x.low),
    close:num(x.close),
    volume:num(x.Trading_Volume ?? x.volume)
  })).filter(x=>x.close>0);

  rows.sort((a,b)=>a.date.localeCompare(b.date));

    throw new Error("查不到 "+symbol+" 的歷史行情");
  }

  priceCache[symbol]=rows;

  return rows;
}

function blankLaw(){
  return {
    foreign:0,
    trust:0,
    dealer:0,
    total:0
  };
}

async function getInstitution(symbol){

  let rows=[];

  try{
    rows=await getFinMind(
      "TaiwanStockInstitutionalInvestorsBuySell",
      symbol,
      90
    );
  }catch(e){}

  const map={};

  rows.forEach(x=>{

    const date=x.date;

    if(!map[date]) map[date]=blankLaw();

    const name=String(
      x.name ||
      x.institutional_investors ||
      x.Institutional_Investor ||
      ""
    );

    const buy=
      num(x.buy) ||
      num(x.buy_volume) ||
      num(x.Buy);

    const sell=
      num(x.sell) ||
      num(x.sell_volume) ||
      num(x.Sell);

    const net=buy-sell;

    if(name.includes("外資")){
      map[date].foreign+=net;
    }else if(name.includes("投信")){
      map[date].trust+=net;
    }else if(
      name.includes("自營") ||
      name.includes("Dealer")
    ){
      map[date].dealer+=net;
    }

  });

  const arr=Object.entries(map)
    .map(([date,x])=>({
      date,
      foreign:x.foreign,
      trust:x.trust,
      dealer:x.dealer,
      total:x.foreign+x.trust+x.dealer
    }))
    .sort((a,b)=>a.date.localeCompare(b.date));

  return arr;
}

function lawPeriod(arr,n){

  const x=arr.slice(-n);

  return {
    foreign:x.reduce((a,b)=>a+b.foreign,0),
    trust:x.reduce((a,b)=>a+b.trust,0),
    dealer:x.reduce((a,b)=>a+b.dealer,0),
    total:x.reduce((a,b)=>a+b.total,0)
  };
}


/* ============================================================
   技術分析
   ============================================================ */

function technical(rows){

  const closes=rows.map(x=>x.close);
  const highs=rows.map(x=>x.high);
  const lows=rows.map(x=>x.low);
  const vols=rows.map(x=>x.volume);

  const price=closes.at(-1);

  const ma5=sma(closes,5);
  const ma20=sma(closes,20);
  const ma60=sma(closes,60);
  const ma120=sma(closes,120);
  const ma240=sma(closes,240);

  const avg20=avg(vols.slice(-21,-1));
  const volumeRatio=
    avg20 ? vols.at(-1)/avg20 : 0;

  const resistance=
    max(highs.slice(-21,-1));

  const support=
    min(lows.slice(-21,-1));

  const range20=
    rangePct(
      max(highs.slice(-20)),
      min(lows.slice(-20))
    );

  const ma20Slope=slope(closes,20);
  const ma60Slope=slope(closes,20);

  const extension=
    ma20 ? (price-ma20)/ma20*100 : 0;

  const closeLocation=
    highs.at(-1)!==lows.at(-1)
    ? (price-lows.at(-1))/(highs.at(-1)-lows.at(-1))
    : .5;

  const distanceToResistance=
    resistance
    ? (resistance-price)/resistance*100
    : 0;

  const last5Range=
    avg(
      rows.slice(-5).map(x=>
        rangePct(x.high,x.low)
      )
    );

  const prior15Range=
    avg(
      rows.slice(-20,-5).map(x=>
        rangePct(x.high,x.low)
      )
    );

  const contraction=
    prior15Range
    ? last5Range/prior15Range
    : 1;

  return {
    price,
    ma5,
    ma20,
    ma60,
    ma120,
    ma240,
    volumeRatio,
    resistance,
    support,
    range20,
    ma20Slope,
    ma60Slope,
    extension,
    closeLocation,
    distanceToResistance,
    contraction
  };
}


/* ============================================================
   突破模型 M1391
   ============================================================ */

function breakoutModel(rows,law){

  const t=technical(rows);

  const p=t.price;

  let score=0;
  const reasons=[];
  const warnings=[];

  const near=
    t.distanceToResistance>=0 &&
    t.distanceToResistance<=5;

  const breakout=
    t.resistance>0 &&
    p>t.resistance;

  const strongVolume=t.volumeRatio>=1.2;
  const dryVolume=
    t.volumeRatio>=.55 &&
    t.volumeRatio<=.90;

  const structure=
    t.ma5>t.ma20 &&
    t.ma20>t.ma60;

  const slopeGood=
    t.ma20Slope>0 &&
    t.ma60Slope>0;

  const institution5=law.p5.total>0;
  const institution20=law.p20.total>0;

  if(structure){
    score+=20;
    reasons.push("MA5 > MA20 > MA60");
  }else{
    warnings.push("均線結構尚未完整");
  }

  if(slopeGood){
    score+=15;
    reasons.push("MA20／MA60 趨勢向上");
  }

  if(near){
    score+=15;
    reasons.push("距離20日壓力5%內");
  }

  if(dryVolume){
    score+=10;
    reasons.push("突破前量能收斂");
  }

  if(strongVolume && p>=t.resistance){
    score+=20;
    reasons.push("突破且成交量放大");
  }

  if(institution5){
    score+=10;
    reasons.push("法人5日偏多");
  }

  if(institution20){
    score+=10;
    reasons.push("法人20日偏多");
  }

  if(t.extension>12){
    score-=15;
    warnings.push("乖離MA20超過12%，避免追高");
  }

  const falseBreakout=
    breakout &&
    (
      t.volumeRatio<1.2 ||
      t.closeLocation<.70
    );

  if(falseBreakout){
    score-=20;
    warnings.push("突破但量能／收盤位置不足，注意假突破");
  }

  if(
    rows.length>=2 &&
    rows.at(-2).close>t.resistance &&
    p<t.resistance
  ){
    score-=30;
    warnings.push("前一天站上壓力、今天跌回，假突破警戒");
  }

  score=Math.max(0,Math.min(100,score));

  let state="🟡 整理觀察";
  let stage="整理觀察";

  if(falseBreakout){
    state="⚠️ 假突破警戒";
    stage="假突破警戒";
  }else if(breakout && strongVolume && t.closeLocation>=.7){
    state="🚀 突破確認";
    stage="突破確認";
  }else if(breakout){
    state="🔥 突破測試";
    stage="突破測試";
  }else if(near && score>=55){
    state="🔥 接近突破";
    stage="接近突破";
  }else if(score>=50){
    state="🐰 提前布局";
    stage="提前布局";
  }

  return {
    score,
    state,
    stage,
    reasons,
    warnings,
    breakout,
    earlyBuy:near && score>=50,
    confirmed:breakout && strongVolume && t.closeLocation>=.70,
    falseBreakout,
    volumeRatio:t.volumeRatio,
    closeLocation:t.closeLocation,
    extension:t.extension,
    resistance:t.resistance,
    support:t.support,
    distanceToResistance:t.distanceToResistance,
    consolidationRange:t.range20,
    contraction:t.contraction,
    riskLevel:
      t.extension>12 || falseBreakout
      ? "高"
      : score>=70 ? "低" : "中",
    entryLow:
      t.support ? t.support : p*.96,
    entryHigh:
      t.ma20 ? Math.min(t.ma20,p) : p
  };
}

function sidewaysModel(rows){

/* ============================================================
   爆量模型
   ============================================================ */

function volumeModel(rows){

  const t=technical(rows);
  const last=rows.at(-1);

  let state="🟢 正常";
  let warning="";

  if(t.volumeRatio>=2){
    state="🔴 極端爆量";
  }else if(t.volumeRatio>=1.5){
    state="🟠 爆量注意";
  }else if(t.volumeRatio>=1.2){
    state="🟡 量能增加";
  }

  const body=
    last.high-last.low;

  const upper=
    body>0
    ? (last.high-Math.max(last.open,last.close))/body
    : 0;

  if(t.volumeRatio>=1.5 && upper>.35){
    warning="爆量＋長上影，注意高檔賣壓";
  }else if(
    t.volumeRatio>=1.5 &&
    last.close<last.open
  ){
    warning="爆量下跌，注意殺盤";
  }else if(
    t.volumeRatio>=1.5 &&
    last.close>last.open
  ){
    warning="爆量上漲，若突破壓力且收盤強才較健康";
  }

  return {
    ratio:t.volumeRatio,
    state,
    warning
  };
}


/* ============================================================

   ============================================================ */

function baseModel(rows,law){

  const t=technical(rows);
  const closes=rows.map(x=>x.close);
  const vols=rows.map(x=>x.volume);

  const peak=max(
    closes.slice(-80)
  );

  const drop=
    peak
    ? (t.price-peak)/peak*100
    : 0;

  const recentVol=
    avg(vols.slice(-5));

  const priorVol=
    avg(vols.slice(-25,-5));

  const volumeShrink=
    priorVol
    ? recentVol/priorVol
    : 1;

  const holdSupport=
    t.price>=t.support*.98;

  const noNewLow=
    closes.length>=10
    ? t.price>=min(closes.slice(-10))
    : false;

  const sellingStop=
    law.p5.total>=0;

  let score=0;
  const reasons=[];

  if(drop<=-15){
    score+=25;
    reasons.push("近期跌幅已達15%以上");
  }else if(drop<=-10){
    score+=15;
    reasons.push("近期有明顯跌深");

    reasons.push("成交量明顯縮減");

    score+=15;
    reasons.push("成交量開始收斂");

    score+=20;

  if(noNewLow){
    score+=15;
    reasons.push("近期低點沒有持續破底");
  }

  if(sellingStop){
    score+=15;
    reasons.push("法人賣壓開始停止");
  }

  let state="🔴 下跌趨勢";

  if(
    score>=75 &&

  }else if(score>=55){
    state="🟡 築底觀察";
  }else if(score>=35){

  }

    reasons
  };
}


/* ============================================================
   週線資料
   ============================================================ */

function makeWeeks(rows){

  const weeks={};

  rows.forEach(x=>{

    const d=new Date(x.date+"T00:00:00");

    const day=d.getDay();

    const diff=
      day===0 ? -6 : 1-day;

    d.setDate(d.getDate()+diff);

    const key=
      d.getFullYear()+"-"+
      String(d.getMonth()+1).padStart(2,"0")+"-"+
      String(d.getDate()).padStart(2,"0");

    if(!weeks[key]){
      weeks[key]={
        date:key,
        open:x.open,
        high:x.high,
        low:x.low,
        close:x.close,
        volume:0
      };
    }

    weeks[key].high=
      Math.max(weeks[key].high,x.high);

    weeks[key].low=
      Math.min(weeks[key].low,x.low);

    weeks[key].close=x.close;

    weeks[key].volume+=x.volume;

  });

  return Object.values(weeks)
    .sort((a,b)=>a.date.localeCompare(b.date));
}


/* ============================================================
   週線有肉評分
   ============================================================ */

function weeklyMeat(weeks,law){

  const c=weeks.map(x=>x.close);

  const price=c.at(-1);

  const w5=sma(c,5);
  const w20=sma(c,20);
  const w40=sma(c,40);
  const w60=sma(c,60);

  const resistance=
    max(
      weeks.slice(-21,-1).map(x=>x.high)
    );

  const support=
    min(
      weeks.slice(-21,-1).map(x=>x.low)
    );

  const distance=
    resistance
    ? (resistance-price)/resistance*100
    : 999;

  const upside=
    price
    ? (resistance-price)/price*100
    : 0;

  const extension=
    w20
    ? (price-w20)/w20*100
    : 0;

  let trend=0;
  let ma=0;
  let inst=0;
  let volume=0;
  let press=0;
  let space=0;

  if(w5>w20)trend+=15;
  if(w20>0 && slope(c,10)>0)trend+=10;

  if(w5>w20)ma+=8;
  if(w20>w40)ma+=7;

  if(law.p5.total>0)inst+=10;
  if(law.p20.total>0)inst+=10;

  const last=weeks.at(-1);

  const avgVol=
    avg(weeks.slice(-21,-1).map(x=>x.volume));

  const vr=
    avgVol
    ? last.volume/avgVol
    : 0;

  if(last.close>last.open)volume+=8;
  if(vr>=1)volume+=7;

  if(distance>=0 && distance<=8)press+=10;
  else if(distance<=15)press+=6;

  if(upside>=15)space+=15;
  else if(upside>=10)space+=10;
  else if(upside>=5)space+=6;

  let score=
    trend+ma+inst+volume+press+space;

  if(extension>15)score-=8;

  score=Math.max(0,Math.min(100,score));

  let label="⚪ 暫不吃";

  if(score>=85)label="🚀 大肉候選";
  else if(score>=75)label="🥩 有肉可吃";
  else if(score>=65)label="🐰 小肉／提前布局";
  else if(score>=55)label="🟡 觀察";

  return {
    score,
    label,
    w5,w20,w40,w60,
    resistance,
    support,
    distance,
    upside,
    extension,
    volumeRatio:vr,
    trend,
    ma,
    inst,
    volume,
    press,
    space
  };
}

  };

    m5,
    m10,

  };
}

function makeMonths(rows){

  const map={};

  rows.forEach(x=>{

    const key=x.date.slice(0,7);

    if(!map[key]){
      map[key]={
        date:key,
        open:x.open,
        high:x.high,
        low:x.low,
        close:x.close,
        volume:0
      };
    }

    map[key].high=Math.max(map[key].high,x.high);
    map[key].low=Math.min(map[key].low,x.low);
    map[key].close=x.close;
    map[key].volume+=x.volume;

  });

  return Object.values(map)
    .sort((a,b)=>a.date.localeCompare(b.date));
}


/* ============================================================
   反彈模型
   ============================================================ */

function reboundModel(rows,law){

  const t=technical(rows);

  const closes=rows.map(x=>x.close);

  const peak=max(
    closes.slice(-60,-5)
  );

  const drop=
    peak
    ? (t.price-peak)/peak*100
    : 0;

  const recovering=
    t.price>t.ma5 &&
    t.ma5>=sma(closes.slice(0,-1),5);

  const sellingStop=
    law.p5.total>=0;

  const support=
    t.price>=t.support*.98;

  let score=0;

  if(drop<=-20)score+=25;
  else if(drop<=-15)score+=20;
  else if(drop<=-10)score+=10;

  if(recovering)score+=30;
  if(sellingStop)score+=25;
  if(support)score+=20;

  let label="🔴 暫不接刀";

  if(score>=80)label="🟢 反彈買點確認";
  else if(score>=60)label="🟡 反彈觀察";
  else if(score>=40)label="🟠 還在接刀";

  return {
    score,
    label,
    drop,
    recovering,
    sellingStop,
    support
  };
}


/* ============================================================
   當沖模型
   ============================================================ */

function dayTradeModel(rows,law){

  const t=technical(rows);
  const x=rows.at(-1);

  const amplitude=
    x.low
    ? (x.high-x.low)/x.low*100
    : 0;

  let score=0;
  const reasons=[];
  const warnings=[];

  if(t.volumeRatio>=1.5){
    score+=30;
    reasons.push("成交量充足");
  }else if(t.volumeRatio>=1.2){
    score+=20;
  }

  if(amplitude>=4){
    score+=25;
    reasons.push("日內波動較大");
  }else if(amplitude>=3){
    score+=18;
  }

  if(x.close>x.open){
    score+=15;
    reasons.push("今日收紅");
  }

  if(x.close>t.ma5){
    score+=15;
    reasons.push("價格站上MA5");
  }

  if(law.p5.total>0){
    score+=15;
    reasons.push("法人短線偏多");
  }

  const upper=
    (x.high-Math.max(x.open,x.close))/
    Math.max(1,x.high-x.low);

  if(upper>.35){
    score-=20;
    warnings.push("長上影，注意沖高回落");
  }

  let state="⚪ 不適合";

  if(score>=75)state="🔥 當沖偏多";
  else if(score>=60)state="🟡 當沖觀察";
  else if(score>=45)state="🟠 謹慎";
  else state="🔴 不建議";

  return {
    score,
    state,
    amplitude,
    reasons,
    warnings
  };
}


/* ============================================================
   綜合股票資料
   ============================================================ */

async function buildStock(symbol){

  const rows=await getPrices(symbol);

  const rt=await getRealtime(symbol);

  const lawRows=await getInstitution(symbol);

  const p5=lawPeriod(lawRows,5);
  const p20=lawPeriod(lawRows,20);

  const law={
    p5,
    p20,
    rows:lawRows
  };

  const t=technical(rows);

  const weeks=makeWeeks(rows);

  const wm=weeklyMeat(weeks,law);

  const ws=weeklySafe(wm,law,t.price);

  const monthly=monthlyModel(rows);

  const rebound=reboundModel(rows,law);

  const volume=volumeModel(rows);

  const base=baseModel(rows,law);

  const breakout=breakoutModel(rows,law);

  const breakdown=breakdownModel(rows,law);

  const consolidation=consolidationModel(rows);

  const sideways=sidewaysModel(rows);

  const daytrade=dayTradeModel(rows,law);

  let total=
    breakout.score*.30+
    wm.score*.25+
    base.score*.15+
    ws.score*.15+
    Math.min(100,Math.max(0,50+law.p5.total/1000))*0.15;

  total=Math.round(
    Math.max(0,Math.min(100,total))
  );

  return {
    symbol,
    name:rt.name || STOCKS[symbol] || symbol,
    realtime:rt,
    rows,
    technical:t,
    law,
    weekly:wm,
    weeklySafe:ws,
    monthly,
    rebound,
    volume,
    base,
    breakout,
    breakdown,
    consolidation,
    sideways,
    daytrade,
    total
  };
}

function findSymbol(input){

  input=String(input||"")
    .trim()
    .toUpperCase();

  if(!input)return null;

  if(STOCKS[input])return input;

  const found=
    Object.entries(STOCKS)
    .find(([code,name])=>
      name.includes(input) ||
      code.includes(input)
    );

  return found ? found[0] : input;
}

async function scanCodes(codes){

  const results=[];

  for(let i=0;i<codes.length;i++){

    const code=codes[i];

    try{

      setStatus(
        `正在分析 ${code} (${i+1}/${codes.length})`,
        "loading"
      );

      const d=
        stockCache[code] ||
        await buildStock(code);

      stockCache[code]=d;

      results.push(d);

    }catch(e){

      console.warn(code,e);

    }

    await sleep(80);
  }

  clearStatus();

  return results;
}

      <div class="listTop">

        <div class="rank">
          #${index+1}
        </div>

        <div class="listMain">
          <div class="rankTitle">
            ${esc(d.name)}
            <span class="tag">${esc(d.symbol)}</span>
          </div>

          <div class="rankSub">
            <span class="badge ${color}">
              ${esc(state)}
            </span>
          </div>
        </div>

        <div class="listPrice ${upClass(r.price-r.prev)}">
          ${fixed(r.price)}
        </div>

      </div>

      <div class="listData">

        <div>
          <b class="${upClass(d.law.p5.foreign)}">
            ${fixed(d.law.p5.foreign,0)}
          </b>
          <small>外資5D</small>
        </div>

        <div>
          <b class="${upClass(d.law.p5.trust)}">
            ${fixed(d.law.p5.trust,0)}
          </b>
          <small>投信5D</small>
        </div>

        <div>
          <b class="${upClass(d.law.p5.dealer)}">
            ${fixed(d.law.p5.dealer,0)}
          </b>
          <small>自營5D</small>
        </div>

        <div>
          <b>${fixed(d.weekly.score,0)}</b>
          <small>週線肉</small>
        </div>

      </div>

      <div class="progress">
        <i style="width:${Math.max(0,Math.min(100,score))}%"></i>
      </div>

    </div>
  `;
}


/* ============================================================
   掃描標題
   ============================================================ */

const SCAN_TITLES={

  institution:[
    "🏦 三大法人同買 TOP19",
    "外資＋投信＋自營商同時買進"
  ],

  etf:[
    "💰 大資金 ETF",
    "大型市場資金 ETF 排名"
  ],

  financial:[
    "🏦 金控股票搜尋",
    "金控／銀行 M1391 綜合排名"
  ],

  weeklySafe:[
    "📅 週線安全買點",
    "回到週線支撐附近的股票"
  ],

  monthlySafe:[
    "📅 月線安全買點",
    "中長線月線位置"
  ],

  rebound:[
    "🩸 暴跌反彈買點",
    "超跌＋止跌＋反彈條件"
  ],

  volume:[
    "🚨 爆量警報",
    "爆量＋長上影＋殺盤警報"
  ],

  base:[
    "🐰 跌深量縮築底",
    "跌一段＋量縮＋跌不下去"
  ],

  breakout:[
    "🚀 突破股票分析",
    "20日壓力＋量能＋均線＋法人"
  ],

  breakdown:[
    "🔻 跌破股票分析",
    "支撐跌破＋均線破壞＋法人賣壓"
  ],

  consolidation:[
    "🟡 盤整股票分析",
    "區間收斂＋波動下降＋準備突破"
  ],

  sideways:[
    "🐢 盤股股票分析",
    "低波動＋均線糾結＋無方向"
  ],

  attention:[
    "🚨 今日注意股票 TOP20",
    "突破／跌破／爆量／築底綜合雷達"
  ],

  daytrade:[
    "⚡ 當沖股票建議",
    "成交量＋波動＋方向＋法人"
  ]

};


/* ============================================================
   排序
   ============================================================ */

function sortResults(results,type){

  if(type==="institution"){

    return results
      .filter(d=>
        d.law.p5.foreign>0 &&
        d.law.p5.trust>0 &&
        d.law.p5.dealer>0
      )
      .sort((a,b)=>
        b.law.p5.total-a.law.p5.total
      )
      .slice(0,19);

  }

  if(type==="etf"){
    return results
      .filter(d=>ETF_CODES.includes(d.symbol))
      .sort((a,b)=>b.total-a.total);
  }

  if(type==="financial"){
    return results
      .filter(d=>
        FINANCIAL.some(x=>x[0]===d.symbol)
      )
      .sort((a,b)=>b.total-a.total);
  }

  if(type==="weeklySafe"){
    return results
      .sort((a,b)=>
        b.weeklySafe.score-a.weeklySafe.score
      )
      .slice(0,20);
  }

  if(type==="monthlySafe"){
    return results
      .sort((a,b)=>
        b.monthly.score-a.monthly.score
      )
      .slice(0,20);
  }

  if(type==="rebound"){
    return results
      .sort((a,b)=>
        b.rebound.score-a.rebound.score
      )
      .slice(0,20);
  }

  if(type==="volume"){
    return results
      .sort((a,b)=>
        b.volume.ratio-a.volume.ratio
      )
      .slice(0,20);
  }

  if(type==="base"){
    return results
      .sort((a,b)=>
        b.base.score-a.base.score
      )
      .slice(0,20);
  }

  if(type==="breakout"){
    return results
      .sort((a,b)=>
        b.breakout.score-a.breakout.score
      )
      .slice(0,20);
  }

  if(type==="breakdown"){
    return results
      .filter(d=>d.breakdown.breakdown)
      .sort((a,b)=>
        b.breakdown.score-a.breakdown.score
      )
      .slice(0,20);
  }

  if(type==="consolidation"){
    return results
      .sort((a,b)=>
        b.consolidation.score-a.consolidation.score
      )
      .slice(0,20);
  }

  if(type==="sideways"){
    return results
      .sort((a,b)=>
        b.sideways.score-a.sideways.score
      )
      .slice(0,20);
  }

  if(type==="daytrade"){
    return results
      .sort((a,b)=>
        b.daytrade.score-a.daytrade.score
      )
      .slice(0,20);
  }

  return results
    .sort((a,b)=>b.total-a.total)
    .slice(0,20);
}


/* ============================================================
   執行掃描
   ============================================================ */

async function runScan(type){

  currentScan=type;

  showPage("scan");

  const title=SCAN_TITLES[type] || [
    "🚨 今日注意股票",
    "綜合分析"
  ];

  document.getElementById("scanTitle").innerHTML=`
    <div class="sectionTitle">${title[0]}</div>
    <div class="small">${title[1]}</div>
  `;

  document.getElementById("scanList").innerHTML=`
    <div class="loadingBox">
      🔎 正在分析股票資料……<br>
      第一次搜尋會需要比較久。
    </div>
  `;

  let codes=[...SCAN_CODES];

  if(type==="financial"){
    codes=FINANCIAL.map(x=>x[0]);
  }

  if(type==="etf"){
    codes=ETF_CODES;
  }

  const results=
    await scanCodes(codes);

  const sorted=
    sortResults(results,type);

  if(!sorted.length){

    document.getElementById("scanList").innerHTML=`
      <div class="card empty">
        目前沒有符合條件的股票。<br>
        可以換其他分類再搜尋。
      </div>
    `;

    return;
  }

  document.getElementById("scanList").innerHTML=
    `<div class="card">
      <div class="small">
        共找到 ${sorted.length} 檔符合／接近條件的股票
      </div>
    </div>`+
    sorted.map((d,i)=>
      listCard(d,i,type)
    ).join("");

  document.querySelectorAll(".listCard")
    .forEach(el=>{
      el.addEventListener("click",async()=>{
        await openStock(el.dataset.code);
      });
    });
}


/* ============================================================
   開啟股票
   ============================================================ */

async function openStock(symbol){

  showPage("detail");

  document.getElementById("detail").innerHTML=`
    <div class="card loadingBox">
      🔎 正在取得 ${esc(symbol)} 最新資料……
    </div>
  `;

  try{

    setStatus(
      `正在分析 ${symbol}…`,
      "loading"
    );

    const d=
      stockCache[symbol] ||
      await buildStock(symbol);

    stockCache[symbol]=d;
    currentStock=symbol;

    clearStatus();

    renderDetail(d);

  }catch(e){

    console.error(e);

    setStatus(
      "資料讀取失敗："+e.message,
      "error"
    );

    document.getElementById("detail").innerHTML=`
      <div class="card">
        <div class="sectionTitle">⚠️ 查詢失敗</div>
        <div class="small">
          ${esc(e.message)}<br><br>
          可以確認股票代號是否正確，或稍後再試。
        </div>
      </div>
    `;

  }

}


/* ============================================================
   頁面切換
   ============================================================ */

function showPage(page){

  document.querySelectorAll(".page")
    .forEach(x=>x.classList.remove("active"));

  if(page==="home"){
    document.getElementById("pageHome").classList.add("active");
  }

  if(page==="detail"){
    document.getElementById("pageDetail").classList.add("active");
  }

  if(page==="scan"){
    document.getElementById("pageScan").classList.add("active");
  }

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* ============================================================
   搜尋
   ============================================================ */

async function doSearch(){

  const input=
    document.getElementById("searchInput").value;

  const symbol=findSymbol(input);

  if(!symbol){

    setStatus(
      "請輸入股票代號或名稱",
      "error"
    );

    return;
  }

  await openStock(symbol);
}

document.getElementById("searchBtn")
  .addEventListener("click",doSearch);

document.getElementById("searchInput")
  .addEventListener("keydown",e=>{
    if(e.key==="Enter")doSearch();
  });


/* ============================================================
   首頁快速按鈕
   ============================================================ */

document.querySelectorAll("[data-scan]")
  .forEach(btn=>{
    btn.addEventListener("click",()=>{
      runScan(btn.dataset.scan);
    });
  });


/* ============================================================
   底部導航
   ============================================================ */

document.querySelectorAll("[data-nav]")
  .forEach(btn=>{

    btn.addEventListener("click",()=>{

      const nav=btn.dataset.nav;

      document.querySelectorAll(".nav button")
        .forEach(x=>x.classList.remove("active"));

      btn.classList.add("active");

      if(nav==="home"){
        showPage("home");
      }

      if(nav==="institution"){
        runScan("institution");
      }

      if(nav==="safe"){
        runScan("weeklySafe");
      }

      if(nav==="warning"){
        runScan("attention");
      }

      if(nav==="financial"){
        runScan("financial");
      }

    });

  });


/* ============================================================
   返回
   ============================================================ */

document.getElementById("backHome")
  .addEventListener("click",()=>{
    showPage("home");
  });

document.getElementById("scanHome")
  .addEventListener("click",()=>{
    showPage("home");
  });


/* ============================================================
   更新
   ============================================================ */

document.getElementById("refreshBtn")
  .addEventListener("click",async()=>{

    if(!currentStock)return;

    delete priceCache[currentStock];
    delete stockCache[currentStock];

    await openStock(currentStock);

  });

document.getElementById("scanRefresh")
  .addEventListener("click",async()=>{

    if(currentScan){
      await runScan(currentScan);
    }

  });


/* ============================================================
   自動更新目前股票
   ============================================================ */

setInterval(async()=>{

  if(
    currentStock &&
    document.getElementById("pageDetail")
      .classList.contains("active")
  ){

    try{

      delete priceCache[currentStock];

      const d=
        await buildStock(currentStock);

      stockCache[currentStock]=d;

      renderDetail(d);

    }catch(e){}

  }

},30000);


/* ============================================================
   啟動
   ============================================================ */

(function boot(){

  const params=
    new URLSearchParams(location.search);

  const symbol=
    params.get("symbol");

  if(symbol){
    openStock(findSymbol(symbol));
  }

})();

</script>

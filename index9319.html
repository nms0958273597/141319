const sma=(a,n)=>a.length>=n?avg(a.slice(-n)):avg(a);

const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"
}[m]));

/* =========================
   FinMind API
========================= */

async function finmind(dataset,id=null,start=pastDate(CONFIG.days)){

const params=new URLSearchParams();

params.set("dataset",dataset);

if(id!==null && id!==undefined && id!==""){
params.set("data_id",id);
}

if(start){
params.set("start_date",start);
}

const url=API+"?"+params.toString();

const r=await fetch(url,{
cache:"no-store"
});

if(!r.ok){
throw new Error("HTTP "+r.status);
}

const j=await r.json();

if(!j.data||!Array.isArray(j.data)){
throw new Error("無資料");
}

return j.data;

}


/* =========================
   行情資料
========================= */

function normalizePrices(rows){

return rows.map(x=>({

date:x.date,

open:+x.open,

high:+x.max,

low:+x.min,

close:+x.close,

volume:+(
x.Trading_Volume??
x.volume??
0
)

})).filter(x=>
Number.isFinite(x.close)
).sort((a,b)=>
a.date.localeCompare(b.date)
);

}


async function getStock(id){

const rows=normalizePrices(
await finmind(
"TaiwanStockPrice",
id
)
);

if(rows.length<25){
throw new Error("歷史資料不足");
}

let law=[];

try{

law=await finmind(
"TaiwanStockInstitutionalInvestorsBuySell",
id,
pastDate(35)
);

}catch(e){

console.log("法人資料暫時無法取得",id);

}

return buildModel(
id,
rows,
law
);

}


/* =========================
   技術分析
========================= */

function calcMAs(p){

const c=p.map(x=>x.close);

return{

ma5:sma(c,5),

ma20:sma(c,20),

ma60:sma(c,60)

};

}


function resistance(p,n=20){

const q=p.slice(0,-1).slice(-n);

return q.length?
Math.max(...q.map(x=>x.high)):
0;

}


function support(p,n=20){

const q=p.slice(0,-1).slice(-n);

return q.length?
Math.min(...q.map(x=>x.low)):
0;

}


function volumeRatio(p){

const today=p.at(-1)?.volume||0;

const prev=p
.slice(-21,-1)
.map(x=>x.volume);

return avg(prev)?
today/avg(prev):
0;

}


function closeLocation(x){

return x.high>x.low?
(x.close-x.low)/(x.high-x.low):
.5;

}


function slopeN(p,n=20){

if(p.length<n+5){
return 0;
}

const a=p
.slice(-n)
.map(x=>x.close);

const first=avg(a.slice(0,5));

const last=avg(a.slice(-5));

return first?
((last-first)/first*100):
0;

}


/* =========================
   週線
========================= */

function weekly(p){

const weeks={};

p.forEach(x=>{

const d=new Date(
x.date+"T00:00:00"
);

const day=(d.getDay()+6)%7;

d.setDate(
d.getDate()-day
);

const k=dateStr(d);

if(!weeks[k]){

weeks[k]={
date:k,
open:x.open,
high:x.high,
low:x.low,
close:x.close,
volume:0
};

}

const w=weeks[k];

w.high=Math.max(w.high,x.high);

w.low=Math.min(w.low,x.low);

w.close=x.close;

w.volume+=x.volume;

});

return Object.values(weeks)
.sort((a,b)=>a.date.localeCompare(b.date));

}


/* =========================
   法人
========================= */

function lawSummary(rows){

let f=0;
let t=0;
let d=0;

rows.forEach(x=>{

const v=
+(x.buy??x.Buy??0)-
+(x.sell??x.Sell??0);

const n=
(x.name||
x.Investor_Name||
"").toLowerCase();

if(
n.includes("foreign")||
n.includes("外資")
){
f+=v;
}

else if(
n.includes("investment")||
n.includes("投信")
){
t+=v;
}

else if(
n.includes("dealer")||
n.includes("自營")
){
d+=v;
}

});

return{
foreign:f,
trust:t,
dealer:d,
total:f+t+d
};

}


function buildLaw(rows){

return rows.map(x=>({

date:x.date,

name:
x.name||
x.Investor_Name||
"",

buy:+(
x.buy??
x.Buy??
0
),

sell:+(
x.sell??
x.Sell??
0
)

}));

}


/* =========================
   M1391 主模型
========================= */

function buildModel(id,p,rawLaw){

const law=buildLaw(rawLaw);

const last=p.at(-1);

const prev=p.at(-2);

const ma=calcMAs(p);

const r20=resistance(p,20);

const s20=support(p,20);

const vr=volumeRatio(p);

const cl=closeLocation(last);

const ext=pct(
last.close,
ma.ma20
);

const last15=p.slice(-30,-1);

const consRange=
last15.length?
(
(
Math.max(...last15.map(x=>x.high))-
Math.min(...last15.map(x=>x.low))
)/
avg(last15.map(x=>x.close))
*100
):
0;

const ranges=
p.slice(-6,-1)
.map(x=>(x.high-x.low)/x.close);

const prior=
p.slice(-21,-6)
.map(x=>(x.high-x.low)/x.close);

const contraction=
avg(prior)?
avg(ranges)/avg(prior):
1;

const s=slopeN(p,20);

const s60=slopeN(p,60);

const upToR=
r20?
((r20-last.close)/last.close*100):
0;


/* 週線 */

const weeklyP=weekly(p);

const w5=sma(
weeklyP.map(x=>x.close),

const w20=sma(
weeklyP.map(x=>x.close),
20

const w60=sma(
weeklyP.map(x=>x.close),
60

const wSlope=slopeN(
weeklyP,
8

const wR=resistance(
weeklyP,
20

const wS=support(
weeklyP,
20

const wDist=
wR?
((wR-last.close)/wR*100):
0;

x=>x.date>=pastDate(7)

const L20=lawSummary(law20);


/* 突破 */

const breakout=
last.close>r20&&
vr>=1.2&&

(

prev&&
prev.close>r20&&

const breakdown=

pct(
last.close,
Math.max(
...p.slice(-80).map(x=>x.high)
)

/* 築底 */

const recentVol=
avg(
p.slice(-5).map(x=>x.volume)

const oldVol=
avg(
p.slice(-25,-5).map(x=>x.volume)

const bottom=
dropPeak<=-12&&
recentVol/Math.max(oldVol,1)<=.8&&
last.close>=s20*.98&&
contraction<=1;

const weeklyScore=clamp(

(
last.close>w5&&
w5>w20&&
wSlope>0
?
25:
0

+

(
last.close>w20&&
w20>w60
?
15:
0

+

(
L5.total>0&&
L20.total>0
?
20:
L5.total>0
?
12:
0

+

(
vr>=.8&&
vr<=1.5&&
cl>=.65
?
15:

function finalRecommendation(d){

let score=0;

let reasons=[];

let warnings=[];


/* 週線 */

if(d.weeklyScore>=75){

score+=25;

reasons.push(
"週線結構偏強"
);

}

else if(
d.weeklyScore>=60
){

score+=17;

reasons.push(
"週線尚可"
);

}

else{

score+=8;

}


/* 法人 */

if(
d.L5.total>0&&
d.L20.total>0
){

score+=20;

reasons.push(
"近週＋近月法人合計偏多"
);

}

else if(
d.L5.total>0
){

score+=11;

reasons.push(
"近期法人偏多"
);

}

else{

warnings.push(
"法人尚未形成明確買超"
);

}


/* 均線 */

if(
d.ma.ma5>d.ma.ma20&&
d.ma.ma20>d.ma.ma60
){

score+=15;

reasons.push(
"MA5＞MA20＞MA60"
);

}

else{

warnings.push(
"均線結構未完全轉強"
);

}


/* 量價 */

if(
d.vr>=1.2&&
d.cl>=.7
){

score+=15;

reasons.push(
"量能與收盤位置支持"
);

}

else if(
d.vr>=.7
){

score+=8;

reasons.push(
"量能正常"
);

}

else{

warnings.push(
"量能偏弱"
);

}


/* 壓力 */

if(
d.r20&&
d.upToR>=0&&
d.upToR<=5
){

score+=10;

reasons.push(
"距離20日壓力不遠"
);

}

else if(d.breakout){

score+=10;

reasons.push(
"已突破20日壓力"
);

}

else if(
d.upToR<0
){

warnings.push(
"已進入壓力上方，留意假突破"
);

}

else{

warnings.push(
"離壓力仍有距離"
);

}


/* 乖離 */

if(d.ext>12){

score-=12;

warnings.push(
"乖離MA20超過12%，不宜追高"
);

}


/* 假突破 */

if(d.falseBreak){

score-=20;

warnings.push(
"假突破警戒"
);

}


/* 跌破 */

if(d.breakdown){

score-=25;

warnings.push(
"支撐跌破"
);

}

score=clamp(
score,
0,
100
);


let label="⚪ 暫不推薦";

if(score>=85){

label="🚀 強勢推薦";

}

else if(score>=75){

label="🟢 偏多推薦";

}

else if(score>=65){

label="🟡 可以觀察";

}

else if(score>=50){

label="🟠 等待確認";

}


/* 進場區 */

let entryLow;

let entryHigh;

if(d.r20){

entryLow=
d.r20*.97;

entryHigh=
d.r20*1.01;

}

else{

entryLow=
d.last.close*.97;

entryHigh=
d.last.close*1.01;

}


/* 止損 */

const stop=
d.s20?
d.s20*.97:
d.last.close*.94;


/* TP */

const tp1=
d.r20&&
d.last.close<d.r20?
d.r20:
d.last.close*1.06;

const tp2=
tp1*1.07;


return{

score,

label,

reasons,

warnings,

entryLow,

entryHigh,

stop,

tp1,

tp2

};

}

const FALLBACK_UNIVERSE=[
...CONFIG.universe
];

let universeReady=false;

let universeLoading=false;


function normalizeUniverse(rows){

const map=new Map();

for(
const x of rows||[]
){

const id=String(
x.stock_id??
x.StockID??
x.code??
x.stockCode??
""
)
.trim()
.toUpperCase();

const name=String(
x.stock_name??
x.StockName??
x.name??
x.company_name??
""
)
.trim();

const type=String(
x.type??
x.Type??
""
)
.toLowerCase();

if(!id||!name){
continue;
}

if(
!/^[0-9]{4,6}[A-Z]?$/.test(id)
){
continue;
}

if(
/權證|認購權證|認售權證/.test(name)
){
continue;
}

map.set(
id,
[
id,
name,
type
]
);

}

const arr=[
...map.values()
].map(x=>[
x[0],
x[1],
x[2]
]);

return arr.length>500
?
arr
:
FALLBACK_UNIVERSE.map(x=>[
x[0],
x[1],
""
]);

}

========================= */

async function scan(type){

let cfg=
SCANS[type];

if(!cfg){
return;
}

if(!universeReady){

await loadAllUniverse();

}

showOnly(
"resultSection"
);

$("resultTitle").textContent=
cfg.title;

$("resultList").innerHTML=
`

<div class="loading">
⏳ 正在分析全市場…
</div>

`;

$("progressBar").style.width="0%";


let pool=
CONFIG.universe;


/* ETF */

if(type==="etf"){

pool=
CONFIG.universe.filter(
x=>
/^(00|006|008|009)/.test(x[0])
);

}


/* 金控 */

if(type==="financial"){

pool=
CONFIG.universe.filter(
x=>
/^(28|58)/.test(x[0])
);

}


const total=
pool.length;

const out=[];

let done=0;

let cursor=0;

const concurrency=6;


async function worker(){

while(true){

const i=
cursor++;

if(i>=total){
return;
}

const item=
pool[i];

const id=
item[0];

try{

const d=
await getStock(id);

if(
cfg.filter(d)
){

out.push(d);

}

}

catch(e){

}

done++;

$("progressText").textContent=
`正在分析 ${done} / ${total}：${id} ${item[1]||""}`;

$("progressBar").style.width=
(done/total*100)+"%";

await sleep(
CONFIG.delay
);

}

}


await Promise.all(
Array.from(
{
length:
Math.min(
concurrency,
total
)
},
worker
)
);


out.sort(
cfg.sort
);


$("progressText").textContent=
`完成｜全市場 ${total.toLocaleString()} 檔｜符合 ${out.length} 檔`;


if(!out.length){

$("resultList").innerHTML=
`

<div class="notice">

目前沒有符合條件的股票。

<br><br>

這代表目前條件較嚴格，

不代表市場沒有機會。

<br><br>

可以改查：

「注意什麼股票推薦」

或直接搜尋個股。

</div>

`;

return;

}


$("resultList").innerHTML=
out
.slice(0,20)
.map(d=>resultCard(d))
.join("");

}


/* =========================
   所有按鈕事件委派
========================= */

document.addEventListener(
"click",
e=>{

const scanBtn=
e.target.closest(
"[data-scan]"
);

if(scanBtn){

e.preventDefault();

scan(
scanBtn.dataset.scan
);

return;

}


const detailBtn=
e.target.closest(
".openDetail"
);

if(detailBtn){

e.preventDefault();

const id=
detailBtn.dataset.id;

$("detailBody").innerHTML=
`

<div class="loading">
⏳ 正在分析
${esc(id)}
…
</div>

`;

showOnly("detail");

getStock(id)
.then(renderDetail)
.catch(err=>{

$("detailBody").innerHTML=
`

<div class="notice">

資料讀取失敗：

${esc(err.message)}

</div>

`;

});

return;

}


const nav=
e.target.closest(
"[data-nav]"
);

if(nav){

e.preventDefault();

const n=
nav.dataset.nav;

setActive(n);

if(n==="home"){

showHome();

}

else if(n==="institution"){

scan("institution");

}

else if(n==="safe"){

scan("weeklySafe");

}

else if(n==="alert"){

scan("volume");

}

else if(n==="financial"){

scan("financial");

}

return;

}

}
);


/* =========================
   錯誤防護
========================= */

window.addEventListener(
"error",
e=>{

console.error(
e.error||
e.message
);

setStatus(
"⚠️ 發生資料錯誤，請重新整理後再試"
);

}
);


window.addEventListener(
"unhandledrejection",
e=>{

console.error(
e.reason
);

}
);


/* =========================
   啟動
========================= */

setStatus(
"⏳ V1391 啟動｜正在載入全市場股票／ETF…"
);

loadAllUniverse();

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">

<title>m1491｜動態台股法人籌碼與突破分析 V1491</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

:root{
  --bg:#080a0c;
  --card:#11161b;
  --card2:#151b21;
  --line:#26313a;
  --text:#f3f6f8;
  --muted:#91a0aa;
  --green:#39d98a;
  --red:#ff6374;
  --orange:#ffad42;
  --yellow:#f4d35e;
  --blue:#55b9ff;
  --purple:#b38cff;
  --cyan:#46e0ff;
  --shadow:0 10px 28px rgba(0,0,0,.24)
}

html{
  scroll-behavior:smooth
}

body{
  margin:0;
  background:linear-gradient(180deg,#080a0c,#0b1014 45%,#080a0c);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,
  "PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif
}

button,
input{
  font:inherit
}

button{
  cursor:pointer
}

.wrap{
  max-width:760px;
  margin:auto;
  padding:16px 14px 100px
}

.search{
  display:flex;
  gap:8px;
  position:sticky;
  top:0;
  z-index:20;
  padding:4px 0 12px;
  background:rgba(8,10,12,.92);
  backdrop-filter:blur(12px)
}

.search input{
  min-width:0;
  flex:1;
  background:#10151a;
  border:1px solid var(--line);
  color:var(--text);
  border-radius:14px;
  padding:13px 14px;
  outline:none
}

.search input:focus{
  border-color:var(--blue);
  box-shadow:0 0 0 3px rgba(85,185,255,.1)
}

.search button,
.action,
.feature,
.navBtn{
  border:1px solid var(--line);
  background:#12181d;
  color:var(--text)
}

.search button{
  border-radius:14px;
  padding:0 16px;
  font-weight:800
}

.hint{
  font-size:12px;
  color:var(--muted);
  margin:0 2px 10px
}

.status{
  font-size:13px;
  color:var(--muted);
  min-height:20px;
  margin:5px 2px
}

.searchResults{
  display:grid;
  gap:6px;
  margin:4px 0 10px
}

.searchResult{
  padding:10px 12px;
  border:1px solid var(--line);
  border-radius:12px;
  background:#0f1418;
  display:flex;
  justify-content:space-between;
  align-items:center
}

.searchResult b{
  font-size:14px
}

.searchResult span{
  font-size:12px;
  color:var(--muted)
}

.card{
  background:linear-gradient(
    180deg,
    rgba(18,24,29,.98),
    rgba(14,19,24,.98)
  );
  border:1px solid var(--line);
  border-radius:18px;
  padding:15px;
  margin:10px 0;
  box-shadow:var(--shadow)
}

.title{
  font-size:18px;
  font-weight:900;
  margin-bottom:7px
}

.intro{
  font-size:13px;
  color:var(--muted);
  line-height:1.7
}

.hero{
  padding:16px
}

.heroTop{
  display:flex;
  gap:12px;
  align-items:center
}

.icon{
  width:48px;
  height:48px;
  border-radius:15px;
  display:grid;
  place-items:center;
  background:#17222a;
  font-size:25px
}

.stockTitle{
  font-size:22px;
  font-weight:950
}

.stockSub,
.update{
  font-size:12px;
  color:var(--muted);
  margin-top:3px
}

.update{
  margin-left:auto;
  text-align:right
}

.grid3{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:13px
}

.box{
  background:#0c1115;
  border:1px solid var(--line);
  border-radius:13px;
  padding:10px
}

.boxMain{
  font-size:18px;
  font-weight:900
}

.boxSub{
  font-size:11px;
  color:var(--muted);
  margin-top:3px
}

.priceStrip{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
  margin-top:10px
}

.priceCell{
  background:#0d1317;
  border:1px solid var(--line);
  padding:9px;
  border-radius:12px
}

.priceLabel{
  font-size:11px;
  color:var(--muted)
}

.priceValue{
  font-size:16px;
  font-weight:900;
  margin-top:3px
}

.green{color:var(--green)}
.red{color:var(--red)}
.orange{color:var(--orange)}
.yellow{color:var(--yellow)}
.blue{color:var(--blue)}
.purple{color:var(--purple)}

.break{
  border-color:rgba(70,224,255,.35)
}

.breakTitle{
  font-size:17px;
  font-weight:900;
  color:var(--cyan)
}

.breakGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
  margin-top:10px
}

.checkRow{
  display:flex;
  gap:8px;
  align-items:center;
  font-size:13px;
  padding:7px 0
}

.check{
  width:20px;
  height:20px;
  border-radius:50%;

  place-items:center;
  background:#17242b;
  color:var(--cyan);
  font-size:12px
}

.data{
  display:grid;
  gap:8px
}

.dataRow{
  display:flex;
  justify-content:space-between;
  gap:12px;
  padding:9px 0;
  border-bottom:1px solid rgba(255,255,255,.055)
}

.dataRow:last-child{

.dataRow span:first-child{

}

.dataRow b{

}

.featureGrid{
  display:grid;
  grid-template-columns:repeat(3,1fr);

}

.feature{
  border-radius:14px;
  padding:10px;

}

.featureIcon{
  font-size:18px
}

.featureName{

  font-size:13px;
  margin-top:3px
}

.featureDesc{
  font-size:10px;
  color:var(--muted);
  margin-top:3px
}

.action{
  width:100%;
  border-radius:12px;
  padding:11px;
  margin-top:7px;
  text-align:left
}

.levelGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px
}

.level{
  padding:12px;
  border-radius:14px;
  background:#0d1317;
  border:1px solid var(--line)
}

.levelLabel{
  font-size:12px;
  color:var(--muted)

.levelValue{
  font-size:21px;
  font-weight:950;
  margin-top:4px

.levelSmall{
  font-size:11px;
  color:var(--muted);
  line-height:1.5;
  margin-top:5px
}

.sectionGrid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:9px
}

.metric{
  padding:11px;
  background:#0d1317;
  border:1px solid var(--line);

}

.metricLabel{
  font-size:11px;
  color:var(--muted)
}

.metricValue{
  font-size:18px;
  font-weight:900;
  margin-top:3px

.metricSub{
  font-size:11px;
  color:var(--muted);
  margin-top:4px;
  line-height:1.5
}

.signal{
  padding:13px;
  border-radius:14px;
  border:1px solid var(--line);
  background:#0d1317
}

.signalState{
  font-size:19px;
  font-weight:950

.scoreBar{
  height:7px;
  border-radius:99px;
  background:#20282e;
  overflow:hidden;
  margin-top:8px

.scoreFill{
  height:100%;
  border-radius:99px;

    #ff6374,
    #ffad42,

.notice{
  padding:11px;
  border-radius:12px;
  background:#111a20;
  border:1px solid #24343d;
  font-size:12px;
  color:#aebbc3;
  line-height:1.6
}

.tableWrap{
  overflow:auto
}

.tableWrap table{
  width:100%;
  border-collapse:collapse;
  font-size:12px
}

.tableWrap th,
.tableWrap td{
  padding:9px 7px;
  border-bottom:1px solid var(--line);

.tableWrap th{
  text-align:left;
  color:var(--muted)
}

.recTable{
  display:grid;
  gap:7px

.recHead{
  display:grid;
  grid-template-columns:1.5fr .8fr .8fr .8fr;
  gap:6px;
  color:var(--muted);

.row{

.recName{

}

.recSmall{

  margin-top:2px
}

.arrow{
  text-align:center;
  font-size:16px
}

.searchResults:empty{
  display:none
}

.empty{
  padding:18px;
  text-align:center;
  color:var(--muted)
}

.loadingBox{
  padding:18px;
  text-align:center;
  color:var(--muted)
}

.progress{
  height:6px;
  background:#20282e;

  overflow:hidden;
  margin-top:9px

.progress i{

  width:35%;
  height:100%;

@keyframes load{

.footer{
  text-align:center;
  color:#5f6b73;
  font-size:10px;
  padding:20px

.bottomNav{

  bottom:0;
  transform:translateX(-50%);
  width:min(760px,100%);

  border-top:1px solid var(--line);
  display:grid;
  grid-template-columns:repeat(5,1fr);

}

.navBtn{

  background:transparent;
  padding:5px 2px;
  color:#71808a
}

.navIcon{
  font-size:18px
}

.navText{
  font-size:10px;
  margin-top:2px
}

.navBtn.active{
  color:var(--blue)
}

.dot{
  display:inline-block;
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--green);

}

.hidden{

}

.pressureStrong{
  color:var(--red)
}

.pressureWarn{
  color:var(--orange)
}

.pressureDanger{

}

.rangeBar{
  height:8px;
  border-radius:99px;
  background:#1d252b;
  position:relative;
  margin-top:9px;
  overflow:hidden
}

.rangeFill{
  height:100%;
  background:linear-gradient(90deg,#55b9ff,#b38cff);
  border-radius:99px
}

.rangeMark{
  position:absolute;
  top:-2px;
  width:2px;
  height:12px;
  background:#fff;
  opacity:.9
}

.scanCards{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:10px
}

.scanCard{
  display:block;
  width:100%;
  text-align:left;
  padding:13px;
  border:1px solid var(--line);
  border-radius:15px;
  background:linear-gradient(180deg,#0d1922,#0b1218);
  color:var(--text)
}

.scanCard:active{
  transform:scale(.99)
}

.scanHead{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px
}

.scanName{
  font-weight:900;
  font-size:15px
}

.scanCode{
  font-size:10px;
  color:var(--muted);
  margin-top:2px
}

.scanState{
  font-size:11px;
  font-weight:800;
  color:var(--cyan)
}

.scanPrice{
  font-size:20px;
  font-weight:950;
  margin:9px 0 8px
}

.scanLevels{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px
}

.scanLevel{
  padding:7px 8px;
  border-radius:10px;
  background:#111b23;
  border:1px solid rgba(255,255,255,.06)
}

.scanLevelLabel{
  font-size:10px;
  color:var(--muted)
}

.scanLevelValue{
  font-size:14px;
  font-weight:900;
  margin-top:2px
}

.scanMeta{
  font-size:10px;
  color:var(--muted);
  line-height:1.45;
  margin-top:8px
}

@media(max-width:480px){
  .scanCards{
    grid-template-columns:1fr
  }

  .grid3{
    grid-template-columns:1fr 1fr
  }

  .grid3 .box:last-child{
    grid-column:1/-1
  }

  .featureGrid{
    grid-template-columns:repeat(2,1fr)
  }

  .breakGrid,
  .levelGrid,
  .sectionGrid{
    grid-template-columns:1fr 1fr
  }

  .stockTitle{
    font-size:20px
  }
}
</style>
</head>

const MIS="https://mis.twse.com.tw/stock/api/getStockInfo.jsp";

const PROXIES=[
  "https://api.allorigins.win/raw?url=",

];

const $=id=>document.getElementById(id);

const esc=v=>String(v??"").replace(
  /[&<>"']/g,
  m=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[m])
);

const n=v=>{
  const x=Number(String(v??"").replace(/,/g,""));
  return Number.isFinite(x)?x:null;
};

const money=(v,d=2)=>
  n(v)==null
    ?"—"
    :n(v).toLocaleString(
      "zh-TW",
      {
        minimumFractionDigits:d,
        maximumFractionDigits:d
      }
    );

const integer=v=>
  n(v)==null
    ?"—"
    :Math.round(n(v)).toLocaleString("zh-TW");

const pct=v=>
  n(v)==null
    ?"—"
    :`${n(v)>=0?"+":""}${n(v).toFixed(2)}%`;

const clean=v=>String(v??"").trim();

function today(){
  const d=new Date();
  const y=d.getFullYear();
  const m=String(d.getMonth()+1).padStart(2,"0");
  const day=String(d.getDate()).padStart(2,"0");

  return `${y}-${m}-${day}`;
}

  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}

async function fetchJSON(url,options={}){
  const controller=new AbortController();

  const timer=setTimeout(
    ()=>controller.abort(),
    15000
  );

  try{
    const res=await fetch(
      url,
      {
        ...options,
        signal:controller.signal,
        headers:{
          "Accept":"application/json",
          ...(options.headers||{})
        }
      }
    );

    if(!res.ok)
      throw new Error(`HTTP ${res.status}`);

    return await res.json();

  }catch(e){

    if(e?.name==="AbortError")
      throw new Error("行情服務逾時");

    throw e;

  }finally{

    clearTimeout(timer);

  }
}

async function finmind(dataset,params={}){
  const q=new URLSearchParams({
    dataset,
    ...params
  });

  const target=`${FINMIND}?${q.toString()}`;

  const urls=[
    target,
    ...PROXIES.map(
      p=>p+encodeURIComponent(target)
    )
  ];

  let lastError=null;

  for(const url of urls){

    try{

      const data=await fetchJSON(url);

      if(
        data &&
        (
          Array.isArray(data.data) ||
          data.status===200 ||
          data.msg===undefined
        )
      )
        return data;

      if(data && Array.isArray(data.data))
        return data;

    }catch(e){

      lastError=e;

    }

  }

  throw lastError ||
    new Error("FinMind 暫時無法取得資料");
}

function firstNumber(...vals){

  for(const v of vals){

    const x=n(v);

    if(x!=null)
      return x;

  }

  return null;
}

function parseRealtime(item){

  if(!item)
    return null;

  const price=firstNumber(
    item.z,
    item.last,
    item.price,
    item.p
  );

  if(price==null)
    return null;

  return{
    price,
    prev:firstNumber(
      item.y,
      item.prevClose,
      item.previousClose
    ),
    open:firstNumber(item.o,item.open),
    high:firstNumber(item.h,item.high),
    low:firstNumber(item.l,item.low),
    bid:firstNumber(item.b),
    ask:firstNumber(item.a),
    volume:firstNumber(item.v,item.tv),
    time:item.t||item.time||"",
    name:item.n||item.name||"",
    market:item.ex||""
  };
}

async function getRealtime(code){

  const markets=[

  for(const m of markets){

    const urls=[
      `${MIS}?ex_ch=${m}_${encodeURIComponent(code)}.tw&json=1&delay=0&_=${Date.now()}`,
      ...PROXIES.map(

          `${MIS}?ex_ch=${m}_${encodeURIComponent(code)}.tw&json=1&delay=0&_=${Date.now()}`
        )
      )
    ];

    for(const url of urls){

      }catch(e){}

  }

  return null;
}

function normalizeRows(data){

      date:
        r.date||
        r.Date||
        r.TradeDate||
        r.trade_date,

      open:
        firstNumber(
          r.open,
          r.Open
        ),

      high:
        firstNumber(
          r.max,
          r.high,
          r.High
        ),

      low:
        firstNumber(
          r.min,
          r.low,
          r.Low
        ),

      close:
        firstNumber(
          r.close,
          r.Close
        ),

      volume:
        firstNumber(
          r.Trading_Volume,

      r=>r.date&&r.close!=null
    )

    );
}

function closes(rows){
  return rows
    .map(r=>r.close)
    .filter(v=>v!=null)
}

function avg(a){

  const x=a.filter(
    v=>n(v)!=null
  );

  return x.length
    ?x.reduce((s,v)=>s+v,0)/x.length
    :null;
}

function sma(rows,period){

  const x=rows
    .slice(-period)
    .map(r=>r.close)
    .filter(v=>v!=null);

  return x.length===period
    ?avg(x)
    :null;
}

function stdev(a){

  const x=a.filter(
    v=>n(v)!=null
  );

  if(x.length<2)
    return null;

  const m=avg(x);

  return Math.sqrt(
    avg(
      x.map(v=>(v-m)**2)
    )
  );
}

function atr(rows,period=14){

  if(rows.length<period+1)
    return null;

  const trs=[];

  for(
    let i=Math.max(1,rows.length-period);
    i<rows.length;
    i++
  ){

    const r=rows[i];
    const p=rows[i-1];

    if(
      r.high==null||
      r.low==null||
      p.close==null
    )
      continue;

    trs.push(
      Math.max(
        r.high-r.low,
        Math.abs(r.high-p.close),
        Math.abs(r.low-p.close)
      )
    );

  }

  return avg(trs);
}

function pctChange(a,b){
  return a!=null&&
    b!=null&&
    b!==0
      ?(a/b-1)*100
      :null
}

function recentRange(rows,period=60){

  const x=rows.slice(-period);

  const highs=x
    .map(r=>r.high??r.close)
    .filter(v=>v!=null);

  const lows=x
    .map(r=>r.low??r.close)
    .filter(v=>v!=null);

  return{
    high:
      highs.length
        ?Math.max(...highs)
        :null,

    low:
      lows.length
        ?Math.min(...lows)
        :null
  };
}

function localExtremes(rows,side,look=2){

  const out=[];

  for(
    let i=look;
    i<rows.length-look;
    i++
  ){

    const p=rows[i];

    const v=
      side==="high"
        ?(p.high??p.close)
        :(p.low??p.close);

    if(v==null)
      continue;

    let ok=true;

    for(
      let j=1;
      j<=look;
      j++
    ){

      const l=rows[i-j];
      const r=rows[i+j];

      const lv=
        side==="high"
          ?(l.high??l.close)
          :(l.low??l.close);

      const rv=
        side==="high"
          ?(r.high??r.close)
          :(r.low??r.close);

      if(
        side==="high" &&
        (v<lv||v<rv)
      )
        ok=false;

      if(
        side==="low" &&
        (v>lv||v>rv)
      )
        ok=false;

    }

    if(ok)
      out.push({
        price:v,
        index:i,
        date:rows[i].date
      });

  }

  return out;
}function volumeProfile(rows,bins=24){
  const data=(rows||[])
    .slice(-120)
    .filter(r=>r.close!=null);

  if(!data.length)
    return [];

  const highs=data
    .map(r=>n(r.high??r.close))
    .filter(v=>v!=null);

  const lows=data
    .map(r=>n(r.low??r.close))
    .filter(v=>v!=null);

  const max=Math.max(...highs);
  const min=Math.min(...lows);

  if(
    !Number.isFinite(min)||
    !Number.isFinite(max)||
    max<=min
  )
    return [];

  const width=(max-min)/bins;

  const buckets=Array.from(
    {length:bins},
    ()=>({
      volume:0,
      touches:0
    })
  );

  for(const r of data){

    const p=n(r.close);
    const v=n(r.volume)||0;

    if(p==null)
      continue;

    const i=Math.max(
      0,
      Math.min(
        bins-1,
        Math.floor((p-min)/width)
      )
    );

    buckets[i].volume+=v;
    buckets[i].touches+=1;
  }

  return buckets
    .map((b,i)=>({
      price:min+width*(i+.5),
      low:min+width*i,
      high:min+width*(i+1),
      volume:b.volume,
      touches:b.touches
    }))
    .filter(x=>x.touches>0)
    .sort((a,b)=>b.volume-a.volume);
}


function clusterLevels(candidates,tolerance){

  const sorted=[
    ...candidates
  ]
  .filter(x=>x.price!=null)
  .sort((a,b)=>a.price-b.price);

  const groups=[];

  for(const c of sorted){

    const g=groups[groups.length-1];

    if(
      !g||
      Math.abs(c.price-g.center)>tolerance
    ){

      groups.push({
        items:[c],
        center:c.price
      });

    }else{

      g.items.push(c);

      const weights=
        g.items.map(
          x=>x.weight||1
        );

      const sw=
        weights.reduce(
          (a,b)=>a+b,
          0
        );

      g.center=
        g.items.reduce(
          (s,x,i)=>
            s+x.price*weights[i],
          0
        )/sw;
    }
  }

  return groups.map(g=>{

    const strength=
      g.items.reduce(
        (s,x)=>
          s+(x.weight||1),
        0
      );

    const types=[
      ...new Set(
        g.items.map(x=>x.type)
      )
    ];

    return{
      ...g,
      strength,
      types,
      min:Math.min(
        ...g.items.map(x=>x.price)
      ),
      max:Math.max(
        ...g.items.map(x=>x.price)
      )
    };

  });
}


function dailyRangeBaseline(rows,period=20){

  const data=(rows||[])
    .slice(-period);

  const values=data
    .map(r=>{

      const h=n(r.high);
      const l=n(r.low);

      return h!=null&&
        l!=null&&
        h>l
          ?h-l
          :null;

    })
    .filter(
      v=>v!=null&&v>0
    );

  return values.length
    ?avg(values)
    :null;
}


function levelTolerance(rows,price){

  const a=atr(rows,14);

  const d=
    dailyRangeBaseline(
      rows,
      20
    );

  const sd=
    stdev(
      closes(rows).slice(-60)
    );

  const values=[
    a!=null?a*.45:null,
    d!=null?d*.55:null,
    sd!=null?sd*.18:null
  ]
  .filter(
    v=>v!=null&&v>0
  );

  return values.length
    ?Math.max(...values)
    :null;
}


function dynamicLevels(rows,price){

  if(
    !rows.length||
    price==null
  )
    return null;

  const ret=
    rows.slice(-120);

  const atrVal=
    atr(ret,14);

  const daily=
    dailyRangeBaseline(
      ret,
      20
    );

  const tol=
    levelTolerance(
      ret,
      price
    );

  const candidates=[];

  const add=(
    p,
    type,
    weight,
    reason
  )=>{

    if(
      p!=null&&
      Number.isFinite(p)
    ){

      candidates.push({
        price:p,
        type,
        weight,
        reason
      });

    }

  };


  for(
    const x of localExtremes(
      ret,
      "low",
      2
    )
  ){

    add(
      x.price,
      "低點",
      2.4,
      "近期局部低點"
    );

  }


  for(
    const x of localExtremes(
      ret,
      "high",
      2
    )
  ){

    add(
      x.price,
      "高點",
      2.4,
      "近期局部高點"
    );

  }


  const ma20=sma(rows,20);
  const ma60=sma(rows,60);
  const ma120=sma(rows,120);

  if(ma20!=null)
    add(
      ma20,
      "均線",
      2,
      "MA20"
    );

  if(ma60!=null)
    add(
      ma60,
      "均線",
      2.2,
      "MA60"
    );

  if(ma120!=null)
    add(
      ma120,
      "均線",
      1.8,
      "MA120"
    );


  for(
    const v of volumeProfile(
      ret,
      24
    ).slice(0,10)
  ){

    if(v.touches>=2){

      add(
        v.price,
        "量價",
        Math.min(
          4,
          v.touches*.55+1
        ),
        "成交量價格密集"
      );

    }

  }


  const rr=
    recentRange(
      rows,
      60
    );

  add(
    rr.low,
    "波段低點",
    2,
    "近60日波段低點"
  );

  add(
    rr.high,
    "波段高點",
    2,
    "近60日波段高點"
  );


  const clusterTol=
    tol ??
    atrVal ??
    daily;


  if(clusterTol==null){

    return{
      s1:null,
      s2:null,
      r1:null,
      r2:null,
      atr:atrVal,
      tolerance:null,
      groups:[],
      range:rr,
      ma20,
      ma60,
      ma120
    };

  }


  const groups=
    clusterLevels(
      candidates,
      clusterTol
    );


  function reason(g){

    const types=
      g.items.map(
        x=>x.type
      );

    const parts=[];

    if(types.includes("高點"))
      parts.push("歷史高點");

    if(types.includes("低點"))
      parts.push("歷史低點");

    if(types.includes("均線"))
      parts.push("均線");

    if(types.includes("量價"))
      parts.push("量價密集");

    if(
      types.includes("波段高點")||
      types.includes("波段低點")
    )
      parts.push("波段結構");

    return parts
      .slice(0,3)
      .join("＋")||
      "價格結構";
  }


  const below=
    groups
      .filter(
        g=>g.center<price
      )
      .sort(
        (a,b)=>
          b.center-a.center
      );


  const above=
    groups
      .filter(
        g=>g.center>price
      )
      .sort(
        (a,b)=>
          a.center-b.center
      );


  function band(g){

    if(!g)
      return null;

    const profilePad=
      Math.max(
        0,
        ...g.items.map(x=>{

          const hi=n(x.profileHigh);
          const lo=n(x.profileLow);

          return hi!=null&&
            lo!=null
              ?Math.abs(hi-lo)/2
              :0;

        })
      );


    const pad=Math.max(
      tol!=null
        ?tol*.45
        :0,

      atrVal!=null
        ?atrVal*.18
        :0,

      daily!=null
        ?daily*.25
        :0,

      profilePad
    );


    return{
      point:g.center,
      low:Math.max(
        0,
        g.center-pad
      ),
      high:g.center+pad,
      reason:reason(g),
      strength:g.strength
    };

  }


  return{

    s1:band(below[0]),
    s2:band(below[1]),

    r1:band(above[0]),
    r2:band(above[1]),

    atr:atrVal,
    tolerance:tol,

    groups,

    range:rr,

    ma20,
    ma60,
    ma120

  };

}


function technical(rows,price){

  const ma5=sma(rows,5);
  const ma20=sma(rows,20);
  const ma60=sma(rows,60);
  const ma120=sma(rows,120);

  const recent=
    recentRange(
      rows,
      20
    );

  const range60=
    recentRange(
      rows,
      60
    );

  const a=
    atr(
      rows,
      14
    );

  const c20=
    rows
      .slice(-21,-1)
      .map(r=>r.close)
      .filter(v=>v!=null);

  const avgVol20=
    avg(
      rows
        .slice(-21,-1)
        .map(r=>r.volume)
        .filter(v=>v!=null)
    );

  const todayRow=
    rows[rows.length-1];

  const volToday=
    todayRow?.volume??null;

  const volRatio=
    avgVol20&&volToday
      ?volToday/avgVol20
      :null;

  const trendScore=
    [
      ma5,
      ma20,
      ma60,
      ma120
    ]
    .filter(v=>v!=null)
    .reduce(
      (s,m)=>
        s+(price>m?1:-1),
      0
    );

  let trend=
    trendScore>=3
      ?"偏多"
      :trendScore<=-2
        ?"偏空"
        :"震盪";  const pos=
    range60.high!=null&&
    range60.low!=null
      ?(price-range60.low)/
        (range60.high-range60.low||1)
      :null;

  const nearHigh=
    recent.high!=null&&
    a!=null
      ?price>=recent.high-a
      :false;

  const nearLow=
    recent.low!=null&&
    a!=null
      ?price<=recent.low+a
      :false;

  return{
    ma5,
    ma20,
    ma60,
    ma120,
    atr:a,
    avgVol20,
    volToday,
    volRatio,
    recent,
    range60,
    trend,
    trendScore,
    pos,
    nearHigh,
    nearLow
  };
}

function retestModel(rows,price,lv){

  const r1=lv?.r1;

  if(!r1){

    return{
      state:"資料不足",
      detail:"尚未形成可辨識的第一壓力區"
    };

  }

  const low=r1.low;
  const high=r1.high;

  const last=rows.slice(-8);

  const touches=last.filter(r=>{

    const h=r.high??r.close;
    const l=r.low??r.close;

    return h>=low&&l<=high;

  }).length;


  if(price>=high){

    return{
      state:"突破觀察",
      detail:
        `價格已在壓力區上方，需觀察突破後是否守住。近8個交易日接觸${touches}次`
    };

  }


  if(
    price>=low&&
    price<=high
  ){

    return{
      state:"回踩中",
      detail:
        `現價位於第一壓力區內，等待結構確認。近8個交易日接觸${touches}次`
    };

  }


  if(touches>0){

    return{
      state:"等待回踩",
      detail:
        `曾測試第一壓力區，尚未回到有效回踩位置。近8個交易日接觸${touches}次`
    };

  }


  return{
    state:"尚未回踩",
    detail:

function breakoutModel(rows,price,tech,lv){

  const r1=lv?.r1;

  const vol=tech.volRatio;

  const above=
    r1
      ?price>r1.high
      :false;

  const near=
    r1
      ?price>=r1.low
      :tech.nearHigh;

  const volumeOk=
    vol==null||
    vol>=1.15;

  const checks=[

    {
      ok:above,
      text:"價格站上第一壓力區"
    },

    {
      ok:near,
      text:"接近第一壓力區"
    },

    {
      ok:volumeOk,
      text:"量能配合"
    }

  ];

  let state=
    above&&volumeOk
      ?"突破確認中"
      :near&&volumeOk
        ?"突破前觀察"
        :"等待突破";

  return{
    state,
    checks
  };

}


function anomalyModel(rows,tech,price){

  const last=
    rows[rows.length-1];

  const prev=
    rows[rows.length-2];

  const move=
    last&&prev
      ?pctChange(
          last.close,
          prev.close
        )
      :null;

  const arr=
    rows
      .slice(-21,-1)
      .map(r=>r.close)
      .filter(v=>v!=null);

  const sd=
    stdev(arr);

  const abnormalMove=
    move!=null&&
    sd!=null&&
    Math.abs(move)>
      Math.max(3,sd);

  const abnormalVol=
    tech.volRatio!=null&&
    tech.volRatio>=2;

  const items=[];

  if(abnormalMove){

    items.push(
      `單日價格變動 ${pct(move)}`
    );

  }

  if(abnormalVol){

    items.push(
      `成交量約為20日均量 ${tech.volRatio.toFixed(2)} 倍`
    );

  }

  return{
    abnormal:items.length>0,
    items
  };

}


function entryModel(price,tech,lv,retest){

  if(!lv){

    return{
      type:"等待資料",
      entry:null,
      defense:null,
      tp1:null,
      tp2:null,
      note:"支撐壓力資料不足"
    };

  }

  const candidates=[];

  if(lv.s1)
    candidates.push(
      lv.s1.point
    );

  if(lv.s2)
    candidates.push(
      lv.s2.point
    );

  const s1=lv.s1;
  const s2=lv.s2;
  const r1=lv.r1;
  const r2=lv.r2;

  let type="等待回踩";
  let entry=null;
  let defense=null;
  let note="";


  if(
    s1&&
    price>=s1.low&&
    price<=s1.high
  ){

    type="回踩進場觀察";

    entry=s1.point;

    note=
      "現價位於第一支撐區，需觀察支撐是否守住。";

    defense=
      s2
        ?s2.low
        :(lv.atr!=null
          ?s1.low-lv.atr
          :s1.low);

  }

  else if(
    s1&&
    price>s1.high&&
    price<s1.point+lv.atr*1.1
  ){

    type="支撐附近觀察";

    entry=s1.point;

    note=
      "距離第一支撐較近，可等待回踩確認。";

    defense=
      s2
        ?s2.low
        :(lv.atr!=null
          ?s1.low-lv.atr
          :s1.low);

  }

  else if(
    r1&&
    price>=r1.low&&
    price<=r1.high
  ){

    type="壓力區不追價";

    note=
      "現價接近壓力區，先等待突破或回踩，不把壓力區直接當買點。";

    defense=
      s1
        ?s1.low
        :null;

  }

  else if(
    r1&&
    price>r1.high
  ){

    type="突破後觀察";

    entry=r1.point;

    note=
      "已站上第一壓力區，觀察突破後回踩是否守住。";

    defense=
      s1
        ?s1.low
        :r1.low;

  }

  else{

    type="區間等待";

    entry=
      s1?.point??
      null;

    defense=
      s1?.low??
      null;

    note=
      "目前不在明確支撐區，等待回踩或有效突破。";

  }


  return{
    type,
    entry,
    defense,
    tp1:r1?.point??null,
    tp2:r2?.point??null,
    note
  };

}

function normalizeInvestor(name){

  const s=
    String(name??"")
      .toLowerCase();

  if(
    s.includes("foreign")||
    s.includes("外資")
  )
    return "foreign";

  if(
    s.includes("investment")||
    s.includes("投信")
  )
    return "trust";

  if(
    s.includes("dealer")||
    s.includes("自營")
  )
    return "dealer";

  return null;
}


async function getInstitution(code){

  try{

    const a=
      await finmind(
        "TaiwanStockInstitutionalInvestorsBuySell",
        {
          data_id:code,
          start_date:dateShift(-35),
          end_date:today()
        }
      );

    const arr=
      Array.isArray(a?.data)
        ?a.data
        :[];

    const map=
      new Map();

    for(const r of arr){

      const date=r.date;

      const key=
        normalizeInvestor(
          r.name??
          r.investor??
          r.Investor
        );

      if(
        !date||
        !key
      )
        continue;

      const buy=
        firstNumber(
          r.buy,
          r.BuyShares,
          r.buy_shares,
          r.Buy
        );

      const sell=
        firstNumber(
          r.sell,
          r.SellShares,
          r.sell_shares,
          r.Sell
        );

      const net=
        buy!=null&&
        sell!=null
          ?buy-sell
          :null;

      if(!map.has(date)){

        map.set(
          date,
          {
            date,
            foreign:null,
            trust:null,
            dealer:null
          }
        );

      }

      if(net!=null)
        map.get(date)[key]=net;

    }


    const rows=
      [...map.values()]
        .sort(
          (a,b)=>
            String(a.date)
              .localeCompare(
                String(b.date)
              )
        );

    const recent=
      rows[rows.length-1]||
      null;


    function sum(period,key){

      const x=
        rows
          .slice(-period)
          .map(r=>r[key])
          .filter(v=>v!=null);

      return x.length
        ?x.reduce(
            (s,v)=>s+v,
            0
          )
        :null;

    }


    return{

      rows,

      latest:
        recent
          ?{
            foreign:recent.foreign,
            trust:recent.trust,
            dealer:recent.dealer,

            total:(()=>{

              const v=[
                recent.foreign,
                recent.trust,
                recent.dealer
              ]
              .filter(
                x=>x!=null
              );

              return v.length
                ?v.reduce(
                    (a,b)=>a+b,
                    0
                  )
                :null;

            })()

          }
          :institutionBlank(),

      p1:{
        foreign:sum(1,"foreign"),
        trust:sum(1,"trust"),
        dealer:sum(1,"dealer")
      },

      p5:{
        foreign:sum(5,"foreign"),
        trust:sum(5,"trust"),
        dealer:sum(5,"dealer")
      },

      p20:{
        foreign:sum(20,"foreign"),
        trust:sum(20,"trust"),
        dealer:sum(20,"dealer")
      }

    };

  }catch(e){

    return{
      rows:[],
      latest:institutionBlank(),
      p1:institutionBlank(),
      p5:institutionBlank(),
      p20:institutionBlank()
    };

  }

}

function breakoutQuality(
  rows,
  price,
  tech,
  lv,
  breakout,
  retest,
  law
){

  const checks=[];

  const r1=lv?.r1;

  const above=
    !!(
      r1&&
      price>r1.high
    );

  const near=
    !!(
      r1&&
      price>=r1.low&&
      price<=r1.high
    );

  const vol=
    tech?.volRatio;

  const volumeStrong=
    vol!=null&&
    vol>=1.2;

  const close=
    rows?.[rows.length-1];

  const closeStrong=
    !!(
      close&&
      close.high!=null&&
      close.low!=null&&
      close.close!=null&&
      close.high>close.low&&
      (
        (close.close-close.low)/
        (close.high-close.low)
      )>=0.65
    );

  const lawLatest=
    law?.latest||{};

  const instTotal=
    lawLatest.total?.net;

  const instPositive=
    instTotal!=null&&
    instTotal>0;

  checks.push({
    ok:above,
    text:"價格站上第一壓力區"
  });

  checks.push({
    ok:volumeStrong,
    text:"成交量較20日均量放大"
  });

  checks.push({
    ok:closeStrong,
    text:"收盤位於當日高檔區"
  });

  checks.push({
    ok:instPositive,
    text:"三大法人合計偏買超"
  });

  let score=0;

  if(above)
    score+=35;
  else if(near)
    score+=20;

  if(volumeStrong)
    score+=25;

  if(closeStrong)
    score+=20;

  if(instPositive)
    score+=20;

  if(
    breakout?.state==="突破確認中"&&
    volumeStrong
  )
    score=
      Math.min(
        100,
        score+5
      );

  if(
    retest?.state==="回踩中"
  )
    score=
      Math.min(
        100,
        score+5
      );

  const label=
    score>=75
      ?"高品質觀察"
      :score>=55
        ?"中度確認"
        :score>=35
          ?"接近突破"
          :"條件不足";

  return{
    score:
      Math.round(
        Math.min(100,score)
      ),
    label,
    checks,
    above,
    near
  };

}


function signalModel(
  price,
  tech,
  lv,
  breakout,
  retest,
  entry,
  law,
  anomaly,
  quality
){

  const total=

  if(

      icon:"🚨",
      detail:

    };

  }

  if(
    breakout?.state==="突破確認中"&&
    quality.score>=70
  ){

    return{
      state:"突破確認",
      icon:"🟢",
      detail:
        "價格、量能與壓力結構同時出現確認訊號。"
    };

  }

  if(
    retest?.state==="回踩中"&&
    tech?.trend==="偏多"
  ){

    return{
      state:"強勢回踩",
      icon:"🟢",
      detail:
        "偏多趨勢中回到關鍵區，等待支撐確認。"
    };

  }

  if(
    breakout?.state==="突破前觀察"||

  ){

      state:"接近突破",
      icon:"🟡",

    };

      icon:"🟠",
      detail:
        "目前位於壓力結構附近，不宜只因接近壓力而追價。"
    };

  }

  if(
    tech?.trend==="偏空"&&
    lv?.s1&&
    price<lv.s1.low
  ){

    return{

      icon:"🔴",
      detail:

        :total>0
          ?"法人偏買但技術訊號尚未完全確認。"
          :"等待價格結構轉強。"
  };

}


function riskRewardModel(
  price,
  entry
){

  const e=entry?.entry;
  const stop=entry?.defense;
  const t1=entry?.tp1;
  const t2=entry?.tp2;

  if(e==null){

    return{
      riskPct:null,
      rr1:null,
      rr2:null,
      state:"等待進場點"
    };

  }

  const risk=
    stop!=null
      ?e-stop
      :null;

  const riskPct=
    risk!=null&&e>0
      ?risk/e*100
      :null;  const rr1=
    risk>0&&
    t1!=null
      ?(t1-e)/risk
      :null;

  const rr2=
    risk>0&&
    t2!=null
      ?(t2-e)/risk
      :null;

  return{
    riskPct,
    rr1,
    rr2,
    state:
      risk>0
        ?"可計算"
        :"風險區間不足"
  };

}

    });

  ){

      type:"壓力爆量",

    });

  }


  if(

    vol!=null&&
    vol>=1.3
  ){

    a.push({
      type:"跌破支撐＋放量",
      level:"高",
      text:
        "第一支撐失守且量能放大。"
    });

  }


  if(
    retest?.state==="回踩中"&&
    tech?.trend==="偏多"
  ){

    a.push({
      type:"突破後回踩",
      level:"強",
      text:
        "偏多趨勢出現關鍵區回踩。"
    });

  }


  if(
    law?.latest?.total?.net>0&&
    law?.p5?.total?.net>0
  ){

    a.push({
      type:"法人連續偏買",
      level:"中",
      text:
        "最新與5日法人合計皆偏買超。"
    });

  }


  if(anomaly?.abnormal){

    a.push(
      ...(anomaly.items||[])
        .map(text=>({
          type:"異常波動",
          level:"中",
          text
        }))
    );

  }


  return a.slice(0,6);

}

let stockUniverseCache=null;

function inferMarket(x){

  const t=
    String(
      x?.type??
      x?.market??
      x?.market_type??
      x?.exchange??
      ''
    ).toLowerCase();

  if(
    /otc|tpex|上櫃|櫃買/.test(t)
  )
    return 'otc';

  return 'tse';
}


function inferETF(x){

  const text=
    String(
      x?.stock_name??
      x?.name??
      ''
    )+
    ' '+
    String(
      x?.industry_category??
      x?.industry??
      ''
    )+
    ' '+
    String(
      x?.type??
      ''
    );

  return /etf|指數型基金|指數股票型基金|槓桿|反向|高股息|主動/
    .test(text.toLowerCase());
}


function normalizeInfo(x){

  const code=
    String(
      x?.stock_id??
      x?.code??
      ''
    )
    .trim()
    .toUpperCase();

  const name=
    String(
      x?.stock_name??
      x?.name??
      ''

      String(
        x?.industry_category??

        '台股'
      ).trim()||'台股',

    isETF:
      inferETF(x)

}

      }catch(e){

        console.warn(
          'TaiwanStockInfo 取得失敗',
          e
        );

      }


      /*
        FinMind 暫時不可用時，
        仍保留首頁已知清單；
        輸入任意代碼仍可直接查行情。
      */

      if(!rows.length){

        rows=
          Object.entries(KNOWN)
            .map(
              ([code,name])=>({
                code,
                name,
                industry:
                  /^00/.test(code)
                    ?'ETF'
                    :'台股',
                market:'tse',
                isETF:/^00/.test(code)
              })
            );

      }


      const map=new Map();

      rows.forEach(
        x=>map.set(x.code,x)
      );


      Object.entries(KNOWN)
        .forEach(
          ([code,name])=>{

            if(!map.has(code)){

              map.set(
                code,
                {
                  code,
                  name,
                  industry:
                    /^00/.test(code)
                      ?'ETF'
                      :'台股',
                  market:'tse',
                  isETF:/^00/.test(code)
                }
              );

            }

          }
        );


      const unique=
        [...map.values()]
          .filter(
            x=>/^[0-9A-Z]{4,8}$/.test(
              x.code
            )
          );


      stockUniverseCache={
        time:Date.now(),
        rows:unique
      };

      return unique;

    })();


  try{

    return await stockUniverseLoading;

  }finally{

    stockUniverseLoading=null;

  }

}


async function loadStockInfo(code){

  const key=
    String(code||'')
      .trim()
      .toUpperCase();

  if(!key)
    return null;


  const cacheKey=
    `info:${key}`;


  if(
    state.cache.has(cacheKey)
  )
    return state.cache.get(cacheKey);


  const universe=
    await getStockUniverse();


  const hit=
    universe.find(
      x=>x.code===key
    );


  if(hit){

    const v={
      code:hit.code,
      name:hit.name,
      industry:hit.industry,
      market:hit.market,
      isETF:hit.isETF
    };

    state.cache.set(
      cacheKey,
      v
    );

    return v;

  }


  /*
    不在名稱清單時仍允許
    直接輸入代碼，
    避免因資料源暫時失敗
    而把合法代碼判成不存在。
  */

  if(
    /^[0-9]{4,6}[A-Z]*$/.test(key)
  ){

    const v={
      code:key,
      name:key,
      industry:'股票／ETF',
      market:'tse',
      isETF:/^00/.test(key)
    };

    state.cache.set(
      cacheKey,
      v
    );

    return v;

  }

  return null;

}


function aliasCode(query){

  const q=
    clean(query)
      .toLowerCase();

  const hit=
    Object.entries(ALIAS)
      .find(
        ([name])=>
          String(name)
            .toLowerCase()===q
      );

  return hit
    ?hit[1]
    :null;

}


async function findStock(query){

  const raw=
    clean(query);

  if(!raw)
    return null;


  const alias=
    aliasCode(raw);

  const key=
    alias||
    raw.toUpperCase();


  const universe=
    await getStockUniverse();


  /*
    代碼精確搜尋：
    支援一般股票、ETF、
    槓桿／反向 ETF 等代碼。
  */

  const byCode=
    universe.find(
      x=>x.code===key
    );

  if(byCode)
    return loadStockInfo(
      byCode.code
    );


  /*
    名稱精確／部分搜尋。
  */

  const q=
    raw.toLowerCase();


  const byName=
    universe.find(
      x=>
        String(x.name)
          .toLowerCase()===q
    )||
    universe.find(
      x=>
        String(x.name)
          .toLowerCase()
          .includes(q)
    );


  if(byName)
    return loadStockInfo(
      byName.code
    );


  /*
    全市場資料源暫時失敗時，
    仍讓使用者直接輸入代碼
    進入行情查詢。
  */

  if(
    /^[0-9]{4,6}[A-Z]*$/.test(key)
  )
    return loadStockInfo(key);


  return null;

}

async function searchStock(query){

  const seq=
    ++state.searchSeq;

  const q=
    clean(query);


  if(!q){

    setStatus(
      "請輸入股票代號或名稱"
    );

    return;

  }


  setStatus(
    "正在取得行情與分析資料…"
  );


  $("result").innerHTML=`
    <div class="card loadingBox">
      資料載入中
      <div class="progress">
        <i></i>
      </div>
    </div>
  `;


  try{

    const info=
      await findStock(q);


    if(seq!==state.searchSeq)
      return;


    if(!info){

      setStatus(
        "找不到此股票或 ETF"
      );

      $("result").innerHTML=`
        <div class="card notice">
          找不到「${esc(q)}」，
          請確認代號或名稱。
        </div>
      `;

      return;

    }


    /*
      行情是必要資料；
      法人／估值是輔助資料，
      失敗不能讓整支股票載入失敗。
    */

    const settled=
      await Promise.allSettled([
        getPrices(info.code),
        getRealtime(info.code),
        getInstitution(info.code),
        getValuation(info.code)
      ]);


    if(seq!==state.searchSeq)
      return;


    const rows=
      settled[0].status==="fulfilled"
        ?settled[0].value
        :[];

    const rt=
      settled[1].status==="fulfilled"
        ?settled[1].value
        :null;

    const law=
      settled[2].status==="fulfilled"
        ?settled[2].value
        :institutionBlank();

    const val=
      settled[3].status==="fulfilled"
        ?settled[3].value
        :{};


    if(!rows.length)
      throw new Error(
        "歷史行情資料暫時無法取得"
      );


    const price=
      rt?.price??
      rows[rows.length-1]?.close;


    if(price==null)
      throw new Error(
        "目前沒有可用價格"
      );


    const data=
      buildData(
        info.code,
        info.name,
        price,
        rows,
        rt,
        law,
        val
      );


    state.currentStock=
      info;

    state.currentData=
      data;


    $("searchInput").value=
      info.code;

    $("searchResults").innerHTML=
      "";


    renderData(data);

    setStatus(
      `已更新 ${info.code} ${info.name}`
    );


    clearInterval(
      state.refreshTimer
    );


    state.refreshTimer=
      setInterval(
        refreshPrice,
        30000
      );


  }catch(e){

    console.error(
      "searchStock",
      e
    );


    setStatus(
      `載入失敗：${
        e.message||
        "行情服務暫時無法使用"
      }`
    );


    $("result").innerHTML=`
      <div class="card notice">
        <b>載入失敗</b>
        <br><br>
        ${esc(
          e.message||
          "行情服務暫時無法使用"
        )}
        <br><br>
        請稍後重新分析。
        程式不會用固定價格代替實際行情。
      </div>
    `;

  }

}

async function scanOne(code){  const key=
    String(code).toUpperCase();

  try{

    const info=
      await loadStockInfo(key);

    const settled=
      await Promise.allSettled([
        getPrices(key),
        getRealtime(key)
      ]);

    const rows=
      settled[0].status==="fulfilled"
        ?settled[0].value
        :[];

    const rt=
      settled[1].status==="fulfilled"
        ?settled[1].value
        :null;


    if(
      !Array.isArray(rows)||
      !rows.length
    ){

      return{
        code:key,
        name:
          info?.name||
          KNOWN[key]||
          key,
        failed:true,
        reason:
          "歷史行情沒有回傳資料"
      };

    }


    const price=
      rt?.price??
      rows[rows.length-1]?.close;


    if(price==null){

      return{
        code:key,
        name:
          info?.name||
          KNOWN[key]||
          key,
        failed:true,
        reason:
          "沒有可用現價"
      };

    }


    const tech=
      technical(
        rows,
        price
      );

    const levels=
      dynamicLevels(
        rows,
        price
      );

    const retest=
      retestModel(
        rows,
        price,
        levels
      );

    const breakout=
      breakoutModel(
        rows,
        price,
        tech,
        levels
      );

    const entry=
      entryModel(
        price,
        tech,
        levels,
        retest
      );


    let score=0;


    if(
      breakout.state===
      "突破確認中"
    )
      score+=40;

    else if(
      breakout.state===
      "突破前觀察"
    )
      score+=25;

    else if(
      breakout.state===
      "已越過壓力"
    )
      score+=20;


    if(
      tech.trend==="偏多"
    )
      score+=20;


    if(
      tech.volRatio!=null&&
      tech.volRatio>=2
    )
      score+=20;

    else if(
      tech.volRatio!=null&&
      tech.volRatio>=1.25
    )
      score+=12;


    if(
      retest.state===
      "突破觀察"
    )
      score+=10;


    return{
      code:key,
      name:
        info?.name||
        KNOWN[key]||
        key,

      price,
      rows,
      rt,
      score,
      levels,
      tech,
      retest,
      breakout,
      entry,

      volume:
        tech.volRatio,

      failed:false
    };


  }catch(e){

    console.warn(
      "scanOne",
      key,
      e
    );


    return{
      code:key,
      name:
        KNOWN[key]||
        key,
      failed:true,
      reason:
        e?.message||
        "行情取得失敗"
    };

  }

}


async function getHot20Codes(){

  /*
    🔥 每次按下按鈕都重新向
    TWSE 官方「成交量前二十名證券」
    抓取最新排行。

    這裡完全不保存固定20檔代號，
    也不保存固定價格。

    因此今天、明天、
    下個交易日出現的20檔
    可以完全不同。
  */

  const targets=[

    "https://openapi.twse.com.tw/v1/exchangeReport/MI_INDEX20",

    "https://www.twse.com.tw/exchangeReport/MI_INDEX20?response=json&date="

  ];


  let last=null;


  for(
    const target of targets
  ){

    const urls=[
      target,
      ...PROXIES.map(
        p=>
          p+
          encodeURIComponent(target)
      )
    ];


    for(
      const url of urls
    ){

      try{

        const data=
          await fetchJSON(
            url,
            16000
          );


        const rows=
          Array.isArray(data?.data)
            ?data.data
            :(
              Array.isArray(data)
                ?data
                :[]
            );


        const hot=
          rows
            .map(
              r=>({

                code:
                  String(
                    r?.[0]??
                    r?.Code??
                    r?.code??
                    ""
                  )
                  .trim()
                  .toUpperCase(),

                name:
                  String(
                    r?.[1]??
                    r?.Name??
                    r?.name??
                    ""
                  )
                  .trim(),

                volume:
                  n(
                    r?.[3]??
                    r?.Trading_Volume??
                    r?.TradingVolume??
                    r?.volume
                  )

              })
            )
            .filter(
              x=>
                /^[0-9A-Z]{4,8}$/
                  .test(x.code)
            );


        if(
          hot.length>=20
        ){

          return hot.slice(
            0,
            20
          );

        }


      }catch(e){

        last=e;

        console.warn(
          "熱門20來源",
          url,
          e
        );

      }

    }

  }


  /*
    完全不使用固定股票清單；
    抓不到當日排行就讓使用者重試。
  */

  throw(
    last||
    new Error(
      "TWSE 今日熱門20檔資料暫時無法取得"
    )
  );

}


async function scanHot20(){

  const seq=
    ++state.scanSeq;

  const box=
    $("scanResult");

  const button=
    $("hot20ScanBtn");


  if(!box)
    return;


  if(button){

    button.disabled=true;

    button.innerHTML=
      "⏳ 正在抓取熱門20檔…";

  }


  box.className=
    "scanCards";


  box.innerHTML=`
    <div class="loadingBox">
      🔥 正在取得最新熱門成交量排行
      <div class="progress">
        <i></i>
      </div>
    </div>
  `;


  setStatus(
    "正在取得今日最新熱門20檔（非固定清單）…"
  );


  try{

    const hot=
      await getHot20Codes();


    if(
      seq!==state.scanSeq
    )
      return;


    const total=
      hot.length;

    const results=[];
    const failed=[];

    const batchSize=3;


    for(
      let i=0;
      i<hot.length;
      i+=batchSize
    ){

      if(
        seq!==state.scanSeq
      )
        return;


      const batch=
        hot.slice(
          i,
          i+batchSize
        );


      const batchResults=
        await Promise.all(
          batch.map(
            x=>
              scanOne(x.code)
          )
        );


      batchResults.forEach(
        (x,j)=>{

          const meta=
            batch[j];


          if(x?.failed){

            failed.push({
              ...x,
              rank:i+j+1,
              hotName:meta.name
            });

          }else if(
            x?.price!=null
          ){

            results.push({
              ...x,
              hotRank:i+j+1,
              hotVolume:meta.volume,
              hotName:meta.name
            });

          }

        }
      );


      setStatus(
        `熱門20檔掃描中 ${
          Math.min(
            i+batchSize,
            total
          )
        }/${total}｜已完成 ${
          results.length
        } 檔`
      );

    }


    if(
      seq!==state.scanSeq
    )
      return;


    results.sort(
      (a,b)=>{

        const av=
          a.hotVolume??-1;

        const bv=
          b.hotVolume??-1;


        if(
          bv!==av
        )
          return bv-av;


        return(
          (a.hotRank??99)-
          (b.hotRank??99)
        );

      }
    );


    if(!results.length){

        }/${SCAN_CODES.length}

    results.sort(
      (a,b)=>{

        const ap=
          a.score||0;

        const bp=
          b.score||0;

        return bp-ap;

      }
    );

      const detail=

async function runFeature(action){

  setStatus(
    "正在掃描…"
  );


  const results=[];


  for(
    const code of SCAN_CODES
  ){

    const x=
      await scanOne(code);

    if(x)
      results.push(x);

  }


  let sorted=
    results;


  if(action==="recent")
    sorted=
      results
        .filter(x=>x.score>0)
        .sort(
          (a,b)=>
            b.score-a.score
        );


  if(action==="long")
    sorted=
      results.sort(
        (a,b)=>
          b.score-a.score
      );


  if(action==="popular")
    sorted=
      results.sort(
        (a,b)=>
          (b.volume??-1)-
          (a.volume??-1)
      );


  if(action==="institution")
    sorted=
      results.sort(
        (a,b)=>
          b.score-a.score
      );


  if(action==="pressure")
    sorted=
      results.sort(
        (a,b)=>
          Math.abs(
            (a.level??a.price)-
            a.price
          )-
          Math.abs(
            (b.level??b.price)-
            b.price
          )
      );


  if(action==="analysis")
    sorted=
      results.sort(
        (a,b)=>
          b.score-a.score
      );


  $("recommendTable").innerHTML=
    `
      <div class="recHead">
        <span>標的</span>
        <span>現價</span>
        <span>關鍵區</span>
        <span>狀態</span>
      </div>
    `+
    sorted
      .slice(0,8)
      .map(
        x=>`
          <button
            class="row"
            data-rec-code="${esc(x.code)}"
          >

            <span>

              <b class="recName">
                ${esc(x.name)}
              </b>

              <span class="recSmall">
                ${esc(x.code)}
              </span>

            </span>

            <span>
              ${money(x.price)}
            </span>

            <span>
              ${money(x.level)}
            </span>

            <span
              class="${
                x.breakout?.state===
                  "突破確認中"
                  ?"green"
                  :x.breakout?.state===
                    "突破前觀察"
                    ?"yellow"
                    :"orange"
              }"
            >
              ${esc(
                x.breakout?.state||
                "觀察"
              )}
            </span>

          </button>
        `
      )
      .join("");


  $("recommendTable")
    .querySelectorAll(
      "[data-rec-code]"
    )
    .forEach(
      b=>
        b.addEventListener(
          "click",
          ()=>
            searchStock(
              b.dataset.recCode
            )
        )
    );


  setStatus(
    `完成：${sorted.length} 檔`
  );

}


function navAction(nav){

  document
    .querySelectorAll(".navBtn")
    .forEach(
      b=>
        b.classList.toggle(
          "active",
          b.dataset.nav===nav
        )
    );


  if(nav==="home"){

    $("home")
      .scrollIntoView({
        behavior:"smooth"
      });

    return;

  }


  if(nav==="watch"){

    $("recommendTable")
      .scrollIntoView({
        behavior:"smooth"
      });

    return;

  }


  if(nav==="chip"){

    if(state.currentData){

      $("result")
        .scrollIntoView({
          behavior:"smooth"
        });

      setTimeout(
        ()=>
          document
            .querySelectorAll(".card")
            .forEach(
              ()=>{}
            ),
        0
      );

    }else{

      setStatus(
        "請先分析一檔股票"
      );

    }

    return;

  }


  if(nav==="industry"){

    setStatus(
      "產業比較功能以實際搜尋的股票資料為基礎；請先分析標的"
    );

    return;

  }


  if(nav==="setting"){

    setStatus(
      "V1491：單一 HTML、動態點位、不寫死股票價格"
    );

    return;

  }

}


let eventsBound=false;


function bindEvents(){

  if(eventsBound)
    return;

  eventsBound=true;


  $("searchBtn")
    .addEventListener(
      "click",
      ()=>
        searchStock(
          $("searchInput").value
        )
    );


  $("searchInput")
    .addEventListener(
      "keydown",
      e=>{
        if(e.key==="Enter")
          searchStock(
            e.target.value
          );
      }
    );


  $("searchInput")
    .addEventListener(
      "input",
      showSearchCandidates
    );


  document
    .querySelectorAll(
      "[data-code]"
    )
    .forEach(
      b=>
        b.addEventListener(
          "click",
          ()=>
            searchStock(
              b.dataset.code
            )
        )
    );


  document
    .querySelectorAll(
      "[data-action]"
    )
    .forEach(
      b=>
        b.addEventListener(
          "click",
          ()=>
            runFeature(
              b.dataset.action
            )
        )
    );


  $("breakScanBtn")
    .addEventListener(
      "click",
      scanBreakout
    );


  $("hot20ScanBtn")
    .addEventListener(
      "click",
      scanHot20
    );


  document
    .querySelectorAll(
      "[data-nav]"
    )
    .forEach(
      b=>
        b.addEventListener(
          "click",
          ()=>
            navAction(
              b.dataset.nav
            )
        )
    );

}


function boot(){

  bindEvents();

  setStatus(
    "V1491 已啟動｜等待輸入股票"
  );

}


if(
  document.readyState==="loading"
)
  document.addEventListener(
    "DOMContentLoaded",
    boot
  );
else
  boot();

</script>

</html>

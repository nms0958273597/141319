<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080a0c">

<title>m1491｜動態台股法人籌碼與突破分析 V1491</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

:root{
  --bg:#080a0c;
  --panel:#101419;
  --panel2:#151a20;
  --panel3:#1b222a;
  --line:#28313a;
  --text:#f2f5f7;
  --muted:#8e9aa5;
  --green:#21d07a;
  --red:#ff5263;
  --yellow:#ffc857;
  --blue:#4da3ff;
  --cyan:#35d6e7;
  --orange:#ff9f43;
  --purple:#a77bff;
  --shadow:0 10px 30px rgba(0,0,0,.28);
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  padding:0;
  background:
    radial-gradient(circle at top,#141a20 0,#080a0c 42%);
  color:var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "PingFang TC",
    "Noto Sans TC",
    "Microsoft JhengHei",
    sans-serif;
  min-height:100vh;
}

button,
input,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

button:disabled{
  cursor:not-allowed;
  opacity:.5;
}

/* =========================
   頂部
========================= */

.topbar{
  position:sticky;
  top:0;
  z-index:1000;
  padding:
    calc(10px + env(safe-area-inset-top))
    14px
    10px;
  background:rgba(8,10,12,.94);
  backdrop-filter:blur(16px);
  border-bottom:1px solid rgba(255,255,255,.06);
}

.topbar-inner{
  max-width:1180px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.brand{
  min-width:0;
}

.brand-title{
  font-size:20px;
  font-weight:900;
  letter-spacing:.5px;
}

.brand-sub{
  margin-top:3px;
  color:var(--muted);
  font-size:11px;
}

.status{
  display:flex;
  align-items:center;
  gap:6px;
  white-space:nowrap;
  font-size:11px;
  color:var(--muted);
}

.status-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--green);
  box-shadow:0 0 10px rgba(33,208,122,.7);
}

/* =========================
   主容器
========================= */

.container{
  width:min(1180px,calc(100% - 20px));
  margin:14px auto 50px;
}

/* =========================
   搜尋區
========================= */

.search-panel{
  position:relative;
  background:linear-gradient(
    145deg,
    rgba(21,26,32,.98),
    rgba(13,17,21,.98)
  );
  border:1px solid var(--line);
  border-radius:18px;
  padding:14px;
  box-shadow:var(--shadow);
}

.search-row{
  display:flex;
  gap:8px;
}

.search-input-wrap{
  position:relative;
  flex:1;
}

#searchInput{
  width:100%;
  height:46px;
  padding:0 14px;
  border-radius:12px;
  border:1px solid #313b45;
  outline:none;
  color:var(--text);
  background:#090c0f;
  transition:.2s;
}

#searchInput:focus{
  border-color:var(--blue);
  box-shadow:0 0 0 3px rgba(77,163,255,.12);
}

#searchInput::placeholder{
  color:#65717d;
}

.primary-btn{
  min-width:82px;
  height:46px;
  border:0;
  border-radius:12px;
  padding:0 16px;
  color:#fff;
  font-weight:800;
  background:linear-gradient(135deg,#1677ff,#315dff);
  box-shadow:0 7px 18px rgba(49,93,255,.22);
}

.primary-btn:active{
  transform:translateY(1px);
}

.search-candidates{
  display:none;
  margin-top:8px;
  border:1px solid var(--line);
  border-radius:12px;
  overflow:hidden;
  background:#0b0f13;
}

.search-candidates.show{
  display:block;
}

.search-candidate{
  width:100%;
  border:0;
  border-bottom:1px solid rgba(255,255,255,.06);
  padding:11px 13px;
  text-align:left;
  color:var(--text);
  background:transparent;
}

.search-candidate:last-child{
  border-bottom:0;
}

.search-candidate:active,
.search-candidate:hover{
  background:#151c23;
}

.candidate-code{
  display:inline-block;
  min-width:58px;
  color:var(--cyan);
  font-weight:800;
}

.candidate-name{
  color:#e9edf0;
}

/* =========================
   快速按鈕
========================= */

.quick-panel{
  margin-top:12px;
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.quick-btn{
  border:1px solid #303943;
  background:#11161b;
  color:#dce2e7;
  border-radius:10px;
  min-height:38px;
  padding:0 13px;
  font-size:13px;
  font-weight:700;
}

.quick-btn:hover{
  border-color:#4b5966;
  background:#182027;
}

.quick-btn:active{
  transform:scale(.98);
}

/* =========================
   熱門20
========================= */

.hot20-wrap{
  margin-top:12px;
}

.hot20-btn{
  width:100%;
  min-height:48px;
  border:1px solid rgba(255,159,67,.45);
  border-radius:13px;
  color:#fff;
  font-weight:900;
  font-size:15px;
  background:
    linear-gradient(
      135deg,
      rgba(255,87,34,.95),
      rgba(255,159,67,.9)
    );
  box-shadow:
    0 8px 22px rgba(255,100,30,.18);
}

.hot20-btn:active{
  transform:translateY(1px);
}

.hot20-btn.loading{
  opacity:.72;
  pointer-events:none;
}

/* =========================
   Loading
========================= */

.loading-box{
  display:none;
  margin-top:12px;
  padding:14px;
  border:1px solid var(--line);
  border-radius:13px;
  background:#0d1217;
  color:var(--muted);
  text-align:center;
  font-size:13px;
}

.loading-box.show{
  display:block;
}

.loading-dot{
  display:inline-block;
  width:7px;
  height:7px;
  margin-right:5px;
  border-radius:50%;
  background:var(--cyan);
  animation:pulse 1s infinite alternate;
}

@keyframes pulse{
  from{opacity:.25}
  to{opacity:1}
}

/* =========================
   股票主資訊
========================= */

.stock-card{
  margin-top:14px;
  background:
    linear-gradient(
      145deg,
      rgba(20,25,31,.98),
      rgba(12,16,20,.98)
    );
  border:1px solid var(--line);
  border-radius:18px;
  padding:16px;
  box-shadow:var(--shadow);
}

.stock-head{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:12px;
}

.stock-name{
  font-size:25px;
  font-weight:950;
  line-height:1.2;
}

.stock-code{
  color:var(--cyan);
  font-size:13px;
  font-weight:800;
  margin-top:5px;
}

.stock-market{
  color:var(--muted);
  font-size:11px;
  margin-top:3px;
}

.price-box{
  text-align:right;
}

.current-price{
  font-size:30px;
  line-height:1;
  font-weight:950;
}

.price-change{
  margin-top:6px;
  font-size:13px;
  font-weight:800;
}

.up{
  color:var(--red);
}

.down{
  color:var(--green);
}

.flat{
  color:var(--muted);
}

/* =========================
   資訊格
========================= */

.info-grid{
  margin-top:15px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
}

.info-item{
  min-height:65px;
  padding:10px;
  border-radius:11px;
  border:1px solid rgba(255,255,255,.055);
  background:#0b0f13;
}

.info-label{
  color:var(--muted);
  font-size:10px;
  margin-bottom:5px;
}

.info-value{
  color:#f1f4f6;
  font-size:14px;
  font-weight:850;
}

/* =========================
   區塊標題
========================= */

.section-title{
  display:flex;
  align-items:center;
  gap:8px;
  margin:18px 0 9px;
  font-size:16px;
  font-weight:900;
}

.section-title::before{
  content:"";
  width:4px;
  height:18px;
  border-radius:3px;
  background:var(--blue);
}

.section-title.orange::before{
  background:var(--orange);
}

.section-title.green::before{
  background:var(--green);
}

.section-title.red::before{
  background:var(--red);
}

/* =========================
   技術分析
========================= */

.level-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
}

.level-card{
  padding:13px 10px;
  border-radius:13px;
  border:1px solid var(--line);
  background:#0d1217;
  text-align:center;
}

.level-label{
  color:var(--muted);
  font-size:11px;
  margin-bottom:6px;
}

.level-value{
  font-size:18px;
  font-weight:950;
}

.support1{
  color:#48d6a0;
}

.support2{
  color:#22b981;
}

.resistance1{
  color:#ffbd69;
}

.resistance2{
  color:#ff6f78;
}

/* =========================
   交易策略
========================= */

.trade-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
}

.trade-card{
  padding:13px 10px;
  border-radius:13px;
  background:#0d1217;
  border:1px solid var(--line);
  text-align:center;
}

.trade-label{
  color:var(--muted);
  font-size:11px;
}

.trade-value{
  margin-top:6px;
  font-size:19px;
  font-weight:950;
}

.entry{
  color:var(--blue);
}

.stop{
  color:var(--red);
}

.tp1{
  color:var(--yellow);
}

.tp2{
  color:var(--green);
}

/* =========================
   法人籌碼
========================= */

.chip-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
}

.chip-card{
  padding:12px 10px;
  border:1px solid var(--line);
  border-radius:13px;
  background:#0d1217;
}

.chip-label{
  color:var(--muted);
  font-size:11px;
}

.chip-value{
  margin-top:6px;
  font-size:17px;
  font-weight:900;
}

.chip-sub{
  margin-top:4px;
  font-size:10px;
  color:#697681;
}

/* =========================
   熱門20結果
========================= */

.hot20-panel{
  margin-top:14px;
  display:none;
  background:#0d1217;
  border:1px solid var(--line);
  border-radius:16px;
  overflow:hidden;
}

.hot20-panel.show{
  display:block;
}

.hot20-head{
  padding:13px 14px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid var(--line);
}

.hot20-title{
  font-weight:900;
}

.hot20-time{
  color:var(--muted);
  font-size:10px;
}

.hot20-list{
  display:flex;
  flex-direction:column;
}

.hot-row{
  display:grid;
  grid-template-columns:38px 1fr 72px 72px;
  gap:8px;
  align-items:center;
  padding:11px 12px;
  border-bottom:1px solid rgba(255,255,255,.05);
}

.hot-row:last-child{
  border-bottom:0;
}

.hot-rank{
  color:var(--yellow);
  font-weight:950;
  text-align:center;
}

.hot-name{
  min-width:0;
}

.hot-name strong{
  display:block;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.hot-name small{
  color:var(--muted);
  font-size:10px;
}

.hot-price{
  text-align:right;
  font-weight:850;
}

.hot-change{
  text-align:right;
  font-weight:850;
}

/* =========================
   錯誤提示
========================= */

.message{
  display:none;
  margin-top:12px;
  padding:12px 14px;
  border-radius:12px;
  border:1px solid rgba(255,82,99,.28);
  background:rgba(255,82,99,.08);
  color:#ff9aa5;
  font-size:13px;
  line-height:1.6;
}

.message.show{
  display:block;
}

/* =========================
   空白提示
========================= */

.empty{
  padding:25px 15px;
  text-align:center;
  color:var(--muted);
}

/* =========================
   Footer
========================= */

.footer{
  margin-top:25px;
  padding:18px 8px 35px;
  color:#58636d;
  font-size:10px;
  line-height:1.7;
  text-align:center;
}

/* =========================
   RWD
========================= */

@media(max-width:760px){

  .container{
    width:calc(100% - 12px);
    margin-top:9px;
  }

  .topbar{
    padding-left:10px;
    padding-right:10px;
  }

  .brand-title{
    font-size:17px;
  }

  .brand-sub{
    font-size:9px;
  }

  .search-panel{
    padding:10px;
    border-radius:15px;
  }

  .search-row{
    gap:6px;
  }

  #searchInput{
    height:44px;
    padding:0 11px;
    font-size:14px;
  }

  .primary-btn{
    min-width:70px;
    padding:0 11px;
  }

  .quick-panel{
    gap:6px;
  }

  .quick-btn{
    min-height:35px;
    padding:0 10px;
    font-size:12px;
  }

  .stock-card{
    padding:13px;
    border-radius:15px;
  }

  .stock-name{
    font-size:21px;
  }

  .current-price{
    font-size:25px;
  }

  .info-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .level-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .trade-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .chip-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .hot-row{
    grid-template-columns:32px 1fr 64px 64px;
    gap:5px;
    padding:10px 8px;
  }
}

@media(max-width:390px){

  .info-item{
    padding:9px;
  }

  .info-value{
    font-size:13px;
  }

  .level-value,
  .trade-value{
    font-size:17px;
  }

  .hot-row{
    grid-template-columns:28px 1fr 58px 58px;
    font-size:12px;
  }
}
</style>
</head>

    <div

  <!-- 股票主資訊 -->
  <section

  <section

      </div>

    </div>

    <div
      id="hot20List"
      class="hot20-list"
    ></div>

  </section>

  <footer class="footer">
    m1491 V1491｜台股資料分析工具<br>

  </footer>

</main>

/* =========================================================
   數字處理
========================================================= */

function num(value){

  if(
    value === null ||
    value === undefined ||
    value === "" ||
    value === "--" ||
    value === "-"
  ){
    return NaN;
  }

  if(typeof value === "number"){
    return Number.isFinite(value) ? value : NaN;
  }

  const n = Number(
    String(value)
      .replace(/,/g,"")
      .replace(/%/g,"")
      .trim()
  );

  return Number.isFinite(n) ? n : NaN;
}


function safeNum(value, fallback=0){

  const n = num(value);

  return Number.isFinite(n) ? n : fallback;
}


function fmt(value, digits=2){

  const n = num(value);

  if(!Number.isFinite(n)){
    return "--";
  }

  return n.toLocaleString(
    "zh-TW",
    {
      minimumFractionDigits:digits,
      maximumFractionDigits:digits
    }
  );
}


function fmtInt(value){

  const n = num(value);

  if(!Number.isFinite(n)){
    return "--";
  }

  return Math.round(n).toLocaleString("zh-TW");
}


function pct(value,digits=2){

  const n = num(value);

  if(!Number.isFinite(n)){
    return "--";
  }

  return `${n.toFixed(digits)}%`;
}

function esc(value){

/* =========================================================
   Fetch 工具
========================================================= */

async function fetchJSON(
  url,
  options={}
){

  const controller =
    new AbortController();

  const timeout =
    setTimeout(
      ()=>controller.abort(),
      options.timeout || 15000
    );

  try{

    const response =
      await fetch(
        url,
        {
          ...options,
          signal:controller.signal,
          cache:"no-store"
        }
      );

    if(!response.ok){

      throw new Error(
        `HTTP ${response.status}`
      );

    }

    return await response.json();

  }
  finally{

    clearTimeout(timeout);

  }

}


/* =========================================================
   API URL
========================================================= */

function apiURL(base,params={}){

  const url =
    new URL(base);

  Object.entries(params)
    .forEach(
      ([key,value])=>{
        if(
          value !== undefined &&
          value !== null &&
          value !== ""
        ){
          url.searchParams.set(
            key,
            value
          );
        }
      }
    );

  /*
   * 避免瀏覽器／中間快取
   */
  url.searchParams.set(
    "_",
    Date.now().toString()
  );

  return url.toString();

}

/* =========================================================
   TWSE 欄位取值工具
========================================================= */

function pick(obj,...keys){

  if(!obj){
    return undefined;
  }

  for(const key of keys){

    if(
      Object.prototype.hasOwnProperty.call(
        obj,
        key
      )
    ){

      const value =
        obj[key];

      if(
        value !== undefined &&
        value !== null &&
        value !== ""
      ){

        return value;

      }

    }

  }

  return undefined;

}

/* =========================================================
   搜尋股票
   ---------------------------------------------------------
   重要：
   不把 KNOWN 當成完整股票資料庫。
========================================================= */

async function findStock(query){

  const q =
    normalizeCode(query);

  if(!q){

    return [];

  }


  const universe =
    await getStockUniverse();


  /*
   * -------------------------------------------------------
   * 代號完全符合
   * -------------------------------------------------------
   */

  const exactCode =
    universe.filter(
      item =>
        normalizeCode(item.code) === q
    );


  /*
   * -------------------------------------------------------
   * 名稱完全符合
   * -------------------------------------------------------
   */

  const exactName =
    universe.filter(
      item =>
        normalizeName(item.name) ===
        normalizeName(query)
    );


  /*
   * -------------------------------------------------------
   * 代號部分符合
   * -------------------------------------------------------
   */

  const codeMatch =
    universe.filter(
      item =>
        normalizeCode(item.code)
          .includes(q)
    );


  /*
   * -------------------------------------------------------
   * 名稱部分符合
   * -------------------------------------------------------
   */

  const nameMatch =
    universe.filter(
      item =>
        normalizeName(item.name)
          .includes(
            normalizeName(query)
          )
    );


  /*
   * -------------------------------------------------------
   * 合併排序
   *
   * 完全符合永遠排前面。
   * -------------------------------------------------------
   */

  const result = [];

  [
    ...exactCode,
    ...exactName,
    ...codeMatch,
    ...nameMatch
  ]
  .forEach(item=>{

    if(!item){
      return;
    }

    if(
      !result.some(
        x=>x.code === item.code
      )
    ){

      result.push(item);

    }

  });


  return result.slice(0,20);

}

/* =========================================================
   TWSE 民國日期轉 Date
========================================================= */

function parseTWSEDate(value){

  const text =
    String(value ?? "")
      .trim();


  /*
   * 例如：
   * 115/10/02
   * 115-10-02
   * 115.10.02
   */

  const match =
    text.match(
      /(\d{2,3})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/
    );


  if(match){

    const y =
      Number(match[1]);

    const m =
      Number(match[2]);

    const d =
      Number(match[3]);


    return new Date(
      y + 1911,
      m - 1,
      d
    ).getTime();

  }


  /*
   * 西元日期備援
   */

  const normal =
    new Date(text)
      .getTime();


  return Number.isFinite(normal)
    ? normal
    : 0;

}

/* =========================================================
   SMA
========================================================= */

function sma(
  rows,
  period
){

  if(
    !Array.isArray(rows) ||
    !rows.length ||
    period <= 0
  ){

    return NaN;

  }


  const valid =
    rows.filter(
      row =>
        row &&
        Number.isFinite(row.close)
    );


  if(valid.length < period){

    /*
     * 不足完整週期時，
     * 使用目前可取得的資料。
     */

    if(!valid.length){
      return NaN;
    }

    const slice =
      valid.slice(
        -Math.min(
          period,
          valid.length
        )
      );

    const sum =
      slice.reduce(
        (acc,row)=>
          acc + row.close,
        0
      );

    return (
      sum / slice.length
    );

  }


  const slice =
    valid.slice(-period);


  const sum =
    slice.reduce(
      (acc,row)=>
        acc + row.close,
      0
    );


  return (
    sum / period
  );

}


/* =========================================================
   移動平均完整序列
========================================================= */

function buildMA(
  rows,
  period
){

  if(
    !Array.isArray(rows) ||
    !rows.length
  ){

    return [];

  }


  const output = [];


  for(
    let i=0;
    i<rows.length;
    i++
  ){

    const start =
      Math.max(
        0,
        i - period + 1
      );


    const slice =
      rows.slice(
        start,
        i + 1
      );


    const valid =
      slice.filter(
        row =>
          Number.isFinite(
            row.close
          )
      );


    if(!valid.length){

      output.push(NaN);

      continue;

    }


    const total =
      valid.reduce(
        (sum,row)=>
          sum + row.close,
        0
      );


    output.push(
      total / valid.length
    );

  }


  return output;

}

function averageVolume(

){

   建立價格層級
   ---------------------------------------------------------
   支撐／壓力採多來源計算：

   1. 近期高低點
   2. MA20
   3. MA60
   4. 最新價格
   5. 前一日高低點

   最後再依照目前價格排序。
========================================================= */

function calculateLevels(data){

  const price =
    num(data?.price);

  const rows =
    Array.isArray(data?.history)
      ? data.history
      : [];

  const ma20 =
    num(data?.ma20);

  const ma60 =
    num(data?.ma60);

  const latest =
    data?.latest || {};

  const previous =
    data?.previousK || {};


  if(!validPrice(price)){

    return {

      support1:NaN,
      support2:NaN,
      resistance1:NaN,
      resistance2:NaN

    };

  }


  const supports = [];

  const resistances = [];


  /* -------------------------
     支撐候選
  ------------------------- */

  const supportCandidates = [

    num(data?.recentLow20),

    num(data?.recentLow60),

    num(previous.low),

    num(latest.low),

    ma20,

    ma60

  ];


  supportCandidates.forEach(value=>{

    if(
      validPrice(value) &&
      value < price
    ){

      supports.push(value);

    }

  });


  /* -------------------------
     壓力候選
  ------------------------- */

  const resistanceCandidates = [

    num(data?.recentHigh20),

    num(data?.recentHigh60),

    num(previous.high),

    num(latest.high),

    ma20,

    ma60

  ];


  resistanceCandidates.forEach(value=>{

    if(
      validPrice(value) &&
      value > price
    ){

      resistances.push(value);

    }

  });


  /*
   * 去除非常接近的重複價位
   */

  function uniqueLevels(values){

    const sorted =
      values
        .filter(validPrice)
        .sort(
          (a,b)=>a-b
        );

    const output = [];

    sorted.forEach(value=>{

      if(!output.length){

        output.push(value);

        return;

      }


      const last =
        output[
          output.length - 1
        ];


      /*
       * 價格差小於 0.3%
       * 視為同一個區間。
       */

      const diffPct =
        Math.abs(
          value - last
        ) /
        last *
        100;


      if(diffPct >= 0.3){

        output.push(value);

      }

    });

    return output;

  }


  const s =
    uniqueLevels(
      supports

  const r =
    uniqueLevels(
      resistances

   * 第二支撐 = 再下一層

  const supportsNear =
    s
      .sort(

   * 第一壓力 = 距離目前價格最近
   * 第二壓力 = 再上一層
   * -------------------------------------------------------
   */

  const resistancesNear =
    r
      .sort(
        (a,b)=>a-b
      );

   * 如果候選不足，

   *
   * 這不是市場預測，
   * 只是避免畫面出現空白。

  let support1 =
    supportsNear[0];

  let support2 =
    supportsNear[1];

  let resistance1 =
    resistancesNear[0];

  let resistance2 =
    resistancesNear[1];

  if(!validPrice(resistance1)){

    resistance1 =

  if(!validPrice(resistance2)){

    support2:

    resistance2:

   * 優先靠近第一支撐。
   * 若第一支撐距離太遠，
   * 使用目前價格與第一支撐中間值。
   */

  let entry =
    s1 +
    (
      price - s1
    ) * 0.35;


  /*
   * 若第一支撐異常，
   * 使用目前價格。
   */

  if(!validPrice(entry)){

    entry =
      price;

  }


  /*
   * 止損：
   *
   * 優先放在第二支撐下方。
   */

  let stop =
    s2 * 0.985;


  if(
    !validPrice(stop) ||
    stop >= entry
  ){

    stop =
      entry * 0.95;

  }


  /*
   * 第一止盈：
   * 優先使用第一壓力。
   */

  let tp1 =
    r1;


  if(
    !validPrice(tp1) ||
    tp1 <= entry
  ){

    tp1 =
      entry * 1.05;

  }


  /*
   * 第二止盈：
   * 優先使用第二壓力。
   */

  let tp2 =
    r2;


  if(
    !validPrice(tp2) ||
    tp2 <= tp1
  ){

    tp2 =
      entry * 1.10;

  }


  return {

    entry:
      roundPrice(entry),

    stop:
      roundPrice(stop),

    tp1:
      roundPrice(tp1),

    tp2:
      roundPrice(tp2)

  };

}


/* =========================================================
   技術狀態判斷
========================================================= */

function getTrendState(data){

  const price =
    num(data?.price);

  const ma5 =
    num(data?.ma5);

  const ma20 =
    num(data?.ma20);

  const ma60 =
    num(data?.ma60);


  if(!validPrice(price)){

    return {

      text:"資料不足",
      className:"flat"

    };

  }


  /*
   * 多頭排列
   */

  if(
    validPrice(ma5) &&
    validPrice(ma20) &&
    validPrice(ma60) &&
    ma5 > ma20 &&
    ma20 > ma60 &&
    price > ma5
  ){

    return {

      text:"多頭排列",
      className:"up"

    };

  }


  /*
   * 空頭排列
   */

  if(
    validPrice(ma5) &&
    validPrice(ma20) &&
    validPrice(ma60) &&
    ma5 < ma20 &&
    ma20 < ma60 &&
    price < ma5
  ){

    return {

      text:"空頭排列",
      className:"down"

    };

  }


  /*
   * 價格站上 MA20
   */

  if(
    validPrice(ma20) &&
    price > ma20
  ){

    return {

      text:"偏多震盪",
      className:"up"

    };

  }


  if(
    validPrice(ma20) &&
    price < ma20
  ){

    return {

      text:"偏弱震盪",
      className:"down"

    };

  }


  return {

    text:"區間震盪",
    className:"flat"

  };

}


/* =========================================================
   量能判斷
========================================================= */

function getVolumeState(data){

  const volume =
    num(data?.volume);

  const avg =
    num(data?.avgVolume20);


  if(
    !Number.isFinite(volume) ||
    !Number.isFinite(avg) ||
    avg <= 0
  ){

    return {

      text:"資料不足",
      className:"flat"

    };

  }


  const ratio =
    volume / avg;


  if(ratio >= 2){

    return {

      text:"爆量",
      className:"up"

    };

  }


  if(ratio >= 1.2){

    return {

      text:"量增",
      className:"up"

    };

  }


  if(ratio <= 0.6){

    return {

      text:"量縮",
      className:"down"

    };

  }


  return {

    text:"正常",
    className:"flat"

  };

}


/* =========================================================
   報酬率
========================================================= */

function calcReturn(
  entry,
  target
){

  const e =
    num(entry);

  const t =
    num(target);


  if(
    !validPrice(e) ||
    !validPrice(t) ||
    e === 0
  ){

    return NaN;

  }


  return (
    t - e
  ) /
  e *
  100;

}

/* =========================================================
   民國日期轉 API 日期
   例如 115/10/03 → 20261003
========================================================= */

function twseDateToYYYYMMDD(
  value
){

  const text =
    String(value ?? "")
      .trim();

  const match =
    text.match(
      /(\d{2,3})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/
    );

  if(!match){
    return "";
  }

  const y =
    Number(match[1]) + 1911;

  const m =
    Number(match[2]);

  const d =
    Number(match[3]);

  return (
    String(y) +
    pad2(m) +
    pad2(d)
  );

}

/* =========================================================
   法人數值處理
========================================================= */

function parseInstitutionValue(
  value
){

  if(
    value === null ||
    value === undefined ||
    value === ""
  ){

    return NaN;

  }


  const text =
    String(value)
      .replace(/,/g,"")
      .trim();


  /*
   * 「-」有時代表 0，
   * 但非數值文字不要硬轉。
   */

  if(
    text === "-" ||
    text === "--"
  ){

    return 0;

  }


  const n =
    Number(text);


  return Number.isFinite(n)
    ? n
    : NaN;

}


/* =========================================================
   法人欄位備援
========================================================= */

function findInstitutionValue(
  row,
  type
){

  if(
    !Array.isArray(row)
  ){

    return NaN;

  }


  /*
   * 只在常見欄位範圍搜尋，
   * 避免誤把代號／名稱當數字。
   */

  const candidates =
    row
      .slice(2)
      .map(
        value =>
          parseInstitutionValue(
            value
          )
      )
      .filter(
        Number.isFinite
      );


  if(!candidates.length){

    return NaN;

  }


  /*
   * 無法從不同版本欄位可靠辨識時，
   * 不偽造資料。
   *
   * 直接回傳 NaN，
   * UI 顯示 --。
   */

  return NaN;

}

/* =========================================================
   將市場資料轉成統一格式
========================================================= */

function normalizeMarketRow(
  row
){

  if(!row){

    return null;

  }


  /*
   * openapi STOCK_DAY_ALL
   *
   * 常見欄位：
   *
   * Code
   * Name
   * TradeVolume
   * TradeValue
   * OpeningPrice
   * HighestPrice
   * LowestPrice
   * ClosingPrice
   * Change
   */

  const code =
    getCode(row);


  const name =
    getName(row);


  if(!code){

    return null;

  }


  /*
   * 排除非正常股票代號。
   *
   * 保留：
   * 4～6 碼數字。
   */

  if(
    !/^\d{4,6}$/.test(code)
  ){

    return null;

  }


  const price =
    getClose(row);


  const open =
    getOpen(row);


  const high =
    getHigh(row);


  const low =
    getLow(row);


  const volume =
    getVolume(row);


  const change =
    getChange(row);


  const changePct =
    getChangePct(row);


  /*
   * 成交金額。
   */

  const tradeValue =
    safeNum(
      pick(
        row,
        "TradeValue",
        "tradeValue",
        "成交金額"
      ),
      0
    );


  /*
   * 如果沒有直接成交金額，
   * 用價格 × 成交量做備援。
   *
   * 注意：
   * STOCK_DAY_ALL 的成交量通常為股數。
   */

  const calculatedValue =
    tradeValue > 0
      ? tradeValue
      : (
          validPrice(price) &&
          volume > 0
            ? price * volume
            : 0
        );


  /*
   * 過濾沒有成交價格的資料。
   */

  if(
    !validPrice(price)
  ){

    return null;

  }


  return {

    code,

    name:
      name || code,

    market:
      "上市",

    price,

    open,

    high,

    low,

    volume,

    tradeValue:
      calculatedValue,

    change,

    changePct,

    raw:row

  };

}


/* =========================================================
   過濾熱門候選
========================================================= */

function filterHotCandidates(
  rows
){

  if(
    !Array.isArray(rows)
  ){

    return [];

  }


  return rows
    .map(
      normalizeMarketRow
    )
    .filter(
      Boolean
    )
    .filter(
      item=>{

        /*
         * 必須有成交量
         */

        if(
          !Number.isFinite(
            item.volume
          ) ||
          item.volume <= 0
        ){

          return false;

        }


        /*
         * 必須有成交金額
         */

        if(
          !Number.isFinite(
            item.tradeValue
          ) ||
          item.tradeValue <= 0
        ){

          return false;

        }


        return true;

      }
    );

}


/* =========================================================
   熱門排序
   ---------------------------------------------------------
   主要依「成交金額」排序。
   
   若成交金額相同，
   再依成交量。
   
   這樣不是固定名單，
   每個交易日會跟著市場變化。
========================================================= */

function rankHot20(
  rows
){

  const candidates =
    filterHotCandidates(
      rows
    );


  /*
   * 完全獨立排序。
   *
   * 這裡沒有任何 SCAN_CODES。
   */

  candidates.sort(
    (a,b)=>{

      const valueDiff =
        b.tradeValue -
        a.tradeValue;


      if(
        valueDiff !== 0
      ){

        return valueDiff;

      }


      return (
        b.volume -
        a.volume
      );

    }
  );


  return candidates
    .slice(0,20);

}


/* =========================================================
   建立熱門20 HTML
========================================================= */

function renderHot20(
  rows
){

  if(!hot20List){

    return;

  }


  hot20List.innerHTML = "";


  if(
    !Array.isArray(rows) ||
    !rows.length
  ){

    hot20List.innerHTML = `
      <div class="empty">
        今天暫時沒有取得熱門資料。
      </div>
    `;

    return;

  }


  rows.forEach(
    (item,index)=>{

      const change =
        num(item.change);


      const changePct =
        num(item.changePct);


      let changeClass =
        "flat";


      if(
        Number.isFinite(change)
      ){

        if(change > 0){

          changeClass =
            "up";

        }
        else if(change < 0){

          changeClass =
            "down";

        }

      }


      const row =
        document.createElement(
          "div"
        );


      row.className =
        "hot-row";


      row.innerHTML = `

        <div class="hot-rank">
          ${index + 1}
        </div>


        <div
          class="hot-name"
          title="${esc(item.name)}"
        >

          <strong>
            ${esc(item.name)}
          </strong>

          <small>
            ${esc(item.code)}
          </small>

        </div>


        <div class="hot-price">
          ${priceOrDash(item.price)}
        </div>


        <div
          class="hot-change ${changeClass}"
        >

          ${
            Number.isFinite(changePct)
              ? `
                ${changePct >= 0 ? "+" : ""}
                ${fmt(changePct,2)}%
              `
              : "--"
          }

        </div>

      `;


      /*
       * 點擊熱門股票，
       * 直接進入完整個股分析。
       */

      row.addEventListener(
        "click",
        async ()=>{

          if(searchInput){

            searchInput.value =
              item.code;

          }


          hideMessage();


          /*
           * 關閉熱門20展開區，
           * 讓使用者直接看到個股分析。
           */

          hot20Panel
            ?.classList
            .remove("show");


          await loadStockInfo(
            item.code
          );

        }
      );


      /*
       * 讓使用者知道可以點。
       */

      row.style.cursor =
        "pointer";


      hot20List.appendChild(
        row
      );

    }
  );

}


/* =========================================================

========================================================= */

function updateHot20Time(){

  if(!hot20Time){

    return;

  }


  const now =
    new Date();


  const text =
    now.getFullYear() +
    "/" +
    pad2(
      now.getMonth()+1
    ) +
    "/" +
    pad2(
      now.getDate()
    ) +
    " " +
    pad2(
      now.getHours()
    ) +
    ":" +
    pad2(
      now.getMinutes()
    ) +
    ":" +
    pad2(
      now.getSeconds()
    );


  hot20Time.textContent =
    `更新：${text}`;

}

async function scanHot20(){

   * -------------------------------------------------------
   * 防止重複點擊
   * -------------------------------------------------------
   */

  if(
    state.hot20Scanning
  ){

    return;

  }


  state.hot20Scanning =

  hideMessage();


  /*
   * -------------------------------------------------------
   * 按鈕鎖定

   */

  if(hot20ScanBtn){

    hot20ScanBtn.disabled =
      true;

    hot20ScanBtn.classList.add(
      "loading"
    );

    hot20ScanBtn.textContent =
      "🔥 正在重新掃描當日熱門20…";

  }


  /*
   * -------------------------------------------------------
   * 顯示載入
   * -------------------------------------------------------
   */

  showLoading(
    "正在取得今日全市場資料…"
  );


  try{

    /*
     * =====================================================
     * 核心：
     *
     * 每次按下按鈕，
     * 都重新向官方全市場資料 API 請求。
     *
     * 不讀取 state.hot20 舊資料。
     * 不使用 SCAN_CODES。
     * =====================================================
     */

    const marketData =
      await getMarketToday();


    setStatus(
      "正在分析熱門股票",
      "loading"
    );


    /*
     * -----------------------------------------------------
     * 動態排序
     * -----------------------------------------------------
     */

    const hot20 =
      rankHot20(
        marketData
      );


    if(
      !hot20.length
    ){

      throw new Error(
        "目前沒有取得有效熱門股票"
      );

    }


    /*
     * -----------------------------------------------------
     * 更新狀態
     * -----------------------------------------------------
     */

    state.hot20 =
      hot20;


    /*
     * -----------------------------------------------------
     * 顯示熱門20
     * -----------------------------------------------------
     */

    renderHot20(
      hot20
    );


    updateHot20Time();


    if(hot20Panel){

      hot20Panel.classList.add(
        "show"
      );

    }


    /*
     * -----------------------------------------------------
     * 顯示掃描完成
     * -----------------------------------------------------
     */

    hideLoading();


    setStatus(
      `熱門20完成｜${hot20.length} 檔`,
      "normal"
    );


  }
  catch(error){

    console.error(
      "scanHot20 error:",
      error
    );


    hideLoading();


    showMessage(
      "熱門20掃描失敗，請稍後再按一次。"
    );


  }
  finally{

    state.hot20Scanning =
      false;


    /*
     * 恢復按鈕
     */

    if(hot20ScanBtn){

      hot20ScanBtn.disabled =
        false;

      hot20ScanBtn.classList.remove(
        "loading"
      );

      hot20ScanBtn.textContent =
        "🔥 掃描熱門20檔";

    }

  }

}

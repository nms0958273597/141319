    */

    if(typeof ALIAS !== "undefined" && ALIAS){

      for(const [code,name] of Object.entries(ALIAS)){

        result.push({
          code,
          name
        });

      }

    }

    return dedupeStocks(result);
  }

  /* ---------------------------------------------------------
     4. 統一搜尋
     代號 / 中文名稱皆可
     --------------------------------------------------------- */

  function findStockFinal(keyword){

    const q = normalizeName(keyword);

    if(!q) return null;

    const universe = collectSearchUniverse();

    /*
      ① 完整代號
    */

    let hit = universe.find(
      x => normalizeName(x.code) === q
    );

    if(hit) return hit;

    /*
      ② 完整中文名稱
    */

    hit = universe.find(
      x => normalizeName(x.name) === q
    );

    if(hit) return hit;

    /*
      ③ 代號包含
    */

    hit = universe.find(
      x => normalizeName(x.code).includes(q)
    );

    if(hit) return hit;

    /*
      ④ 名稱包含
    */

    hit = universe.find(
      x => normalizeName(x.name).includes(q)
    );

    if(hit) return hit;

    return null;
  }

  /* ---------------------------------------------------------
     5. 搜尋候選清單
     --------------------------------------------------------- */

  function searchCandidatesFinal(keyword,limit=20){

    const q = normalizeName(keyword);

    if(!q) return [];

    const universe = collectSearchUniverse();

    const exact = [];
    const starts = [];
    const contains = [];

    for(const x of universe){

      const code = normalizeName(x.code);
      const name = normalizeName(x.name);

      if(code === q || name === q){
        exact.push(x);
        continue;
      }

      if(
        code.startsWith(q) ||
        name.startsWith(q)
      ){
        starts.push(x);
        continue;
      }

      if(
        code.includes(q) ||
        name.includes(q)
      ){
        contains.push(x);
      }
    }

    return [
      ...exact,
      ...starts,
      ...contains
    ].slice(0,limit);
  }

  /* ---------------------------------------------------------
     6. 搜尋 UI 統一處理
     --------------------------------------------------------- */

  function getSearchInput(){

    const ids = [
      "searchInput",
      "stockSearch",
      "searchBox",
      "stockInput",
      "codeInput"
    ];

    for(const id of ids){

      const el = byId(id);

      if(el) return el;

    }

    return null;
  }

  function selectSearchStock(stock){

    if(!stock) return;

    const code = stock.code;

    const input = getSearchInput();

    if(input){
      input.value = code;
    }

    /*
      優先呼叫原本程式的分析函式
    */

    const runners = [
      "runFeature",
      "analyzeStock",
      "analyze",
      "runAnalysis",
      "loadStock"
    ];

    for(const fn of runners){

      if(typeof window[fn] === "function"){

        try{

          const result = window[fn](code);

          /*
            不需要等待結果。
            原程式負責畫面更新。
          */

          return result;

        }catch(err){

          console.warn(
            "[V1491] 分析函式執行失敗:",
            fn,
            err
          );

        }
      }
    }

    /*
      若沒有既有分析函式，
      嘗試觸發原本按鈕。
    */

    const buttons = [
      "analyzeBtn",
      "searchBtn",
      "runBtn"
    ];

    for(const id of buttons){

      const btn = byId(id);

      if(btn){
        btn.click();
        return;
      }

    }
  }

  function renderSearchCandidatesFinal(list){

    const box =
      byId("searchCandidates") ||
      byId("searchResults") ||
      byId("searchDropdown");

    if(!box) return;

    box.innerHTML = "";

    if(!list.length){

      box.style.display = "none";
      return;
    }

    for(const stock of list){

      const item = document.createElement("button");

      item.type = "button";
      item.className = "v1491-search-item";

      item.innerHTML = `
        <span class="v1491-search-code">
          ${stock.code}
        </span>
        <span class="v1491-search-name">
          ${stock.name}
        </span>
      `;

      item.addEventListener("click",()=>{

        box.style.display = "none";

        selectSearchStock(stock);

      });

      box.appendChild(item);
    }

    box.style.display = "block";
  }

  /* ---------------------------------------------------------
     7. 搜尋事件只綁一次
     --------------------------------------------------------- */

  function bindSearchFinal(){

    if(STATE.searchBound) return;

    const input = getSearchInput();

    if(!input) return;

    STATE.searchBound = true;

    input.addEventListener("input",()=>{

      const value = text(input.value);

      if(!value){

        renderSearchCandidatesFinal([]);
        return;
      }

      const list =
        searchCandidatesFinal(value,20);

      renderSearchCandidatesFinal(list);

    });

    input.addEventListener("keydown",(e)=>{

      if(e.key !== "Enter") return;

      e.preventDefault();

      const value = text(input.value);

      if(!value) return;

      const stock = findStockFinal(value);

      if(stock){

        renderSearchCandidatesFinal([]);

        selectSearchStock(stock);

      }

    });

  }

  /* ---------------------------------------------------------
     8. Hot20 結果標準化
     --------------------------------------------------------- */

  function normalizeHot20Item(x){

    if(!x) return null;

    const code = normalizeCode(
      x.code ??
      x.symbol ??
      x.stockCode ??
      x.SecuritiesCompanyCode ??
      x.Code
    );

    const name = text(
      x.name ??
      x.stockName ??
      x.companyName ??
      x.SecuritiesCompanyName ??
      x.Name
    );

    const price = num(
      x.price ??
      x.close ??
      x.ClosingPrice ??
      x.Close
    );

    const volume = num(
      x.volume ??
      x.tradeVolume ??
      x.TradeVolume ??
      x.TradingVolume ??
      x.Trading_Volume
    );

    if(!code) return null;

    return {
      ...x,
      code,
      name: name || code,
      price,
      volume
    };
  }

  function normalizeHot20List(list){

    const map = new Map();

    for(const raw of (Array.isArray(list) ? list : [])){

      const x = normalizeHot20Item(raw);

      if(!x) continue;

      /*
        同一股票只留一筆
      */

      if(!map.has(x.code)){
        map.set(x.code,x);
      }

    }

    return [...map.values()]
      .filter(x => x.price !== null || x.volume !== null)
      .slice(0,20);
  }

  /* ---------------------------------------------------------
     9. Hot20 按鈕統一
     --------------------------------------------------------- */

  function getHot20Button(){

    const ids = [
      "hot20ScanBtn",
      "hot20Btn",
      "scanHot20Btn"
    ];

    for(const id of ids){

      const el = byId(id);

      if(el) return el;

    }

    /*
      如果前面程式沒有按鈕才建立。
    */

    const buttons =
      [...document.querySelectorAll("button")];

    const existing = buttons.find(
      b => /掃描熱門20|熱門20/i.test(
        text(b.textContent)
      )
    );

    return existing || null;
  }

  /* ---------------------------------------------------------
     10. Hot20 狀態
     --------------------------------------------------------- */

  function setHot20ButtonState(running){

    const btn = getHot20Button();

    if(!btn) return;

    if(running){

      btn.dataset.v1491Busy = "1";

      btn.disabled = true;

      if(!btn.dataset.v1491OriginalText){
        btn.dataset.v1491OriginalText =
          text(btn.textContent);
      }

      btn.textContent =
        "🔥 掃描熱門20檔中…";

    }else{

      btn.dataset.v1491Busy = "0";

      btn.disabled = false;

      if(btn.dataset.v1491OriginalText){

        btn.textContent =
          btn.dataset.v1491OriginalText;

      }else{

        btn.textContent =
          "🔥 掃描熱門20檔";

      }

    }
  }

  /* ---------------------------------------------------------
     11. Hot20 掃描入口
     --------------------------------------------------------- */

  async function runHot20Final(){

    if(STATE.hot20Running){

      console.warn(
        "[V1491] 熱門20檔掃描正在進行"
      );

      return;
    }

    STATE.hot20Running = true;

    const seq = ++STATE.hot20Seq;

    setHot20ButtonState(true);

    try{

      let list = null;

      /*
        優先使用前面第十一段建立的正式 API。
      */

      if(
        typeof window.V1491_GET_HOT20 ===
        "function"
      ){

        list =
          await window.V1491_GET_HOT20();

      }

      /*
        若沒有第十一段 API，
        使用原本 scanHot20。
      */

      if(
        (!Array.isArray(list) || !list.length) &&
        typeof window.scanHot20 === "function" &&
        window.scanHot20 !== runHot20Final
      ){

        list =
          await window.scanHot20();

      }

      if(seq !== STATE.hot20Seq){
        return;
      }

      const clean =
        normalizeHot20List(list);

      /*
        若 API 已經直接負責畫面，
        不重複覆蓋。
      */

      if(clean.length){

        window.V1491_HOT20_RESULT = clean;

        /*
          若存在統一 render 函式則交給它。
        */

        if(
          typeof window.renderHot20 ===
          "function"
        ){

          try{
            window.renderHot20(clean);
          }catch(err){
            console.warn(
              "[V1491] renderHot20:",
              err
            );
          }

        }

      }

      return clean;

    }catch(err){

      console.error(
        "[V1491] Hot20:",
        err
      );

      /*
        不讓錯誤造成整頁死掉。
      */

      const box =
        byId("hot20Result") ||
        byId("scanResult") ||
        byId("result");

      if(box && !box.innerHTML.trim()){

        box.innerHTML = `
          <div class="v1491-error">
            ⚠️ 熱門20檔掃描失敗<br>
            ${text(err?.message || err)}
          </div>
        `;

      }

    }finally{

      STATE.hot20Running = false;

      setHot20ButtonState(false);

    }
  }

  /* ---------------------------------------------------------
     12. Hot20 按鈕只綁一次
     --------------------------------------------------------- */

  function bindHot20Final(){

    if(STATE.buttonBound) return;

    const btn = getHot20Button();

    if(!btn) return;

    STATE.buttonBound = true;

    /*
      使用捕獲階段攔截，
      避免前面重複 listener 造成多次掃描。
    */

    btn.addEventListener(
      "click",
      function(e){

        if(STATE.hot20Running){

          e.preventDefault();
          e.stopImmediatePropagation();

          return;
        }

        /*
          如果原本已有 listener，
          不阻止它。
          這裡只負責狀態管理。
        */

        runHot20Final();

      },
      false
    );

  }

  /* ---------------------------------------------------------
     13. 全局錯誤保護
     --------------------------------------------------------- */

  window.addEventListener(
    "unhandledrejection",
    function(e){

      console.warn(
        "[V1491] 未處理 Promise:",
        e.reason
      );

    }
  );

  /* ---------------------------------------------------------
     14. 啟動
     --------------------------------------------------------- */

  function initialize(){

    if(STATE.initialized) return;

    STATE.initialized = true;

    bindSearchFinal();
    bindHot20Final();

    /*
      對外提供統一入口
    */

    window.V1491_FINAL = {
      state: STATE,
      search: findStockFinal,
      candidates: searchCandidatesFinal,
      hot20: runHot20Final,
      universe: collectSearchUniverse
    };

    console.log(
      "%c[V1491 第十三段] 最終整合層已載入",
      "font-weight:bold"
    );

    console.log(
      "[V1491] 搜尋股票數量:",
      collectSearchUniverse().length
    );

  }

  if(document.readyState === "loading"){

    document.addEventListener(
      "DOMContentLoaded",
      initialize,
      {once:true}
    );

  }else{

    initialize();

  }

})();

<script>
(function V1491_TRADE_INTEGRATION(){

  "use strict";

  /* =======================================================
     14-1｜數值工具
     ======================================================= */

  function n(v){

    if(v === null || v === undefined || v === ""){
      return null;
    }

    const x = Number(
      String(v)
        .replace(/,/g,"")
        .replace(/%/g,"")
        .trim()
    );

    return Number.isFinite(x) ? x : null;
  }


  function round2(v){

    const x = n(v);

    return x === null
      ? null
      : Math.round(x * 100) / 100;

  }


  function price(v){

    const x = n(v);

    return x === null
      ? null
      : round2(x);

  }


  function money(v){

    const x = price(v);

    return x === null
      ? "--"
      : x.toFixed(2);

  }


  /* =======================================================
     14-2｜取得價格
     ======================================================= */

  function getPrice(stock){

    return price(
      stock?.price ??
      stock?.close ??
      stock?.ClosingPrice ??
      stock?.Close
    );

  }


  /* =======================================================
     14-3｜統一四大關卡
     ======================================================= */

  function normalizeLevels(stock){

    const lv =
      stock?.levels ||
      stock?.level ||
      {};

    let s1 = price(
      lv.firstSupport ??
      lv.support1 ??
      lv.s1 ??
      stock?.firstSupport ??
      stock?.support1
    );

    let s2 = price(
      lv.secondSupport ??
      lv.support2 ??
      lv.s2 ??
      stock?.secondSupport ??
      stock?.support2
    );

    let r1 = price(
      lv.firstResistance ??
      lv.resistance1 ??
      lv.r1 ??
      stock?.firstResistance ??
      stock?.resistance1
    );

    let r2 = price(
      lv.secondResistance ??
      lv.resistance2 ??
      lv.r2 ??
      stock?.secondResistance ??
      stock?.resistance2
    );


    /*
      確保支撐由低到高
    */

    if(
      s1 !== null &&
      s2 !== null &&
      s1 > s2
    ){

      [s1,s2] = [s2,s1];

    }


    /*
      確保壓力由低到高
    */

    if(
      r1 !== null &&
      r2 !== null &&
      r1 > r2
    ){

      [r1,r2] = [r2,r1];

    }


    return {

      firstSupport:s1,

      secondSupport:s2,

      firstResistance:r1,

      secondResistance:r2

    };

  }


  /* =======================================================
     14-4｜如果原本模型沒有完整四關卡
           依現有價格／ATR補齊
     ======================================================= */

  function completeLevels(stock){

    const current =
      getPrice(stock);

    const lv =
      normalizeLevels(stock);


    /*
      已經完整就直接使用
    */

    if(
      lv.firstSupport !== null &&
      lv.secondSupport !== null &&
      lv.firstResistance !== null &&
      lv.secondResistance !== null
    ){

      return lv;

    }


    /*
      優先使用 ATR
    */

    const atr =
      price(
        stock?.atr ??
        stock?.ATR ??
        stock?.levels?.atr
      );


    /*
      沒 ATR 時，不自行亂造價格。
      保留已有資料。
    */

    if(
      current === null ||
      atr === null ||
      atr <= 0
    ){

      return lv;

    }


    const step =
      Math.max(
        atr,
        current * 0.01
      );


    if(
      lv.firstSupport === null
    ){

      lv.firstSupport =
        round2(
          current - step
        );

    }


    if(
      lv.secondSupport === null
    ){

      lv.secondSupport =
        round2(
          current - step * 2
        );

    }


    if(
      lv.firstResistance === null
    ){

      lv.firstResistance =
        round2(
          current + step
        );

    }


    if(
      lv.secondResistance === null
    ){

      lv.secondResistance =
        round2(
          current + step * 2
        );

    }


    return lv;

  }


  /* =======================================================
     14-5｜交易策略
     ======================================================= */

  function buildTradePlan(stock){

    const current =
      getPrice(stock);

    const lv =
      completeLevels(stock);


    if(current === null){

      return {

        entry:null,

        stopLoss:null,

        takeProfit1:null,

        takeProfit2:null,

        rr1:null,

        rr2:null

      };

    }


    /*
      進場：
      優先使用原本模型的 entry。
    */

    let entry =
      price(
        stock?.trade?.entry ??
        stock?.entry ??
        stock?.entryPrice
      );


    /*
      沒有 entry 時，
      以目前價格作為分析基準。
    */

    if(entry === null){

      entry = current;

    }


    /*
      止損：
      優先使用原模型。
      否則使用第二支撐。
    */

    let stopLoss =
      price(
        stock?.trade?.stopLoss ??
        stock?.stopLoss ??
        stock?.stop
      );


    if(
      stopLoss === null &&
      lv.secondSupport !== null
    ){

      stopLoss =
        lv.secondSupport;

    }


    /*
      如果第二支撐仍不存在，
      不硬造價格。
    */


    /*
      第一止盈：
      優先第一壓力。
    */

    let takeProfit1 =
      price(
        stock?.trade?.takeProfit1 ??
        stock?.takeProfit1 ??
        stock?.target1
      );


    if(
      takeProfit1 === null &&
      lv.firstResistance !== null
    ){

      takeProfit1 =
        lv.firstResistance;

    }


    /*
      第二止盈：
      優先第二壓力。
    */

    let takeProfit2 =
      price(
        stock?.trade?.takeProfit2 ??
        stock?.takeProfit2 ??
        stock?.target2
      );


    if(
      takeProfit2 === null &&
      lv.secondResistance !== null
    ){

      takeProfit2 =
        lv.secondResistance;

    }


    /*
      風險報酬
    */

    let rr1 = null;
    let rr2 = null;


    if(
      stopLoss !== null &&
      entry > stopLoss
    ){

      const risk =
        entry - stopLoss;


      if(
        takeProfit1 !== null
      ){

        rr1 =
          round2(
            (takeProfit1 - entry) /
            risk
          );

      }


      if(
        takeProfit2 !== null
      ){

        rr2 =
          round2(
            (takeProfit2 - entry) /
            risk
          );

      }

    }


    return {

      entry,

      stopLoss,

      takeProfit1,

      takeProfit2,

      rr1,

      rr2

    };

  }


  /* =======================================================
     14-6｜突破狀態統一
     ======================================================= */

  function buildBreakoutStatus(stock,levels){

    const current =
      getPrice(stock);


    if(current === null){

      return {

        type:"無法判斷",

        text:"目前價格資料不足",

        cls:"normal"

      };

    }


    /*
      使用原本模型結果
    */

    const original =
      stock?.breakout ||
      stock?.signal;


    if(
      original?.type
    ){

      return {

        type:String(
          original.type
        ),

        text:
          original.text ||
          String(original.type),

        cls:
          original.type === "強勢突破"
            ? "breakout-strong"
            : original.type === "突破"
              ? "breakout"
              : original.type === "跌破支撐"
                ? "breakdown"
                : "normal"

      };

    }


    /*
      原模型沒有狀態時，
      只根據既有關卡判斷。
    */

    if(
      levels.firstResistance !== null &&
      current >= levels.firstResistance
    ){

      return {

        type:"突破",

        text:"突破第一壓力",

        cls:"breakout"

      };

    }


    if(
      levels.secondSupport !== null &&
      current < levels.secondSupport
    ){

      return {

        type:"跌破支撐",

        text:"跌破第二支撐",

        cls:"breakdown"

      };

    }


    return {

      type:"區間",

      text:"目前位於支撐壓力區間",

      cls:"normal"

    };

  }


  /* =======================================================
     14-7｜單檔最終資料模型
     ======================================================= */

  function buildFinalStock(stock,index){

    const levels =
      completeLevels(stock);


    const trade =
      buildTradePlan({
        ...stock,
        levels
      });


    const breakout =
      buildBreakoutStatus(
        stock,
        levels
      );


    const current =
      getPrice(stock);


    return {

      ...stock,

      rank:
        stock?.rank ??
        index + 1,

      price:
        current,

      levels,

      trade,

      breakout

    };

  }


  /* =======================================================
     14-8｜熱門20全部標準化
     ======================================================= */

  function normalizeHot20Trade(list){

    if(!Array.isArray(list)){
      return [];
    }


    return list
      .slice(0,20)
      .map(
        (stock,index)=>
          buildFinalStock(
            stock,
            index
          )
      );

  }


  /* =======================================================
     14-9｜輸出到全域
     ======================================================= */

  window.V1491_TRADE_MODEL = {

    levels:
      normalizeLevels,

    completeLevels,

    trade:
      buildTradePlan,

    breakout:
      buildBreakoutStatus,

    stock:
      buildFinalStock,

    hot20:
      normalizeHot20Trade

  };


  /* =======================================================
     14-10｜與既有 Hot20 結果串接
     ======================================================= */

  function refreshHot20TradeModel(){

    const source =
      window.V1491_HOT20_RESULT;


    if(!Array.isArray(source)){
      return [];
    }


    const result =
      normalizeHot20Trade(
        source
      );


    window.V1491_HOT20_FINAL =
      result;


    return result;

  }


  window.V1491_REFRESH_HOT20_TRADE =
    refreshHot20TradeModel;


  /* =======================================================
     14-11｜檢查四大關卡
     ======================================================= */

  function verifyLevels(stock){

    const lv =
      completeLevels(stock);


    const result = {

      firstSupport:
        lv.firstSupport,

      secondSupport:
        lv.secondSupport,

      firstResistance:
        lv.firstResistance,

      secondResistance:
        lv.secondResistance

    };


    /*
      檢查順序
    */

    const supportOK =
      lv.firstSupport === null ||
      lv.secondSupport === null ||
      lv.firstSupport <=
      lv.secondSupport;


    const resistanceOK =
      lv.firstResistance === null ||
      lv.secondResistance === null ||
      lv.firstResistance <=
      lv.secondResistance;


    return {

      ...result,

      supportOrderOK:
        supportOK,

      resistanceOrderOK:
        resistanceOK,

      valid:
        supportOK &&
        resistanceOK

    };

  }


  /* =======================================================
     14-12｜檢查交易計畫
     ======================================================= */

  function verifyTrade(stock){

    const final =
      buildFinalStock(
        stock,
        0

  function toNumber(value){

    if(
      value === null ||
      value === undefined ||
      value === ""
    ){

      return null;

    }


    const n =
      Number(
        String(value)
          .replace(/,/g,"")
          .replace(/%/g,"")
          .trim()
      );


    return Number.isFinite(n)
      ? n
      : null;

  }


  /* =========================================================
     17-4｜Hot20 資料標準化
     ========================================================= */

  function normalizeStock(stock,index){

    if(!stock){
      return null;
    }


    const code =
      String(
        stock.code ??
        stock.symbol ??
        stock.stockCode ??
        stock.SecuritiesCompanyCode ??
        ""
      )
      .trim()
      .toUpperCase();


    if(!code){
      return null;
    }


    const name =
      String(
        stock.name ??
        stock.stockName ??
        stock.companyName ??
        stock.SecuritiesCompanyName ??
        code
      ).trim();


    const price =
      toNumber(
        stock.price ??
        stock.close ??
        stock.ClosingPrice ??
        stock.Close
      );


    const volume =
      toNumber(
        stock.volume ??
        stock.tradeVolume ??
        stock.TradeVolume ??
        stock.TradingVolume ??
        stock.Trading_Volume
      );


    return {

      ...stock,

      rank:
        index + 1,

      code,

      name,

      price,

      volume

    };

  }


  /* =========================================================
     17-5｜去除重複股票
     ========================================================= */

  function uniqueStocks(list){

    const map =
      new Map();


    for(
      const item of (
        Array.isArray(list)
          ? list
          : []
      )
    ){

      const stock =
        normalizeStock(
          item,
          map.size
        );


      if(!stock){
        continue;
      }


      /*
        同一股票只保留一筆
      */

      if(
        !map.has(stock.code)
      ){

        map.set(
          stock.code,
          stock
        );

      }

    }


    return [
      ...map.values()
    ]
    .slice(0,20)
    .map(
      (x,i)=>({
        ...x,
        rank:i+1
      })
    );

  }

      "function"
    ){

      try{

          .V1491_TRADE_MODEL
          .hot20(source);

      }catch(err){

          "[V1491] 第十四段交易模型失敗，使用原始資料。",
          err
        );

      }

     17-7｜最終結果儲存
     ========================================================= */

  function commit(list){

    const finalList =
      applyTradeModel(list);


    STATE.lastResult =
      finalList;


    STATE.lastUpdate =
      new Date();


    /*
      統一出口
    */

    window.V1491_HOT20_RESULT =
      finalList;


    window.V1491_HOT20_FINAL =
      finalList;


    window.V1491_LAST_HOT20 =
      finalList;


    return finalList;

  }


  /* =========================================================
     17-8｜最終呈現
     ========================================================= */

  function render(list){

    /*
      優先使用第十二段最終結果 renderer
    */

    if(
      typeof window
        .renderV1491FinalResults ===
      "function"
    ){

            null
          );

      }catch(err){

          "[V1491] 最終結果 renderer 失敗",
          err
        );

    ){

          .renderHot20(list);

      }catch(err){

        console.warn(
          "[V1491] 原 Hot20 renderer 失敗",
          err
        );

      }

    }


    return false;

  }


  /* =========================================================
     17-9｜最終資料流
     ========================================================= */

  async function execute(list){

    if(
      STATE.running
    ){

      console.warn(
        "[V1491] 已有 Hot20 任務正在執行。"
      );

      return STATE.lastResult || [];

    }


    STATE.running =
      true;


    const sequence =
      ++STATE.sequence;


    try{

      const finalList =
        commit(list);


      /*

      */

      if(
        sequence !==
        STATE.sequence
      ){

        return STATE.lastResult || [];

      }


      render(finalList);


      console.log(
        "[V1491] Hot20 最終資料流完成：",
        finalList
      );


      return finalList;

    }finally{

      STATE.running =
        false;

    }

  }

     ========================================================= */

  window.V1491_COMMIT_HOT20 =

<script>
(function V1491_REAL_DATA_VALIDATOR(){

  "use strict";

  const KEY =
    "__V1491_REAL_DATA_VALIDATOR__";


  if(window[KEY]){

    console.warn(
      "[V1491] 第十八段已執行，略過。"
    );

    return;

  }


  window[KEY] = true;


  /* =========================================================
     18-1｜工具
     ========================================================= */

  function num(v){

    if(
      v === null ||
      v === undefined ||
      v === ""
    ){

      return null;

    }


    const n =
      Number(
        String(v)
          .replace(/,/g,"")
          .replace(/%/g,"")
          .trim()
      );


    return Number.isFinite(n)
      ? n
      : null;

  }


  function text(v){

    return String(
      v ?? ""
    ).trim();

  }


  /* =========================================================
     18-2｜驗證單檔
     ========================================================= */

  function validateStock(stock,index=0){

    const errors = [];
    const warnings = [];


    if(!stock){

      errors.push(
        "資料不存在"
      );

      return {

        valid:false,

        errors,

        warnings

      };

    }


    const code =
      text(
        stock.code ??
        stock.symbol ??
        stock.stockCode
      );


    const name =
      text(
        stock.name ??
        stock.stockName
      );


    const price =
      num(
        stock.price ??
        stock.close ??
        stock.ClosingPrice ??
        stock.Close
      );


    const volume =
      num(
        stock.volume ??
        stock.tradeVolume ??
        stock.TradeVolume ??
        stock.TradingVolume
      );


    /* -------------------------------------------------------
       股票代號
       ------------------------------------------------------- */

    if(!code){

      errors.push(
        "缺少股票代號"
      );

    }


    /* -------------------------------------------------------
       股票名稱
       ------------------------------------------------------- */

    if(!name){

      warnings.push(
        `${code || "未知股票"}：缺少股票名稱`
      );

    }


    /* -------------------------------------------------------
       股價
       ------------------------------------------------------- */

    if(
      price === null ||
      price <= 0
    ){

      errors.push(
        `${code || "未知股票"}：沒有有效股價`
      );

    }


    /* -------------------------------------------------------
       成交量
       ------------------------------------------------------- */

    if(
      volume === null
    ){

      warnings.push(
        `${code || "未知股票"}：成交量尚未取得`
      );

    }


    /* -------------------------------------------------------
       四大關卡
       ------------------------------------------------------- */

    const lv =
      stock.levels ||
      {};


    const s1 =
      num(
        lv.firstSupport ??
        lv.support1 ??
        lv.s1
      );


    const s2 =
      num(
        lv.secondSupport ??
        lv.support2 ??
        lv.s2
      );


    const r1 =
      num(
        lv.firstResistance ??
        lv.resistance1 ??
        lv.r1
      );


    const r2 =
      num(
        lv.secondResistance ??
        lv.resistance2 ??
        lv.r2
      );


    if(
      s1 !== null &&
      s2 !== null &&
      s1 > s2
    ){

      errors.push(
        `${code}：支撐順序錯誤`
      );

    }


    if(
      r1 !== null &&
      r2 !== null &&
      r1 > r2
    ){

      errors.push(
        `${code}：壓力順序錯誤`
      );

    }


    /* -------------------------------------------------------
       交易計畫
       ------------------------------------------------------- */

    const trade =
      stock.trade ||
      {};


    const entry =
      num(trade.entry);


    const stop =
      num(trade.stopLoss);


    const tp1 =
      num(trade.takeProfit1);


    const tp2 =
      num(trade.takeProfit2);


    if(entry === null){

      warnings.push(
        `${code}：沒有參考進場價`
      );

    }


    if(stop === null){

      warnings.push(
        `${code}：沒有止損`
      );

    }


    if(tp1 === null){

      warnings.push(
        `${code}：沒有止盈①`
      );

    }


    if(tp2 === null){

      warnings.push(
        `${code}：沒有止盈②`
      );

    }


    return {

      index,

      code,

      name,

      price,

      volume,

      levels:{

        firstSupport:s1,

        secondSupport:s2,

        firstResistance:r1,

        secondResistance:r2

      },

      trade:{

        entry,

        stopLoss:stop,

        takeProfit1:tp1,

        takeProfit2:tp2

      },

      valid:
        errors.length === 0,

      errors,

      warnings

    };

  }


  /* =========================================================
     18-3｜驗證 Hot20
     ========================================================= */

  function validateHot20(list){

    const source =
      Array.isArray(list)
        ? list
        : [];


    const results =
      source
        .slice(0,20)
        .map(
          (x,i)=>
            validateStock(x,i)
        );


    const valid =
      results.filter(
        x => x.valid
      ).length;


    const invalid =
      results.filter(
        x => !x.valid
      ).length;


    return {

      total:
        results.length,

      valid,

      invalid,

      complete:
        results.length === 20,

      results

    };

  }


  /* =========================================================
     18-4｜搜尋實測
     ========================================================= */

  function testSearch(){

    const keywords = [

      "2330",

      "台積電",

      "2409",

      "友達",

      "2426",

      "鼎元"

    ];


    const results = {};


    const search =
      window.V1491_FINAL?.search;


    if(
      typeof search !==
      "function"
    ){

      return {

        available:false,

        results

      };

    }


    for(
      const keyword of keywords
    ){

      try{

        const hit =
          search(keyword);


        results[keyword] = {

          found:
            !!hit,

          code:
            hit?.code ||
            null,

          name:
            hit?.name ||
            null

        };

      }catch(err){

        results[keyword] = {

          found:false,

          error:
            text(
              err?.message ||
              err
            )

        };

      }

    }


    return {

      available:true,

      results

    };

  }


  /* =========================================================
     18-5｜確認 Hot20 是否使用固定清單
     ========================================================= */

  function checkFixedListSeparation(){

    const scanCodes =
      Array.isArray(
        window.SCAN_CODES
      )
        ? window.SCAN_CODES
        : [];


    const hot20 =
      Array.isArray(
        window.V1491_HOT20_RESULT
      )
        ? window.V1491_HOT20_RESULT
        : [];


    if(
      !hot20.length ||
      !scanCodes.length
    ){

      return {

        checked:false,

        separated:true,

        reason:
          "目前沒有足夠資料比較"

      };

    }


    const fixed =
      new Set(
        scanCodes.map(
          x =>
            text(
              typeof x === "string"
                ? x
                : x?.code
            )
        )
      );


    const sameCount =
      hot20.filter(
        x =>
          fixed.has(
            text(x.code)
          )
      ).length;


    return {

      checked:true,

      hot20Count:
        hot20.length,

      sameCount,

      separated:
        sameCount <
        hot20.length

    };

  }


  /* =========================================================
     18-6｜資料時間
     ========================================================= */

  function getDataTime(){

    return {

      now:
        new Date()
          .toISOString(),

      hot20Updated:
        window.V1491_DATA_FLOW_STATE
          ?.lastUpdate
          ?.toISOString?.() ||
        null,

      resultUpdated:
        window.V1491_RESULT
          ?.updatedAt
          ?.toISOString?.() ||
        null

    };

  }


  /* =========================================================
     18-7｜完整驗證
     ========================================================= */

  function run(){

    const hot20 =
      validateHot20(
        window.V1491_HOT20_FINAL ||
        window.V1491_HOT20_RESULT ||
        []
      );


    const search =
      testSearch();


    const separation =
      checkFixedListSeparation();


    const time =
      getDataTime();


    const report = {

      version:
        "V1491",

      hot20,

      search,

      fixedList:
        separation,

      time

    };


    window.V1491_REAL_DATA_REPORT =
      report;


    console.group(
      "%cV1491｜第十八段實際資料驗證",

    );

    );


    console.log(
      "搜尋：",
      search
    );


    console.log(
      "固定清單分離：",
      separation
    );


    console.log(
      "資料時間：",
      time
    );


    console.groupEnd();


    return report;

  }


  /* =========================================================
     18-8｜公開 API
     ========================================================= */

  window.V1491_VALIDATE_REAL_DATA =
    run;


  window.V1491_VALIDATE_STOCK =
    validateStock;


  window.V1491_VALIDATE_HOT20 =
    validateHot20;

    不在載入網頁時自動掃描 Hot20，

  */


  console.log(
    "%cV1491｜第十八段 REAL DATA VALIDATOR 已載入",
    "font-weight:bold"
  );


})();

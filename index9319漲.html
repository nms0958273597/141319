<script>
"use strict";

/* =========================================================
   V1491｜第一段
   搜尋核心
   ---------------------------------------------------------
   支援：
   ① 股票代號
   ② 完整中文名稱
   ③ 部分中文名稱
   ④ 上市
   ⑤ 上櫃
   ⑥ ETF／特殊代號
   ⑦ KNOWN 僅作快速別名，不限制搜尋範圍
   ========================================================= */

const SEARCH_TWSE =
  "https://openapi.twse.com.tw/v1/opendata/t187ap03_L";

const SEARCH_TPEX =
  "https://www.tpex.org.tw/openapi/v1/mopsfin_t187ap03_O";

const $ = id =>
  document.getElementById(id);


/* =========================================================
   基本清理
   ========================================================= */

function cleanSearchValue(value){

  return String(value ?? "")
    .trim();

}


/* =========================================================
   搜尋標準化
   ---------------------------------------------------------
   讓：

   台積電
   台積 電
   台積-電
   台積＿電

   都能視為同一搜尋字串
   ========================================================= */

function normalizeSearchText(value){

  return String(value ?? "")
    .toLowerCase()
    .replace(/[\s　\-－_＿()（）]/g,"")
    .trim();

}


/* =========================================================
   已知快速別名
   ---------------------------------------------------------
   注意：

   KNOWN / ALIAS 只是加速搜尋
   並不是搜尋限制
   ========================================================= */

const SEARCH_KNOWN = {

  "1301":"台塑",
  "1303":"南亞",
  "1326":"台化",
  "2002":"中鋼",

  "2303":"聯電",
  "2308":"台達電",
  "2312":"金寶",
  "2313":"華通",
  "2317":"鴻海",

  "2330":"台積電",
  "2367":"燿華",

  "2409":"友達",

  "auo":"2409",

  "鼎元":"2426",

  "強茂":"2481",
  "裕民":"2606",
  "長榮航":"2618",

  "中信金":"2891",

  "雙鴻":"3324",
  "群創":"3481",

  "日月光":"3711",

  "元大台灣50正2":"00631L",

  "群益臺灣加權正2":"00685L",

};


/* =========================================================
   搜尋狀態
   ========================================================= */

const SEARCH_STATE = {

  universe:null,

  loading:false,

  promise:null,

  searchSequence:0

};


/* =========================================================
   API JSON
   ========================================================= */

async function searchFetchJSON(

  url,
  timeout=12000

){

  const controller =
    new AbortController();

  const timer =
    setTimeout(
      ()=>controller.abort(),
      timeout
    );

  try{

    const response =
      await fetch(
        url,
        {
          method:"GET",

          headers:{
            "Accept":
              "application/json"
          },

          signal:
            controller.signal
        }
      );

    if(!response.ok){

      throw new Error(
        `HTTP ${response.status}`
      );

    }

    return await response.json();

  }catch(error){

    if(
      error?.name ===
      "AbortError"
    ){

      throw new Error(
        "搜尋資料服務逾時"
      );

    }

    throw error;

  }finally{

    clearTimeout(timer);

  }

}


/* =========================================================
   解析上市資料
   ========================================================= */

function parseTWSESearchRows(data){

  const rows =
    Array.isArray(data)
      ? data
      : Array.isArray(data?.data)
        ? data.data
        : [];

  return rows
    .map(row=>{

      const code =
        String(
          row["公司代號"] ??
          row["公司代碼"] ??
          row["證券代號"] ??
          row["Code"] ??
          ""
        ).trim();

      const name =
        String(
          row["公司簡稱"] ??
          row["公司名稱"] ??
          row["證券名稱"] ??
          row["Name"] ??
          ""
        ).trim();

      return {

        code,

        name,

        market:"TWSE"

      };

    })
    .filter(
      x =>
        x.code &&
        x.name
    );

}


/* =========================================================
   解析上櫃資料
   ========================================================= */

function parseTPEXSearchRows(data){

  const rows =
    Array.isArray(data)
      ? data
      : Array.isArray(data?.data)
        ? data.data
        : [];

  return rows
    .map(row=>{

      const code =
        String(
          row["公司代號"] ??
          row["公司代碼"] ??
          row["證券代號"] ??
          row["Code"] ??
          ""
        ).trim();

      const name =
        String(
          row["公司簡稱"] ??
          row["公司名稱"] ??
          row["證券名稱"] ??
          row["Name"] ??
          ""
        ).trim();

      return {

        code,

        name,

        market:"TPEx"

      };

    })
    .filter(
      x =>
        x.code &&
        x.name
    );

}


/* =========================================================
   建立搜尋宇宙
   ---------------------------------------------------------
   重點：

   不再只使用 KNOWN

   會嘗試：

   TWSE
   +
   TPEx
   +
   KNOWN

   ========================================================= */

async function buildSearchUniverse(){

  if(
    SEARCH_STATE.universe
  ){

    return SEARCH_STATE.universe;

  }


  if(
    SEARCH_STATE.promise
  ){

    return SEARCH_STATE.promise;

  }


  SEARCH_STATE.promise =
    (async()=>{

      const result = [];

      const codeMap =
        new Map();


      /* ---------------------------------------------
         先放 KNOWN
         --------------------------------------------- */

      Object.entries(
        SEARCH_KNOWN
      ).forEach(
        ([code,name])=>{

          codeMap.set(
            code,
            {
              code,
              name,
              market:"KNOWN"
            }
          );

        }
      );


      /* ---------------------------------------------
         上市
         --------------------------------------------- */

      try{

        const data =
          await searchFetchJSON(
            SEARCH_TWSE
          );

        const rows =
          parseTWSESearchRows(
            data
          );

        rows.forEach(
          item=>{

            if(
              !codeMap.has(
                item.code
              )
            ){

              codeMap.set(
                item.code,
                item
              );

            }

          }
        );

      }catch(error){

        console.warn(
          "TWSE 搜尋清單取得失敗",
          error
        );

      }


      /* ---------------------------------------------
         上櫃
         --------------------------------------------- */

      try{

        const data =
          await searchFetchJSON(
            SEARCH_TPEX
          );

        const rows =
          parseTPEXSearchRows(
            data
          );

        rows.forEach(
          item=>{

            if(
              !codeMap.has(
                item.code
              )
            ){

              codeMap.set(
                item.code,
                item
              );

            }

          }
        );

      }catch(error){

        console.warn(
          "TPEx 搜尋清單取得失敗",
          error
        );

      }


      /* ---------------------------------------------
         ALIAS 對應也補進去
         --------------------------------------------- */

      Object.entries(
        SEARCH_ALIAS
      ).forEach(
        ([name,code])=>{

          if(
            !codeMap.has(code)
          ){

            codeMap.set(
              code,
              {
                code,
                name:
                  SEARCH_KNOWN[code] ||
                  name,

                market:"ALIAS"

              }
            );

          }

        }
      );


      result.push(
        ...codeMap.values()
      );


      SEARCH_STATE.universe =
        result;

      return result;

    })();


  try{

    return await
      SEARCH_STATE.promise;

  }finally{

    SEARCH_STATE.promise =
      null;

  }

}


/* =========================================================
   找股票
   ========================================================= */

async function findSearchStock(

  rawValue

){

  const raw =
    cleanSearchValue(
      rawValue
    );

  if(!raw){

    return null;

  }


  const q =
    normalizeSearchText(
      raw
    );


  /* ---------------------------------------------
     ① 先查 ALIAS
     --------------------------------------------- */

  const aliasCode =
    SEARCH_ALIAS[raw] ??
    SEARCH_ALIAS[q];


  if(aliasCode){

    return {

      code:
        aliasCode,

      name:
        SEARCH_KNOWN[
          aliasCode
        ] ||
        raw,

      market:
        "ALIAS"

    };

  }


  /* ---------------------------------------------
     ② 取得完整搜尋宇宙
     --------------------------------------------- */

  const universe =
    await buildSearchUniverse();


  /* ---------------------------------------------
     ③ 完整代號
     --------------------------------------------- */

  const exactCode =
    universe.find(
      item =>
        normalizeSearchText(
          item.code
        ) === q
    );


  if(exactCode){

    return exactCode;

  }


  /* ---------------------------------------------
     ④ 完整中文名稱
     --------------------------------------------- */

  const exactName =
    universe.find(
      item =>
        normalizeSearchText(
          item.name
        ) === q
    );


  if(exactName){

    return exactName;

  }


  /* ---------------------------------------------
     ⑤ 中文部分名稱
     --------------------------------------------- */

  const partialName =
    universe.find(
      item =>
        normalizeSearchText(
          item.name
        ).includes(q)
    );


  if(partialName){

    return partialName;

  }


  /* ---------------------------------------------
     ⑥ 代號部分搜尋
     --------------------------------------------- */

  const partialCode =
    universe.find(
      item =>
        normalizeSearchText(
          item.code
        ).includes(q)
    );


  if(partialCode){

    return partialCode;

  }


  /* ---------------------------------------------
     ⑦ 最後 KNOWN 備援
     --------------------------------------------- */

  if(
    SEARCH_KNOWN[raw]
  ){

    return {

      code:raw,

      name:
        SEARCH_KNOWN[raw],

      market:"KNOWN"

    };

  }


  return null;

}


/* =========================================================
   顯示搜尋候選
   ========================================================= */

async function showSearchCandidates(){

  const input =
    $("searchInput");

  const resultBox =
    $("searchResults");

  if(
    !input ||
    !resultBox
  ){

    return;

  }


  const raw =
    cleanSearchValue(
      input.value
    );


  if(
    raw.length < 1
  ){

    resultBox.innerHTML =
      "";

    return;

  }


  const sequence =
    ++SEARCH_STATE.searchSequence;


  resultBox.innerHTML =
    `<div class="loadingBox">
      正在搜尋…
    </div>`;


  try{

    const universe =
      await buildSearchUniverse();


    if(
      sequence !==
      SEARCH_STATE.searchSequence
    ){

      return;

    }


    const q =
      normalizeSearchText(
        raw
      );


    const matches =
      universe
        .filter(
          item => {

            const code =
              normalizeSearchText(
                item.code
              );

            const name =
              normalizeSearchText(
                item.name
              );

            return (

              code.includes(q) ||

              name.includes(q)

            );

          }
        )
        .slice(0,10);


    if(
      !matches.length
    ){

      resultBox.innerHTML =
        `<div class="empty">
          找不到符合的股票／ETF
        </div>`;

      return;

    }


    resultBox.innerHTML =
      matches
        .map(
          item => `

            <button
              class="searchResult"
              data-search-code="${esc(
                item.code
              )}"
            >

              <b>
                ${esc(item.code)}
                ｜${esc(item.name)}
              </b>

              <span>
                ${esc(
                  item.market ||
                  "市場"
                )}
              </span>

            </button>

          `
        )
        .join("");


    resultBox
      .querySelectorAll(
        "[data-search-code]"
      )
      .forEach(
        button => {

          button.addEventListener(
            "click",
            ()=>{

              const code =
                button.dataset.searchCode;

              resultBox.innerHTML =
                "";

              if(
                typeof searchStock ===
                "function"
              ){

                searchStock(
                  code
                );

              }

            }
          );

        }
      );

  }catch(error){

    console.warn(
      "搜尋候選失敗",
      error
    );

    resultBox.innerHTML =
      `<div class="empty">
        搜尋資料暫時無法取得
      </div>`;

  }

}


/* =========================================================
   第一段自我檢查
   ========================================================= */

async function verifySearchCore(){

  const tests = [

    ["2330","台積電"],

    ["2409","友達"],

    ["2426","鼎元"],

    ["友達","2409"],

    ["鼎元","2426"]

  ];


  const result = [];


  for(
    const [input,expected]
    of tests
  ){

    try{

      const stock =
        await findSearchStock(
          input
        );


      result.push({

        input,

        result:
          stock
            ? `${stock.code}｜${stock.name}`
            : "找不到",

        ok:
          stock &&
          (
            stock.code ===
              expected ||

            stock.name ===
              expected
          )

      });

    }catch(error){

      result.push({

        input,

        result:
          error.message,

        ok:false

      });

    }

  }


  console.table(
    result
  );


  return result;

}

<script>

/* =========================================================
   【2-1】熱門20掃描狀態
   ========================================================= */

const HOT20_STATE = {
  running: false,
  sequence: 0,
  tradingDate: null,
  stocks: [],
  errors: []
};


/* =========================================================
   【2-2】取得台灣日期
   ========================================================= */

function hot20TaiwanDate(offsetDays = 0){

  const now = new Date();

  const utc =
    now.getTime() +
    now.getTimezoneOffset() * 60000;

  const tw =
    new Date(utc + 8 * 60 * 60000);

  tw.setDate(tw.getDate() + offsetDays);

  const y = tw.getFullYear();
  const m = String(tw.getMonth() + 1).padStart(2,"0");
  const d = String(tw.getDate()).padStart(2,"0");

  return `${y}${m}${d}`;
}


/* =========================================================
   【2-3】熱門20資料來源
   優先使用 TWSE 官方資料
   ========================================================= */

const HOT20_ENDPOINTS = [

  /* TWSE 官方 OpenAPI */
  date =>
    `https://openapi.twse.com.tw/v1/exchangeReport/MI_INDEX20?date=${date}`,

  /* TWSE 官方歷史市場資料 */
  date =>
    `https://www.twse.com.tw/exchangeReport/MI_INDEX20?response=json&date=${date}`

];


/* =========================================================
   【2-4】通用 JSON 取得
   ========================================================= */

async function hot20FetchJSON(url){

  const controller = new AbortController();

  const timer = setTimeout(() => {
    controller.abort();
  }, 15000);

  try{

    const res = await fetch(url, {
      method: "GET",
      cache: "no-store",
      signal: controller.signal,
      headers: {
        "Accept": "application/json,text/plain,*/*"
      }
    });

    if(!res.ok){
      throw new Error(`HTTP ${res.status}`);
    }

    const text = await res.text();

    if(!text){
      throw new Error("回傳資料為空");
    }

    try{
      return JSON.parse(text);
    }catch{

      /*
       * 某些市場端點可能回傳 JSONP / 非標準內容
       * 嘗試清理最外層
       */
      const clean =
        text
          .replace(/^\uFEFF/, "")
          .trim();

      return JSON.parse(clean);
    }

  }catch(err){

    if(err?.name === "AbortError"){
      throw new Error("行情服務逾時");
    }

    throw err;

  }finally{

    clearTimeout(timer);

  }

}


/* =========================================================
   【2-5】數字轉換
   ========================================================= */

function hot20Number(value){

  if(
    value === null ||
    value === undefined ||
    value === ""
  ){
    return null;
  }

  if(typeof value === "number"){
    return Number.isFinite(value) ? value : null;
  }

  const n =
    Number(
      String(value)
        .replace(/,/g,"")
        .replace(/%/g,"")
        .trim()
    );

  return Number.isFinite(n) ? n : null;
}


/* =========================================================
   【2-6】取得欄位
   ========================================================= */

function hot20Field(row, keys){

  if(!row) return null;

  for(const key of keys){

    if(
      Object.prototype.hasOwnProperty.call(row,key) &&
      row[key] !== null &&
      row[key] !== undefined &&
      row[key] !== ""
    ){
      return row[key];
    }

  }

  return null;
}


/* =========================================================
   【2-7】解析 TWSE 熱門20資料
   ========================================================= */

function parseHot20Rows(data){

  let rows = [];

  /*
   * OpenAPI 常見格式：
   * [
   *   {
   *     Code,
   *     Name,
   *     TradeVolume,
   *     ClosingPrice
   *   }
   * ]
   */

  if(Array.isArray(data)){
    rows = data;
  }

  /*
   * 傳統 TWSE JSON：
   * data.data
   */

  else if(
    data &&
    Array.isArray(data.data)
  ){
    rows = data.data;
  }

  /*
   * 某些資料格式：
   * data.tables[0].data
   */

  else if(
    data &&
    Array.isArray(data.tables) &&
    data.tables[0] &&
    Array.isArray(data.tables[0].data)
  ){
    rows = data.tables[0].data;
  }

  if(!rows.length){
    return [];
  }


  const result = [];

  for(const row of rows){

    let code = "";
    let name = "";
    let price = null;
    let volume = null;

    /*
     * -----------------------------------------
     * 物件格式
     * -----------------------------------------
     */

    if(
      row &&
      typeof row === "object" &&
      !Array.isArray(row)
    ){

      code = String(
        hot20Field(row,[
          "Code",
          "code",
          "股票代號",
          "證券代號",
          "Symbol",
          "symbol"
        ]) || ""
      ).trim();

      name = String(
        hot20Field(row,[
          "Name",
          "name",
          "股票名稱",
          "證券名稱"
        ]) || ""
      ).trim();

      volume = hot20Number(
        hot20Field(row,[
          "TradeVolume",
          "Trading_Volume",
          "TradingVolume",
          "成交股數",
          "成交量",
          "volume"
        ])
      );

      price = hot20Number(
        hot20Field(row,[
          "ClosingPrice",
          "Close",
          "Closing_Price",
          "收盤價",
          "成交價",
          "price"
        ])
      );

    }

    /*
     * -----------------------------------------
     * 陣列格式
     * -----------------------------------------
     */

    else if(Array.isArray(row)){

      /*
       * TWSE MI_INDEX 常見欄位：
       *
       * 0 代號
       * 1 名稱
       * ...
       * 2 成交股數 / 成交量
       * ...
       */

      code = String(row[0] ?? "").trim();
      name = String(row[1] ?? "").trim();

      /*
       * 先尋找所有可能的數字欄位
       */

      const nums =
        row.map((v,index)=>({
          index,
          value:hot20Number(v)
        }));

      /*
       * 成交量通常在第 2 欄
       */

      volume =
        hot20Number(row[2]) ??
        hot20Number(row[3]) ??
        null;

      /*
       * 收盤價通常會出現在後段欄位
       * 找不到時再從後方尋找
       */

      if(row.length > 6){

        for(let i=row.length-1;i>=2;i--){

          const n = hot20Number(row[i]);

          if(
            n !== null &&
            n > 0
          ){

            /*
             * 避免把成交量當成股價
             */

            if(
              volume === null ||
              n !== volume
            ){
              price = n;
              break;
            }

          }

        }

      }

    }


    /*
     * -----------------------------------------
     * 基本資料過濾
     * -----------------------------------------
     */

    code =
      String(code)
        .replace(/\s/g,"")
        .trim();

    name =
      String(name)
        .replace(/\s+/g," ")
        .trim();


    /*
     * 只保留正常台股代號
     */

    if(!/^\d{4,6}[A-Z]?$/.test(code)){
      continue;
    }

    /*
     * 必須有成交量
     */

    if(
      volume === null ||
      !Number.isFinite(volume) ||
      volume <= 0
    ){
      continue;
    }


    result.push({

      code,

      name,

      price,

      volume,

      rank: result.length + 1

    });

  }

  return result;

}


/* =========================================================
   【2-8】清理熱門20資料
   ========================================================= */

function normalizeHot20Stocks(rows){

  const map = new Map();

  for(const item of rows){

    if(!item?.code) continue;

    const code =
      String(item.code).trim();

    if(map.has(code)) continue;

    map.set(code,{
      code,
      name:item.name || code,
      price:
        Number.isFinite(item.price)
          ? item.price
          : null,
      volume:
        Number.isFinite(item.volume)
          ? item.volume
          : 0
    });

  }

  /*
   * 按成交量由大到小
   */

  return [...map.values()]
    .sort((a,b)=>b.volume-a.volume)
    .slice(0,20)
    .map((x,i)=>({
      ...x,
      rank:i+1
    }));

}


/* =========================================================
   【2-9】取得指定交易日熱門20
   ========================================================= */

async function fetchHot20ByDate(date){

  let lastError = null;

  for(const makeURL of HOT20_ENDPOINTS){

    const url = makeURL(date);

    try{

      const data =
        await hot20FetchJSON(url);

      const rows =
        parseHot20Rows(data);

      const stocks =
        normalizeHot20Stocks(rows);

      if(stocks.length >= 5){

        return {
          date,
          stocks,
          source:url
        };

      }

      lastError =
        new Error(
          `資料筆數不足：${stocks.length}`
        );

    }catch(err){

      lastError = err;

    }

  }

  throw (
    lastError ||
    new Error("熱門20資料取得失敗")
  );

}


/* =========================================================
   【2-10】尋找最近交易日
   ========================================================= */

async function fetchLatestHot20(){

  /*
   * 最多往前找 7 個日曆日
   * 避免週末、國定假日造成空資料
   */

  let lastError = null;

  for(let offset=0;offset<=7;offset++){

    const date =
      hot20TaiwanDate(-offset);

    try{

      const result =
        await fetchHot20ByDate(date);

      if(
        result &&
        Array.isArray(result.stocks) &&
        result.stocks.length
      ){

        return result;

      }

    }catch(err){

      lastError = err;

    }

  }

  throw(
    lastError ||
    new Error("找不到最近交易日熱門資料")
  );

}


/* =========================================================
   【2-11】取得即時股價
   不寫死任何價格
   ========================================================= */

async function refreshHot20Prices(stocks){

  if(!Array.isArray(stocks)){
    return [];
  }

  /*
   * 如果原本 V1491 已經有 getQuote()
   * 優先使用原本行情函式。
   */

  if(typeof getQuote === "function"){

    const results =
      await Promise.all(
        stocks.map(async stock=>{

          try{

            const q =
              await getQuote(stock.code);

            const price =
              hot20Number(
                q?.price ??
                q?.close ??
                q?.ClosingPrice
              );

            return {
              ...stock,
              price:
                price !== null
                  ? price
                  : stock.price
            };

          }catch{

            return stock;

          }

        })
      );

    return results;

  }

  return stocks;

}

async function scanHot20(){

  /*

   */

  if(HOT20_STATE.running){

    if(typeof toast === "function"){
      toast("🔥 熱門20正在掃描中，請稍候");
    }

    return;

  }


  HOT20_STATE.running = true;

  HOT20_STATE.sequence++;

  const sequence =
    HOT20_STATE.sequence;

  HOT20_STATE.errors = [];

  const btn =
    document.getElementById("hot20ScanBtn");

  const originalText =
    btn?.textContent ||
    "🔥 掃描熱門20檔";


  if(btn){

    btn.disabled = true;

    btn.textContent =
      "⏳ 正在抓取熱門20...";

  }


  try{

    /*
     * -----------------------------------------
     * ① 抓最近交易日
     * -----------------------------------------
     */

    const hot =
      await fetchLatestHot20();


    /*
     * 如果過程中又產生新的掃描
     * 舊結果不准覆蓋新結果
     */

    if(sequence !== HOT20_STATE.sequence){
      return;
    }


    HOT20_STATE.tradingDate =
      hot.date;

    HOT20_STATE.stocks =
      hot.stocks;


    /*
     * -----------------------------------------
     * ② 更新即時價格
     * -----------------------------------------
     */

    const stocks =
      await refreshHot20Prices(
        hot.stocks
      );


    HOT20_STATE.stocks =
      stocks;


    /*
     * -----------------------------------------
     * ③ 顯示熱門20
     * -----------------------------------------
     */

    if(typeof renderHot20 === "function"){

      await renderHot20(
        stocks,
        hot.date
      );

    }
    else if(
      typeof renderScanResults === "function"
    ){

      await renderScanResults(
        stocks,
        `🔥 動態熱門20｜${hot.date}`
      );

    }
    else{

      /*
       * 如果原版沒有專用 renderer，
       * 嘗試放入現有結果容器
       */

      const container =
        document.querySelector(
          "#results,#scanResults,#resultList"
        );

      if(container){

        container.innerHTML =
          stocks.map((s,i)=>`
            <div class="hot20-item">
              <b>${i+1}. ${s.code}</b>
              <span>${s.name}</span>
              <span>
                ${s.price == null ? "--" : s.price}
              </span>
              <small>
                成交量 ${Number(s.volume||0).toLocaleString()}
              </small>
            </div>
          `).join("");

      }

    }


    /*
     * -----------------------------------------
     * ④ 成功提示
     * -----------------------------------------
     */

    if(typeof toast === "function"){

      toast(
        `🔥 已更新熱門20｜交易日 ${hot.date}`
      );

    }


  }catch(err){

    HOT20_STATE.errors.push(
      err?.message ||
      String(err)
    );


    console.error(
      "[V1491 HOT20]",
      err
    );


    /*
     * 使用者看到明確錯誤
     */

    const message =
      err?.message ||
      "未知錯誤";


    if(typeof toast === "function"){

      toast(
        `⚠️ 熱門20檔掃描失敗：${message}`
      );

    }

    else{

      alert(
        `⚠️ 熱門20檔掃描失敗\n${message}`
      );

    }


  }finally{

    HOT20_STATE.running = false;

    if(btn){

      btn.disabled = false;

      btn.textContent =
        originalText;

    }

  }

}

function bindHot20Button(){

  const btn =
    document.getElementById(
      "hot20ScanBtn"
    );

  if(!btn){
    return false;
  }


  /*

  if(btn.dataset.hot20Bound === "1"){

  btn.addEventListener(
    "click",
    scanHot20,
    {
      passive:true
    }
  );


  return true;

function verifyHot20Core(){

  const checks = {

    state:
      typeof HOT20_STATE === "object",

    endpoint:
      Array.isArray(HOT20_ENDPOINTS) &&
      HOT20_ENDPOINTS.length >= 1,

    fetch:

    parser:

    normalizer:
      typeof normalizeHot20Stocks === "function",

    latest:
      typeof fetchLatestHot20 === "function",

    scanner:
      typeof scanHot20 === "function"

  };

  console.table(checks);

  return Object.values(checks)
    .every(Boolean);

}

</script><!-- =========================================================
     V1491｜第三段
     四大關卡：第一支撐／第二支撐／第一壓力／第二壓力
     ========================================================= -->

<script>

/* =========================================================
   【3-1】安全數字
   ========================================================= */

function levelNum(v, fallback = null){

  const n = Number(v);

  return Number.isFinite(n)
    ? n
    : fallback;

}


/* =========================================================
   【3-2】價格格式化
   ========================================================= */

function levelMoney(v){

  const n = levelNum(v);

  if(n === null){
    return "--";
  }

  return n >= 100
    ? n.toFixed(2)
    : n.toFixed(2);

}


/* =========================================================
   【3-3】依股價決定最小跳動單位
   ========================================================= */

function getTickSize(price){

  const p = levelNum(price);

  if(p === null || p <= 0){
    return 0.01;
  }

  if(p < 5){
    return 0.01;
  }

  if(p < 15){
    return 0.05;
  }

  if(p < 50){
    return 0.1;
  }

  if(p < 150){
    return 0.5;
  }

  if(p < 1000){
    return 1;
  }

  return 5;

}


/* =========================================================
   【3-4】價格合法化
   ========================================================= */

function normalizeLevel(price){

  const p = levelNum(price);

  if(p === null || p <= 0){
    return null;
  }

  const tick =
    getTickSize(p);

  return Math.round(p / tick) * tick;

}


/* =========================================================
   【3-5】從歷史價格建立支撐／壓力候選
   ========================================================= */

function buildLevelCandidates(history, price){

  const p = levelNum(price);

  if(
    p === null ||
    !Array.isArray(history) ||
    !history.length
  ){
    return {
      supports:[],
      resistances:[]
    };
  }


  const supports = [];
  const resistances = [];


  for(const item of history){

    const close =
      levelNum(
        item?.close ??
        item?.Close ??
        item?.closing_price
      );

    const high =
      levelNum(
        item?.high ??
        item?.High
      );

    const low =
      levelNum(
        item?.low ??
        item?.Low
      );

    if(low !== null && low < p){

      supports.push(low);

    }

    if(close !== null && close < p){

      supports.push(close);

    }

    if(high !== null && high > p){

      resistances.push(high);

    }

    if(close !== null && close > p){

      resistances.push(close);

    }

  }


  return {

    supports:
      [...new Set(
        supports
          .map(normalizeLevel)
          .filter(v=>v !== null)
      )],

    resistances:
      [...new Set(
        resistances
          .map(normalizeLevel)
          .filter(v=>v !== null)
      )]

  };

}


/* =========================================================
   【3-6】聚集價格區間
   ========================================================= */

function clusterLevels(levels, price){

  if(!Array.isArray(levels)){
    return [];
  }

  const p =
    levelNum(price);

  if(p === null){
    return [];
  }


  const tick =
    getTickSize(p);

  /*
   * 不同價格的股票使用不同容許區間。
   */

  const tolerance =
    Math.max(
      tick * 3,
      p * 0.008
    );


  const sorted =
    levels
      .filter(v=>Number.isFinite(v))
      .sort((a,b)=>a-b);


  const groups = [];


  for(const value of sorted){

    const last =
      groups[groups.length - 1];

    if(
      !last ||
      Math.abs(value - last.center) > tolerance
    ){

      groups.push({

        values:[value],

        center:value,

        touches:1

      });

    }else{

      last.values.push(value);

      last.center =
        last.values.reduce(
          (sum,v)=>sum+v,
          0
        ) /
        last.values.length;

      last.touches++;

    }

  }


  return groups;

}


/* =========================================================
   【3-7】計算四大關卡
   ========================================================= */

function calculateFourLevels(stock, history = []){

  const price =
    levelNum(
      stock?.price ??
      stock?.close ??
      stock?.ClosingPrice
    );


  if(price === null){

    return {

      price:null,

      firstSupport:null,
      secondSupport:null,

      firstResistance:null,
      secondResistance:null

    };

  }


  /*
   * -----------------------------------------
   * 歷史資料候選
   * -----------------------------------------
   */

  const candidates =
    buildLevelCandidates(
      history,
      price
    );


  /*
   * -----------------------------------------
   * 支撐
   * -----------------------------------------
   */

  let supportGroups =
    clusterLevels(
      candidates.supports,
      price
    );


  /*
   * 從靠近目前價格的位置開始找
   */

  supportGroups =
    supportGroups
      .filter(g=>g.center < price)
      .sort(
        (a,b)=>
          Math.abs(price-a.center) -
          Math.abs(price-b.center)
      );


  /*
   * -----------------------------------------
   * 壓力
   * -----------------------------------------
   */

  let resistanceGroups =
    clusterLevels(
      candidates.resistances,
      price
    );


  resistanceGroups =
    resistanceGroups
      .filter(g=>g.center > price)
      .sort(
        (a,b)=>
          Math.abs(a.center-price) -
          Math.abs(b.center-price)
      );


  /*
   * -----------------------------------------
   * 如果歷史資料不足
   * 使用 ATR / 百分比建立動態候選
   *
   * 注意：
   * 這不是寫死股票價格。
   * 會跟著當前股價變動。
   * -----------------------------------------
   */

  const atr =
    levelNum(
      stock?.atr ??
      stock?.ATR
    );


  const volatility =
    atr !== null && atr > 0
      ? atr
      : price * 0.02;


  if(!supportGroups.length){

    supportGroups = [

      {
        center:
          normalizeLevel(
            price - volatility
          ),
        touches:1
      },

      {
        center:
          normalizeLevel(
            price - volatility * 2
          ),
        touches:1
      }

    ];

  }


  if(!resistanceGroups.length){

    resistanceGroups = [

      {
        center:
          normalizeLevel(
            price + volatility
          ),
        touches:1
      },

      {
        center:
          normalizeLevel(
            price + volatility * 2
          ),
        touches:1
      }

    ];

  }


  /*
   * -----------------------------------------
   * 最終四大關卡
   * -----------------------------------------
   */

  const firstSupport =
    supportGroups[0]?.center ??
    null;

  const secondSupport =
    supportGroups[1]?.center ??
    null;

  const firstResistance =
    resistanceGroups[0]?.center ??
    null;

  const secondResistance =
    resistanceGroups[1]?.center ??
    null;


  return {

    price,

    firstSupport,

    secondSupport,

    firstResistance,

    secondResistance,

    /*
     * 相容舊版欄位
     */

    support1:firstSupport,
    support2:secondSupport,

    resistance1:firstResistance,
    resistance2:secondResistance

  };

}


/* =========================================================
   【3-8】建立熱門20單檔分析資料
   ========================================================= */

async function buildHot20Analysis(stock){

  if(!stock?.code){
    return null;
  }


  const price =
    levelNum(stock.price);


  if(price === null){

    return {

      ...stock,

      levels:
        calculateFourLevels(
          stock,
          []
        )

    };

  }


  let history = [];


  /*
   * 優先使用 V1491 原本的歷史行情函式
   */

  try{

    if(
      typeof getHistory === "function"
    ){

      const data =
        await getHistory(
          stock.code,
          60
        );

      if(Array.isArray(data)){
        history = data;
      }

    }

  }catch(err){

    console.warn(
      `[V1491] ${stock.code} 歷史資料取得失敗`,
      err
    );

  }


  /*
   * 如果原版使用 fetchHistory
   */

  if(
    !history.length &&
    typeof fetchHistory === "function"
  ){

    try{

      const data =
        await fetchHistory(
          stock.code,
          60
        );

      if(Array.isArray(data)){
        history = data;
      }

    }catch(err){

      console.warn(
        `[V1491] ${stock.code} fetchHistory失敗`,
        err
      );

    }

  }


  const levels =
    calculateFourLevels(
      stock,
      history
    );


  return {

    ...stock,

    history,

    levels,

    /*
     * 直接攤平，
     * 方便舊版 renderer 使用
     */

    firstSupport:
      levels.firstSupport,

    secondSupport:
      levels.secondSupport,

    firstResistance:
      levels.firstResistance,

    secondResistance:
      levels.secondResistance

  };

}


/* =========================================================
   【3-9】熱門20全部分析
   ========================================================= */

async function analyzeHot20Stocks(stocks){

  if(!Array.isArray(stocks)){
    return [];
  }


  const results = [];


  /*
   * 一次不要無限制打 API。
   * 每批 4 檔。
   */

  const batchSize = 4;


  for(
    let i=0;
    i<stocks.length;
    i+=batchSize
  ){

    const batch =
      stocks.slice(
        i,
        i + batchSize
      );


    const analyzed =
      await Promise.all(
        batch.map(
          buildHot20Analysis
        )
      );


    for(const item of analyzed){

      if(item){
        results.push(item);
      }

    }

  }


  return results;

}

     V1491｜第四段
     進場／止損／止盈／突破／風險報酬
     ========================================================= -->

<script>

/* =========================================================
   【4-1】安全取得價格
   ========================================================= */

function tradePrice(v){

  const n = Number(v);

  return Number.isFinite(n) && n > 0
    ? n
    : null;

}


/* =========================================================
   【4-2】依股價與波動計算交易方案
   ========================================================= */

function buildTradePlan(stock){

  const price =
    tradePrice(
      stock?.price ??
      stock?.close
    );

  const lv =
    stock?.levels || {};

  if(price === null){

    return {

      status:"資料不足",

      entry:null,
      stopLoss:null,

      takeProfit1:null,
      takeProfit2:null,

      risk:null,
      reward1:null,
      reward2:null,

      rr1:null,
      rr2:null

    };

  }


  const s1 =
    tradePrice(
      lv.firstSupport ??
      lv.support1
    );

  const s2 =
    tradePrice(
      lv.secondSupport ??
      lv.support2
    );

  const r1 =
    tradePrice(
      lv.firstResistance ??
      lv.resistance1
    );

  const r2 =
    tradePrice(
      lv.secondResistance ??
      lv.resistance2
    );


  /*
   * ---------------------------------------------------------
   * 進場
   *
   * 以目前價格作為分析基準。
   * 不固定任何股票價格。
   * ---------------------------------------------------------
   */

  const entry = price;


  /*
   * ---------------------------------------------------------
   * 止損
   *
   * 優先使用第二支撐下方。
   * 若資料不足則使用第一支撐。
   * ---------------------------------------------------------
   */

  let stopLoss = null;

  if(s2 !== null && s2 < price){

    stopLoss = s2;

  }else if(s1 !== null && s1 < price){

    stopLoss = s1;

  }else{

    /*
     * 完全沒有支撐資料時，
     * 使用價格波動百分比建立防守線。
     */

    stopLoss =
      price * 0.95;

  }


  /*
   * ---------------------------------------------------------
   * 止盈
   * ---------------------------------------------------------
   */

  let takeProfit1 = null;
  let takeProfit2 = null;


  if(r1 !== null && r1 > price){

    takeProfit1 = r1;

  }else{

    takeProfit1 =
      price * 1.05;

  }


  if(r2 !== null && r2 > price){

    takeProfit2 = r2;

  }else{

    takeProfit2 =
      price * 1.10;

  }


  /*
   * ---------------------------------------------------------
   * 風險
   * ---------------------------------------------------------
   */

  const risk =
    entry - stopLoss;


  const reward1 =
    takeProfit1 - entry;


  const reward2 =
    takeProfit2 - entry;


  const rr1 =
    risk > 0
      ? reward1 / risk
      : null;


  const rr2 =
    risk > 0
      ? reward2 / risk
      : null;


  /*
   * ---------------------------------------------------------
   * 狀態
   * ---------------------------------------------------------
   */

  let status = "觀察";


  if(
    r1 !== null &&
    price >= r1
  ){

    status = "突破壓力";

  }
  else if(
    s1 !== null &&
    price <= s1
  ){

    status = "接近支撐";

  }
  else if(
    s1 !== null &&
    r1 !== null &&
    price > s1 &&
    price < r1
  ){

    status = "區間整理";

  }


  return {

    status,

    entry,

    stopLoss,

    takeProfit1,
    takeProfit2,

    risk,
    reward1,
    reward2,

    rr1,
    rr2

  };

}


/* =========================================================
   【4-3】突破判斷
   ========================================================= */

function detectBreakout(stock){

  const price =
    tradePrice(stock?.price);

  const lv =
    stock?.levels || {};


  if(price === null){

    return {

      type:"資料不足",
      strength:0,
      text:"目前缺少有效價格"

    };

  }


  const r1 =
    tradePrice(
      lv.firstResistance ??
      lv.resistance1
    );

  const r2 =
    tradePrice(
      lv.secondResistance ??
      lv.resistance2
    );


  const s1 =
    tradePrice(
      lv.firstSupport ??
      lv.support1
    );


  if(
    r2 !== null &&
    price > r2
  ){

    return {

      type:"強勢突破",

      strength:3,

      text:
        "價格已突破第二壓力"

    };

  }


  if(
    r1 !== null &&
    price > r1
  ){

    return {

      type:"突破",

      strength:2,

      text:
        "價格突破第一壓力"

    };

  }


  if(
    s1 !== null &&
    price < s1
  ){

    return {

      type:"跌破支撐",

      strength:-2,

      text:
        "價格跌破第一支撐"

    };

  }


  return {

    type:"區間",

    strength:0,

    text:
      "目前位於主要支撐與壓力區間"

  };

}


/* =========================================================
   【4-4】成交量強弱
   ========================================================= */

function analyzeVolume(stock){

  const volume =
    Number(stock?.volume);


  if(
    !Number.isFinite(volume) ||
    volume <= 0
  ){

    return {

      level:"未知",
      score:0,
      text:"成交量資料不足"

    };

  }


  /*
   * 若 V1491 已經有均量資料，
   * 優先使用。
   */

  const avgVolume =
    Number(
      stock?.avgVolume ??
      stock?.volumeMA5 ??
      stock?.volumeAvg
    );


  if(
    Number.isFinite(avgVolume) &&
    avgVolume > 0
  ){

    const ratio =
      volume / avgVolume;


    if(ratio >= 2){

      return {

        level:"爆量",
        score:2,

        ratio,

        text:
          "成交量明顯高於均量"

      };

    }


    if(ratio >= 1.3){

      return {

        level:"放量",
        score:1,

        ratio,

        text:
          "成交量高於均量"

      };

    }


    if(ratio <= 0.6){

      return {

        level:"量縮",
        score:-1,

        ratio,

        text:
          "成交量低於均量"

      };

    }


    return {

      level:"正常",
      score:0,

      ratio,

      text:
        "成交量接近均量"

    };

  }


  return {

    level:"有量",

    score:0,

    ratio:null,

    text:
      "已有成交量資料，缺少均量基準"

  };

}


/* =========================================================
   【4-5】建立單檔完整交易分析
   ========================================================= */

function buildCompleteTradeAnalysis(stock){

  const levels =
    stock?.levels ||
    calculateFourLevels(
      stock,
      stock?.history || []
    );


  const normalizedStock = {

    ...stock,

    levels

  };


  const trade =
    buildTradePlan(
      normalizedStock
    );


  const breakout =
    detectBreakout(
      normalizedStock
    );


  const volume =
    analyzeVolume(
      normalizedStock
    );


  /*
   * ---------------------------------------------------------
   * 綜合分數
   *
   * 這只是程式內部條件分數，
   * 不代表投資評級。
   * ---------------------------------------------------------
   */

  let signalScore = 0;


  signalScore +=
    breakout.strength || 0;


  signalScore +=
    volume.score || 0;


  if(
    trade.rr1 !== null &&
    trade.rr1 >= 2
  ){

    signalScore += 1;

  }


  return {

    ...normalizedStock,

    trade,

    breakout,

    volume,

    signalScore

  };

}


/* =========================================================
   【4-6】交易數字格式
   ========================================================= */

function tradeMoney(v){

  const n =
    Number(v);

  if(
    !Number.isFinite(n)
  ){

    return "--";

  }

  return n.toFixed(2);

}


function tradePercent(v){

  const n =
    Number(v);

  if(
    !Number.isFinite(n)
  ){

    return "--";

  }

  return `${n.toFixed(2)}%`;

}

   【4-7】建立交易分析卡片

function renderTradePlan(stock){

          </strong>

                : "+" + tradePercent(tp2Percent)
            }

                1:${trade.rr1.toFixed(2)}
              </span>
            `
        }

      </div>

    </div>

  `;

}

<script>

/* =========================================================
   【5-1】V1491 熱門20完整資料結構
   ========================================================= */

const V1491_HOT20 = {

  running:false,

  requestId:0,

  date:null,

  source:null,

  stocks:[],

  completed:0,

  failed:0

};


/* =========================================================
   【5-2】安全文字
   ========================================================= */

function safeText(value){

  return String(
    value ??
    ""
  )
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");

}


/* =========================================================
   【5-3】安全價格
   ========================================================= */

function safePrice(value){

  const n =
    Number(value);

  return Number.isFinite(n) &&
         n > 0
    ? n
    : null;

}


/* =========================================================
   【5-4】熱門20排序
   ========================================================= */

function sortHot20Stocks(stocks){

  if(!Array.isArray(stocks)){
    return [];
  }


  return stocks
    .filter(
      s =>
        s &&
        s.code
    )
    .sort(
      (a,b) =>
        Number(b.volume || 0) -
        Number(a.volume || 0)
    )
    .slice(0,20)
    .map(
      (s,index) => ({
        ...s,
        rank:index + 1
      })
    );

}


/* =========================================================
   【5-5】建立單檔完整分析
   ========================================================= */

async function prepareHot20Stock(stock){

  if(!stock?.code){
    return null;
  }


  try{

    /*
     * 第三段：
     * 四大支撐／壓力
     */

    const analyzed =
      await buildHot20Analysis(
        stock
      );


    if(!analyzed){
      throw new Error(
        "無法建立行情分析"
      );
    }


    /*
     * 第四段：
     * 進場／止損／止盈／突破
     */

    const complete =
      buildCompleteTradeAnalysis(
        analyzed
      );


    return {

      ...complete,

      code:
        stock.code,

      name:
        stock.name ||
        stock.code,

      price:
        safePrice(
          complete.price ??
          stock.price
        ),

      volume:
        Number(
          stock.volume || 0
        )

    };

  }catch(error){

    console.warn(
      `[V1491 HOT20] ${stock.code}`,
      error
    );


    return {

      ...stock,

      code:
        stock.code,

      name:
        stock.name ||
        stock.code,

      price:
        safePrice(stock.price),

      volume:
        Number(
          stock.volume || 0
        ),

      analysisError:
        error?.message ||
        "分析失敗"

    };

  }

}


/* =========================================================
   【5-6】批次分析
   ========================================================= */

async function prepareHot20Stocks(stocks){

  if(!Array.isArray(stocks)){
    return [];
  }


  const result = [];

  const batchSize = 4;


  for(
    let i=0;
    i<stocks.length;
    i+=batchSize
  ){

    const batch =
      stocks.slice(
        i,
        i + batchSize
      );


    const batchResult =
      await Promise.all(
        batch.map(
          prepareHot20Stock
        )
      );


    for(
      const item of batchResult
    ){

      if(item){

        result.push(item);

        V1491_HOT20.completed++;

      }else{

        V1491_HOT20.failed++;

      }

    }

  }


  return sortHot20Stocks(
    result
  );

}


/* =========================================================
   【5-7】狀態標籤
   ========================================================= */

function getHot20Status(stock){

  const breakout =
    stock?.breakout;

  if(!breakout){

    return {

      cls:"neutral",
      text:"資料不足"

    };

  }


  if(
    breakout.type ===
    "強勢突破"
  ){

    return {

      cls:"breakout-strong",
      text:"🔥 強勢突破"

    };

  }


  if(
    breakout.type ===
    "突破"
  ){

    return {

      cls:"breakout",
      text:"🚀 突破"

    };

  }


  if(
    breakout.type ===
    "跌破支撐"
  ){

    return {

      cls:"breakdown",
      text:"⚠️ 跌破支撐"

    };

  }


  return {

    cls:"neutral",
    text:"整理中"

  };

}


/* =========================================================
   【5-8】完整熱門20卡片
   ========================================================= */

function renderV1491Hot20Card(stock){

  const price =
    safePrice(
      stock?.price
    );


  const volume =
    Number(
      stock?.volume || 0
    );


  const levels =
    stock?.levels || {};

    stock?.trade || {};

    );


  return `

    <article
      class="v1491-hot20-card"
      data-code="${safeText(stock.code)}"
    >

      <!-- =====================================
           標題
           ===================================== -->

      <div class="v1491-hot20-top">

        <div class="v1491-hot20-rank">

          #${stock.rank}

        </div>


        <div class="v1491-hot20-title">

          <strong>
            ${safeText(stock.code)}
          </strong>

          <span>
            ${safeText(stock.name)}
          </span>

        </div>


        <div class="v1491-hot20-current">

          ${
            price === null
              ? "--"
              : price.toFixed(2)
          }

        </div>

      </div>


      <!-- =====================================
           狀態
           ===================================== -->

      <div class="v1491-hot20-status">

        <span
          class="
            v1491-status-pill
            ${status.cls}
          "
        >
          ${status.text}
        </span>


        <span class="v1491-volume">

          成交量
          ${volume.toLocaleString()}

        </span>

      </div>


      <!-- =====================================
           四大關卡
           ===================================== -->

      <div class="v1491-level-grid">


        <div class="v1491-level support">

          <span>
            第一支撐
          </span>

          <strong>

            ${
              levelMoney(
                levels.firstSupport ??
                levels.support1
              )
            }

          </strong>

        </div>


        <div class="v1491-level support">

          <span>
            第二支撐
          </span>

          <strong>

            ${
              levelMoney(
                levels.secondSupport ??
                levels.support2
              )
            }

/* =========================================================

   ========================================================= */

async function scanHot20(){

  /*
   * 防止重複掃描
   */

  if(
    V1491_HOT20.running
  ){

    if(
      typeof toast ===
      "function"
    ){

      toast(
        "⏳ 熱門20正在更新，請稍候"
      );

    }

    return;

  }


  V1491_HOT20.running =
    true;

  V1491_HOT20.requestId++;

  V1491_HOT20.completed =
    0;

  V1491_HOT20.failed =
    0;


  const currentRequest =
    V1491_HOT20.requestId;


  const btn =
    document.getElementById(
      "hot20ScanBtn"
    );


  const oldText =
    btn?.textContent ||
    "🔥 掃描熱門20檔";


  if(btn){

    btn.disabled =
      true;

    btn.textContent =
      "⏳ 掃描中...";

  }


  try{

    /*
     * ① 取得最近交易日熱門20
     */

    const data =
      await fetchLatestHot20();


    /*
     * ② 防止舊請求繼續執行
     */

    if(
      currentRequest !==
      V1491_HOT20.requestId
    ){

      return;

    }


    if(
      !data ||
      !Array.isArray(
        data.stocks
      )
    ){

      throw new Error(
        "熱門20資料格式錯誤"
      );

    }


    /*
     * ③ 排序並限制20檔
     */

    const stocks =
      sortHot20Stocks(
        data.stocks
      );


    /*
     * ④ 完整分析
     */

    const analyzed =
      await prepareHot20Stocks(
        stocks
      );


    /*
     * ⑤ 再次確認 request
     */

    if(
      currentRequest !==
      V1491_HOT20.requestId
    ){

      return;

    }


    /*
     * ⑥ 儲存
     */

    V1491_HOT20.stocks =
      analyzed;

    V1491_HOT20.date =
      data.date;

    V1491_HOT20.source =
      data.source;


    /*
     * ⑦ 顯示
     */

    renderV1491Hot20Results(
      analyzed,
      data.date,
      data.source
    );


    /*
     * ⑧ 成功訊息
     */

    if(
      typeof toast ===
      "function"
    ){

      toast(
        `🔥 熱門20更新完成｜${data.date}`
      );

    }


  }catch(error){

    console.error(
      "[V1491 HOT20]",
      error
    );


    const message =
      error?.message ||
      "未知錯誤";


    if(
      typeof toast ===
      "function"
    ){

      toast(
        `⚠️ 熱門20掃描失敗：${message}`
      );

    }

  }finally{

    V1491_HOT20.running =
      false;


    if(btn){

      btn.disabled =
        false;

      btn.textContent =
        oldText;

    }

  }

}

function normalizeV1491SearchText(value){

    /[\s　\-－_]/g,
    ""
  )
  .trim();

   【6-3】建立搜尋股票物件
   ========================================================= */

function createV1491SearchStock(
  code,
  name,
  market = ""
){

  const c =
    String(code ?? "")
      .trim();

  const n =
    String(name ?? "")
      .trim();


  if(!c){
    return null;
  }


  return {

    code:c,

    name:
      n || c,

    market:
      market || "",

    searchCode:
      normalizeV1491SearchText(c),

    searchName:
      normalizeV1491SearchText(n)

  };

   【6-4】加入搜尋宇宙
   ========================================================= */

function addV1491SearchStock(
  map,
  code,
  name,
  market = ""
){

  const item =
    createV1491SearchStock(
      code,
      name,
      market
    );


  if(!item){
    return;
  }


  /*
   * 排除明顯不是股票代號的資料
   */

  if(
    !/^\d{4,6}[A-Z]?$/
      .test(item.code)
  ){

    return;

  }


  if(!map.has(item.code)){

    );

  }else{

    const old =
      map.get(item.code);


    if(

}

      const item of tpex
    ){

      addV1491SearchStock(
        map,
        item.code,
        item.name,
        item.market
      );

    }


    /*
     * ③ 原版 KNOWN
     */

    addV1491KnownUniverse(
      map
    );


    /*
     * ④ ETF / ETN / 指定補充
     */

    addV1491ExtraSymbols(
      map
    );


    V1491_SEARCH.universe =
      [...map.values()]
        .filter(Boolean)
        .sort(
          (a,b)=>
            a.code.localeCompare(
              b.code
            )
        );


    V1491_SEARCH.loaded =
      true;


    return V1491_SEARCH.universe;

  }finally{

    V1491_SEARCH.loading =
      false;

  }

}


/* =========================================================
   【6-10】搜尋
   ========================================================= */

async function searchV1491Stock(raw){

  const q =
    normalizeV1491SearchText(
      raw
    );


  V1491_SEARCH.query =
    q;


  if(!q){

    V1491_SEARCH.candidates =
      [];

    return [];

  }


  const universe =
    await buildV1491SearchUniverse();


  /*
   * 完全相同代號
   */

  const exactCode =
    universe.filter(
      item =>
        item.searchCode === q
    );


  /*
   * 完全相同名稱
   */

  const exactName =
    universe.filter(
      item =>
        item.searchName === q
    );


  /*
   * 代號開頭
   */

  const codePrefix =
    universe.filter(
      item =>
        item.searchCode.startsWith(q)
    );


  /*
   * 名稱包含
   */

  const nameInclude =
    universe.filter(
      item =>
        item.searchName.includes(q)
    );


  /*
   * 合併並去重
   */

  const map =
    new Map();


  for(
    const group of [
      exactCode,
      exactName,
      codePrefix,
      nameInclude
    ]
  ){

    for(
      const item of group
    ){

      if(
        !map.has(item.code)
      ){

        map.set(
          item.code,
          item
        );

      }

    }

  }


  const result =
    [...map.values()]
      .slice(0,30);


  V1491_SEARCH.candidates =
    result;


  return result;

}

function renderV1491SearchCandidates(

){

      </div>

    `;

  }


  container.innerHTML =

          <button
            type="button"

            data-search-index="${index}"
          >

            <span
              class="v1491-search-code"
            >

            </span>

              class="v1491-search-name"
            >

            </span>

            <span
              class="v1491-search-market"
            >
              ${safeText(item.market)}
            </span>

          </button>

        `
      )
      .join("");


  container
    .querySelectorAll(
      ".v1491-search-item"
    )
    .forEach(
      button => {

        button.addEventListener(
          "click",
          async () => {

            const index =

              );

async function selectV1491SearchStock(
  stock
){

  if(!stock?.code){
    return;
  }


  /*
   * 搜尋框
   */

  const input =
    document.querySelector(
      "#stockSearch"
    ) ||
    document.querySelector(
      "#searchInput"
    );


  if(input){

    input.value =
      `${stock.code} ${stock.name}`;

  }


  /*
   * 關閉候選清單
   */

  const candidates =
    document.querySelector(
      "#searchCandidates"
    ) ||
    document.querySelector(
      "#searchResults"
    );


  if(candidates){

    candidates.innerHTML =
      "";

  }


  /*
   * 如果原版有分析函式，
   * 直接交給原版。
   */

  if(
    typeof analyzeStock ===
    "function"
  ){

    await analyzeStock(
      stock.code
    );

    return;

  }


  if(
    typeof runAnalysis ===
    "function"
  ){

    await runAnalysis(
      stock.code
    );

    return;

  }


  /*
   * 如果 V1491 原版使用 runFeature，
   * 直接指定代號後執行。
   */

  if(
    typeof runFeature ===
    "function"
  ){

    try{

      await runFeature(
        stock.code
      );

      return;

    }catch(error){

      console.warn(
        "[V1491 SEARCH]",
        error
      );

    }

  }


  /*
   * 最後把選擇結果存起來，
   * 讓後續流程可以取得。
   */

  V1491_SEARCH.selected =
    stock;

}

function bindV1491Search(){

  const input =
    document.querySelector(
      "#stockSearch"
    ) ||
    document.querySelector(
      "#searchInput"
    ) ||
    document.querySelector(
      'input[type="search"]'
    );


  if(!input){
    return false;
  }


  /*
   * 找候選結果容器
   */

  let container =
    document.querySelector(
      "#searchCandidates"
    ) ||
    document.querySelector(
      "#searchResults"
    );


  /*
   * 如果沒有，
   * 自動建立。
   */

  if(!container){

    container =
      document.createElement(
        "div"
      );


    container.id =
      "v1491SearchCandidates";


    container.className =
      "v1491-search-candidates";


    input.parentNode
      ?.appendChild(
        container
      );

  }


  if(
    input.dataset
      .v1491SearchBound ===
    "1"
  ){

    return true;

  }


  input.dataset
    .v1491SearchBound =
    "1";


  let timer = null;


  input.addEventListener(
    "input",
    () => {

      clearTimeout(timer);


      timer =
        setTimeout(
          async () => {

            const value =
              input.value;


            if(
              !normalizeV1491SearchText(
                value
              )
            ){

              container.innerHTML =
                "";

              return;

            }


            container.innerHTML = `

              <div
                class="v1491-search-loading"
              >
                🔎 搜尋中...
              </div>

            `;


            try{

              const result =
                await searchV1491Stock(
                  value
                );


              renderV1491SearchCandidates(
                result,
                container
              );

            }catch(error){

              console.error(
                "[V1491 SEARCH]",
                error
              );


              container.innerHTML = `

                <div
                  class="v1491-search-empty"
                >
                  ⚠️ 搜尋資料取得失敗
                </div>

              `;

            }

          },
          250
        );

    }
  );


  return true;

}

<script>

/* =========================================================
   【9-1】數字安全處理
   ========================================================= */

function v1491ValidPrice(value){

  const n = Number(value);

  return Number.isFinite(n) && n > 0
    ? n
    : null;

}


/* =========================================================
   【9-2】四大關卡一致性修正
   ========================================================= */

function normalizeV1491Levels(
  levels,
  price
){

  const p =
    v1491ValidPrice(price);


  if(!p){

    return {

      firstSupport:null,
      secondSupport:null,

      firstResistance:null,
      secondResistance:null

    };

  }


  let s1 =
    v1491ValidPrice(
      levels?.firstSupport ??
      levels?.support1
    );


  let s2 =
    v1491ValidPrice(
      levels?.secondSupport ??
      levels?.support2
    );


  let r1 =
    v1491ValidPrice(
      levels?.firstResistance ??
      levels?.resistance1
    );


  let r2 =
    v1491ValidPrice(
      levels?.secondResistance ??
      levels?.resistance2
    );


  /*
   * -----------------------------------------
   * 支撐必須低於目前價格
   * -----------------------------------------
   */

  if(
    s1 !== null &&
    s1 >= p
  ){

    s1 = null;

  }


  if(
    s2 !== null &&
    s2 >= p
  ){

    s2 = null;

  }


  /*
   * -----------------------------------------
   * 壓力必須高於目前價格
   * -----------------------------------------
   */

  if(
    r1 !== null &&
    r1 <= p
  ){

    r1 = null;

  }


  if(
    r2 !== null &&
    r2 <= p
  ){

    r2 = null;

  }


  /*
   * -----------------------------------------
   * 第一支撐必須高於第二支撐
   * -----------------------------------------
   */

  if(
    s1 !== null &&
    s2 !== null &&
    s1 < s2
  ){

    [s1,s2] =
      [s2,s1];

  }


  /*
   * -----------------------------------------
   * 第一壓力必須低於第二壓力
   * -----------------------------------------
   */

  if(
    r1 !== null &&
    r2 !== null &&
    r1 > r2
  ){

    [r1,r2] =
      [r2,r1];

  }


  /*
   * -----------------------------------------
   * 缺少第二支撐
   * -----------------------------------------
   */

  if(
    s1 !== null &&
    s2 === null
  ){

    const distance =
      p - s1;


    if(distance > 0){

      s2 =
        s1 -
        distance * 0.8;

    }

  }


  /*
   * -----------------------------------------
   * 缺少第二壓力
   * -----------------------------------------
   */

  if(
    r1 !== null &&
    r2 === null
  ){

    const distance =
      r1 - p;


    if(distance > 0){

      r2 =
        r1 +
        distance * 0.8;

    }

  }


  return {

    firstSupport:s1,

    secondSupport:s2,

    firstResistance:r1,

    secondResistance:r2,

    support1:s1,

    support2:s2,

    resistance1:r1,

    resistance2:r2

  };

}


/* =========================================================
   【9-3】檢查單檔資料
   ========================================================= */

function validateV1491Stock(
  stock
){

  const errors = [];


  if(!stock){

    errors.push(
      "股票資料不存在"
    );


    return {

      valid:false,

      errors

    };

  }


  if(!stock.code){

    errors.push(
      "缺少股票代號"
    );

  }


  const price =
    v1491ValidPrice(
      stock.price
    );


  if(price === null){

    errors.push(
      "缺少有效股價"
    );

  }


  if(
    stock.volume !== undefined &&
    (
      !Number.isFinite(
        Number(stock.volume)
      ) ||
      Number(stock.volume) < 0
    )
  ){

    errors.push(
      "成交量格式異常"
    );

  }


  if(
    price !== null &&
    stock.levels
  ){

    const lv =
      normalizeV1491Levels(
        stock.levels,
        price
      );


    if(
      lv.firstSupport !== null &&
      lv.firstSupport >= price
    ){

      errors.push(
        "第一支撐異常"
      );

    }


    if(
      lv.secondSupport !== null &&
      lv.secondSupport >= price
    ){

      errors.push(
        "第二支撐異常"
      );

    }


    if(
      lv.firstResistance !== null &&
      lv.firstResistance <= price
    ){

      errors.push(
        "第一壓力異常"
      );

    }


    if(
      lv.secondResistance !== null &&
      lv.secondResistance <= price
    ){

      errors.push(
        "第二壓力異常"
      );

    }

  }


  return {

    valid:
      errors.length === 0,

    errors

  };

}


/* =========================================================
   【9-4】修正熱門20所有資料
   ========================================================= */

function sanitizeV1491Hot20(
  stocks
){

  if(
    !Array.isArray(stocks)
  ){

    return [];

  }


  return stocks
    .filter(Boolean)
    .map(
      stock => {

        const price =
          v1491ValidPrice(
            stock.price
          );


        let levels =
          stock.levels || {};


        if(price !== null){

          levels =
            normalizeV1491Levels(
              levels,
              price
            );

        }


        return {

          ...stock,

          price,

          levels,

          firstSupport:
            levels.firstSupport,

          secondSupport:
            levels.secondSupport,

          firstResistance:
            levels.firstResistance,

          secondResistance:
            levels.secondResistance

        };

      }
    );

}


/* =========================================================
   【9-5】重新計算交易計畫
   ========================================================= */

function refreshV1491TradePlan(
  stock
){

  if(!stock){

    return null;

  }


  const clean = {

    ...stock,

    levels:
      normalizeV1491Levels(
        stock.levels,
        stock.price
      )

  };


  return {

    ...clean,

    trade:
      buildTradePlan(
        clean
      ),

    breakout:
      detectBreakout(
        clean
      )

  };

}


/* =========================================================
   【9-6】熱門20最終資料處理
   ========================================================= */

function finalizeV1491Hot20Data(
  stocks
){

  const clean =
    sanitizeV1491Hot20(
      stocks
    );


  const finalData =
    clean
      .map(
        refreshV1491TradePlan
      )
      .filter(Boolean)
      .slice(0,20);


  /*
   * 重新編號
   */

  return finalData.map(
    (stock,index)=>({

      ...stock,

      rank:
        index + 1

    })
  );

}


/* =========================================================
   【9-7】檢查四大關卡
   ========================================================= */

function verifyV1491Levels(
  stock
){

  const price =
    v1491ValidPrice(
      stock?.price
    );


  if(price === null){

    return {

      ok:false,

      reason:
        "缺少有效股價"

    };

  }


  const lv =
    normalizeV1491Levels(
      stock?.levels,
      price
    );


  const checks = {

    support1:
      lv.firstSupport === null ||
      lv.firstSupport < price,

    support2:
      lv.secondSupport === null ||
      lv.secondSupport < price,

    supportOrder:
      lv.firstSupport === null ||
      lv.secondSupport === null ||
      lv.firstSupport >= lv.secondSupport,

    resistance1:
      lv.firstResistance === null ||
      lv.firstResistance > price,

    resistance2:
      lv.secondResistance === null ||
      lv.secondResistance > price,

    resistanceOrder:
      lv.firstResistance === null ||
      lv.secondResistance === null ||
      lv.firstResistance <= lv.secondResistance

  };


  return {

    ok:
      Object
        .values(checks)
        .every(Boolean),

    checks,

    levels:lv

  };

}


/* =========================================================
   【9-8】熱門20整體驗證
   ========================================================= */

function verifyV1491Hot20Data(
  stocks
){

  if(
    !Array.isArray(stocks)
  ){

    return {

      ok:false,

      count:0,

      valid:0,

      invalid:0,

      details:[]

    };

  }


  const details =
    stocks.map(
      stock => {

        const stockCheck =
          validateV1491Stock(
            stock
          );


        const levelCheck =
          verifyV1491Levels(
            stock
          );


        return {

          code:
            stock.code,

          name:
            stock.name,

          stockValid:
            stockCheck.valid,

          levelValid:
            levelCheck.ok,

          errors:
            stockCheck.errors

        };

      }
    );


  const valid =
    details.filter(
      item =>
        item.stockValid &&
        item.levelValid
    ).length;


  return {

    ok:
      valid === details.length,

    count:
      details.length,

    valid,

    invalid:
      details.length - valid,

    details

  };

}

   【9-9】安全顯示最終熱門20
   ========================================================= */

      );

    }

  }


  return {

<script>

/* =========================================================
   【11-1】行情服務狀態
   ========================================================= */

const V1491_API = {

  activeSource:null,

  lastSuccess:null,

  lastError:null,

  failCount:0,

  successCount:0

};


/* =========================================================
   【11-2】HTTP 狀態分類
   ========================================================= */

function classifyV1491HTTPError(error){

  const message =
    String(
      error?.message ||
      error ||
      ""
    );


  const match =
    message.match(
      /HTTP\s+(\d{3})/i
    );


  if(!match){

    if(
      /timeout|逾時|abort/i
        .test(message)
    ){

      return "TIMEOUT";

    }


    return "UNKNOWN";

  }


  const code =
    Number(
      match[1]
    );


  if(code === 401){
    return "HTTP_401";
  }


  if(code === 403){
    return "HTTP_403";
  }


  if(code === 404){
    return "HTTP_404";
  }


  if(code >= 500){
    return "HTTP_5XX";
  }


  return `HTTP_${code}`;

}


/* =========================================================
   【11-3】安全取得 JSON
   ========================================================= */

async function v1491ApiFetch(
  url,
  options = {}
){

  const controller =
    new AbortController();


  const timeout =
    Number(
      options.timeout ||
      15000
    );


  const timer =
    setTimeout(
      () => {
        controller.abort();
      },
      timeout
    );


  try{

    const response =
      await fetch(
        url,
        {
          ...options,

          signal:
            controller.signal,

          cache:
            "no-store",

          headers:{
            "Accept":
              "application/json,text/plain,*/*",

            ...(options.headers || {})

          }

        }
      );


    if(!response.ok){

      throw new Error(
        `HTTP ${response.status}`
      );

    }


    const text =
      await response.text();


    if(!text.trim()){

      throw new Error(
        "API回傳空資料"
      );

    }


    let data;


    try{

      data =
        JSON.parse(
          text
        );

    }catch{

      /*
       * 嘗試移除 BOM
       */

      data =
        JSON.parse(
          text
            .replace(
              /^\uFEFF/,
              ""
            )
            .trim()
        );

    }


    V1491_API.successCount++;

    V1491_API.lastSuccess =
      new Date().toISOString();

    V1491_API.activeSource =
      url;


    return data;

  }catch(error){

    V1491_API.failCount++;

    V1491_API.lastError = {

      url,

      type:
        classifyV1491HTTPError(
          error
        ),

      message:
        error?.message ||
        String(error),

      time:
        new Date().toISOString()

    };


    if(
      error?.name ===
      "AbortError"
    ){

      throw new Error(
        "行情服務逾時"
      );

    }


    throw error;

  }finally{

    clearTimeout(
      timer
    );

  }

}

function validateV1491RawHot20(
  data
){

  if(
    Array.isArray(data)
  ){

    return data.length > 0;

  }


  if(
    data &&
    Array.isArray(data.data)
  ){

    return data.data.length > 0;

  }


  if(
    data &&
    Array.isArray(data.tables)
  ){

    return data.tables.some(
      table =>
        Array.isArray(
          table?.data
        ) &&
        table.data.length > 0
    );

  }


  return false;

}


/* =========================================================
   【11-6】官方來源取得熱門20
   ========================================================= */

async function fetchV1491Hot20Official(
  date
){

  const urls =
    getV1491Hot20OfficialURLs(
      date
    );


  let lastError =
    null;


  for(
    const url of urls
  ){

    try{

      const data =
        await v1491ApiFetch(
          url,
          {
            timeout:15000
          }
        );


      if(
        !validateV1491RawHot20(
          data
        )
      ){

        throw new Error(
          "官方資料格式異常"
        );

      }


      const rows =
        parseHot20Rows(
          data
        );


      const stocks =
        normalizeHot20Stocks(
          rows
        );


      if(
        stocks.length < 5
      ){

        throw new Error(
          `有效資料不足：${stocks.length}檔`
        );

      }


      return {

        date,

        stocks:
          stocks.slice(
            0,
            20
          ),

        source:
          "TWSE_OFFICIAL"

      };

    }catch(error){

      lastError =
        error;

      console.warn(
        "[V1491 API] TWSE來源失敗",
        url,
        error
      );

    }

  }


  throw(
    lastError ||
    new Error(
      "TWSE官方資料取得失敗"
    )
  );

}

function getV1491ApiErrorMessage(
  error
){

  const type =
    classifyV1491HTTPError(
      error
    );


  switch(type){

    case "HTTP_401":

      return (
        "行情服務拒絕本次請求，" +
        "系統將改用其他官方資料端點。"
      );


    case "HTTP_403":

      return (
        "行情服務暫時拒絕存取，" +
        "請稍後再試。"
      );


    case "HTTP_404":

      return (
        "行情資料端點暫時無法使用。"
      );


    case "HTTP_5XX":

      return (
        "行情伺服器暫時異常，" +
        "請稍後再試。"
      );


    case "TIMEOUT":

      return (
        "行情服務回應逾時，" +
        "請稍後再試。"
      );


    default:

      return (
        error?.message ||
        "行情資料取得失敗"
      );

  }

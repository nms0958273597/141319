<script>
"use strict";

/* =========================================================
   V1491｜全域狀態
========================================================= */

const STATE = {
  market: {
    all: "all",
    twse: "twse",
    tpex: "tpex"
  },

  current: null,
  currentStock: null,
  lastAnalysis: null,

  stocks: [],
  marketStocks: [],

  scan: {
    running: false,
    type: "",
    results: [],
    progress: 0
  },

  cache: {
    market: null,
    marketTime: 0,
    history: new Map(),
    quotes: new Map()
  }
};

let current = null;


/* =========================================================
   V1491｜API
========================================================= */

const API = {
  twseAll:
    "https://openapi.twse.com.tw/v1/exchangeReport/STOCK_DAY_ALL",

  tpexAll:
    "https://www.tpex.org.tw/openapi/v1/tpex_mainboard_daily_close_quotes",

  quote:
    "https://mis.twse.com.tw/stock/api/getStockInfo.jsp",

  day:
    "https://www.twse.com.tw/rwd/zh/afterTrading/STOCK_DAY"
};


/* =========================================================
   V1491｜基本工具
========================================================= */

function normalizeCode(value){
  if(value === null || value === undefined){
    return "";
  }

  return String(value)
    .trim()
    .toUpperCase()
    .replace(/\s+/g,"");
}


function normalizeSearch(value){
  return String(value || "")
    .trim()
    .toLowerCase()
    .replace(/\s+/g,"");
}


function numberValue(value){
  if(
    value === null ||
    value === undefined ||
    value === "" ||
    value === "-"
  ){
    return null;
  }

  const n = Number(
    String(value)
      .replace(/,/g,"")
      .replace(/%/g,"")
      .trim()
  );

  return Number.isFinite(n) ? n : null;
}


function safeNumber(value,fallback=null){
  const n = numberValue(value);
  return n === null ? fallback : n;
}


function formatNumber(value,digits=2){
  const n = numberValue(value);

  if(n === null){
    return "—";
  }

  return n.toLocaleString(
    "zh-TW",
    {
      minimumFractionDigits:digits,
      maximumFractionDigits:digits
    }
  );
}


function formatPercent(value,digits=2){
  const n = numberValue(value);

  if(n === null){
    return "—";
  }

  return `${n.toFixed(digits)}%`;
}


function clamp(value,min,max){
  return Math.min(
    max,
    Math.max(min,value)
  );
}


function sleep(ms){
  return new Promise(
    resolve => setTimeout(resolve,ms)
  );
}


/* =========================================================
   V1491｜ETF 判斷
========================================================= */

function isETFCode(code){
  const c = normalizeCode(code);

  return (
    /^00\d{4}$/.test(c) ||
    /^01\d{4}$/.test(c) ||
    /^02\d{4}$/.test(c)
  );
}


/* =========================================================
   V1491｜市場判斷
========================================================= */

function detectMarket(code){
  const c = normalizeCode(code);

  if(isETFCode(c)){
    return "twse";
  }

  if(
    /^4\d{3}$/.test(c) ||
    /^5\d{3}$/.test(c) ||
    /^6\d{3}$/.test(c) ||
    /^8\d{3}$/.test(c) ||
    /^9\d{3}$/.test(c)
  ){
    return "tpex";
  }

  return "twse";
}


/* =========================================================
   V1491｜Fetch
========================================================= */

async function safeFetchJSON(
  url,
  options={}
){
  const controller =
    new AbortController();

  const timeout =
    setTimeout(
      () => controller.abort(),
      8000
    );

  try{

    const response =
      await fetch(
        url,
        {
          ...options,
          cache:"no-store",
          signal:controller.signal
        }
      );

    if(!response.ok){
      throw new Error(
        `HTTP ${response.status}`
      );
    }

    return await response.json();

  }finally{

    clearTimeout(
      timeout
    );
  }
}


/* =========================================================
   V1491｜股票資料基本結構
========================================================= */

function createStockBase(data={}){
  const code =
    normalizeCode(
      data.code ||
      data.symbol ||
      data.c ||
      ""
    );

  return {
    code,

    name:
      data.name ||
      data.stockName ||
      data.n ||
      code,

    market:
      data.market ||
      detectMarket(code),

    price:
      numberValue(
        data.price ??
        data.close ??
        data.z
      ),

    prev:
      numberValue(
        data.prev ??
        data.previousClose ??
        data.y
      ),

    open:
      numberValue(
        data.open ??
        data.o
      ),

    high:
      numberValue(
        data.high ??
        data.h
      ),

    low:
      numberValue(
        data.low ??
        data.l
      ),

    volume:
      numberValue(
        data.volume ??
        data.v
      ),

    changePct:
      numberValue(
        data.changePct ??
        data.pct
      ),

    dayChangePct:
      numberValue(
        data.dayChangePct ??
        data.changePct
      ),

    technical:
      data.technical || null
  };
}


/* =========================================================
   V1491｜TWSE 資料轉換
========================================================= */

function normalizeTWSERow(row){
  if(!row){
    return null;
  }

  const code =
    normalizeCode(
      row.Code ??
      row[0]
    );

  if(!code){
    return null;
  }

  const name =
    String(
      row.Name ??
      row[1] ??
      code
    ).trim();

  const close =
    numberValue(
      row.ClosingPrice ??
      row[8] ??
      row[2]
    );

  const volume =
    numberValue(
      row.TradeVolume ??
      row[2] ??
      row[9]
    );

  return createStockBase({
    code,
    name,
    market:"twse",
    price:close,
    volume
  });
}


/* =========================================================
   V1491｜TPEx 資料轉換
========================================================= */

function normalizeTPExRow(row){
  if(!row){
    return null;
  }

  const code =
    normalizeCode(
      row.SecuritiesCompanyCode ??
      row.Code ??
      row[0]
    );

  if(!code){
    return null;
  }

  const name =
    String(
      row.CompanyName ??
      row.Name ??
      row[1] ??
      code
    ).trim();

  const close =
    numberValue(
      row.Close ??
      row.ClosingPrice ??
      row[2] ??
      row[4]
    );

  const volume =
    numberValue(
      row.TradeVolume ??
      row.Volume ??
      row[7] ??
      row[8]
    );

  return createStockBase({
    code,
    name,
    market:"tpex",
    price:close,
    volume
  });
}


/* =========================================================
   V1491｜載入 TWSE 全市場
========================================================= */

async function getTWSEAll(){

  const json =
    await safeFetchJSON(
      API.twseAll
    );

  const rows =
    Array.isArray(json)
      ? json
      : Array.isArray(json?.data)
        ? json.data
        : [];

  return rows
    .map(normalizeTWSERow)
    .filter(Boolean);
}


/* =========================================================
   V1491｜載入 TPEx 全市場
========================================================= */

async function getTPExAll(){

  const json =
    await safeFetchJSON(
      API.tpexAll
    );

  const rows =
    Array.isArray(json)
      ? json
      : Array.isArray(json?.data)
        ? json.data
        : [];

  return rows
    .map(normalizeTPExRow)
    .filter(Boolean);
}


/* =========================================================
   V1491｜取得市場資料
========================================================= */

async function getMarketToday(){

  const now =
    Date.now();

  if(
    STATE.cache.market &&
    now - STATE.cache.marketTime < 60000
  ){

    setMarketLoadStatus(
      100,
      STATE.cache.market.length,
      STATE.cache.market.length,
      `資料完成｜${STATE.cache.market.length} 檔`
    );

    return STATE.cache.market;
  }

  setMarketLoadStatus(
    0,
    0,
    0,
    "讀取中… 0%｜0 檔"
  );

  const twseJob =
    getTWSEAll()
      .then(
        data => {

          const list =
            Array.isArray(data)
              ? data
              : [];

          setMarketLoadStatus(
            50,
            list.length,
            0,
            `讀取中… 50%｜${list.length} 檔`
          );

          return list;
        }
      )
      .catch(
        error => {

          console.warn(
            "TWSE:",
            error
          );

          return [];
        }
      );

  const tpexJob =
    getTPExAll()
      .then(
        data => {

          const list =
            Array.isArray(data)
              ? data
              : [];

          setMarketLoadStatus(
            90,
            list.length,
            0,
            `讀取中… 90%｜${list.length} 檔`
          );

          return list;
        }
      )
      .catch(
        error => {

          console.warn(
            "TPEx:",
            error
          );

          return [];
        }
      );

  const [
    twse,
    tpex
  ] =
    await Promise.all([
      twseJob,
      tpexJob
    ]);

  const all =
    [
      ...twse,
      ...tpex
    ];

  const map =
    new Map();

  for(
    const stock of all
  ){

    if(stock?.code){

      map.set(
        stock.code,
        stock
      );
    }
  }

  STATE.cache.market =
    [
      ...map.values()
    ];

  STATE.cache.marketTime =
    now;

  STATE.marketStocks =
    STATE.cache.market;

  STATE.stocks =
    STATE.cache.market;

  setMarketLoadStatus(
    100,
    STATE.stocks.length,
    STATE.stocks.length,
    `資料完成｜${STATE.stocks.length} 檔`
  );

  return STATE.cache.market;
}



  STATE.stocks =
    STATE.cache.market;

  return STATE.cache.market;
}
/* =========================================================
   V1491｜股票搜尋
========================================================= */

function findStock(
  keyword,
  market=STATE.market.all
){

  const q =
    normalizeSearch(keyword);

  if(!q){
    return null;
  }

  const stocks =
    Array.isArray(STATE.stocks)
      ? STATE.stocks
      : [];

  let list = stocks;

  if(market !== STATE.market.all){
    list =
      stocks.filter(
        stock =>
          stock.market === market
      );
  }

  /* ① 完全代號 */
  let found =
    list.find(
      stock =>
        normalizeCode(stock.code) ===
        normalizeCode(keyword)
    );

  if(found){
    return found;
  }

  /* ② 完全名稱 */
  found =
    list.find(
      stock =>
        normalizeSearch(stock.name) === q
    );

  if(found){
    return found;
  }

  /* ③ 名稱包含 */
  found =
    list.find(
      stock =>
        normalizeSearch(stock.name)
          .includes(q)
    );

  if(found){
    return found;
  }

  /* ④ 代號包含 */
  found =
    list.find(
      stock =>
        normalizeCode(stock.code)
          .includes(
            normalizeCode(keyword)
          )
    );

  return found || null;
}


/* =========================================================
   V1491｜搜尋候選清單
========================================================= */

function searchStocks(
  keyword,
  limit=12
){

  const q =
    normalizeSearch(keyword);

  if(!q){
    return [];
  }

  const stocks =
    Array.isArray(STATE.stocks)
      ? STATE.stocks
      : [];

  const exactCode = [];
  const exactName = [];
  const partialName = [];
  const partialCode = [];

  for(const stock of stocks){

    const code =
      normalizeCode(stock.code);

    const name =
      normalizeSearch(stock.name);

    if(
      code ===
      normalizeCode(keyword)
    ){
      exactCode.push(stock);
      continue;
    }

    if(name === q){
      exactName.push(stock);
      continue;
    }

    if(name.includes(q)){
      partialName.push(stock);
      continue;
    }

    if(code.includes(
      normalizeCode(keyword)
    )){
      partialCode.push(stock);
    }
  }

  return [
    ...exactCode,
    ...exactName,
    ...partialName,
    ...partialCode
  ].slice(0,limit);
}

========================================================= */

async function selectStock(
  keyword
){

  const value =
    normalizeCode(keyword);

  if(!value){
    return;
  }

  const input =
    document.getElementById(
      "stockSearch"
    );

  if(input){
    input.value = value;
  }

  const suggestionBox =
    document.getElementById(
      "searchSuggestions"
    );

  if(suggestionBox){
    suggestionBox.classList.add(
      "hidden"
    );
  }

  const searchResult =
    document.getElementById(
      "searchResult"
    );

  if(searchResult){

    searchResult.innerHTML = `
      <div class="loading">
        <span class="loading-dot"></span>
        正在取得 ${value} 資料…
      </div>
    `;
  }

  try{

    /* 如果市場資料還沒載入，先載入 */
    if(
      !Array.isArray(STATE.stocks) ||
      STATE.stocks.length === 0
    ){
      await getMarketToday();
    }

    let stock =
      findStock(value);

    /*
      搜尋市場清單沒有找到時，
      仍建立基本股票資料，
      讓 MIS / 歷史資料可以繼續嘗試。
    */
    if(!stock){

      stock =
        createStockBase({
          code:value,
          name:value,
          market:detectMarket(value)
        });
    }

    const loaded =
      await loadStockData(stock);

    if(!loaded){
      throw new Error(
        "無法取得股票資料"
      );
    }

    const analysis =
      await buildStockAnalysis(
        loaded
      );

    if(!analysis){
      throw new Error(
        "分析資料建立失敗"
      );
    }

    renderCurrentStock(
      analysis
    );

    renderTechnical(
      analysis
    );

    renderLevels(
      analysis
    );

    renderAnalysis(
      analysis
    );

    if(searchResult){

      searchResult.innerHTML = `
        <div class="row space">
          <div>
            <strong>
              ${analysis.code}
            </strong>
            <span class="muted">
              ${analysis.name || ""}
            </span>
          </div>

          <span class="badge ${
            numberValue(
              analysis.changePct
            ) >= 0
              ? "up"
              : "down"
          }">
            ${
              formatPercent(
                analysis.changePct
              )
            }
          </span>
        </div>
      `;
    }

    const hint =
      document.getElementById(
        "currentStockHint"
      );

    if(hint){
      hint.textContent =
        `${analysis.code} ${analysis.name || ""}`;
    }

    showToast(
      `已完成 ${analysis.code} 分析`
    );

    return analysis;

  }catch(error){

    console.error(
      "selectStock:",
      error
    );

    if(searchResult){

      searchResult.innerHTML = `
        <div class="error-box">
          無法取得 ${value} 的資料。<br>
          請確認股票代號，或稍後再試。
        </div>
      `;
    }

    showToast(
      "股票資料取得失敗，請稍後再試"
    );

    return null;
  }
}


/* =========================================================
   V1491｜搜尋事件綁定
========================================================= */

function bindSearch(){

  const input =
    document.getElementById(
      "stockSearch"
    );

  const box =
    document.getElementById(
      "searchSuggestions"
    );

  if(!input){
    console.warn(
      "V1491：找不到 stockSearch"
    );
    return;
  }

  /* 防止重複綁定 */
  if(input.dataset.bound === "1"){
    return;
  }

  input.dataset.bound = "1";


  input.addEventListener(
    "input",
    function(){

      const value =
        this.value.trim();

      if(!value){

        if(box){
          box.classList.add(
            "hidden"
          );
        }

        return;
      }

      renderSearchSuggestions(
        value
      );
    }
  );


  input.addEventListener(
    "keydown",
    async function(event){

      if(event.key === "Enter"){

        event.preventDefault();

        const value =
          this.value.trim();

        if(value){
          await selectStock(
            value
          );
        }
      }

      if(event.key === "Escape"){

        if(box){
          box.classList.add(
            "hidden"
          );
        }
      }
    }
  );


  input.addEventListener(
    "focus",
    function(){

      const value =
        this.value.trim();

      if(value){
        renderSearchSuggestions(
          value
        );
      }
    }
  );


  document.addEventListener(
    "click",
    async function(event){

      const item =
        event.target.closest(
          ".suggest-item"
        );

      if(item && box?.contains(item)){

        const code =
          item.dataset.code;

        if(code){
          await selectStock(
            code
          );
        }

        return;
      }

      if(
        box &&
        !box.contains(event.target) &&
        event.target !== input
      ){
        box.classList.add(
          "hidden"
        );
      }
    }
  );
}

/* =========================================================
   V1491｜數值平均
========================================================= */

function avg(values){

  const arr =
    (values || [])
      .map(numberValue)
      .filter(
        value => value !== null
      );

  if(!arr.length){
    return null;
  }

  return (
    arr.reduce(
      (sum,value) =>
        sum + value,
      0
    ) / arr.length
  );
}


/* =========================================================
   V1491｜最高／最低
========================================================= */

function maxValue(values){

  const arr =
    (values || [])
      .map(numberValue)
      .filter(
        value => value !== null
      );

  return arr.length
    ? Math.max(...arr)
    : null;
}


function minValue(values){

  const arr =
    (values || [])
      .map(numberValue)
      .filter(
        value => value !== null
      );

  return arr.length
    ? Math.min(...arr)
    : null;
}


/* =========================================================
   V1491｜技術條件判斷
========================================================= */

function getTrendScore(stock){

  const t =
    stock?.technical || {};

  const price =
    numberValue(t.price);

  const ma5 =
    numberValue(t.ma5);

  const ma20 =
    numberValue(t.ma20);

  const ma60 =
    numberValue(t.ma60);

  let score = 50;

  if(
    price !== null &&
    ma5 !== null
  ){
    score +=
      price > ma5
        ? 10
        : -10;
  }

  if(
    price !== null &&
    ma20 !== null
  ){
    score +=
      price > ma20
        ? 10
        : -10;
  }

  if(
    ma5 !== null &&
    ma20 !== null
  ){
    score +=
      ma5 > ma20
        ? 8
        : -8;
  }

  if(
    ma20 !== null &&
    ma60 !== null
  ){
    score +=
      ma20 > ma60
        ? 7
        : -7;
  }

  return clamp(
    score,
    0,
    100
  );
}


/* =========================================================
   V1491｜量價分數
========================================================= */

function getVolumeScore(stock){

  const ratio =
    numberValue(
      stock?.technical?.volumeRatio
    );

  if(ratio === null){
    return 50;
  }

  if(ratio >= 2){
    return 95;
  }

  if(ratio >= 1.5){
    return 85;
  }

  if(ratio >= 1.2){
    return 75;
  }

  if(ratio >= 1){
    return 65;
  }

  if(ratio >= .8){
    return 50;
  }

  return 35;
}


/* =========================================================
   V1491｜突破分數
========================================================= */

function getBreakoutScore(stock){

  const t =
    stock?.technical || {};

  const price =
    numberValue(t.price);

  const high20 =
    numberValue(t.high20);

  const high60 =
    numberValue(t.high60);

  if(
    price === null
  ){
    return 50;
  }

  let score = 50;

  if(
    high20 !== null &&
    price >= high20
  ){
    score += 30;
  }
  else if(
    high20 !== null &&
    price >= high20 * .97
  ){
    score += 15;
  }

  if(
    high60 !== null &&
    price >= high60
  ){
    score += 20;
  }

  return clamp(
    score,
    0,
    100
  );
}
/* =========================================================
   V1491｜突破／起飛／多頭條件
========================================================= */

function getReadyScore(stock){

  const t =
    stock?.technical || {};

  const price =
    numberValue(t.price);

  const ma5 =
    numberValue(t.ma5);

  const ma20 =
    numberValue(t.ma20);

  const high20 =
    numberValue(t.high20);

  if(price === null){
    return 50;
  }

  let score = 50;

  if(
    ma5 !== null &&
    price >= ma5
  ){
    score += 12;
  }

  if(
    ma20 !== null &&
    price >= ma20
  ){
    score += 12;
  }

  if(
    high20 !== null &&
    price >= high20 * .95
  ){
    score += 15;
  }

  if(
    numberValue(t.volumeRatio) >= 1.2
  ){
    score += 10;
  }

  return clamp(
    score,
    0,
    100
  );
}


function getBullishScore(stock){

  const trend =
    getTrendScore(stock);

  const volume =
    getVolumeScore(stock);

  const breakout =
    getBreakoutScore(stock);

  const ready =
    getReadyScore(stock);

  return clamp(
    trend * .35 +
    volume * .20 +
    breakout * .25 +
    ready * .20,
    0,
    100
  );
}


/* =========================================================
   V1491｜支撐壓力計算
========================================================= */

function calculateLevels(
  stock
){

  const t =
    stock?.technical || {};

  const price =
    numberValue(
      t.price ??
      stock.price
    );

  const ma5 =
    numberValue(t.ma5);

  const ma20 =
    numberValue(t.ma20);

  const high20 =
    numberValue(t.high20);

  const low20 =
    numberValue(t.low20);

  const atr =
    numberValue(t.atr);

  if(price === null){

    return {
      support1:null,
      support2:null,
      resistance1:null,
      resistance2:null
    };
  }

  /*
    支撐：
    1. MA5 / MA20
    2. 20日低點
    3. ATR 動態距離
  */

  const supportCandidates = [
    ma5,
    ma20,
    low20,
    atr !== null
      ? price - atr
      : null
  ]
    .filter(
      v =>
        v !== null &&
        v < price
    )
    .sort(
      (a,b) => b-a
    );

  /*
    壓力：
    1. 20日高點
    2. ATR 動態距離
    3. MA5 / MA20 上方參考
  */

  const resistanceCandidates = [
    high20,
    atr !== null
      ? price + atr
      : null,
    ma5,
    ma20
  ]
    .filter(
      v =>
        v !== null &&
        v > price
    )
    .sort(
      (a,b) => a-b
    );

  let support1 =
    supportCandidates[0] ?? null;

  let support2 =
    supportCandidates[1] ?? null;

  let resistance1 =
    resistanceCandidates[0] ?? null;

  let resistance2 =
    resistanceCandidates[1] ?? null;

  /*
    如果資料不足，
    使用 ATR 或百分比補值，
    確保畫面不會全部變成空白。
  */

  if(
    support1 === null
  ){
    support1 =
      atr !== null
        ? price - atr
        : price * .97;
  }

  if(
    support2 === null
  ){
    support2 =
      atr !== null
        ? price - atr * 2
        : price * .94;
  }

  if(
    resistance1 === null
  ){
    resistance1 =
      atr !== null
        ? price + atr
        : price * 1.03;
  }

  if(
    resistance2 === null
  ){
    resistance2 =
      atr !== null
        ? price + atr * 2
        : price * 1.06;
  }

  return {
    support1,
    support2,
    resistance1,
    resistance2
  };
}

/* =========================================================
   V1491｜完整個股分析
========================================================= */

async function buildStockAnalysis(
  stock
){

  if(!stock){
    return null;
  }

  let history =
    stock?.technical?.history;

  if(
    !Array.isArray(history) ||
    history.length === 0
  ){
    try{
      history =
        await getDailyK(
          stock.code
        );
    }catch(error){

      console.warn(
        "buildStockAnalysis history:",
        error
      );

      history = [];
    }
  }

  let technical;

  try{

    technical =
      enrichTechnicalData(
        buildTechnicalData(
          stock,
          history
        )
      );

  }catch(error){

    console.warn(
      "buildStockAnalysis technical:",
      error
    );

    technical =
      enrichTechnicalData({
        history,
        price:numberValue(stock.price),
        changePct:numberValue(
          stock.changePct
        )
      });
  }


  const result = {
    ...stock,
    technical
  };


  /*
    確保現價與漲跌幅同步
  */

  result.price =
    numberValue(
      technical.price
    ) ??
    numberValue(
      stock.price
    );

  result.changePct =
    numberValue(
      technical.dayChangePct
    ) ??
    numberValue(
      stock.changePct
    );

  result.dayChangePct =
    result.changePct;


  /*
    技術分數
  */

  result.trendScore =
    getTrendScore(result);

  result.volumeScore =
    getVolumeScore(result);

  result.breakoutScore =
    getBreakoutScore(result);

  result.readyScore =
    getReadyScore(result);

  result.bullishScore =
    getBullishScore(result);


  /*
    綜合分數
  */

  result.compositeScore =
    clamp(
      result.trendScore * .35 +
      result.volumeScore * .20 +
      result.breakoutScore * .25 +
      result.readyScore * .20,
      0,
      100
    );


  /*
    支撐壓力
  */

  result.levels =
    calculateLevels(
      result
    );

  result.support1 =
    result.levels.support1;

  result.support2 =
    result.levels.support2;

  result.resistance1 =
    result.levels.resistance1;

  result.resistance2 =
    result.levels.resistance2;


  /*
    操作訊號
  */

  if(
    result.compositeScore >= 80
  ){
    result.signal =
      "強勢多頭";
  }
  else if(
    result.compositeScore >= 70
  ){
    result.signal =
      "偏多";
  }
  else if(
    result.compositeScore >= 55
  ){
    result.signal =
      "中性偏多";
  }
  else if(
    result.compositeScore >= 40
  ){
    result.signal =
      "中性";
  }
  else{
    result.signal =
      "偏弱";
  }


  /*
    分析理由
  */

  const reasons = [];

  if(
    result.trendScore >= 70
  ){
    reasons.push(
      "股價與均線結構偏多"
    );
  }

  if(
    result.volumeScore >= 75
  ){
    reasons.push(
      "成交量明顯放大"
    );
  }

  if(
    result.breakoutScore >= 75
  ){
    reasons.push(
      "接近或突破近期壓力"
    );
  }

  if(
    result.readyScore >= 70
  ){
    reasons.push(
      "具備起飛準備條件"
    );
  }

  if(
    !reasons.length
  ){
    reasons.push(
      "目前訊號尚未形成明確共振"
    );
  }

  result.reasons =
    reasons;


  STATE.current =
    result;

  STATE.currentStock =
    result;

  STATE.lastAnalysis =
    result;

  current =
    result;

  return result;
}

========================================================= */

async function prepareHotCandidate(
  stock
){

  if(!stock){
    return null;
  }

  try{

    const result =
      await buildStockAnalysis(
        stock
      );

    if(!result){
      return null;
    }

    const score =
      getBullishScore(
        result
      );

    return {
      ...result,
      hotScore:score
    };

  }catch(error){

    console.warn(
      "prepareHotCandidate:",
      stock?.code,
      error
    );

    return null;
  }
}


/* =========================================================
   V1491｜原始30
========================================================= */

async function scanOriginal30(){

  const universe =
    getScanUniverse();

  if(!universe.length){
    return [];
  }

  const candidates = [];

  /*
    原始30先使用市場資料快速初篩，
    再進一步做完整技術分析。
  */

  const sorted =
    [...universe]
      .filter(
        stock =>
          numberValue(
            stock.price
          ) !== null
      )
      .sort(
        (a,b) =>
          Math.abs(
            numberValue(
              b.changePct
            ) || 0
          ) -
          Math.abs(
            numberValue(
              a.changePct
            ) || 0
          )
      )
      .slice(0,80);

  for(
    const stock of sorted
  ){

    if(
      STATE.scan.cancelled
    ){
      break;
    }

    const result =
      await prepareHotCandidate(
        stock
      );

    if(result){
      candidates.push(
        result
      );
    }
  }

  return sortByScore(
    candidates
  ).slice(0,30);
}


/* =========================================================
   V1491｜熱門20
========================================================= */

async function scanHot20(){

  const universe =
    getScanUniverse();

  if(!universe.length){
    return [];
  }

  const sorted =
    [...universe]
      .filter(
        stock =>
          numberValue(
            stock.price
          ) !== null
      )
      .sort(
        (a,b) =>
          (
            numberValue(
              b.changePct
            ) || 0
          ) -
          (
            numberValue(
              a.changePct
            ) || 0
          )
      )
      .slice(0,60);

  const candidates = [];

  for(
    const stock of sorted
  ){

    if(
      STATE.scan.cancelled
    ){
      break;
    }

    const result =
      await prepareHotCandidate(
        stock
      );

    if(result){

      const volumeScore =
        getVolumeScore(
          result
        );

      result.hotScore =
        result.compositeScore * .7 +
        volumeScore * .3;

      candidates.push(
        result
      );
    }
  }

  return candidates
    .sort(
      (a,b) =>
        b.hotScore -
        a.hotScore
    )
    .slice(0,20);
}

/* =========================================================
   V1491｜執行掃描
========================================================= */

async function runScan(
  type
){

  if(STATE.scan.running){

    showToast(
      "目前正在掃描，請稍候"
    );

    return;
  }

  STATE.scan.running = true;
  STATE.scan.type = type;
  STATE.scan.cancelled = false;

  const buttons =
    document.querySelectorAll(
      ".scan-btn"
    );

  buttons.forEach(
    button =>
      button.classList.remove(
        "active"
      )
  );

  const buttonMap = {
    original30:
      "original30Btn",

    hot20:
      "hot20Btn",

    breakout:
      "breakoutBtn",

    ready:
      "readyBtn",

    bullish:
      "bullishBtn"
  };

  const activeButton =
    document.getElementById(
      buttonMap[type]
    );

  if(activeButton){
    activeButton.classList.add(
      "active"
    );
  }

  setScanStatus(
    "正在載入市場資料…"
  );

  try{

    if(
      !Array.isArray(
        STATE.stocks
      ) ||
      STATE.stocks.length === 0
    ){

      await getMarketToday();
    }

    if(
      !STATE.stocks.length
    ){
      throw new Error(
        "市場資料為空"
      );
    }

    setScanStatus(
      `正在掃描 ${STATE.stocks.length} 檔…`
    );

    let results = [];

    if(type === "original30"){
      results =
        await scanOriginal30();
    }
    else if(type === "hot20"){
      results =
        await scanHot20();
    }
    else if(type === "breakout"){
      results =
        await scanBreakout();
    }
    else if(type === "ready"){
      results =
        await scanReady();
    }
    else if(type === "bullish"){
      results =
        await scanBullish();
    }

    STATE.scan.results =
      results;

    renderScanResults(
      results,
      type
    );

    setScanStatus(
      `完成｜${results.length} 檔`,
      "ok"
    );

    showToast(
      `掃描完成，共 ${results.length} 檔`
    );

    return results;

  }catch(error){

    console.error(
      "runScan:",
      error
    );

    setScanStatus(
      "掃描失敗",
      "error"
    );

    const box =
      document.getElementById(
        "resultsContent"
      );

    if(box){

      box.innerHTML = `
        <div class="error-box">
          掃描失敗：${
            error?.message ||
            "未知錯誤"
          }
        </div>
      `;
    }

    showToast(
      "掃描失敗，請稍後再試"
    );

    return [];

  }finally{

    STATE.scan.running =
      false;

    STATE.scan.cancelled =
      false;
  }
}/* =========================================================
   V1491｜五大按鈕綁定
========================================================= */

function bindScanButtons(){

  const buttonMap = {
    original30Btn:"original30",
    hot20Btn:"hot20",
    breakoutBtn:"breakout",
    readyBtn:"ready",
    bullishBtn:"bullish"
  };

  Object.entries(buttonMap)
    .forEach(
      ([id,type]) => {

        const button =
          document.getElementById(id);

        if(!button){
          console.warn(
            "V1491：找不到按鈕",
            id
          );
          return;
        }

        /*
          防止同一按鈕被重複綁定
        */
        if(button.dataset.bound === "1"){
          return;
        }

        button.dataset.bound = "1";

        button.addEventListener(
          "click",
          async function(event){

            event.preventDefault();
            event.stopPropagation();

            await runScan(type);
          }
        );
      }
    );
}

function ensureStockArray(){

  if(!Array.isArray(STATE.stocks)){
    STATE.stocks = [];
  }

  return STATE.stocks;
}


/* =========================================================
   V1491｜從市場資料補足股票
========================================================= */

function upsertStock(stock){

  if(!stock){
    return null;
  }

  const code =
    normalizeCode(stock.code);

  if(!code){
    return null;
  }

  const list =
    ensureStockArray();

  const index =
    list.findIndex(
      item =>
        normalizeCode(item.code) === code
    );

  if(index >= 0){

    list[index] = {
      ...list[index],
      ...stock
    };

    return list[index];
  }

  list.push(stock);

  return stock;
}


/* =========================================================
   V1491｜重新整理股票索引
========================================================= */

function rebuildStockIndex(){

  const source =
    Array.isArray(
      STATE.stocks
    )
      ? STATE.stocks
      : [];

  const map =
    new Map();

  for(const stock of source){

    if(!stock){
      continue;
    }

    const code =
      normalizeCode(
        stock.code
      );

    if(!code){
      continue;
    }

    map.set(
      code,
      stock
    );
  }

  STATE.stocks =
    [...map.values()];

  STATE.marketStocks =
    STATE.stocks;

  return STATE.stocks;
}

){

  let stock =

  if(!stock){

/* =========================================================
   V1491｜掃描結果快速統計
========================================================= */

function getScanSummary(
  results
){

  const list =
    Array.isArray(results)
      ? results
      : [];

  if(!list.length){

    return {
      count:0,
      averageScore:null,
      strongest:null
    };
  }

  const scores =
    list
      .map(
        item =>
          numberValue(
            item.compositeScore
          )
      )
      .filter(
        value =>
          value !== null
      );

  return {
    count:list.length,

    averageScore:
      scores.length
        ? avg(scores)
        : null,

    strongest:
      [...list].sort(
        (a,b) =>
          (
            numberValue(
              b.compositeScore
            ) || 0
          ) -
          (
            numberValue(
              a.compositeScore
            ) || 0
          )
      )[0] || null
  };
}

}/* =========================================================
   V1491｜資料快取／歷史資料核心
========================================================= */

function _v1491HistoryNumber(value){

  if(
    value === null ||
    value === undefined ||
    value === ""
  ){
    return null;
  }

  const n =
    Number(
      String(value)
        .replace(/,/g,"")
        .trim()
    );

  return Number.isFinite(n)
    ? n
    : null;
}


/* =========================================================
   V1491｜歷史資料解析
========================================================= */

function _v1491ParseHistoryRows(
  json
){

  const rows =
    Array.isArray(json?.data)
      ? json.data
      : [];

  return rows
    .map(
      row => {

        if(!Array.isArray(row)){
          return null;
        }

        const date =
          row[0];

        const open =
          _v1491HistoryNumber(
            row[1]
          );

        const high =
          _v1491HistoryNumber(
            row[2]
          );

        const low =
          _v1491HistoryNumber(
            row[3]
          );

        const close =
          _v1491HistoryNumber(
            row[4]
          );

        const volume =
          _v1491HistoryNumber(
            row[8] ??
            row[5]
          );

        if(
          !date ||
          close === null
        ){
          return null;
        }

        return {
          date,
          open,
          high,
          low,
          close,
          volume
        };
      }
    )
    .filter(Boolean);
}


/* =========================================================
   V1491｜取得日K
========================================================= */

async function getDailyK(
  code
){

  const stockCode =
    normalizeCode(code);

  if(!stockCode){
    return [];
  }

  /*
    優先使用快取
  */

  if(
    STATE.cache.history.has(
      stockCode
    )
  ){

    return STATE.cache.history.get(
      stockCode
    );
  }

  const jobs = [];
  const now =
    new Date();

  /*
    最近六個月份
  */

  for(
    let i = 0;
    i < 6;
    i++
  ){

    const d =
      new Date(
        now.getFullYear(),
        now.getMonth() - i,
        1
      );

    const yyyy =
      d.getFullYear();

    const mm =
      String(
        d.getMonth() + 1
      ).padStart(
        2,
        "0"
      );

    const url =
      API.day +
      "?response=json" +
      "&date=" +
      encodeURIComponent(
        `${yyyy}${mm}01`
      ) +
      "&stockNo=" +
      encodeURIComponent(
        stockCode
      );

    jobs.push(
      safeFetchJSON(
        url,
        {
          headers:{
            Accept:
              "application/json"
          }
        }
      )
    );
  }

  const responses =
    await Promise.allSettled(
      jobs
    );

  const rows = [];

  for(
    const item of responses
  ){

    if(
      item.status !==
      "fulfilled"
    ){
      continue;
    }

    rows.push(
      ..._v1491ParseHistoryRows(
        item.value
      )
    );
  }

  /*
    同日期去重
  */

  const unique =
    new Map();

  for(
    const row of rows
  ){

    unique.set(
      row.date,
      row
    );
  }

  const result =
    [...unique.values()]
      .sort(
        (a,b) =>
          String(a.date)
            .localeCompare(
              String(b.date)
            )
      );

  STATE.cache.history.set(
    stockCode,
    result
  );

  return result;
}


/* =========================================================
   V1491｜歷史平均
========================================================= */

function _v1491Avg(
  values
){

  const arr =
    values
      .map(
        _v1491HistoryNumber
      )
      .filter(
        value =>
          value !== null
      );

  if(!arr.length){
    return null;
  }

  return (
    arr.reduce(
      (sum,value) =>
        sum + value,
      0
    ) / arr.length
  );
}


function _v1491Max(
  values
){

  const arr =
    values
      .map(
        _v1491HistoryNumber
      )
      .filter(
        value =>
          value !== null
      );

  return arr.length
    ? Math.max(...arr)
    : null;
}


function _v1491Min(
  values
){

  const arr =
    values
      .map(
        _v1491HistoryNumber
      )
      .filter(
        value =>
          value !== null
      );

  return arr.length
    ? Math.min(...arr)
    : null;
}


/* =========================================================
   V1491｜ATR
========================================================= */

function _v1491ATR(
  history,
  period=14
){

  if(
    !Array.isArray(history) ||
    history.length < 2
  ){
    return null;
  }

  const tr = [];

  for(
    let i = 1;
    i < history.length;
    i++
  ){

    const h =
      _v1491HistoryNumber(
        history[i].high
      );

    const l =
      _v1491HistoryNumber(
        history[i].low
      );

    const previousClose =
      _v1491HistoryNumber(
        history[i-1].close
      );

    if(
      h === null ||
      l === null ||
      previousClose === null
    ){
      continue;
    }

    tr.push(
      Math.max(
        h - l,
        Math.abs(
          h - previousClose
        ),
        Math.abs(
          l - previousClose
        )
      )
    );
  }

  return _v1491Avg(
    tr.slice(-period)
  );
}


/* =========================================================
   V1491｜建立技術資料
========================================================= */

function buildTechnicalData(
  stock,
  history=[]
){

  const rows =
    Array.isArray(history)
      ? history
      : [];

  const closes =
    rows
      .map(
        row =>
          row.close
      )
      .filter(
        value =>
          _v1491HistoryNumber(
            value
          ) !== null
      );

  const highs =
    rows
      .map(
        row =>
          row.high
      )
      .filter(
        value =>
          _v1491HistoryNumber(
            value
          ) !== null
      );

  const lows =
    rows
      .map(
        row =>
          row.low
      )
      .filter(
        value =>
          _v1491HistoryNumber(
            value
          ) !== null
      );

  const volumes =
    rows
      .map(
        row =>
          row.volume
      )
      .filter(
        value =>
          _v1491HistoryNumber(
            value
          ) !== null
      );


  const current =
    _v1491HistoryNumber(
      stock?.price
    ) ??
    (
      closes.length
        ? closes[
            closes.length - 1
          ]
        : null
    );


  const previous =
    closes.length >= 2
      ? closes[
          closes.length - 2
        ]
      : null;


  const dayChangePct =
    current !== null &&
    previous !== null &&
    previous !== 0

      ? (
          (current - previous) /
          previous
        ) * 100

      : _v1491HistoryNumber(
          stock?.changePct
        );


  const ma5 =
    _v1491Avg(
      closes.slice(-5)
    );

  const ma20 =
    _v1491Avg(
      closes.slice(-20)
    );

  const ma60 =
    _v1491Avg(
      closes.slice(-60)
    );


  const high20 =
    _v1491Max(
      highs.slice(-20)
    );

  const low20 =
    _v1491Min(
      lows.slice(-20)
    );

  const high60 =
    _v1491Max(
      highs.slice(-60)
    );

  const low60 =
    _v1491Min(
      lows.slice(-60)
    );


  const avgVolume20 =
    _v1491Avg(
      volumes.slice(-20)
    );


  const latestVolume =
    volumes.length
      ? volumes[
          volumes.length - 1
        ]
      : _v1491HistoryNumber(
          stock?.volume
        );


  const volumeRatio =
    latestVolume !== null &&
    avgVolume20 !== null &&
    avgVolume20 > 0

      ? latestVolume /
        avgVolume20

      : null;


  return {

    history:rows,

    price:current,

    close:current,

    prev:previous,

    ma5,

    ma20,

    ma60,

    high20,

    low20,

    high60,

    low60,

    atr:
      _v1491ATR(
        rows,
        14
      ),

    dayChangePct,

    changePct:
      dayChangePct,

    volume:
      latestVolume,

    avgVolume20,

    volumeRatio
  };
}


/* =========================================================
   V1491｜技術資料數值標準化

function enrichTechnicalData(

/* =========================================================
   V1491｜即時報價／股票資料載入
========================================================= */

async function loadStockData(input){

  const code =
    typeof input === "object"
      ? normalizeCode(input.code)
      : normalizeCode(input);

  if(!code){
    return null;
  }

  let base =
    typeof input === "object"
      ? createStockBase(input)
      : findStock(code);

  if(!base){

    base =
      createStockBase({
        code,
        name:code,
        market:detectMarket(code)
      });
  }


  /* -------------------------------------------------------
     即時行情
  ------------------------------------------------------- */

  try{

    const market =
      base.market ||
      detectMarket(code);

    /*
      TWSE MIS：
      上市股票使用 tse
      上櫃股票使用 otc
    */

    const exchange =
      market === "tpex"
        ? "otc"
        : "tse";

    const url =
      API.quote +
      "?ex_ch=" +
      encodeURIComponent(
        exchange +
        "_" +
        code +
        ".tw"
      ) +
      "&json=1&delay=0";


    const json =
      await safeFetchJSON(
        url
      );


    const q =
      Array.isArray(
        json?.msgArray
      )
        ? json.msgArray[0]
        : null;


    if(q){

      const price =
        _v1491HistoryNumber(
          q.z === "-"
            ? q.pz
            : q.z
        );

      const previous =
        _v1491HistoryNumber(
          q.y
        );

      const changePct =
        price !== null &&
        previous !== null &&
        previous !== 0

          ? (
              (price - previous) /
              previous
            ) * 100

          : _v1491HistoryNumber(
              base.changePct
            );


      base = {
        ...base,

        price:
          price ??
          base.price,

        prev:
          previous ??
          base.prev,

        changePct,

        dayChangePct:
          changePct,

        open:
          _v1491HistoryNumber(
            q.o
          ) ??
          base.open,

        high:
          _v1491HistoryNumber(
            q.h
          ) ??
          base.high,

        low:
          _v1491HistoryNumber(
            q.l
          ) ??
          base.low,

        volume:
          _v1491HistoryNumber(
            q.v
          ) ??
          base.volume,

        name:
          q.n ||
          base.name
      };


      STATE.cache.quotes.set(
        code,
        base
      );
    }

  }catch(error){

    console.warn(
      "V1491 quote:",
      code,
      error
    );
  }


  /* -------------------------------------------------------
     歷史日K
  ------------------------------------------------------- */

  try{

    const history =
      await getDailyK(
        code
      );


    const technical =
      enrichTechnicalData(
        buildTechnicalData(
          base,
          history
        )
      );


    base = {
      ...base,

      technical,

      price:
        technical.price ??
        base.price,

      changePct:
        technical.dayChangePct ??
        base.changePct,

      dayChangePct:
        technical.dayChangePct ??
        base.dayChangePct,

      volume:
        technical.volume ??
        base.volume
    };

  }catch(error){

    console.warn(
      "V1491 history:",
      code,
      error
    );
  }


  /*
    更新全域目前股票
  */

  STATE.current =
    base;

  STATE.currentStock =
    base;

  current =
    base;


  /*
    更新市場股票索引
  */

  upsertStock(
    base
  );

  rebuildStockIndex();


  return base;
}


/* =========================================================
   V1491｜個股資料快速取得
========================================================= */

async function getStock(
  code
){

  const normalized =
    normalizeCode(code);

  if(!normalized){
    return null;
  }

  const cached =
    STATE.cache.quotes.get(
      normalized
    );

  if(cached){
    return cached;
  }

  return await loadStockData(
    normalized
  );
}


/* =========================================================
   V1491｜目前股票資訊
========================================================= */

function getCurrentStock(){

  return (
    STATE.current ||
    STATE.currentStock ||
    current ||
    null
  );
}


/* =========================================================
   V1491｜目前股票代號
========================================================= */

function getCurrentCode(){

  const stock =
    getCurrentStock();

  return stock
    ? normalizeCode(
        stock.code
      )
    : "";
}


/* =========================================================
   V1491｜目前股票價格
========================================================= */

function getCurrentPrice(){

  const stock =
    getCurrentStock();

  if(!stock){
    return null;
  }

  return (
    numberValue(
      stock.price
    ) ??
    numberValue(
      stock.technical?.price
    )
  );
}


/* =========================================================
   V1491｜完整分析包裝
========================================================= */

async function analyzeStock(
  code
){

  const stock =
    await getStock(
      code
    );

  if(!stock){
    return null;
  }

  const result =
    await buildStockAnalysis(
      stock
    );

  if(!result){
    return null;
  }

  STATE.current =
    result;

  STATE.currentStock =
    result;

  STATE.lastAnalysis =
    result;

  current =
    result;


  renderCurrentStock(
    result
  );

  renderTechnical(
    result
  );

  renderLevels(
    result
  );

  renderAnalysis(
    result
  );


  return result;
}


/* =========================================================
   V1491｜搜尋流程最終保險
========================================================= */

async function searchAndAnalyze(
  keyword
){

  const value =
    String(
      keyword || ""
    ).trim();

  if(!value){

    showToast(
      "請輸入股票代號或名稱"
    );

    return null;
  }


  try{

    await ensureSearchData();


    let stock =
      findStock(
        value
      );


    /*
      搜尋不到時，
      若輸入的是純數字代號，
      直接建立股票資料。
    */

    if(
      !stock &&
      /^\d{4,6}$/.test(
        value
      )
    ){

      stock =
        createStockBase({
          code:value,
          name:value,
          market:
            detectMarket(value)
        });
    }


    if(!stock){

      showToast(
        `找不到「${value}」`
      );

      return null;
    }


    return await analyzeStock(
      stock.code
    );

  }catch(error){

    console.error(
      "searchAndAnalyze:",
      error
    );

    showToast(
      "搜尋分析失敗"
    );

    return null;
  }
}


/* =========================================================
   V1491｜重新綁定搜尋
========================================================= */

function forceBindSearch(){

  const input =
    document.getElementById(
      "stockSearch"
    );

  if(!input){
    return;
  }

  /*
    如果之前已經綁定，
    不重複綁定。
  */

  if(
    input.dataset.v1491SearchBound ===
    "1"
  ){
    return;
  }

  input.dataset.v1491SearchBound =
    "1";


  input.addEventListener(
    "keydown",
    async function(event){

      if(
        event.key !==
        "Enter"
      ){
        return;
      }

      event.preventDefault();

      const value =
        this.value.trim();

      if(value){

        await searchAndAnalyze(
          value
        );
      }
    }
  );


  input.addEventListener(
    "input",
    function(){

      const value =
        this.value.trim();

      if(value){

        renderSearchSuggestions(
          value
        );

      }else{

        clearSearchSuggestions();
      }
    }
  );
}


/* =========================================================
   V1491｜重新綁定五大掃描按鈕
========================================================= */

function forceBindScanButtons(){

  const mapping = {
    original30Btn:
      "original30",

    hot20Btn:
      "hot20",

    breakoutBtn:
      "breakout",

    readyBtn:
      "ready",

    bullishBtn:
      "bullish"
  };


  Object.entries(
    mapping
  ).forEach(
    ([id,type]) => {

      const button =
        document.getElementById(
          id
        );

      if(!button){
        return;
      }

      if(
        button.dataset
          .v1491ScanBound ===
        "1"
      ){
        return;
      }

      button.dataset
        .v1491ScanBound =
        "1";


      button.addEventListener(
        "click",
        async function(event){

          event.preventDefault();

          if(
            STATE.scan.running
          ){

            showToast(
              "正在掃描中，請稍候"
            );

            return;
          }

          try{

            setScanButtonsDisabled(
              true
            );

            const results =
              await runScanCore(
                type
              );

            STATE.scan.results =
              results;

            renderScanResults(
              results,
              type
            );

            renderScanSummary(
              results
            );

            setScanStatus(
              `完成｜${results.length} 檔`,
              "ok"
            );

          }catch(error){

            console.error(
              "forceBindScanButtons:",
              error
            );

            setScanStatus(
              "掃描失敗",
              "error"
            );

            showToast(
  "掃描失敗"
);

          }finally{

            setScanButtonsDisabled(
              false
            );
          }
        }
      );
    }
  );
}
/* =========================================================
   V1491｜最終事件保險層
========================================================= */

function bindFinalSafetyLayer(){

  /*
    搜尋框
  */

  const searchInput =
    document.getElementById(
      "stockSearch"
    );

  if(searchInput){

    searchInput.addEventListener(
      "keydown",
      async function(event){

        if(
          event.key !== "Enter"
        ){
          return;
        }

        event.preventDefault();

        const keyword =
          this.value.trim();

        if(!keyword){
          showToast(
            "請輸入股票代號或名稱"
          );
          return;
        }

        await searchAndAnalyze(
          keyword
        );
      }
    );
  }


  /*
    五大按鈕
  */

  const scanMap = {
    original30Btn:"original30",
    hot20Btn:"hot20",
    breakoutBtn:"breakout",
    readyBtn:"ready",
    bullishBtn:"bullish"
  };


  Object.entries(
    scanMap
  ).forEach(
    ([id,type]) => {

      const button =
        document.getElementById(id);

      if(!button){
        return;
      }

      if(
        button.dataset
          .finalBound === "1"
      ){
        return;
      }

      button.dataset.finalBound =
        "1";


      button.addEventListener(
        "click",
        async function(event){

          event.preventDefault();
          event.stopPropagation();

          if(
            STATE.scan.running
          ){
            showToast(
              "正在掃描中，請稍候"
            );
            return;
          }

          try{

            STATE.scan.running =
              true;

            STATE.scan.type =
              type;

            setScanButtonsDisabled(
              true
            );

            setScanStatus(
              "正在掃描…"
            );


            await ensureSearchData();


            let results = [];


            if(type === "original30"){

              results =
                await scanOriginal30();

            }
            else if(type === "hot20"){

              results =
                await scanHot20();

            }
            else if(type === "breakout"){

              results =
                await scanBreakout();

            }
            else if(type === "ready"){

              results =
                await scanReady();

            }
            else if(type === "bullish"){

              results =
                await scanBullish();
            }


            STATE.scan.results =
              results;


            renderScanResults(
              results,
              type
            );

            renderScanSummary(
              results
            );


            setScanStatus(
              `完成｜${results.length} 檔`,
              "ok"
            );


            showToast(
              `掃描完成，共 ${results.length} 檔`
            );

          }catch(error){

            console.error(
              "Final scan:",
              error
            );

            setScanStatus(
              "掃描失敗",
              "error"
            );

            showToast(
  "掃描失敗，請稍後再試"
);
          }finally{

            STATE.scan.running =
              false;

            setScanButtonsDisabled(
              false
            );
          }
        }
      );
    }
  );
}


/* =========================================================
   V1491｜快速按鈕最終保險
========================================================= */

function bindFinalQuickButtons(){

  document
    .querySelectorAll(
      ".quick-btn[data-code]"
    )
    .forEach(
      button => {

        if(
          button.dataset
            .finalQuickBound === "1"
        ){
          return;
        }

        button.dataset
          .finalQuickBound =
          "1";


        button.addEventListener(
          "click",
          async function(event){

            event.preventDefault();

            const code =
              this.dataset.code;

            if(!code){
              return;
            }

            await searchAndAnalyze(
              code
            );
          }
        );
      }
    );
}


/* =========================================================
   V1491｜搜尋建議最終保險
========================================================= */

function bindSuggestionLayer(){

  const box =
    document.getElementById(
      "searchSuggestions"
    );

  if(!box){
    return;
  }

  if(
    box.dataset
      .finalBound === "1"
  ){
    return;
  }

  box.dataset.finalBound =
    "1";


  box.addEventListener(
    "click",
    async function(event){

      const item =
        event.target.closest(
          ".suggest-item"
        );

      if(!item){
        return;
      }

      const code =
        item.dataset.code;

      if(!code){
        return;
      }

      await searchAndAnalyze(
        code
      );

      box.classList.add(
        "hidden"
      );
    }
  );
}


/* =========================================================

function finalBootV1491(){

  try{

    bindFinalSafetyLayer();

    bindFinalQuickButtons();

    bindSuggestionLayer();

    updateMarketStatus();

    console.log(

}

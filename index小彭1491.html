<!DOCTYPE html>
<html lang="zh-Hant">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<meta
  name="theme-color"
  content="#080a0c"
>

<meta
  name="apple-mobile-web-app-capable"
  content="yes"
>

  name="apple-mobile-web-app-status-bar-style"

<title>

</title>


<style>

/* =========================================================
   V1491｜GLOBAL
========================================================= */

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  padding:0;
  min-height:100vh;

  background:
    radial-gradient(
      circle at 50% -10%,
      #1a222b 0,
      #0b0e11 38%,
      #080a0c 75%
    );

  color:#f3f5f7;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "PingFang TC",
    "Noto Sans TC",
    "Microsoft JhengHei",
    sans-serif;

  -webkit-font-smoothing:antialiased;
}


/* =========================================================
   ROOT COLORS
========================================================= */

:root{

  --bg:#080a0c;

  --panel:#101419;

  --panel2:#14191f;

  --panel3:#1b2229;

  --line:#29323b;

  --line2:#35414b;

  --text:#f3f5f7;

  --muted:#8d99a5;

  --green:#21d07a;

  --green2:#13b968;

  --red:#ff5364;

  --red2:#e63e50;

  --yellow:#ffc857;

  --orange:#ff9f43;

  --blue:#4da3ff;

  --cyan:#35d6e7;

  --purple:#a77bff;

  --white:#ffffff;

}


/* =========================================================
   COMMON
========================================================= */

button,
input,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

button:disabled{
  cursor:not-allowed;
  opacity:.5;
}

.hidden{
  display:none !important;
}

.muted{
  color:var(--muted);
}

.green{
  color:var(--green);
}

.red{
  color:var(--red);
}

.yellow{
  color:var(--yellow);
}

.blue{
  color:var(--blue);
}

.orange{
  color:var(--orange);
}

.purple{
  color:var(--purple);
}


/* =========================================================
   TOP BAR
========================================================= */

.topbar{

  position:sticky;

  top:0;

  z-index:1000;

  padding:
    calc(9px + env(safe-area-inset-top))
    12px
    9px;

  background:
    rgba(8,10,12,.94);

  border-bottom:
    1px solid rgba(255,255,255,.07);

  backdrop-filter:
    blur(18px);

  -webkit-backdrop-filter:
    blur(18px);
}


.topbar-inner{

  width:min(
    1180px,
    calc(100% - 4px)
  );

  margin:auto;

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:12px;
}


.brand{

  min-width:0;
}


.brand-title{

  font-size:20px;

  line-height:1.15;

  font-weight:950;

  letter-spacing:.3px;

  white-space:nowrap;
}


.brand-title span{

  color:var(--cyan);
}


.brand-sub{

  margin-top:4px;

  font-size:10px;

  line-height:1.4;

  color:var(--muted);

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;
}


.market-status{

  flex:none;

  display:flex;

  align-items:center;

  gap:6px;

  padding:
    6px 9px;

  border:
    1px solid rgba(33,208,122,.2);

  border-radius:999px;

  background:
    rgba(33,208,122,.06);

  color:#9ba6af;

  font-size:10px;

  white-space:nowrap;
}


.market-dot{

  width:7px;

  height:7px;

  border-radius:50%;

  background:var(--green);

  box-shadow:
    0 0 9px rgba(33,208,122,.75);
}


/* =========================================================
   MAIN
========================================================= */

.container{

  width:min(
    1180px,
    calc(100% - 20px)
  );

  margin:
    14px auto
    60px;
}


/* =========================================================
   CARD
========================================================= */

.card{

  position:relative;

  margin-bottom:12px;

  padding:14px;

  background:
    linear-gradient(
      145deg,
      rgba(20,25,31,.98),
      rgba(13,17,21,.98)
    );

  border:
    1px solid var(--line);

  border-radius:17px;

  box-shadow:
    0 10px 30px rgba(0,0,0,.18);
}


.card-title{

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:8px;

  margin-bottom:11px;
}


.card-title h2{

  margin:0;

  font-size:15px;

  font-weight:900;

  letter-spacing:.2px;
}


.card-title small{

  color:var(--muted);

  font-size:10px;
}


/* =========================================================
   SEARCH
========================================================= */

.search-card{

  padding:15px;

  border-color:#303b45;

  background:
    linear-gradient(
      145deg,
      #151b21,
      #0d1115
    );
}


.search-title{

  display:flex;

  align-items:center;

  gap:8px;

  margin-bottom:11px;

  font-size:15px;

  font-weight:950;
}


.search-title .icon{

  display:flex;

  align-items:center;

  justify-content:center;

  width:28px;

  height:28px;

  border-radius:9px;

  background:
    rgba(53,214,231,.1);

  border:
    1px solid rgba(53,214,231,.18);
}


.search-row{

  display:flex;

  gap:8px;

  align-items:stretch;
}


.search-input-wrap{

  position:relative;

  flex:1;

  min-width:0;
}


#searchInput{

  width:100%;

  height:46px;

  padding:
    0 13px;

  color:var(--text);

  background:#090c0f;

  border:
    1px solid #35404a;

  border-radius:12px;

  outline:none;

  font-size:15px;

  transition:
    border-color .2s,
    box-shadow .2s;
}


#searchInput::placeholder{

  color:#65717c;
}


#searchInput:focus{

  border-color:
    rgba(53,214,231,.65);

  box-shadow:
    0 0 0 3px
    rgba(53,214,231,.08);
}


#searchBtn{

  flex:none;

  min-width:78px;

  height:46px;

  padding:
    0 16px;

  border:0;

  border-radius:12px;

  color:#061014;

  background:
    linear-gradient(
      135deg,
      #35d6e7,
      #4da3ff
    );

  font-size:14px;

  font-weight:950;

  box-shadow:
    0 7px 20px
    rgba(53,214,231,.14);

  transition:
    transform .15s,
    filter .15s;
}


#searchBtn:active{

  transform:scale(.97);
}


#searchBtn:hover{

  filter:brightness(1.08);
}


/* =========================================================
   SEARCH CANDIDATES
========================================================= */

#searchCandidates{

  position:absolute;

  left:0;

  right:0;

  top:51px;

  z-index:900;

  display:none;

  max-height:310px;

  overflow-y:auto;

  background:
    #11161b;

  border:
    1px solid #35404a;

  border-radius:13px;

  box-shadow:
    0 18px 45px rgba(0,0,0,.5);

  overflow-x:hidden;
}


#searchCandidates.show{

  display:block;
}


.search-candidate{

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:10px;

  width:100%;

  min-height:48px;

  padding:
    8px 12px;

  border:0;

  border-bottom:
    1px solid rgba(255,255,255,.05);

  color:var(--text);

  background:transparent;

  text-align:left;
}


.search-candidate:last-child{

  border-bottom:0;
}


.search-candidate:hover{

  background:
    rgba(255,255,255,.05);
}


.search-candidate-main{

  min-width:0;
}


.search-candidate-name{

  font-size:13px;

  font-weight:850;

  overflow:hidden;

  text-overflow:ellipsis;

  white-space:nowrap;
}


.search-candidate-code{

  margin-top:2px;

  color:var(--muted);

  font-size:10px;
}


.search-candidate-market{

  flex:none;

  color:var(--cyan);

  font-size:9px;

  padding:
    3px 6px;

  border-radius:6px;

  background:
    rgba(53,214,231,.08);
}


/* =========================================================
   QUICK SEARCH
========================================================= */

.quick-title{

  margin:
    12px 0 8px;

  color:var(--muted);

  font-size:10px;
}


.quick-grid{

  display:grid;

  grid-template-columns:
    repeat(5,1fr);

  gap:7px;
}


.quick-btn{

  min-width:0;

  min-height:38px;

  padding:
    7px 5px;

  color:#dce2e6;

  background:
    #0b0f12;

  border:
    1px solid #2b343c;

  border-radius:10px;

  font-size:11px;

  font-weight:800;

  transition:
    background .15s,
    border-color .15s,
    transform .15s;
}


.quick-btn:hover{

  background:#151b20;

  border-color:#46525c;
}


.quick-btn:active{

  transform:scale(.97);
}


/* =========================================================
   SEARCH STATUS
========================================================= */

#searchStatus{

  min-height:17px;

  margin-top:9px;

  color:var(--muted);

  font-size:10px;

  line-height:1.5;
}


/* =========================================================
   ACTION BUTTONS
========================================================= */

.action-grid{

  display:grid;

  grid-template-columns:
    repeat(2,1fr);

  gap:8px;
}


.action-btn{

  min-height:43px;

  padding:
    9px 10px;

  color:#eef2f5;

  background:
    #11161b;

  border:
    1px solid #303a43;

  border-radius:11px;

  font-size:12px;

  font-weight:850;

  transition:
    transform .15s,
    background .15s,
    border-color .15s;
}


.action-btn:hover{

  background:#171d23;

  border-color:#46515b;
}


.action-btn:active{

  transform:scale(.98);
}


.action-btn.primary{

  color:#061014;

  background:
    linear-gradient(
      135deg,
      #35d6e7,
      #4da3ff
    );

  border-color:transparent;
}


.action-btn.green{

  border-color:
    rgba(33,208,122,.28);

  background:
    rgba(33,208,122,.07);

  color:
    #70e6a7;
}


.action-btn.red{

  border-color:
    rgba(255,83,100,.28);

  background:
    rgba(255,83,100,.07);

  color:
    #ff8b98;
}


.action-btn.yellow{

  border-color:
    rgba(255,200,87,.28);

  background:
    rgba(255,200,87,.07);

  color:
    #ffd978;
}


.action-btn.purple{

  border-color:
    rgba(167,123,255,.28);

  background:
    rgba(167,123,255,.07);

  color:
    #c7a9ff;
}


/* =========================================================
   SCAN MENU
========================================================= */

.scan-menu{

  display:grid;

  grid-template-columns:
    repeat(5,1fr);

  gap:7px;
}


.scan-btn{

  min-height:42px;

  padding:
    7px 5px;

  border:
    1px solid #303a43;

  border-radius:10px;

  color:#dce2e6;

  background:
    #0c1013;

  font-size:10px;

  font-weight:900;

  line-height:1.25;

  transition:.15s;
}


.scan-btn:hover{

  border-color:#4b5965;

  background:#171d22;
}


.scan-btn.hot{

  color:#ffd978;

  border-color:
    rgba(255,200,87,.28);

  background:
    rgba(255,200,87,.06);
}


.scan-btn.breakout{

  color:#75e8ac;

  border-color:
    rgba(33,208,122,.28);

  background:
    rgba(33,208,122,.06);
}


.scan-btn.ready{

  color:#7bc2ff;

  border-color:
    rgba(77,163,255,.28);

  background:
    rgba(77,163,255,.06);
}


.scan-btn.bullish{

  color:#c5a5ff;

  border-color:
    rgba(167,123,255,.28);

  background:
    rgba(167,123,255,.06);
}


/* =========================================================
   SECTION LABEL
========================================================= */

.section-label{

  display:flex;

  align-items:center;

  gap:7px;

  margin:
    15px 2px 8px;

  color:#c8d0d6;

  font-size:12px;

  font-weight:900;
}


.section-label::before{

  content:"";

  width:4px;

  height:15px;

  border-radius:99px;

  background:
    linear-gradient(
      #35d6e7,
      #4da3ff
    );
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:700px){

  .container{

    width:
      calc(100% - 14px);

    margin-top:9px;
  }

  .topbar{

    padding-left:9px;

    padding-right:9px;
  }

  .brand-title{

    font-size:17px;
  }

  .brand-sub{

    max-width:190px;
  }

  .market-status{

    font-size:9px;

    padding:
      5px 7px;
  }

  .card{

    padding:12px;

    border-radius:15px;
  }

  .quick-grid{

    grid-template-columns:
      repeat(5,1fr);
  }

  .scan-menu{

    grid-template-columns:
      repeat(2,1fr);
  }

}


@media(max-width:430px){

  .search-row{

    gap:6px;
  }

  #searchBtn{

    min-width:67px;

    padding:
      0 11px;

    font-size:13px;
  }

  .quick-btn{

    font-size:10px;
  }

  .action-grid{

    grid-template-columns:
      1fr 1fr;
  }

}


/* =========================================================
   TABLET / DESKTOP
========================================================= */

@media(min-width:900px){

  .container{

    margin-top:20px;
  }

  .search-card{

    padding:18px;
  }

  .quick-grid{

    grid-template-columns:
      repeat(10,1fr);
  }

  .scan-menu{

    grid-template-columns:
      repeat(5,1fr);
  }

}


/* =========================================================
   SCROLLBAR
========================================================= */

::-webkit-scrollbar{

  width:6px;

  height:6px;
}


::-webkit-scrollbar-track{

  background:#090c0f;
}


::-webkit-scrollbar-thumb{

  background:#303a43;

  border-radius:99px;
}


::-webkit-scrollbar-thumb:hover{

  background:#46525c;
}


/* =========================================================
   SELECTION
========================================================= */

::selection{

  color:#061014;

  background:#35d6e7;
}

</style>

</head>

/* =========================================================
   8. 安全數字
========================================================= */

function num(value){

  if(
    value === null ||
    value === undefined ||
    value === "" ||
    value === "--"
  ){
    return null;
  }

  if(typeof value === "number"){

    return Number.isFinite(value)
      ? value
      : null;

  }

  const cleaned = String(value)
    .replace(/,/g,"")
    .replace(/%/g,"")
    .trim();

  if(!cleaned){
    return null;
  }

  const n = Number(cleaned);

  return Number.isFinite(n)
    ? n
    : null;

}


/* =========================================================
   9. 數字格式
========================================================= */

function fmtNum(
  value,
  digits=2
){

  const n = num(value);

  if(n === null){
    return "--";
  }

  return n.toLocaleString(
    "zh-TW",
    {
      minimumFractionDigits:digits,
      maximumFractionDigits:digits
    }
  );

}


/* =========================================================
   10. 百分比格式
========================================================= */

function fmtPct(
  value,
  digits=2
){

  const n = num(value);

  if(n === null){
    return "--";
  }

  return (
    n >= 0 ? "+" : ""
  )
  +
  n.toFixed(digits)
  +
  "%";

}


/* =========================================================
   11. 安全文字
========================================================= */

function esc(value){

  return String(
    value ?? ""
  )
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");

}


/* =========================================================

========================================================= */

function todayString(){

  const d = new Date();

  const y =
    d.getFullYear();

  const m =
    String(
      d.getMonth()+1
    ).padStart(2,"0");

  const day =
    String(
      d.getDate()
    ).padStart(2,"0");

  return `${y}-${m}-${day}`;

}

/* =========================================================
   14. API FETCH
========================================================= */

async function fetchJSON(
  url,
  options={}
){

  const controller =
    new AbortController();

  const timeout =
    setTimeout(
      ()=>{
        controller.abort();
      },
      15000
    );

  try{

    const response =
      await fetch(
        url,
        {
          ...options,
          signal:
            controller.signal,
          cache:"no-store"
        }
      );

    if(!response.ok){

      throw new Error(
        `HTTP ${response.status}`
      );

    }

    return await response.json();

  }finally{

    clearTimeout(timeout);

  }

}


/* =========================================================
   15. 安全 API
========================================================= */

async function safeFetchJSON(
  url,
  options={}
){

  try{

    return await fetchJSON(
      url,
      options
    );

  }catch(error){

    console.warn(
      "[V1491 API]",
      url,
      error
    );

    return null;

  }

}

/* =========================================================
   29. 解析上市市場資料
========================================================= */

function normalizeTWSERow(row){

  if(!row){
    return null;
  }

  const code =
    normalizeCode(
      row.Code ||
      row.code ||
      row["證券代號"] ||
      row["股票代號"]
    );

  const name =
    row.Name ||
    row.name ||
    row["證券名稱"] ||
    row["股票名稱"] ||
    "--";

  if(!code){
    return null;
  }

  const price =
    num(
      row.ClosingPrice ||
      row.Close ||
      row["收盤價"] ||
      row["成交價"]
    );

  const change =
    num(
      row.Change ||
      row["漲跌價差"]
    );

  const volume =
    num(
      row.TradingVolume ||
      row.Volume ||
      row["成交股數"] ||
      row["成交量"]
    );

  const tradeValue =
    num(
      row.TradingTurnover ||
      row["成交金額"]
    );

  return createStockBase({

    code,

    name,

    market:"上市",

    price,

    prev:
      price !== null &&
      change !== null
        ? price - change
        : null,

    change,

    changePct:
      price !== null &&
      price - change !== 0 &&
      change !== null
        ? (
            change /
            (price - change)
          ) * 100
        : null,

    volume,

    tradeValue

  });

}

/* =========================================================
   33. 取得全市場
   使用 Promise.allSettled
   避免上市失敗連上櫃也一起失效
========================================================= */

async function getMarketToday(
  force=false
){

  if(
    !force &&
    STATE.market.loaded &&
    STATE.market.all.length
  ){

    return STATE.market.all;

  }


  setMarketStatus(
    "市場資料更新中…",
    true
  );


  const results =
    await Promise.allSettled([

      getTWSEAll(),

      getTPExAll()

    ]);


  const twse =
    results[0].status === "fulfilled"
      ? results[0].value
      : [];

  const tpex =
    results[1].status === "fulfilled"
      ? results[1].value
      : [];


  STATE.market.twse =
    Array.isArray(twse)
      ? twse
      : [];


  STATE.market.tpex =
    Array.isArray(tpex)
      ? tpex
      : [];


  STATE.market.all =
    [
      ...STATE.market.twse,
      ...STATE.market.tpex
    ];


  STATE.market.date =
    todayString();


  STATE.market.loaded =
    STATE.market.all.length > 0;


  const success =
    STATE.market.all.length > 0;


  setMarketStatus(
    success
      ? `市場 ${STATE.market.all.length} 檔`
      : "市場資料暫缺",
    success
  );


  return STATE.market.all;

}


/* =========================================================
   34. 取得股票名稱
========================================================= */

function getAlias(
  keyword
){

  const key =
    normalizeSearch(
      keyword
    );

  const keys =
    Object.keys(ALIASES);

  for(
    const name of keys
  ){

    if(
      normalizeSearch(name) === key
    ){

      return ALIASES[name];

    }

  }

  return null;

}


/* =========================================================
   35. 從市場資料找股票
========================================================= */

function findStock(
  keyword,
  market=STATE.market.all
){

  const q =
    normalizeSearch(
      keyword
    );

  if(!q){
    return null;
  }


  const alias =
    getAlias(q);


  if(alias){

    const exact =
      market.find(
        item =>
          normalizeCode(item.code) ===
          normalizeCode(alias.code)
      );

    if(exact){
      return exact;
    }

    return createStockBase(alias);

  }


  const exactCode =
    market.find(
      item =>
        normalizeCode(item.code) === q
    );


  if(exactCode){
    return exactCode;
  }


  const exactName =
    market.find(
      item =>
        normalizeSearch(item.name) === q
    );


  if(exactName){
    return exactName;
  }


  const partial =
    market.find(
      item =>
        normalizeSearch(item.name)
          .includes(q)
    );


  if(partial){
    return partial;
  }


  return null;

}


/* =========================================================
   36. 取得搜尋候選
========================================================= */

function getSearchCandidates(
  keyword,
  market=STATE.market.all
){

  const q =
    normalizeSearch(
      keyword
    );

  if(!q){
    return [];
  }


  const aliasMatches =
    Object.entries(ALIASES)
      .filter(
        ([name,item]) => {

          const nameUpper =
            normalizeSearch(name);

          return (
            nameUpper.includes(q) ||
            normalizeSearch(item.code)
              .includes(q)
          );

        }
      )
      .map(
        ([name,item]) => ({
          code:item.code,
          name:item.name || name,
          market:item.market || "--"
        })
      );


  const marketMatches =
    market
      .filter(
        item => {

          const code =
            normalizeSearch(
              item.code
            );

          const name =
            normalizeSearch(
              item.name
            );

          return (
            code.includes(q) ||
            name.includes(q)
          );

        }
      )
      .map(
        item => ({
          code:item.code,
          name:item.name,
          market:item.market
        })
      );


  const merged =
    [
      ...aliasMatches,
      ...marketMatches
    ];


  const unique =
    new Map();


  for(
    const item of merged
  ){

    const key =
      normalizeCode(
        item.code
      );

    if(
      !unique.has(key)
    ){

      unique.set(
        key,
        item
      );

    }

  }


  return [
    ...unique.values()
  ].slice(0,12);

}

            data-code="${esc(item.code)}"
          >

            <div class="search-candidate-main">

              <div class="search-candidate-name">
                ${esc(item.name)}
              </div>

              <div class="search-candidate-code">
                ${esc(item.code)}
              </div>

            </div>

            <div class="search-candidate-market">
              ${esc(item.market || "--")}
            </div>

          </button>

        `
      )
      .join("");


  box.classList.add(
    "show"
  );


  box
    .querySelectorAll(
      ".search-candidate"
    )
    .forEach(
      button => {

        button.addEventListener(
          "click",
          async () => {

            const code =
              button.dataset.code;

            const input =

            if(input){

              input.value =
                code;

            }

            box.classList.remove(
              "show"
            );

            await doSearch(
              code
            );

          }
        );

      }

/* =========================================================
   41. 搜尋主程式
========================================================= */

async function doSearch(
  keyword
){

  const q =
    String(
      keyword ??
      getSearchInput()?.value ??
      ""
    ).trim();


  if(!q){

    setSearchStatus(
      "請輸入股票代號或名稱"
    );

    return null;

  }


  setSearchStatus(
    `正在搜尋「${q}」…`
  );


  hideSearchCandidates();


  let market =
    STATE.market.all;


  if(
    !market.length
  ){

    market =
      await getMarketToday();

  }


  let stock =
    findStock(
      q,
      market
    );


  /*
   * 如果全市場資料尚未抓到，
   * 但使用者輸入的是固定別名，
   * 仍然允許後續即時 API 嘗試。
   */

  if(!stock){

    const alias =
      getAlias(q);

    if(alias){

      stock =
        createStockBase(
          alias
        );

    }

  }


  if(!stock){

    setSearchStatus(
      `找不到「${q}」，請確認代號或名稱`
    );

    setSystemMessage(
      "搜尋不到指定股票，沒有自行捏造資料。",
      "muted"
    );

    return null;

  }


  STATE.current =
    stock;

  current =
    stock;


  setSearchStatus(
    `已找到 ${stock.code}｜${stock.name}`
  );


  /*
   * 第 4 段開始：
   * 即時行情會再補完整資料。
   */

  if(
    typeof loadStockData ===
    "function"
  ){

    try{

      await loadStockData(
        stock.code
      );

    }catch(error){

      console.error(
        "[V1491 doSearch]",
        error
      );

    }

  }


  return stock;

}

/* =========================================================
   72. 安全排序
========================================================= */

function sortNumbers(
  values,
  descending=false
){

  return values
    .map(num)
    .filter(
      value =>
        value !== null &&
        Number.isFinite(value)
    )
    .sort(
      descending
        ? (a,b)=>b-a
        : (a,b)=>a-b
    );

}


/* =========================================================
   73. 建立價格候選
========================================================= */

function buildPriceCandidates(
  technical,
  price
){

  if(!technical){
    return [];
  }


  const values = [

    technical.ma5,

    technical.ma20,

    technical.ma60,

    technical.high20,

    technical.low20,

    technical.high60,

    technical.low60

  ];


  const atr =
    num(
      technical.atr
    );


  const current =
    num(price);


  if(
    current !== null &&
    atr !== null
  ){

    values.push(

      current - atr,

      current - atr * 1.5,

      current + atr,

      current + atr * 1.5

    );

  }


  return values
    .map(num)
    .filter(
      value =>
        value !== null &&
        value > 0
    );

}


/* =========================================================
   74. 動態支撐／壓力
========================================================= */

function dynamicLevels(
  technical,
  price
){

  if(!technical){

    return {

      support1:null,
      support2:null,

      resistance1:null,
      resistance2:null,

      source:[]

    };

  }


  const current =
    num(price);


  if(
    current === null
  ){

    return {

      support1:null,
      support2:null,

      resistance1:null,
      resistance2:null,

      source:[]

    };

  }


  const candidates =
    buildPriceCandidates(
      technical,
      current
    );


  /*
   * 價格下方＝支撐
   * 價格上方＝壓力
   */

  const supports =
    sortNumbers(
      candidates.filter(
        value =>
          value < current
      ),
      true
    );


  const resistances =
    sortNumbers(
      candidates.filter(
        value =>
          value > current
      ),
      false
    );


  /*
   * 若 MA／高低點太少，
   * 使用 ATR 建立模型型關卡。
   */

  const atr =
    num(
      technical.atr
    );


  if(
    !supports.length &&
    atr !== null
  ){

    supports.push(
      current - atr
    );

    supports.push(
      current - atr * 1.5
    );

  }


  if(
    !resistances.length &&
    atr !== null
  ){

    resistances.push(
      current + atr
    );

    resistances.push(
      current + atr * 1.5
    );

  }


  /*
   * 去除過度接近的價格
   */

  const uniqueNear =
    (
      arr,
      threshold
    ) => {

      const result=[];

      for(
        const value of arr
      ){

        if(
          !result.some(
            existing =>
              Math.abs(
                existing-value
              )
              <= threshold
          )
        ){

          result.push(value);

        }

      }

      return result;

    };


  const distance =
    atr !== null
      ? Math.max(
          atr * .18,
          current * .003
        )
      : current * .003;


  const uniqueSupports =
    uniqueNear(
      supports,
      distance
    );


  const uniqueResistances =
    uniqueNear(
      resistances,
      distance
    );


  return {

    support1:
      uniqueSupports[0]
      ?? null,

    support2:
      uniqueSupports[1]
      ?? null,

    resistance1:
      uniqueResistances[0]
      ?? null,

    resistance2:
      uniqueResistances[1]
      ?? null,

    source:candidates

  };

}


/* =========================================================
   75. 兼容舊版 calculateLevels
========================================================= */

function calculateLevels(
  technical,
  price
){

  const levels =
    dynamicLevels(
      technical,
      price
    );


  /*
   * 保留常用名稱，

   */

  return {

    support1:

    support2:
      levels.support2,

    resistance1:

    resistance2:
      levels.resistance2,

    s1:

}


/* =========================================================
   76. 趨勢狀態
========================================================= */

function getTrendState(
  technical
){

  if(!technical){

    return {

      state:"資料不足",

      score:0,

      label:"資料不足"

    };

  }


  const price =
    num(
      technical.price
    );

  const ma5 =
    num(
      technical.ma5
    );

  const ma20 =
    num(
      technical.ma20
    );

  const ma60 =
    num(
      technical.ma60
    );


  let score=0;


  if(
    price !== null &&
    ma5 !== null
  ){

    score +=
      price > ma5
        ? 25
        : -20;

  }


  if(
    ma5 !== null &&
    ma20 !== null
  ){

    score +=
      ma5 > ma20
        ? 25
        : -20;

  }


  if(
    ma20 !== null &&
    ma60 !== null
  ){

    score +=
      ma20 > ma60
        ? 30
        : -20;

  }


  if(
    technical.dayChangePct !== null
  ){

    score +=
      technical.dayChangePct > 0
        ? 20
        : -15;

  }


  if(
    score >= 70
  ){

    return {

      state:"多頭",

      score,

      label:"🟢 多頭"

    };

  }


  if(
    score >= 35
  ){

    return {

      state:"偏多",

      score,

      label:"🟡 偏多"

    };

  }


  if(
    score <= -20
  ){

    return {

      state:"偏空",

      score,

      label:"🔴 偏空"

    };

  }


  return {

    state:"震盪",

    score,

    label:"⚪ 震盪"

  };

}


/* =========================================================
   77. 成交量狀態
========================================================= */

function getVolumeState(
  technical
){

  if(!technical){

    return {

      state:"資料不足",

      score:0,

      ratio:null,

      label:"資料不足"

    };

  }


  const ratio =

    );


  if(ratio === null){

    return {

      state:"資料不足",

      score:0,

      ratio:null,

      label:"⚪ 資料不足"

    };

  }


  if(
    ratio >= 2
  ){

    return {

      state:"爆量",

      score:100,

      ratio,

      label:"🔥 爆量"

    };

  }


  if(
    ratio >= 1.5
  ){

    return {

      state:"放量",

      score:85,

      ratio,

      label:"🟢 放量"

    };

  }


  if(
    ratio >= 1.15
  ){

    return {

      state:"溫和放量",

      score:70,

      ratio,

      label:"🟡 溫和放量"

    };

  }


  if(
    ratio >= .8
  ){

    return {

      state:"正常",

      score:50,

      ratio,

      label:"⚪ 正常"

    };

  }


  return {

    state:"量縮",

    score:25,

    ratio,

    label:"🔵 量縮"

  };

}


/* =========================================================
   78. 成交量模型
========================================================= */

function volumeSignal(
  technical
){

  const volume =
    getVolumeState(
      technical
    );


  const priceChange =
    num(
      technical?.dayChangePct
    );


  let signal =
    volume.state;


  let score =
    volume.score;


  /*
   * 上漲＋放量
   * 是突破模型中最重要的組合之一。
   */

  if(
    priceChange !== null &&
    priceChange > 0 &&
    volume.ratio !== null &&
    volume.ratio >= 1.3
  ){

    score =
      Math.min(
        100,
        score + 15
      );

    signal =
      "上漲放量";

  }


  /*
   * 下跌＋爆量
   * 不直接視為利多。
   */

  if(
    priceChange !== null &&
    priceChange < 0 &&
    volume.ratio !== null &&
    volume.ratio >= 1.5
  ){

    score =
      Math.max(
        0,
        score - 15
      );

    signal =
      "下跌爆量";

  }


  return {

    ...volume,

    signal,

    score

  };

}

  if(
    price === null
  ){

    return {

      valid:false,

      score:0,

      price:null,

      label:"資料不足"

    };

  }


  const candidates =
    [
      ma5,
      ma20,
      technical.low20
    ]
    .filter(
      value =>
        num(value) !== null &&
        num(value) < price
    )
    .map(num);


  if(!candidates.length){

    return {

      valid:false,

      score:0,

      price:null,

      label:"無明確回測位"

    };

  }


  const nearest =
    candidates.sort(
      (a,b) =>
        Math.abs(price-a) -
        Math.abs(price-b)
    )[0];


  const distancePct =
    Math.abs(
      price-nearest
    )
    /
    price *
    100;


  const valid =
    distancePct <= 5;


  const score =
    valid
      ? Math.max(
          0,
          Math.round(
            100 -
            distancePct * 20
          )
        )
      : 0;


  return {

    valid,

    score,

    price:nearest,

    distancePct,

    label:
      valid
        ? "🎯 回測買點"
        : "等待回測"

  };

}


/* =========================================================
   83. 交易關卡
========================================================= */

function buildTradeLevels(
  technical,
  price
){

  if(!technical){

    return {

      entry:null,

      stopLoss:null,

      target1:null,

      target2:null,

      target3:null

    };

  }


  const current =
    num(price);


  if(
    current === null
  ){

    return {

      entry:null,

      stopLoss:null,

      target1:null,

      target2:null,

      target3:null

    };

  }


  const atr =
    num(
      technical.atr
    );


  const levels =
    dynamicLevels(
      technical,
      current
    );


  const support1 =
    num(
      levels.support1
    );


  const resistance1 =
    num(
      levels.resistance1
    );


  const resistance2 =
    num(
      levels.resistance2
    );


  /*
   * 進場：
   * 以現價或第一壓力突破價為模型依據
   */

  const entry =
    current;


  /*
   * 止損：
   * 優先放在第一支撐下方，
   * 沒有支撐則用 ATR。
   */

  let stopLoss =
    support1 !== null
      ? support1 * .985
      : atr !== null
        ? current - atr * 1.2
        : current * .95;


  /*
   * 避免止損高於現價
   */

  if(
    stopLoss >= current
  ){

    stopLoss =
      atr !== null
        ? current - atr * 1.2
        : current * .95;

  }


  /*
   * 第一目標
   */

  let target1 =
    resistance1 !== null
      ? resistance1
      : atr !== null
        ? current + atr
        : current * 1.05;


  /*
   * 第二目標
   */

  let target2 =
    resistance2 !== null
      ? resistance2
      : atr !== null
        ? current + atr * 2
        : current * 1.10;


  /*
   * 第三目標
   */

  let target3 =
    atr !== null
      ? current + atr * 3
      : current * 1.15;


  /*
   * 確保目標價高於進場
   */

  if(
    target1 <= current
  ){

    target1 =
      current *
      1.05;

  }


  if(
    target2 <= target1
  ){

    target2 =
      target1 *
      1.05;

  }


  if(
    target3 <= target2
  ){

    target3 =
      target2 *
      1.05;

  }


  const risk =
    current -
    stopLoss;


  const reward1 =
    target1 -
    current;


  const reward2 =
    target2 -
    current;


  return {

    entry,

    stopLoss,

    target1,

    target2,

    target3,

    risk,

    reward1,

    reward2,

    rr1:
      risk > 0
        ? reward1 / risk
        : null,

    rr2:
      risk > 0
        ? reward2 / risk
        : null

  };

}

function buildFiveLevels(
  technical,
  price
){

      up1:null,
      up2:null,

      up4:null,

      down3:null,

  const atr =
    num(
      technical?.atr
    );


  const unit =
    atr !== null
      ? atr
      : current * .03;


  return {

    up1:
      current + unit * .5,

    up2:
      current + unit,

    up3:
      current + unit * 1.5,

    up4:
      current + unit * 2,

    up5:

    down1:
      current - unit * .5,

    down2:
      current - unit,

    down3:
      current - unit * 1.5,

    down4:
      current - unit * 2,

    down5:
      current - unit * 3

  };

}

/* =========================================================
   72. 安全排序
========================================================= */

function sortNumbers(
  values,
  descending=false
){

  return values
    .map(num)
    .filter(
      value =>
        value !== null &&
        Number.isFinite(value)
    )
    .sort(
      descending
        ? (a,b)=>b-a
        : (a,b)=>a-b
    );

}


/* =========================================================
   73. 建立價格候選
========================================================= */

function buildPriceCandidates(
  technical,
  price
){

  if(!technical){
    return [];
  }


  const values = [

    technical.ma5,

    technical.ma20,

    technical.ma60,

    technical.high20,

    technical.low20,

    technical.high60,

    technical.low60

  ];


  const atr =
    num(
      technical.atr
    );


  const current =
    num(price);


  if(
    current !== null &&
    atr !== null
  ){

    values.push(

      current - atr,

      current - atr * 1.5,

      current + atr,

      current + atr * 1.5

    );

  }


  return values
    .map(num)
    .filter(
      value =>
        value !== null &&
        value > 0
    );

}


/* =========================================================
   74. 動態支撐／壓力
========================================================= */

function dynamicLevels(
  technical,
  price
){

  if(!technical){

    return {

      support1:null,
      support2:null,

      resistance1:null,
      resistance2:null,

      source:[]

    };

  }


  const current =
    num(price);


  if(
    current === null
  ){

    return {

      support1:null,
      support2:null,

      resistance1:null,
      resistance2:null,

      source:[]

    };

  }


  const candidates =
    buildPriceCandidates(
      technical,
      current
    );


  /*
   * 價格下方＝支撐
   * 價格上方＝壓力
   */

  const supports =
    sortNumbers(
      candidates.filter(
        value =>
          value < current
      ),
      true
    );


  const resistances =
    sortNumbers(
      candidates.filter(
        value =>
          value > current
      ),
      false
    );


  /*
   * 若 MA／高低點太少，
   * 使用 ATR 建立模型型關卡。
   */

  const atr =
    num(
      technical.atr
    );


  if(
    !supports.length &&
    atr !== null
  ){

    supports.push(
      current - atr
    );

    supports.push(
      current - atr * 1.5
    );

  }


  if(
    !resistances.length &&
    atr !== null
  ){

    resistances.push(
      current + atr
    );

    resistances.push(
      current + atr * 1.5
    );

  }


  /*
   * 去除過度接近的價格
   */

  const uniqueNear =
    (
      arr,
      threshold
    ) => {

      const result=[];

      for(
        const value of arr
      ){

        if(
          !result.some(
            existing =>
              Math.abs(
                existing-value
              )
              <= threshold
          )
        ){

          result.push(value);

        }

      }

      return result;

    };


  const distance =
    atr !== null
      ? Math.max(
          atr * .18,
          current * .003
        )
      : current * .003;


  const uniqueSupports =
    uniqueNear(
      supports,
      distance
    );


  const uniqueResistances =
    uniqueNear(
      resistances,
      distance
    );


  return {

    support1:
      uniqueSupports[0]
      ?? null,

    support2:
      uniqueSupports[1]
      ?? null,

    resistance1:
      uniqueResistances[0]
      ?? null,

    resistance2:
      uniqueResistances[1]
      ?? null,

    source:candidates

  };

}

    };

  }

    );

    );

  ){

  }


  if(
    ma5 !== null &&
    ma20 !== null
  ){

  }


  if(

  if(

  if(

    };

  }


  return {

   78. 成交量模型

function volumeSignal(
  technical
){

  let score =
    volume.score;


  /*
   * 上漲＋放量

   */

  if(
    priceChange !== null &&
    priceChange > 0 &&
    volume.ratio !== null &&
    volume.ratio >= 1.3
  ){

    score =
      Math.min(
        100,
        score + 15
      );

    signal =
      "上漲放量";

  }


  /*
   * 下跌＋爆量
   * 不直接視為利多。
   */

  if(
    priceChange !== null &&
    priceChange < 0 &&
    volume.ratio !== null &&
    volume.ratio >= 1.5
  ){

    score =
      Math.max(
        0,
        score - 15
      );

    signal =
      "下跌爆量";

  }


  return {

    ...volume,

    signal,

    score

  };

}

  if(

  ){

function getVolumeState(

/* =========================================================
   78. 成交量模型
========================================================= */

function volumeSignal(
  technical
){

  const volume =
    getVolumeState(
      technical
    );


  const priceChange =
    num(
      technical?.dayChangePct
    );


  let signal =
    volume.state;


  let score =
    volume.score;


  /*
   * 上漲＋放量
   * 是突破模型中最重要的組合之一。
   */

  if(
    priceChange !== null &&
    priceChange > 0 &&
    volume.ratio !== null &&
    volume.ratio >= 1.3
  ){

    score =
      Math.min(
        100,
        score + 15
      );

    signal =
      "上漲放量";

  }


  /*
   * 下跌＋爆量
   * 不直接視為利多。
   */

  if(
    priceChange !== null &&
    priceChange < 0 &&
    volume.ratio !== null &&
    volume.ratio >= 1.5
  ){

    score =
      Math.max(
        0,
        score - 15
      );

    signal =
      "下跌爆量";

  }


  return {

    ...volume,

    signal,

    score

  };

}


/* =========================================================
   79. 突破模型

function breakoutModel(
  stock,
  technical
){

  if(!technical){

    return {

      isBreakout:false,

      score:0,

      label:"資料不足",

      reasons:[]

    };

  }


  const price =
    num(
      technical.price
    );


  const high20 =
    num(
      technical.high20
    );


  const high60 =
    num(
      technical.high60
    );


  const ma5 =
    num(
      technical.ma5
    );


  const ma20 =
    num(
      technical.ma20
    );


  const volume =
    volumeSignal(
      technical
    );


  const reasons=[];

  let score=0;


  /*
   * 價格站上 20 日高
   */

  if(
    price !== null &&
    high20 !== null &&
    price >= high20
  ){

    score += 35;

    reasons.push(
      "站上20日高"
    );

  }


  /*
   * 價格接近 20 日高
   */

  else if(
    price !== null &&
    high20 !== null &&
    price >= high20 * .985
  ){

    score += 15;

    reasons.push(
      "接近20日高"
    );

  }


  /*
   * 站上 MA5
   */

  if(
    price !== null &&
    ma5 !== null &&
    price > ma5
  ){

    score += 10;

    reasons.push(
      "站上5日線"
    );

  }


  /*
   * MA5 > MA20
   */

  if(
    ma5 !== null &&
    ma20 !== null &&
    ma5 > ma20
  ){

    score += 15;

    reasons.push(
      "5日線在20日線上"
    );

  }


  /*
   * 放量
   */

  if(
    volume.ratio !== null &&
    volume.ratio >= 1.3
  ){

    score += 20;

    reasons.push(
      "成交量放大"
    );

  }


  /*
   * 60日高突破額外加分
   */

  if(
    price !== null &&
    high60 !== null &&
    price >= high60
  ){

    score += 20;

    reasons.push(
      "站上60日高"
    );

  }


  score =
    Math.min(
      100,
      score
    );


  /*
   * 確認突破需要：
   * 1. 價格突破
   * 2. 趨勢／量能至少一項支持
   */

  const priceBreak =
    (
      price !== null &&
      high20 !== null &&
      price >= high20
    );


  const supportBreak =
    (
      (
        ma5 !== null &&
        ma20 !== null &&
        ma5 > ma20
      )
      ||
      (
        volume.ratio !== null &&
        volume.ratio >= 1.3
      )
    );


  const isBreakout =
    priceBreak &&
    supportBreak;


  return {

    isBreakout,

    score,

    label:
      isBreakout
        ? "🚀 確認突破"
        : score >= 60
          ? "🟡 接近突破"
          : "⚪ 尚未突破",

    reasons

  };

}

/* =========================================================
   82. 回測型買點
========================================================= */

function retestModel(
  stock,
  technical
){

  if(!technical){

    return {

      valid:false,

      score:0,

      price:null,

      label:"資料不足"

    };

  }


  const price =
    num(
      technical.price
    );


  const ma5 =
    num(
      technical.ma5
    );


  const ma20 =
    num(
      technical.ma20
    );


  if(
    price === null
  ){

    return {

      valid:false,

      score:0,

      price:null,

      label:"資料不足"

    };

  }


  const candidates =
    [
      ma5,
      ma20,
      technical.low20
    ]
    .filter(
      value =>
        num(value) !== null &&
        num(value) < price
    )
    .map(num);


  if(!candidates.length){

    return {

      valid:false,

      score:0,

      price:null,

      label:"無明確回測位"

    };

  }


  const nearest =
    candidates.sort(
      (a,b) =>
        Math.abs(price-a) -
        Math.abs(price-b)
    )[0];


  const distancePct =
    Math.abs(
      price-nearest
    )
    /
    price *
    100;


  const valid =
    distancePct <= 5;


  const score =
    valid
      ? Math.max(
          0,
          Math.round(
            100 -
            distancePct * 20
          )
        )
      : 0;


  return {

    valid,

    score,

    price:nearest,

    distancePct,

    label:
      valid
        ? "🎯 回測買點"
        : "等待回測"

  };

}


/* =========================================================
   83. 交易關卡
========================================================= */

function buildTradeLevels(
  technical,
  price
){

  if(!technical){

    return {

      entry:null,

      stopLoss:null,

      target1:null,

      target2:null,

      target3:null

    };

  }


  const current =
    num(price);


  if(
    current === null
  ){

    return {

      entry:null,

      stopLoss:null,

      target1:null,

      target2:null,

      target3:null

    };

  }


  const atr =
    num(
      technical.atr
    );


  const levels =
    dynamicLevels(
      technical,
      current
    );


  const support1 =
    num(
      levels.support1
    );


  const resistance1 =
    num(
      levels.resistance1
    );


  const resistance2 =
    num(
      levels.resistance2
    );


  /*
   * 進場：
   * 以現價或第一壓力突破價為模型依據
   */

  const entry =
    current;


  /*
   * 止損：
   * 優先放在第一支撐下方，
   * 沒有支撐則用 ATR。
   */

  let stopLoss =
    support1 !== null
      ? support1 * .985
      : atr !== null
        ? current - atr * 1.2
        : current * .95;


  /*
   * 避免止損高於現價
   */

  if(
    stopLoss >= current
  ){

    stopLoss =
      atr !== null
        ? current - atr * 1.2
        : current * .95;

  }


  /*
   * 第一目標
   */

  let target1 =
    resistance1 !== null
      ? resistance1
      : atr !== null
        ? current + atr
        : current * 1.05;


  /*
   * 第二目標
   */

  let target2 =
    resistance2 !== null
      ? resistance2
      : atr !== null
        ? current + atr * 2
        : current * 1.10;


  /*
   * 第三目標
   */

  let target3 =
    atr !== null
      ? current + atr * 3
      : current * 1.15;


  /*
   * 確保目標價高於進場
   */

  if(
    target1 <= current
  ){

    target1 =
      current *
      1.05;

  }


  if(
    target2 <= target1
  ){

    target2 =
      target1 *
      1.05;

  }


  if(
    target3 <= target2
  ){

    target3 =
      target2 *
      1.05;

  }


  const risk =
    current -
    stopLoss;


  const reward1 =
    target1 -
    current;


  const reward2 =
    target2 -
    current;


  return {

    entry,

    stopLoss,

    target1,

    target2,

    target3,

    risk,

    reward1,

    reward2,

    rr1:
      risk > 0
        ? reward1 / risk
        : null,

    rr2:
      risk > 0
        ? reward2 / risk
        : null

  };

}


/* =========================================================
   84. 五段交易關卡
========================================================= */

function buildFiveLevels(
  technical,
  price
){

  const current =
    num(price);


  if(
    current === null
  ){

    return {

      up1:null,
      up2:null,
      up3:null,
      up4:null,
      up5:null,

      down1:null,
      down2:null,
      down3:null,
      down4:null,
      down5:null

    };

  }


  const atr =
    num(
      technical?.atr
    );


  const unit =
    atr !== null
      ? atr
      : current * .03;


  return {

    up1:
      current + unit * .5,

    up2:
      current + unit,

    up3:
      current + unit * 1.5,

    up4:
      current + unit * 2,

    up5:
      current + unit * 3,

    down1:
      current - unit * .5,

    down2:
      current - unit,

    down3:
      current - unit * 1.5,

    down4:
      current - unit * 2,

    down5:
      current - unit * 3

  };

}

/* =========================================================
   88. 日期工具
========================================================= */

function formatDate(
  date
){

  const d =
    date instanceof Date
      ? date
      : new Date(date);


  if(
    Number.isNaN(
      d.getTime()
    )
  ){

    return null;

  }


  const y =
    d.getFullYear();


  const m =
    String(
      d.getMonth()+1
    ).padStart(
      2,
      "0"
    );


  const day =
    String(
      d.getDate()
    ).padStart(
      2,
      "0"
    );


  return `${y}-${m}-${day}`;

}


/* =========================================================
   89. 取得過去 N 天日期
========================================================= */

function getPastDate(
  days
){

  const d =
    new Date();


  d.setDate(
    d.getDate() - days
  );


  return formatDate(
    d
  );

}


/* =========================================================
   90. FinMind 法人資料解析
========================================================= */

function parseFinMindInstitution(
  json,
  code
){

  if(
    !json ||
    !Array.isArray(
      json.data
    )
  ){

    return [];

  }


  const c =
    normalizeCode(code);


  return json.data
    .filter(
      row => {

        const rowCode =
          normalizeCode(
            row.stock_id ||
            row.StockID ||
            row.code
          );

        return rowCode === c;

      }
    )
    .map(
      row => {

        const date =
          row.date ||
          row.Date ||
          null;


        const name =
          row.name ||
          row.Name ||
          "";


        /*
         * FinMind 常見欄位：
         *
         * buy
         * sell
         * difference
         *
         * 若 API 回傳 net，
         * 也一起支援。
         */

        const buy =
          num(
            row.buy ??
            row.Buy
          );


        const sell =
          num(
            row.sell ??
            row.Sell
          );


        let net =
          num(
            row.difference ??
            row.Difference ??
            row.net ??
            row.Net
          );


        if(
          net === null &&
          buy !== null &&
          sell !== null
        ){

          net =
            buy - sell;

        }


        let type =
          "other";


        const lowerName =
          String(
            name
          ).toLowerCase();


        if(
          name.includes("外資") ||
          lowerName.includes(
            "foreign"
          )
        ){

          type =
            "foreign";

        }
        else if(
          name.includes("投信") ||
          lowerName.includes(
            "investment"
          )
        ){

          type =
            "trust";

        }
        else if(
          name.includes("自營") ||
          lowerName.includes(
            "dealer"
          )
        ){

          type =
            "dealer";

        }


        return {

          date,

          name,

          type,

          buy,

          sell,

          net

        };

      }
    )
    .filter(
      row =>
        row.date
    );

}

  rows
){

  const map =
    new Map();


  for(
    const row of rows
  ){

    if(
      !row ||
      !row.date
    ){

      continue;

    }


    if(
      !map.has(row.date)
    ){

      map.set(
        row.date,
        {

          date:
            row.date,

          foreign:null,

          trust:null,

          dealer:null,

          total:null

        }
      );

    }


    const item =
      map.get(
        row.date
      );


    if(
      row.type === "foreign"
    ){

      item.foreign =
        (
          item.foreign ?? 0
        )
        +
        (
          row.net ?? 0
        );

    }


    if(
      row.type === "trust"
    ){

      item.trust =
        (
          item.trust ?? 0
        )
        +
        (
          row.net ?? 0
        );

    }


    if(
      row.type === "dealer"
    ){

      item.dealer =
        (
          item.dealer ?? 0
        )
        +
        (
          row.net ?? 0
        );

    }

  }


  const result =
    [...map.values()]
      .sort(
        (a,b) =>
          String(a.date)
            .localeCompare(
              String(b.date)
            )
      );


  /*
   * 三大法人合計
   * 至少有一個法人有資料才計算。
   */

  for(
    const item of result
  ){

    const values =
      [
        item.foreign,
        item.trust,
        item.dealer
      ]
      .filter(
        value =>
          value !== null
      );


    item.total =
      values.length
        ? values.reduce(
            (sum,value) =>
              sum + value,
            0
          )
        : null;

  }


  return result;

}


/* =========================================================
   92. 取得法人資料
========================================================= */

async function getInstitutionConsecutive(
  code,
  force=false
){

  const c =
    normalizeCode(code);


  if(!c){
    return null;
  }


  const cached =
    STATE.institutionCache[c];


  if(
    !force &&
    cached &&
    cached.time &&
    Date.now() -
      cached.time <
      60000
  ){

    return cached.data;

  }


  const startDate =
    getPastDate(
      60
    );


  const url =
    V1491_FINMIND +
    "?dataset=TaiwanStockInstitutionalInvestorsBuySell" +
    "&data_id=" +
    encodeURIComponent(c) +
    "&start_date=" +
    encodeURIComponent(startDate);


  const json =
    await safeFetchJSON(
      url
    );


  const rawRows =
    parseFinMindInstitution(
      json,
      c
    );


  if(
    !rawRows.length
  ){

    STATE.apiStatus.institution =
      false;

    return {

      available:false,

      code:c,

      days:[],

      latest:null,

      foreign:null,

      trust:null,

      dealer:null,

      total:null,

      consecutive:{

        foreign3:false,

        foreign5:false,

        foreign10:false,

        trust3:false,

        trust5:false,

        trust10:false,

        dealer3:false,

        dealer5:false,

        dealer10:false,

        total3:false,

        total5:false,

        total10:false

      },

      sums:{

        foreign3:null,

        foreign5:null,

        foreign10:null,

        trust3:null,

        trust5:null,

        trust10:null,

        dealer3:null,

        dealer5:null,

        dealer10:null,

        total3:null,

        total5:null,

        total10:null

      }

    };

  }


  const days =
    groupInstitutionByDate(
      rawRows
    );


  /*
   * 只保留有法人資料的交易日，
   * 最新日期放最後。
   */

  const validDays =
    days
      .filter(
        day =>
          day.foreign !== null ||
          day.trust !== null ||
          day.dealer !== null
      )
      .sort(
        (a,b) =>
          String(a.date)
            .localeCompare(
              String(b.date)
            )
      );


  if(
    !validDays.length
  ){

    return {

      available:false,

      code:c,

      days:[]

    };

  }


  const latest =
    validDays.at(-1);


  /* =======================================================
     計算最近 N 日合計
  ======================================================= */

  function sumField(
    field,
    period
  ){

    const rows =
      validDays.slice(
        -period
      );


    const values =
      rows
        .map(
          row =>
            num(row[field])
        )
        .filter(
          value =>
            value !== null
        );


    if(
      values.length < period
    ){

      return null;

    }


    return values.reduce(
      (sum,value) =>
        sum + value,
      0
    );

  }


  /* =======================================================
     連續買超
  ======================================================= */

  function consecutiveBuy(
    field,
    period
  ){

    if(
      validDays.length <
      period
    ){

      return false;

    }


    const rows =
      validDays.slice(
        -period
      );


    /*
     * 每一天都必須有資料，
     * 且全部 > 0。
     */

    return rows.every(
      row => {

        const value =
          num(
            row[field]
          );

        return (
          value !== null &&
          value > 0
        );

      }
    );

  }


  const result = {

    available:true,

    code:c,

    days:validDays,

    latest,

    foreign:
      latest.foreign,

    trust:
      latest.trust,

    dealer:
      latest.dealer,

    total:
      latest.total,

    consecutive:{

      foreign3:
        consecutiveBuy(
          "foreign",
          3
        ),

      foreign5:
        consecutiveBuy(
          "foreign",
          5
        ),

      foreign10:
        consecutiveBuy(
          "foreign",
          10
        ),


      trust3:
        consecutiveBuy(
          "trust",
          3
        ),

      trust5:
        consecutiveBuy(
          "trust",
          5
        ),

      trust10:
        consecutiveBuy(
          "trust",
          10
        ),


      dealer3:
        consecutiveBuy(
          "dealer",
          3
        ),

      dealer5:
        consecutiveBuy(
          "dealer",
          5
        ),

      dealer10:
        consecutiveBuy(
          "dealer",
          10
        ),


      total3:
        consecutiveBuy(
          "total",
          3
        ),

      total5:
        consecutiveBuy(
          "total",
          5
        ),

      total10:
        consecutiveBuy(
          "total",
          10
        )

    },

    sums:{

      foreign3:
        sumField(
          "foreign",
          3
        ),

      foreign5:
        sumField(
          "foreign",
          5
        ),

      foreign10:
        sumField(
          "foreign",
          10
        ),


      trust3:
        sumField(
          "trust",
          3
        ),

      trust5:
        sumField(
          "trust",
          5
        ),

      trust10:
        sumField(
          "trust",
          10
        ),


      dealer3:
        sumField(
          "dealer",
          3
        ),

      dealer5:
        sumField(
          "dealer",
          5
        ),

      dealer10:
        sumField(
          "dealer",
          10
        ),


      total3:
        sumField(
          "total",
          3
        ),

      total5:
        sumField(
          "total",
          5
        ),

      total10:
        sumField(
          "total",
          10
        )

    }

  };


  STATE.institutionCache[c] = {

    time:
      Date.now(),

    data:
      result

  };


  STATE.apiStatus.institution =
    true;


  return result;

}

/* =========================================================
   94. 法人籌碼強度
========================================================= */

function calculateInstitutionScore(
  institution
){

  if(
    !institution ||
    !institution.available
  ){

    return {

      score:null,

      max:20,

      details:[]

    };

  }


  let score=0;

  const details=[];


  /*
   * 外資
   */

  if(
    institution.foreign !== null
  ){

    if(
      institution.foreign > 0
    ){

      score += 3;

      details.push(
        "外資買超"
      );

    }else{

      score -= 2;

      details.push(
        "外資賣超"
      );

    }

  }


  /*
   * 投信
   */

  if(
    institution.trust !== null
  ){

    if(
      institution.trust > 0
    ){

      score += 3;

      details.push(
        "投信買超"
      );

    }else{

      score -= 2;

      details.push(
        "投信賣超"
      );

    }

  }


  /*
   * 自營商
   */

  if(
    institution.dealer !== null
  ){

    if(
      institution.dealer > 0
    ){

      score += 2;

      details.push(
        "自營商買超"
      );

    }else{

      score -= 1;

      details.push(
        "自營商賣超"
      );

    }

  }


  /*
   * 3 日連買
   */

  if(
    institution.consecutive?.total3
  ){

    score += 4;

    details.push(
      "三大法人3日連買"
    );

  }


  /*
   * 5 日連買
   */

  if(
    institution.consecutive?.total5
  ){

    score += 4;

    details.push(
      "三大法人5日連買"
    );

  }


  /*
   * 10 日連買
   */

  if(
    institution.consecutive?.total10
  ){

    score += 4;

    details.push(
      "三大法人10日連買"
    );

  }


  /*
   * 最大20分
   */

  score =
    Math.max(
      0,
      Math.min(
        20,
        score
      )
    );


  return {

    score,

    max:20,

    details

  };

}

/* =========================================================
 /* =========================================================
   第 7 段：V1491 專業綜合評分
   - 三大法人評分
   - 技術面評分
   - 突破/準備突破/多頭評分
   - 進場位置評分
   - 風險報酬評分
   - 最終 100 分
   ========================================================= */

function clamp(v, min, max){
  return Math.max(min, Math.min(max, v));
}

/* ---------- 評級 ---------- */
function getCompositeGrade(score){
  if(score == null || !Number.isFinite(Number(score))) return "N/A";

  score = Number(score);

  if(score >= 85) return "S";
  if(score >= 75) return "A";
  if(score >= 65) return "B";
  if(score >= 55) return "C";
  return "D";
}

/* ---------- 趨勢 20 分 ---------- */
function scoreTrend20(stock){
  const trend = String(stock?.trendState || stock?.trend || "").toUpperCase();

  let score = 10;

  if(
    trend.includes("STRONG") ||
    trend.includes("BULL") ||
    trend.includes("強勢") ||
    trend.includes("多頭")
  ){
    score = 20;
  }else if(
    trend.includes("UP") ||
    trend.includes("偏多") ||
    trend.includes("上升")
  ){
    score = 16;
  }else if(
    trend.includes("NEUTRAL") ||
    trend.includes("盤整") ||
    trend.includes("震盪")
  ){
    score = 10;
  }else if(
    trend.includes("DOWN") ||
    trend.includes("偏空") ||
    trend.includes("下降")
  ){
    score = 5;
  }else if(
    trend.includes("BEAR") ||
    trend.includes("空頭") ||
    trend.includes("弱勢")
  ){
    score = 2;
  }

  return clamp(score,0,20);
}

/* ---------- 位置 15 分 ---------- */
function scorePosition15(stock){
  const price = num(
    stock?.price ??
    stock?.close ??
    stock?.currentPrice
  );

  const levels = stock?.levels || {};
  const support1 = num(
    levels.support1 ??
    levels.s1 ??
    stock?.support1
  );

  const support2 = num(
    levels.support2 ??
    levels.s2 ??
    stock?.support2
  );

  const resistance1 = num(
    levels.resistance1 ??
    levels.r1 ??
    stock?.resistance1
  );

  const resistance2 = num(
    levels.resistance2 ??
    levels.r2 ??
    stock?.resistance2
  );

  if(!price) return 7;

  let score = 8;

  if(support1 && price >= support1){
    const dist = Math.abs(price - support1) / price * 100;

    if(dist <= 1.5) score += 5;
    else if(dist <= 3) score += 3;
    else if(dist <= 5) score += 1;
  }

  if(resistance1 && price >= resistance1){
    score += 1;
  }

  if(resistance2 && price >= resistance2){
    score -= 2;
  }

  if(support2 && price < support2){
    score -= 5;
  }

  return clamp(score,0,15);
}

/* ---------- 成交量＋漲跌 15 分 ---------- */
function scoreVolume15(stock){
  const signal = String(
    stock?.volumeSignal?.state ??
    stock?.volumeState ??
    stock?.volumeSignal ??
    ""
  ).toUpperCase();

  const change = num(
    stock?.dayChangePct ??
    stock?.changePct ??
    stock?.change
  );

  let score = 8;

  if(
    signal.includes("BREAK") ||
    signal.includes("爆量") ||
    signal.includes("放量")
  ){
    score = 14;
  }else if(
    signal.includes("STRONG") ||
    signal.includes("強")
  ){
    score = 13;
  }else if(
    signal.includes("HEALTH") ||
    signal.includes("健康")
  ){
    score = 11;
  }else if(
    signal.includes("WEAK") ||
    signal.includes("量縮") ||
    signal.includes("弱")
  ){
    score = 6;
  }

  if(change >= 5) score += 1;
  if(change <= -5) score -= 3;

  return clamp(score,0,15);
}

/* ---------- 突破類型 20 分 ---------- */
function scoreBreakout20(stock){
  const breakout = stock?.breakout || {};
  const ready = stock?.readyBreakout || {};
  const bullish = stock?.bullish || {};

  const bScore = num(
    breakout.score ??
    breakout.rating ??
    breakout.strength
  );

  const rScore = num(
    ready.score ??
    ready.rating ??
    ready.strength
  );

  const bullScore = num(
    bullish.score ??
    bullish.rating ??
    bullish.strength
  );

  const scores = [
    Number.isFinite(bScore) ? bScore : null,
    Number.isFinite(rScore) ? rScore : null,
    Number.isFinite(bullScore) ? bullScore : null
  ].filter(v => v !== null);

  if(!scores.length){
    const state = String(
      stock?.signal ??
      stock?.technicalSignal ??
      ""
    ).toUpperCase();

    if(
      state.includes("BREAK") ||
      state.includes("突破")
    ) return 18;

    if(
      state.includes("READY") ||
      state.includes("準備")
    ) return 15;

    if(
      state.includes("BULL") ||
      state.includes("多頭")
    ) return 13;

    return 10;
  }

  const best = Math.max(...scores);

  /*
   * 不管原始模型是 0~100 或 0~20，
   * 自動轉成 0~20。
   */
  if(best > 20){
    return clamp(Math.round(best / 5),0,20);
  }

  return clamp(Math.round(best),0,20);
}

/* ---------- 三大法人 20 分 ---------- */
function scoreInstitution20(stock){
  const value = num(
    stock?.institutionScore ??
    stock?.institution?.score ??
    stock?.institutionSummary?.score
  );

  if(Number.isFinite(value)){
    return clamp(value,0,20);
  }

  const inst = stock?.institution || {};

  const foreign = num(
    inst.foreign ??
    inst.foreignInvestor ??
    inst.foreignNet
  );

  const trust = num(
    inst.investmentTrust ??
    inst.trust ??
    inst.investment
  );

  const dealer = num(
    inst.dealer ??
    inst.dealerNet
  );

  let score = 10;

  if(foreign > 0) score += 3;
  if(trust > 0) score += 4;
  if(dealer > 0) score += 2;

  if(foreign < 0) score -= 2;
  if(trust < 0) score -= 3;
  if(dealer < 0) score -= 1;

  return clamp(score,0,20);
}

/* ---------- 交易計畫 10 分 ---------- */
function scoreTradePlan10(stock){
  const plan = stock?.tradePlan || {};

  const entry = num(
    plan.entry ??
    plan.entryPrice ??
    stock?.entry
  );

  const stop = num(
    plan.stopLoss ??
    plan.stop ??
    stock?.stopLoss
  );

  const target = num(
    plan.target ??
    plan.takeProfit ??
    stock?.target
  );

  if(!entry || !stop || !target){
    return 5;
  }

  const risk = Math.abs(entry - stop);
  const reward = Math.abs(target - entry);

  if(!risk) return 3;

  const rr = reward / risk;

  if(rr >= 3) return 10;
  if(rr >= 2.5) return 9;
  if(rr >= 2) return 8;
  if(rr >= 1.5) return 7;
  if(rr >= 1) return 5;

  return 2;
}

/* =========================================================
   100 分綜合評分
========================================================= */
function calculateComposite100Score(stock){

  const parts = {
    trend: scoreTrend20(stock),
    position: scorePosition15(stock),
    volume: scoreVolume15(stock),
    breakout: scoreBreakout20(stock),
    institution: scoreInstitution20(stock),
    tradePlan: scoreTradePlan10(stock)
  };

  const maxScore =
    20 +
    15 +
    15 +
    20 +
    20 +
    10;

  const rawScore =
    parts.trend +
    parts.position +
    parts.volume +
    parts.breakout +
    parts.institution +
    parts.tradePlan;

  const finalScore = clamp(
    Math.round((rawScore / maxScore) * 100),
    0,
    100
  );

  return {
    score: finalScore,
    grade: getCompositeGrade(finalScore),
    rawScore,
    maxScore,
    breakdown: parts,
    label:
      finalScore >= 85 ? "強力買進候選" :
      finalScore >= 75 ? "偏多強勢" :
      finalScore >= 65 ? "偏多觀察" :
      finalScore >= 55 ? "中性觀察" :
      "風險偏高"
  };
}

/* =========================================================
   套用 V1491 綜合評分
========================================================= */
function applyCompositeScore(stock){

  if(!stock) return stock;

  const result = calculateComposite100Score(stock);

  stock.compositeScore = result.score;
  stock.compositeGrade = result.grade;
  stock.compositeLabel = result.label;

  stock.composite = {
    score: result.score,
    grade: result.grade,
    label: result.label,
    rawScore: result.rawScore,
    maxScore: result.maxScore,
    breakdown: result.breakdown
  };

  return stock;
}

  setSearchStatus("搜尋中…");

  try{

    let stock =
      findStock(keyword);

    if(!stock){

      const candidates =
        await getSearchCandidates(keyword);

      if(candidates.length === 1){
        stock = candidates[0];
      }else if(candidates.length > 1){

        showSearchCandidates(candidates);

        setSearchStatus(
          `找到 ${candidates.length} 個候選`
        );

        return;
      }
    }

    if(!stock){

      setSearchStatus("找不到股票");

      setSystemMessage(
        `找不到「${keyword}」`
      );

      return;
    }

    setSearchStatus(
      `${stock.code} ${stock.name || ""}`
    );

    await analyzeAndRenderStock(stock);

  }catch(error){

    console.error(error);

    setSearchStatus("搜尋失敗");

    setSystemMessage(
      `搜尋失敗：${error.message || "未知錯誤"}`

function getStockScore(stock){

  if(!stock) return -999;

  if(Number.isFinite(Number(stock.compositeScore))){
    return Number(stock.compositeScore);
  }

  const result =
    calculateComposite100Score(stock);

  return Number(result.score || 0);

}


/* =========================================================
   熱門候選條件
========================================================= */

function filterHotCandidates(stocks){

  if(!Array.isArray(stocks)){
    return [];
  }

  return stocks.filter(stock => {

    if(!stock) return false;

    const code =
      normalizeCode(
        stock.code ||
        stock.stockCode ||
        ""
      );

    if(!validStockCode(code)){
      return false;
    }

    const score =
      getStockScore(stock);

    const price =
      num(
        stock.price ??
        stock.close
      );

    if(!price || price <= 0){
      return false;
    }

    /*
     * 分數達 55：
     * 代表至少進入可觀察區。
     */
    if(score < 55){
      return false;
    }

    return true;

  });

}


/* =========================================================
   HOT20 排名
========================================================= */

function rankHot20(stocks){

  const candidates =
    filterHotCandidates(stocks);

  return candidates
    .map(stock => {

      const score =
        getStockScore(stock);

      const change =
        num(
          stock.dayChangePct ??
          stock.changePct ??
          stock.change
        );

      const volumeRatio =
        num(
          stock.volumeRatio ??
          stock.technical?.volumeRatio
        );

      const institutionScore =
        num(
          stock.institutionScore ??
          stock.institution?.score
        );

      /*
       * HOT20 最終分數
       *
       * 100分綜合評分為主
       * ＋ 當日強弱
       * ＋ 成交量
       * ＋ 法人
       */
      const hotScore =
        score * 0.65 +
        clamp(change + 5,0,10) * 1.2 +
        clamp(volumeRatio,0,5) * 2 +
        clamp(institutionScore,0,20) * 0.15;

      return {
        ...stock,
        hotScore
      };

    })
    .sort(
      (a,b) =>
        Number(b.hotScore || 0) -
        Number(a.hotScore || 0)
    )
    .slice(
      0,
      DYNAMIC_LIMITS.HOT20
    );

}


/* =========================================================
   突破候選
========================================================= */

function rankBreakout20(stocks){

  if(!Array.isArray(stocks)){
    return [];
  }

  return stocks
    .map(stock => {

      const model =
        stock.breakout ||
        {};

      const score =
        num(
          model.score ??
          model.rating ??
          model.strength
        );

      const composite =
        getStockScore(stock);

      let finalScore =
        composite * 0.5;

      if(score > 20){
        finalScore += score * 0.5;
      }else{
        finalScore += score * 2.5;
      }

      return {
        ...stock,
        breakoutScore:
          Math.round(finalScore)
      };

    })
    .filter(stock =>
      Number(stock.breakoutScore || 0) >= 50
    )
    .sort(
      (a,b) =>
        b.breakoutScore -
        a.breakoutScore
    )
    .slice(
      0,
      DYNAMIC_LIMITS.BREAKOUT
    );

}

========================================================= */

async function buildCandidatePool(){

  setSystemMessage(    "正在建立動態股票資料池…"
  );

  try{

    const market =
      await getMarketToday();

    if(!Array.isArray(market)){
      return [];
    }

    /*
     * 原始30檔優先
     */
    const fixed =
      market.filter(stock =>
        isOriginal30(stock.code)
      );

    /*
     * 其餘市場股票加入候選池
     */
    const others =
      market.filter(stock =>
        !isOriginal30(stock.code)
      );

    const pool =
      [
        ...fixed,
        ...others
      ].slice(
        0,
        DYNAMIC_LIMITS.CANDIDATE_POOL
      );

    return pool;

  }catch(error){

    console.error(
      "buildCandidatePool:",
      error
    );

    return [];

  }

}

/* =========================================================
   HOT20 主掃描
========================================================= */

async function scanHot20(){

  const list =
    document.getElementById(
      "hot20List"
    );

  const time =
    document.getElementById(
      "hot20Time"
    );

  if(list){

    list.innerHTML = `
      <div class="loading">
        🔄 正在掃描熱門股票…
      </div>
    `;
  }

  setSystemMessage(
    "🔥 HOT20 掃描中…"
  );

  try{

    const pool =
      await buildCandidatePool();

    if(!pool.length){

      if(list){
        list.innerHTML = `
          <div class="empty">
            暫時沒有取得市場資料
          </div>
        `;
      }

      return [];
    }

    /*
     * 限制同時分析數量，
     * 避免 API 一次打爆。
     */
    const selected =
      pool.slice(
        0,
        DYNAMIC_LIMITS.CANDIDATE_POOL
      );

    const results = [];

    const batchSize = 5;

    for(
      let i = 0;
      i < selected.length;
      i += batchSize
    ){

      const batch =
        selected.slice(
          i,
          i + batchSize
        );

      const batchResults =
        await Promise.all(
          batch.map(
            stock =>
              prepareHotCandidate(stock)
          )
        );

      batchResults
        .filter(Boolean)
        .forEach(stock =>
          results.push(stock)
        );

      setSystemMessage(
        `🔥 HOT20 掃描中 ${Math.min(
          i + batchSize,
          selected.length
        )}/${selected.length}`
      );

    }

    const ranked =
      rankHot20(results);

    STATE.hot20 =
      ranked;

    renderHot20(
      ranked
    );

    renderHot20Panel(
      ranked
    );

    if(time){

      time.textContent =
        `更新：${new Date().toLocaleTimeString(
          "zh-TW",
          {
            hour:"2-digit",
            minute:"2-digit",
            second:"2-digit"
          }
        )}`;

    }

    setSystemMessage(
      `🔥 HOT20 完成｜共 ${ranked.length} 檔`
    );

    return ranked;

  }catch(error){

    console.error(
      "scanHot20:",
      error
    );

    setSystemMessage(
      `HOT20 掃描失敗：${
        error.message || "未知錯誤"
      }`
    );

    if(list){

      list.innerHTML = `
        <div class="empty">
          ⚠️ 掃描失敗
        </div>
      `;

    }

    return [];

  }

}

========================================================= */

async function scanDynamicList(type){

  setSystemMessage(
    `正在掃描 ${type}…`
  );

  const pool =
    await buildCandidatePool();

  if(!pool.length){
    return [];
  }

  const results = [];

  const batchSize = 5;

  for(
    let i = 0;
    i < pool.length;
    i += batchSize
  ){

    const batch =
      pool.slice(
        i,
        i + batchSize
      );

    const rows =
      await Promise.all(
        batch.map(
          stock =>
            prepareHotCandidate(stock)
        )
      );

    rows
      .filter(Boolean)
      .forEach(
        row =>
          results.push(row)
      );

  }

  let ranked = [];

  if(type === "breakout"){
    ranked =
      rankBreakout20(results);
  }

  if(type === "ready"){
    ranked =
      rankReady20(results);
  }

  if(type === "bullish"){
    ranked =
      rankBullish20(results);
  }

  STATE[type] =
    ranked;

  renderScanResult(
    ranked,
    type
  );

  setSystemMessage(
    `${type} 完成｜${ranked.length} 檔`
  );

  return ranked;

}

async function scanOriginal30(){

  setSystemMessage(
    "🔍 正在掃描原始30檔…"
  );

  const market =
    await getMarketToday();

  if(!Array.isArray(market) || !market.length){

    setSystemMessage(
      "目前無法取得市場資料"
    );

    return [];
  }

  const original =
    market.filter(stock =>
      isOriginal30(stock.code)
    );

  const results = [];

  const batchSize = 5;

  for(
    let i = 0;
    i < original.length;
    i += batchSize
  ){

    const batch =
      original.slice(
        i,
        i + batchSize
      );

    const rows =
      await Promise.all(
        batch.map(
          stock =>
            prepareHotCandidate(stock)
        )
      );

    rows
      .filter(Boolean)
      .forEach(
        stock =>
          results.push(stock)
      );

  }

  results.sort(
    (a,b) =>
      getStockScore(b) -
      getStockScore(a)
  );

  STATE.original30 =
    results;

  renderScanResult(
    results,
    "original30"
  );

  setSystemMessage(
    `原始30掃描完成｜${results.length} 檔`
  );

  return results;
}

    case "ready":

    case "bullish":
      return await scanDynamicList(
        "bullish"
      );

    default:

  }

}

/* =========================================================
   API Timeout
========================================================= */

async function fetchWithTimeout(
  url,
  options = {},
  timeout = 10000
){

  const controller =
    new AbortController();

  const timer =
    setTimeout(
      () =>
        controller.abort(),
      timeout
    );

  try{

    const response =
      await fetch(
        url,
        {
          ...options,
          signal:
            controller.signal
        }
      );

    return response;

  }finally{

    clearTimeout(
      timer
    );

  }

}


/* =========================================================
   安全 JSON Fetch
========================================================= */

async function safeFetchJSONV12(
  url,
  options = {},
  timeout = 10000
){

  try{

    const response =
      await fetchWithTimeout(
        url,
        options,
        timeout
      );

    if(
      !response.ok
    ){

      throw new Error(
        `HTTP ${response.status}`
      );

    }

    return await response.json();

  }catch(error){

    console.warn(
      "safeFetchJSONV12:",
      url,
      error
    );

    return null;

  }

}


/* =========================================================
   安全數字
========================================================= */

function safeNumber(value){

  if(
    value === null ||
    value === undefined ||
    value === ""
  ){

    return null;

  }

  const n =
    Number(
      String(value)
        .replace(/,/g,"")
        .replace(/%/g,"")
        .trim()
    );

  return Number.isFinite(n)
    ? n
    : null;

}


/* =========================================================
   股票代號標準化
========================================================= */

function normalizeStockCodeV12(
  code
){

  if(
    code === null ||
    code === undefined
  ){

    return "";

  }

  return String(code)
    .trim()
    .replace(
      /^TWSE:/i,
      ""
    )
    .replace(
      /^TPEX:/i,
      ""
    )
    .replace(
      /^TW:/i,
      ""
    )
    .replace(
      /\.TW$/i,
      ""
    );

}


/* =========================================================
   ETF 判斷
========================================================= */

function isETFCodeV12(
  code
){

  const c =
    normalizeStockCodeV12(
      code
    );

  return (
    /^\d{4}[A-Z]?$/.test(c) &&
    (
      c.startsWith("00") ||
      [
        "00878",
        "0050",
        "0056",
        "006208",
        "00631L",
        "00632R",
        "00685L",
        "00919",
        "00981A"
      ].includes(c)
    )
  );

}


/* =========================================================
   股票名稱相容
========================================================= */

function resolveStockName(
  stock
){

  if(!stock){
    return "";
  }

  return (
    stock.name ||
    stock.stockName ||
    stock.n ||
    stock.Name ||
    getAlias(
      normalizeStockCodeV12(
        stock.code ||
        stock.stockCode
      )
    ) ||
    normalizeStockCodeV12(
      stock.code ||
      stock.stockCode
    )
  );

}


/* =========================================================
   市場資料標準化
========================================================= */

function normalizeMarketStockV12(
  raw
){

  if(!raw){
    return null;
  }

  const code =
    normalizeStockCodeV12(
      raw.code ||
      raw.stock_id ||
      raw.stockId ||
      raw.c ||
      raw.Code ||
      raw.StockID
    );

  if(!code){
    return null;
  }

  const price =
    safeNumber(
      raw.price ??
      raw.close ??
      raw.ClosingPrice ??
      raw.Close
    );

  const changePct =
    safeNumber(
      raw.changePct ??
      raw.change ??
      raw.ChangePercent ??
      raw.Change
    );

/* =========================================================
   API Timeout
   ========================================================= */

async function fetchWithTimeout(
  url,
  options = {},
  timeout = 12000
){

  const controller =
    new AbortController();

  const timerId =
    setTimeout(
      () => controller.abort(),
      timeout
    );

  try{

    const response =
      await fetch(
        url,
        {
          ...options,
          signal:
            controller.signal
        }
      );

    return response;

  }finally{

    clearTimeout(
      timerId
    );

  }

}


/* =========================================================
   安全 JSON
   ========================================================= */

async function safeFetchJSONV12(
  url,
  options = {},
  timeout = 12000
){

  try{

    const response =
      await fetchWithTimeout(
        url,
        options,
        timeout
      );

    if(!response.ok){

      throw new Error(
        `HTTP ${response.status}`
      );

    }

    const text =
      await response.text();

    if(!text){

      throw new Error(
        "API 回傳空資料"
      );

    }

    try{

      return JSON.parse(
        text
      );

    }catch(error){

      throw new Error(
        "API JSON 格式錯誤"
      );

    }

  }catch(error){

    console.warn(
      "API ERROR:",
      url,
      error
    );

    return null;

  }

}


/* =========================================================
   安全數字
   ========================================================= */

function safeNumber(value){

  if(
    value === null ||
    value === undefined ||
    value === ""
  ){
    return null;
  }

  if(
    typeof value ===
    "string"
  ){

    value =
      value
        .replace(/,/g,"")
        .replace(/%/g,"")
        .trim();

  }

  const n =
    Number(value);

  return Number.isFinite(n)
    ? n
    : null;

}


/* =========================================================
   股票代號標準化
   ========================================================= */

function normalizeStockCodeV12(value){

  if(
    value === null ||
    value === undefined
  ){
    return "";
  }

  let code =
    String(value)
      .trim()
      .toUpperCase();

  /*
   * 去除台股常見前綴
   */
  code =
    code
      .replace(/^TWSE:/,"")
      .replace(/^TPE:/,"")
      .replace(/^TPEX:/,"")
      .replace(/^TW:/,"");

  /*
   * 保留英數字
   */
  code =
    code.replace(
      /[^A-Z0-9]/g,
      ""
    );

  return code;
}


/* =========================================================
   判斷 ETF
   ========================================================= */

function isETFCodeV12(code){

  const c =
    normalizeStockCodeV12(
      code
    );

  return [
    "0050",
    "0056",
    "00631L",
    "00632R",
    "00685L",
    "00878",
    "00891",
    "00919",
    "00981A"
  ].includes(c);

}


/* =========================================================
   取得股票名稱
   ========================================================= */

function resolveStockName(
  code,
  fallback = ""
){

  const c =
    normalizeStockCodeV12(
      code
    );

  if(
    ALIASES &&
    ALIASES[c]
  ){

    return ALIASES[c];

  }

  return fallback || c;

}

  row
){

  if(!row){

  const code =
    normalizeStockCodeV12(
      row.code ??
      row.Code ??
      row.c ??
      row.stockCode ??
      row["股票代號"]
    );

  if(!code){
    return null;
  }

  const name =
    row.name ??
    row.Name ??
    row.n ??
    row.stockName ??
    row["股票名稱"] ??
    resolveStockName(code);

  const price =
    safeNumber(
      row.price ??
      row.close ??
      row.ClosingPrice ??
      row["收盤價"]
    );

  const changePct =
    safeNumber(
      row.changePct ??
      row.change ??
      row.ChangePercent ??
      row["漲跌幅"]
    );

  const volume =
    safeNumber(
      row.volume ??
      row.Volume ??
      row["成交股數"]
    );

  return {
    ...row,

    code,

    name,

    price,

    close:
      price,

    changePct,

    dayChangePct:
      changePct,

    volume

  };

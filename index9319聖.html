<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080a0c">

<title>m1491｜動態台股法人籌碼與突破分析 V1491</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

:root{
  --bg:#080a0c;
  --panel:#101419;
  --panel2:#151a20;
  --panel3:#1b222a;
  --line:#28313a;
  --text:#f2f5f7;
  --muted:#8e9aa5;
  --green:#21d07a;
  --red:#ff5263;
  --yellow:#ffc857;
  --blue:#4da3ff;
  --cyan:#35d6e7;
  --orange:#ff9f43;
  --purple:#a77bff;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  padding:0;
  background:
    radial-gradient(
      circle at top,
      #141a20 0,
      #080a0c 42%
    );
  color:var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "PingFang TC",
    "Noto Sans TC",
    "Microsoft JhengHei",
    sans-serif;
  min-height:100vh;
}

button,
input{
  font:inherit;
}

button{
  cursor:pointer;
}

button:disabled{
  cursor:not-allowed;
  opacity:.55;
}

/* =========================
   頂部
========================= */

.topbar{
  position:sticky;
  top:0;
  z-index:1000;
  padding:
    calc(10px + env(safe-area-inset-top))
    14px
    10px;
  background:rgba(8,10,12,.94);
  backdrop-filter:blur(16px);
  border-bottom:1px solid rgba(255,255,255,.06);
}

.topbar-inner{
  max-width:1180px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.brand-title{
  font-size:20px;
  font-weight:900;
  letter-spacing:.5px;
}

.brand-sub{
  margin-top:3px;
  color:var(--muted);
  font-size:11px;
}

.status{
  display:flex;
  align-items:center;
  gap:6px;
  white-space:nowrap;
  font-size:11px;
  color:var(--muted);
}

.status-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--green);
  box-shadow:
    0 0 10px rgba(33,208,122,.7);
}

/* =========================
   主容器
========================= */

.container{
  width:min(
    1180px,
    calc(100% - 20px)
  );
  margin:14px auto 50px;
}

/* =========================
   搜尋區
========================= */

.search-panel{
  position:relative;
  background:
    linear-gradient(
      145deg,
      rgba(21,26,32,.98),
      rgba(13,17,21,.98)
    );
  border:1px solid var(--line);
  border-radius:18px;
  padding:14px;
  box-shadow:
    0 10px 30px rgba(0,0,0,.28);
}

.search-row{
  display:flex;
  gap:8px;
}

.search-input-wrap{
  position:relative;
  flex:1;
}

#searchInput{
  width:100%;
  height:46px;
  padding:0 14px;
  border-radius:12px;
  border:1px solid #313b45;
  outline:none;
  color:var(--text);
  background:#090c0f;
  transition:.2s;
}

#searchInput:focus{
  border-color:var(--blue);
  box-shadow:
    0 0 0 3px rgba(77,163,255,.12);
}

#searchInput::placeholder{
  color:#65717d;
}

.primary-btn{
  min-width:82px;
  height:46px;
  border:0;
  border-radius:12px;
  padding:0 16px;
  color:#fff;
  font-weight:800;
  background:
    linear-gradient(
      135deg,
      #1677ff,
      #315dff
    );
  box-shadow:
    0 7px 18px rgba(49,93,255,.22);
}

.primary-btn:active{
  transform:translateY(1px);
}

/* =========================
   搜尋候選
========================= */

.search-candidates{
  display:none;
  margin-top:8px;
  border:1px solid var(--line);
  border-radius:12px;
  overflow:hidden;
  background:#0b0f13;
}

.search-candidates.show{
  display:block;
}

.search-candidate{
  width:100%;
  border:0;
  border-bottom:1px solid rgba(255,255,255,.06);
  padding:11px 13px;
  text-align:left;
  color:var(--text);
  background:transparent;
}

.search-candidate:last-child{
  border-bottom:0;
}

.search-candidate:hover,
.search-candidate:active{
  background:#151c23;
}

.candidate-code{
  display:inline-block;
  min-width:64px;
  color:var(--cyan);
  font-weight:800;
}

.candidate-name{
  color:#e9edf0;
}

/* =========================
   快速按鈕
========================= */

.quick-panel{
  margin-top:10px;
  display:flex;
  flex-wrap:wrap;
  gap:7px;
}

.quick-btn{
  border:1px solid #303943;
  background:#11161b;
  color:#dce2e7;
  border-radius:10px;
  min-height:38px;
  padding:0 12px;
  font-size:12px;
  font-weight:800;
}

.quick-btn:hover{
  border-color:#4b5966;
  background:#182027;
}

.quick-btn:active{
  transform:scale(.98);
}

/* =========================
   五大掃描按鈕
========================= */

.scan-panel{
  margin-top:12px;
  padding:11px;
  background:#0d1217;
  border:1px solid var(--line);
  border-radius:14px;
}

.scan-grid{
  display:grid;
  grid-template-columns:
    repeat(5,1fr);
  gap:7px;
}

.scan-btn{
  border:1px solid #303943;
  background:#11161b;
  color:#dce2e7;
  border-radius:10px;
  min-height:44px;
  padding:0 10px;
  font-size:12px;
  font-weight:850;
}

.scan-btn:hover{
  border-color:#4b5966;
  background:#182027;
}

.scan-btn:active{
  transform:scale(.98);
}

.scan-btn.hot{
  border-color:
    rgba(255,159,67,.45);
  background:
    linear-gradient(
      135deg,
      rgba(255,87,34,.95),
      rgba(255,159,67,.9)
    );
  color:#fff;
}

.scan-btn.break{
  border-color:
    rgba(33,208,122,.35);
}

.scan-btn.ready{
  border-color:
    rgba(255,200,87,.35);
}

.scan-btn.bull{
  border-color:
    rgba(77,163,255,.35);
}

/* =========================
   Loading
========================= */

.loading-box{
  display:none;
  margin-top:12px;
  padding:14px;
  border:1px solid var(--line);
  border-radius:13px;
  background:#0d1217;
  color:var(--muted);
  text-align:center;
  font-size:13px;
}

.loading-box.show{
  display:block;
}

.loading-dot{
  display:inline-block;
  width:7px;
  height:7px;
  margin-right:5px;
  border-radius:50%;
  background:var(--cyan);
  animation:pulse 1s infinite alternate;
}

@keyframes pulse{
  from{
    opacity:.25;
  }

  to{
    opacity:1;
  }
}

/* =========================
   錯誤訊息
========================= */

.message{
  display:none;
  margin-top:12px;
  padding:12px 14px;
  border-radius:12px;
  border:
    1px solid rgba(255,82,99,.28);
  background:
    rgba(255,82,99,.08);
  color:#ff9aa5;
  font-size:13px;
  line-height:1.6;
}

.message.show{
  display:block;
}

/* =========================
   股票主資訊
========================= */

.stock-card{
  margin-top:14px;
  background:
    linear-gradient(
      145deg,
      rgba(20,25,31,.98),
      rgba(12,16,20,.98)
    );
  border:1px solid var(--line);
  border-radius:18px;
  padding:16px;
  box-shadow:
    0 10px 30px rgba(0,0,0,.28);
}

.stock-head{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:12px;
}

.stock-name{
  font-size:25px;
  font-weight:950;
  line-height:1.2;
}

.stock-code{
  color:var(--cyan);
  font-size:13px;
  font-weight:800;
  margin-top:5px;
}

.stock-market{
  color:var(--muted);
  font-size:11px;
  margin-top:3px;
}

.price-box{
  text-align:right;
}

.current-price{
  font-size:30px;
  line-height:1;
  font-weight:950;
}

.price-change{
  margin-top:6px;
  font-size:13px;
  font-weight:800;
}

.up{
  color:var(--red);
}

.down{
  color:var(--green);
}

.flat{
  color:var(--muted);
}

/* =========================
   資訊格
========================= */

.info-grid{
  margin-top:15px;
  display:grid;
  grid-template-columns:
    repeat(4,1fr);
  gap:8px;
}

.info-item{
  min-height:65px;
  padding:10px;
  border-radius:11px;
  border:
    1px solid rgba(255,255,255,.055);
  background:#0b0f13;
}

.info-label{
  color:var(--muted);
  font-size:10px;
  margin-bottom:5px;
}

.info-value{
  color:#f1f4f6;
  font-size:14px;
  font-weight:850;
}

/* =========================
   區塊標題
========================= */

.section-title{
  display:flex;
  align-items:center;
  gap:8px;
  margin:18px 0 9px;
  font-size:16px;
  font-weight:900;
}

.section-title::before{
  content:"";
  width:4px;
  height:18px;
  border-radius:3px;
  background:var(--blue);
}

.section-title.orange::before{
  background:var(--orange);
}

.section-title.green::before{
  background:var(--green);
}

/* =========================
   支撐壓力
========================= */

.level-grid{
  display:grid;
  grid-template-columns:
    repeat(4,1fr);
  gap:8px;
}

.level-card{
  padding:13px 10px;
  border-radius:13px;
  border:1px solid var(--line);
  background:#0d1217;
  text-align:center;
}

.level-label{
  color:var(--muted);
  font-size:11px;
  margin-bottom:6px;
}

.level-value{
  font-size:18px;
  font-weight:950;
}

.support1{
  color:#48d6a0;
}

.support2{
  color:#22b981;
}

.resistance1{
  color:#ffbd69;
}

.resistance2{
  color:#ff6f78;
}

/* =========================
   交易計畫
========================= */

.trade-grid{
  display:grid;
  grid-template-columns:
    repeat(4,1fr);
  gap:8px;
}

.trade-card{
  padding:13px 10px;
  border-radius:13px;
  background:#0d1217;
  border:1px solid var(--line);
  text-align:center;
}

.trade-label{
  color:var(--muted);
  font-size:11px;
}

.trade-value{
  margin-top:6px;
  font-size:19px;
  font-weight:950;
}

.entry{
  color:var(--blue);
}

.stop{
  color:var(--red);
}

.tp1{
  color:var(--yellow);
}

.tp2{
  color:var(--green);
}

/* =========================
   法人
========================= */

.chip-grid{
  display:grid;
  grid-template-columns:
    repeat(4,1fr);
  gap:8px;
}

.chip-card{
  padding:12px 10px;
  border:1px solid var(--line);
  border-radius:13px;
  background:#0d1217;
}

.chip-label{
  color:var(--muted);
  font-size:11px;
}

.chip-value{
  margin-top:6px;
  font-size:17px;
  font-weight:900;
}

.chip-sub{
  margin-top:4px;
  font-size:10px;
  color:#697681;
}

/* =========================
   熱門20
========================= */

.hot20-panel{
  margin-top:14px;
  display:none;
  background:#0d1217;
  border:1px solid var(--line);
  border-radius:16px;
  overflow:hidden;
}

.hot20-panel.show{
  display:block;
}

.hot20-head{
  padding:13px 14px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid var(--line);
}

.hot20-title{
  font-weight:900;
}

.hot20-time{
  color:var(--muted);
  font-size:10px;
}

.hot20-list{
  display:flex;
  flex-direction:column;
}

.hot-row{
  display:grid;
  grid-template-columns:
    38px 1fr 75px 75px 70px;
  gap:7px;
  align-items:center;
  padding:11px 12px;
  border-bottom:1px solid rgba(255,255,255,.05);
}

.hot-row:last-child{
  border-bottom:0;
}

.hot-rank{
  color:var(--yellow);
  font-weight:950;
  text-align:center;
}

.hot-name{
  min-width:0;
}

.hot-name strong{
  display:block;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.hot-name small{
  color:var(--muted);
  font-size:10px;
}

.hot-num{
  text-align:right;
  font-weight:800;
  font-size:12px;
}

/* =========================
   掃描結果
========================= */

.scan-result{
  margin-top:14px;
}

.scan-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:8px;
}

.scan-title{
  font-size:17px;
  font-weight:900;
}

.scan-time{
  font-size:10px;
  color:var(--muted);
}

.result-list{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.result-card{
  padding:12px;
  border:1px solid var(--line);
  border-radius:14px;
  background:#0d1217;
}

.result-top{
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.result-name{
  font-weight:900;
}

.result-name small{
  display:block;
  color:var(--muted);
  font-size:10px;
  margin-top:3px;
}

.result-price{
  text-align:right;
  font-weight:950;
}

.result-metrics{
  display:grid;
  grid-template-columns:
    repeat(5,1fr);
  gap:6px;
  margin-top:9px;
}

.metric{
  padding:7px;
  border-radius:8px;
  background:#090d11;
  text-align:center;
}

.metric span{
  display:block;
  color:var(--muted);
  font-size:9px;
}

.metric b{
  font-size:12px;
}

.result-actions{
  display:flex;
  justify-content:flex-end;
  margin-top:9px;
}

.view-btn{
  border:1px solid #3a4651;
  background:#141b22;
  color:#fff;
  border-radius:8px;
  padding:7px 11px;
  font-size:11px;
  font-weight:800;
}

/* =========================
   空白
========================= */

.empty{
  padding:25px 15px;
  text-align:center;
  color:var(--muted);
}

/* =========================
   Footer
========================= */

.footer{
  margin-top:25px;
  padding:18px 8px 35px;
  color:#58636d;
  font-size:10px;
  line-height:1.7;
  text-align:center;
}

/* =========================
   RWD
========================= */

@media(max-width:760px){

  .container{
    width:calc(100% - 12px);
    margin-top:9px;
  }

  .topbar{
    padding-left:10px;
    padding-right:10px;
  }

  .brand-title{
    font-size:17px;
  }

  .brand-sub{
    font-size:9px;
  }

  .scan-grid{
    grid-template-columns:
      repeat(2,1fr);
  }

  .scan-btn:first-child{
    grid-column:span 2;
  }

  .stock-card{
    padding:13px;
  }

  .stock-name{
    font-size:21px;
  }

  .current-price{
    font-size:25px;
  }

  .info-grid,
  .level-grid,
  .trade-grid,
  .chip-grid{
    grid-template-columns:
      repeat(2,1fr);
  }

  .hot-row{
    grid-template-columns:
      30px 1fr 60px 60px 60px;
    gap:5px;
    padding:10px 8px;
  }

  .result-metrics{
    grid-template-columns:
      repeat(3,1fr);
  }

}

@media(max-width:390px){

  .hot-row{
    grid-template-columns:
      26px 1fr 54px 54px 52px;
    font-size:11px;
  }

  .result-metrics{
    grid-template-columns:
      repeat(2,1fr);
  }

}
</style>
</head>

<body>

<header class="topbar">

  <div class="topbar-inner">

    <div>

      <div class="brand-title">
        m1491｜台股專業分析
      </div>

      <div class="brand-sub">
        動態法人籌碼 × 支撐壓力 × 突破分析 V1491
      </div>

    </div>

    <div class="status">

      <span class="status-dot"></span>

      <span id="systemStatus">
        系統待命
      </span>

    </div>

  </div>

</header>


<main class="container">

  <!-- =========================
       搜尋
  ========================== -->

  <section class="search-panel">

      <div class="search-input-wrap">

        <input
          id="searchInput"
          type="search"
          autocomplete="off"
          autocorrect="off"

    <div

    ></div>


    <!-- =====================

    <div class="quick-panel">

      <button
        class="quick-btn"
        type="button"
        data-code="2330"
      >
        台積電 2330
      </button>

      <button
        class="quick-btn"
        type="button"
        data-code="2317"
      >
        鴻海 2317
      </button>

      <button
        class="quick-btn"
        type="button"
        data-code="2303"
      >
        聯電 2303
      </button>

      <button
        class="quick-btn"
        type="button"
        data-code="2409"
      >
        友達 2409
      </button>

      <button
        class="quick-btn"
        type="button"
        data-code="2426"

      </button>

    <!-- =====================

    ====================== -->

    <div class="scan-panel">

        <button

        >

        </button>

        <button

        >
          🔥 熱門20檔

        <button
          id="breakoutBtn"

        >
          🚀 確認突破

          id="readyBtn"

    <div

    <!-- =====================

    ====================== -->

    <div

  </section>


  <!-- =========================

  <section

  >

    <div class="empty">

    </div>

  </section>


  <!-- =========================
       熱門20
  ========================== -->

  <section
    id="hot20Panel"
    class="hot20-panel"
  >

    <div class="hot20-head">

      <div class="hot20-title">
        🔥 當日熱門20檔
      </div>

      <div
        id="hot20Time"
        class="hot20-time"
      >
        尚未掃描
      </div>

    </div>

    <div
      id="hot20List"

  <!-- =========================

  ========================== -->

  <section
    id="scanResult"
    class="scan-result"
  ></section>


  <!-- =========================

  <footer class="footer">

    m1491 V1491｜台股資料分析工具<br>

</main><script>
"use strict";

/* =========================================================
   V1491｜核心設定
========================================================= */

const V1491_VERSION = "V1491";
const V1491_BUILD = "2026.10";


/* =========================================================
   原始30檔
   ❗固定資料，不作為動態熱門20／突破掃描候選池
========================================================= */

const SCAN_CODES = [
  "1301",
  "1303",
  "1326",

/* =========================================================
   基礎工具
========================================================= */

function cleanCode(value){

  return String(value ?? "")
    .trim()
    .toUpperCase();

}


function normalizeCode(value){

  return cleanCode(value)
    .replace(/\s+/g,"");

}


function numberValue(value){

  if(
    value === null ||
    value === undefined ||
    value === "" ||
    value === "--" ||
    value === "---"
  ){

    return null;

  }

  const n = Number(
    String(value)
      .replace(/,/g,"")
      .replace(/%/g,"")
      .trim()
  );

  return Number.isFinite(n)
    ? n
    : null;

}


function textValue(value){

  if(
    value === null ||
    value === undefined
  ){

    return "";

  }

  return String(value).trim();

}


function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function formatNumber(value,digits=2){

  const n = numberValue(value);

  if(n === null){

    return "--";

  }

  return n.toLocaleString(
    "zh-TW",
    {
      minimumFractionDigits:digits,
      maximumFractionDigits:digits
    }
  );

}


function formatInteger(value){

  const n = numberValue(value);

  if(n === null){

    return "--";

  }

  return n.toLocaleString("zh-TW",{
    maximumFractionDigits:0
  });

}


function formatPercent(value){

  const n = numberValue(value);

  if(n === null){

    return "--";

  }

  return `${n >= 0 ? "+" : ""}${n.toFixed(2)}%`;

}


function sleep(ms){

  return new Promise(resolve =>
    setTimeout(resolve,ms)
  );

}

/* =========================================================
   合併市場資料
========================================================= */

function mergeMarketRows(...lists){

  const map = new Map();

  for(const list of lists){

    if(!Array.isArray(list)){

      continue;

    }

    for(const row of list){

      if(!row || !row.code){

        continue;

      }

      const code =
        normalizeCode(row.code);

      const old =
        map.get(code);

      map.set(
        code,
        old
          ? {
              ...old,
              ...row,
              code
            }
          : {
              ...row,
              code
            }
      );

    }

  }

  return Array.from(
    map.values()
  );

}

async function fetchJSON(url,options={}){

  const controller =
    new AbortController();

  const timeout =
    setTimeout(
      () => controller.abort(),
      options.timeout || 12000
    );

  try{

    const response =
      await fetch(
        url,
        {
          ...options,
          signal:
            controller.signal,
          cache:"no-store"
        }
      );

    if(!response.ok){

      throw new Error(
        `HTTP ${response.status}`
      );

    }

    return await response.json();

  }finally{

    clearTimeout(timeout);

  }

}

/* =========================================================
   建立完整搜尋宇宙
   TWSE + TPEx + 市場 + KNOWN
========================================================= */

async function getMarketUniverse(force=false){

  const now =
    Date.now();

  if(
    !force &&
    state.universe.length &&
    now - state.universeTime < 300000
  ){

    return state.universe;

  }


  if(
    !force &&
    state.universePromise
  ){

    return state.universePromise;

  }


  state.universePromise =
    (async()=>{

      const [
        twseInfo,
        tpexInfo,
        market
      ] =
        await Promise.all([
          getTWSEUniverse(),
          getTPExUniverse(),
          getMarketToday(force)
            .catch(()=>[])
        ]);


      const rows = [];


      rows.push(
        ...twseInfo,
        ...tpexInfo
      );


      /*
       * 市場資料可以補上目前
       * API 有資料但基本資料 API
       * 尚未回傳的股票／ETF。
       */

      for(const row of market){

        rows.push({

          code:
            row.code,

          name:
            row.name ||
            KNOWN[row.code] ||
            "",

          market:
            row.market ||
            "",

          type:
            isETFCode(row.code)
              ? "ETF"
              : "STOCK"

        });

      }


      /*
       * KNOWN 最後補入。
       * 只是補資料，不限制搜尋。
       */

      for(
        const [code,name]
        of Object.entries(KNOWN)
      ){

        rows.push({

          code,

          name,

          market:"",

          type:
            isETFCode(code)
              ? "ETF"
              : "STOCK"

        });

      }


      const map =
        new Map();


      for(const row of rows){

        const code =
          normalizeCode(
            row.code
          );

        if(!code){

          continue;

        }

        const old =
          map.get(code);


        if(!old){

          map.set(
            code,
            {
              ...row,
              code
            }
          );

          continue;

        }


        /*
         * 優先保留有名稱的資料
         */

        map.set(
          code,
          {

            ...old,

            ...row,

            code,

            name:
              row.name ||
              old.name ||
              KNOWN[code] ||
              ""

          }
        );

      }


      state.universe =
        Array.from(
          map.values()
        );

      state.universeTime =
        Date.now();


      return state.universe;

    })()
    .finally(()=>{

      state.universePromise =
        null;

    });


  return state.universePromise;

}

            b.code
          )
      );


  state.searchReady = true;


  return state.searchUniverse;

}


/* =========================================================
   搜尋股票
   支援：
   2330
   2409
   台積電
   友達
   元大台灣50
========================================================= */

async function searchStocks(keyword){

  const key =
    textValue(keyword)
      .toUpperCase();


  if(!key){

    return [];

  }


  const universe =
    await prepareSearchUniverse();


  /*
   * 完全代號優先
   */

  const exactCode =
    universe.filter(
      row =>
        normalizeCode(row.code) ===
        normalizeCode(key)
    );


  /*
   * 完全名稱優先
   */

  const exactName =
    universe.filter(
      row =>
        textValue(row.name)
          .toUpperCase() === key
    );


  /*
   * 代號包含
   */

  const codeMatch =
    universe.filter(
      row =>
        normalizeCode(row.code)
          .includes(
            normalizeCode(key)
          )
    );


  /*
   * 中文名稱包含
   */

  const nameMatch =
    universe.filter(
      row =>
        textValue(row.name)
          .toUpperCase()
          .includes(key)
    );


  const map =
    new Map();


  for(
    const row
    of [
      ...exactCode,
      ...exactName,
      ...codeMatch,
      ...nameMatch
    ]
  ){

    if(!map.has(row.code)){

      map.set(
        row.code,
        row
      );

    }

  }


  return Array.from(
    map.values()
  ).slice(0,30);

}


/* =========================================================
   找單一股票
========================================================= */

async function findStock(value){

  const key =
    normalizeCode(value);


  if(!key){

    return null;

  }


  const results =
    await searchStocks(value);


  if(!results.length){

    return null;

  }


  /*
   * 完全代號優先
   */

  const exact =
    results.find(
      row =>
        normalizeCode(row.code) === key
    );


  if(exact){

    return exact;

  }


  /*
   * 完全名稱
   */

  const exactName =
    results.find(
      row =>
        textValue(row.name) ===
        textValue(value)
    );


  return exactName ||
    results[0] ||
    null;

}

async function getHistory(code, months=4){

  const clean =
    normalizeCode(code);

  if(!clean){

    return [];

  }


  const cacheKey =
    `${clean}_${months}`;


  if(
    state.historyCache.has(cacheKey)
  ){

    return state.historyCache.get(
      cacheKey
    );

  }


  /*
   * TWSE STOCK_DAY
   *
   * 使用最近幾個月資料，
   * 足夠計算 MA5 / MA20 / MA60
   * 以及近期高低點。
   */

  const now =
    new Date();

  const results = [];


  for(
    let i=0;
    i<months;
    i++
  ){

    const d =
      new Date(
        now.getFullYear(),
        now.getMonth()-i,
        1
      );


    const date =
      `${d.getFullYear()}${String(
        d.getMonth()+1
      ).padStart(2,"0")}01`;


    const url =
      `${API.day}?date=${date}&stockNo=${encodeURIComponent(clean)}`;


    try{

        await fetchJSON(
          url,
          {
            timeout:10000
          }
        );


      if(
        !payload ||
        !Array.isArray(payload.data)
      ){

        continue;

      }


      /*
       * TWSE 回傳：
       *
       * 0 日期
       * 1 成交股數
       * 2 成交金額
       * 3 開盤
       * 4 最高
       * 5 最低
       * 6 收盤
       * 7 漲跌
       * 8 漲跌價差
       * 9 成交筆數
       */

      for(
        const row

          continue;

          numberValue(row[6]);

      console.warn(

      );

    }

  }


  /*
   * 日期由舊到新

  results.sort(
    (a,b)=>
      String(a.date)
        .localeCompare(
          String(b.date)
        )
  );


  /*

  const map =

/* =========================================================

function movingAverage(
  values,
  period
){

  const arr =
    values
      .map(numberValue)
      .filter(v => v !== null);


  if(
    arr.length < period
  ){

    return null;

  }


  const recent =
    arr.slice(
      -period
    );


  const sum =
    recent.reduce(
      (a,b)=>a+b,
      0
    );


  return sum / period;

}


/* =========================================================
   移動平均

function calculateMovingAverages(

){

  if(
    !Array.isArray(history) ||
    !history.length
  ){

    return {

      ma5:null,

      ma20:null,

      ma60:null,

  }


  const closes =
    history.map(
      row => row.close
    );


  const volumes =
    history.map(
      row => row.volume
    );


  return {

    ma5:
      movingAverage(

        5
      ),

    ma20:
      movingAverage(
        closes,
        20
      ),

    ma60:
      movingAverage(
        closes,
        60
      ),

    volumeMA5:
      movingAverage(

      ),

      movingAverage(
        volumes,
        20

}


/* =========================================================
   最近高低點
========================================================= */

function recentHigh(
  history,
  period=20
){

  if(
    !Array.isArray(history) ||
    history.length < period
  ){

    return null;

/* =========================================================
   前一區間高低點
   避免突破後「壓力不存在」
========================================================= */

function previousPeriodHigh(
  history,
  recentPeriod=20,
  previousPeriod=20
){

  if(
    !Array.isArray(history) ||
    history.length <
      recentPeriod + previousPeriod
  ){

    return null;

  }


  const end =
    history.length -
    recentPeriod;


  const start =
    Math.max(
      0,
      end - previousPeriod
    );


  const rows =
    history.slice(
      start,
      end
    );


  const values =
    rows
      .map(
        row =>
          numberValue(row.high)
      )
      .filter(
        v => v !== null
      );


  return values.length
    ? Math.max(...values)
    : null;

}


function previousPeriodLow(

  previousPeriod=20
){

  if(
    !Array.isArray(history) ||
    history.length <
      recentPeriod + previousPeriod

/* =========================================================
   ATR
   用於突破後沒有歷史壓力時，
   建立有依據的風險距離
========================================================= */

function calculateATR(
  history,
  period=14
){

  if(
    !Array.isArray(history) ||
    history.length < period + 1
  ){

    return null;

  }


  const trs = [];


  for(
    let i=1;
    i<history.length;
    i++
  ){

    const current =
      history[i];

    const previous =
      history[i-1];


    const high =
      numberValue(
        current.high
      );

    const low =
      numberValue(
        current.low
      );

    const previousClose =
      numberValue(
        previous.close
      );


    if(
      high === null ||
      low === null ||
      previousClose === null
    ){

      continue;

    }


    const tr =
      Math.max(

        high - low,

        Math.abs(
          high -
          previousClose
        ),

        Math.abs(
          low -
          previousClose
        )

      );


    trs.push(tr);

  }


  if(
    trs.length < period
  ){

    return null;

  }


  const recent =
    trs.slice(-period);


  return recent.reduce(
    (a,b)=>a+b,
    0
  ) / period;

}


/* =========================================================
   成交量均值
========================================================= */

function averageVolume(
  history,
  period=20
){

  if(
    !Array.isArray(history) ||
    history.length < period
  ){

    return null;

  }


  const values =
    history
      .slice(-period)
      .map(
        row =>
          numberValue(row.volume)
      )
      .filter(
        v => v !== null
      );


  if(
    values.length < period
  ){

    return null;

  }


  return values.reduce(
    (a,b)=>a+b,
    0
  ) / values.length;

}


/* =========================================================
   量比
========================================================= */

function volumeRatio(
  history
){

  if(
    !Array.isArray(history) ||
    history.length < 21

    return null;

  const latest =
    numberValue(

      ),

    );


  if(

  ){

    return null;

  }


  return latest / avg;

}

/* =========================================================
   支撐／壓力計算
   ❗不使用人工固定百分比假價格
========================================================= */

function calculateLevels(
  history,
  price
){

  const current =
    numberValue(price);


  if(
    current === null
  ){

    return {

      support1:null,

      support2:null,

      resistance1:null,

      resistance2:null

    };

  }


  const ma =
    calculateMovingAverages(
      history
    );


  const low20 =
    recentLow(
      history,
      20
    );


  const low40 =
    recentLow(
      history,
      40
    );


  const high20 =
    recentHigh(
      history,
      20
    );


  const high40 =
    recentHigh(
      history,
      40
    );


  const previousHigh =
    previousPeriodHigh(
      history,
      20,
      20
    );


  const previousLow =
    previousPeriodLow(
      history,
      20,
      20
    );


  /*
   * 支撐：
   * 只取目前價格下方的真實技術位置。
   */

  const supportCandidates = [

    low20,

    low40,

    ma.ma5,

    ma.ma20,

    ma.ma60,

    previousLow

  ]
    .filter(
      v =>
        v !== null &&
        v < current
    )
    .sort(
      (a,b)=>b-a
    );


  /*
   * 去除非常接近的重複價格
   */

  const uniqueSupports = [];


  for(
    const value
    of supportCandidates
  ){

    if(
      !uniqueSupports.some(
        existing =>
          Math.abs(
            existing-value
          ) /
          value <
          0.005
      )
    ){

      uniqueSupports.push(
        value
      );

    }

  }


  /*
   * 壓力：
   * 目前價格上方的歷史高點。
   */

  const resistanceCandidates = [

    high20,

    high40,

    previousHigh

  ]
    .filter(
      v =>
        v !== null &&
        v > current
    )
    .sort(
      (a,b)=>a-b
    );


  const uniqueResistances = [];


  for(
    const value
    of resistanceCandidates
  ){

    if(
      !uniqueResistances.some(
        existing =>
          Math.abs(
            existing-value
          ) /
          value <
          0.005
      )
    ){

      uniqueResistances.push(
        value
      );

    }

  }


  /*
   * 突破後如果上方沒有歷史壓力，
   * 不直接製造假壓力。
   *
   * resistance 會保持 null，
   * 後面的交易計畫再依 ATR
   * 計算風險／目標。
   */

  return {

    support1:
      uniqueSupports[0] ??
      null,

    support2:
      uniqueSupports[1] ??
      null,

    resistance1:
      uniqueResistances[0] ??
      null,

    resistance2:
      uniqueResistances[1] ??
      null

  };

}

/* =========================================================
   交易價位
========================================================= */

function buildTradeLevels(
  technical,
  price
){

  const current =
    numberValue(price);


  if(
    current === null
  ){

    return {

      entry:null,

      stop:null,

      tp1:null,

      tp2:null

    };

  }


  const levels =
    technical?.levels || {};


  const atr =
    numberValue(
      technical?.atr
    );


  /*
   * 進場：
   * 以目前價格作為分析基準。
   */

  const entry =
    current;


  /*
   * 止損：
   *
   * 優先使用第一支撐。
   * 若沒有支撐，再使用 ATR。
   */

  let stop =
    numberValue(
      levels.support1
    );


  if(stop === null){

    if(atr !== null){

      stop =
        current -
        atr * 1.2;

    }

  }


  /*
   * 如果技術資料不足，
   * 不硬塞假的價格。
   */

  if(
    stop !== null &&
    stop >= current
  ){

    stop = null;

  }


  /*
   * TP1：
   * 優先第一壓力。
   *
   * 突破後沒有歷史壓力，
   * 使用 ATR 方式計算。
   */

  let tp1 =
    numberValue(
      levels.resistance1
    );


  if(
    tp1 === null &&
    atr !== null
  ){

    tp1 =
      current +
      atr * 1.5;

  }


  /*
   * TP2：
   * 優先第二壓力。
   */

  let tp2 =
    numberValue(
      levels.resistance2
    );


  if(
    tp2 === null &&
    atr !== null
  ){

    tp2 =
      current +
      atr * 2.5;

  }


  /*
   * 確保目標價高於進場。
   */

  if(
    tp1 !== null &&
    tp1 <= current
  ){

    tp1 = null;

  }


  if(
    tp2 !== null &&
    tp2 <= current
  ){

    tp2 = null;

  }


  /*
   * 若 TP2 小於 TP1，
   * 不顛倒目標。
   */

  if(
    tp1 !== null &&
    tp2 !== null &&
    tp2 <= tp1
  ){

    tp2 = null;

  }


  return {

    entry,

    stop,

    tp1,

    tp2

  };

}

};

   */

  const pct =
    numberValue(
      stock.changePct
    );


  if(
    pct !== null &&
    pct >= 3
  ){

    score += 10;

    reasons.push(
      "當日漲幅強"
    );

  }


  /*
   * 確認突破：
   *
   * 必須有價格突破，
   * 且至少有一項量價／均線確認。
   */

  const priceBreak =
    isPriceBreakingOut(
      technical,
      price
    );


  const confirmation =
    (
      isVolumeExpanded(
        technical
      ) ||
      isBullishMA(
        technical.ma
      ) ||
      (
        pct !== null &&
        pct >= 3
      )
    );


  return {

    isBreakout:
      priceBreak &&
      confirmation,

    score:
      Math.min(
        100,
        score
      ),

    reasons

  };

}


/* =========================================================
   準備突破
========================================================= */

function readyBreakoutModel(
  stock,
  technical
){

  const price =
    numberValue(stock?.price);


  if(
    price === null ||
    !technical
  ){

    return {

      isReady:false,

      score:0,

      reasons:[]

    };

  }


  let score = 0;

  const reasons = [];


  /*
   * ① 接近前高
   */

  const previousHigh =
    numberValue(
      technical.previousHigh20
    );


  if(
    previousHigh !== null &&
    previousHigh > price
  ){

    const distance =
      (
        previousHigh -
        price
      ) /
      previousHigh;


    if(distance <= 0.03){

      score += 30;

      reasons.push(
        "接近前期高點"
      );

    }else if(distance <= 0.06){

      score += 20;

      reasons.push(
        "接近前期壓力"
      );

    }

  }


  /*
   * ② MA5 / MA20
   */

  if(
    priceAboveMA(
      price,
      technical.ma?.ma5
    )
  ){

    score += 15;

    reasons.push(
      "站上MA5"
    );

  }


  if(
    priceAboveMA(
      price,
      technical.ma?.ma20
    )
  ){

    score += 15;

    reasons.push(
      "站上MA20"
    );

  }


  /*
   * ③ 均線多頭
   */

  if(
    isBullishMA(
      technical.ma
    )
  ){

    score += 15;

    reasons.push(
      "均線偏多"
    );

  }


  /*
   * ④ 成交量開始放大
   */

  const ratio =
    numberValue(
      technical.volumeRatio
    );


  if(
    ratio !== null &&
    ratio >= 1.2
  ){

    score += 15;

    reasons.push(
      "量能增加"
    );

  }


  /*
   * ⑤ 當日強勢
   */

  const pct =
    numberValue(
      stock.changePct
    );


  if(
    pct !== null &&
    pct >= 1
  ){

    score += 10;

    reasons.push(
      "股價偏強"
    );

  }


  /*
   * 準備突破：
   *
   * 尚未正式突破，
   * 但已經接近壓力並有量價條件。
   */

  const notBroken =
    previousHigh === null ||
    price <= previousHigh;


  const isReady =
    notBroken &&
    score >= 55;


  return {

    isReady,

    score:
      Math.min(
        100,
        score
      ),

    reasons

  };

}


/* =========================================================
   多頭模型
========================================================= */

function bullishModel(
  stock,
  technical
){

  const price =
    numberValue(stock?.price);


  if(
    price === null ||
    !technical
  ){

    return {

      isBullish:false,

      score:0,

      reasons:[]

    };

  }


  let score = 0;

  const reasons = [];


  /*
   * MA5 > MA20
   */

  if(
    technical.ma?.ma5 !== null &&
    technical.ma?.ma20 !== null &&
    technical.ma.ma5 >
      technical.ma.ma20
  ){

    score += 25;

    reasons.push(
      "MA5高於MA20"
    );

  }


  /*
   * MA20 > MA60
   */

  if(
    technical.ma?.ma20 !== null &&
    technical.ma?.ma60 !== null &&
    technical.ma.ma20 >
      technical.ma.ma60
  ){

    score += 25;

    reasons.push(
      "MA20高於MA60"
    );

  }


  /*
   * 股價站上MA20
   */

  if(
    priceAboveMA(
      price,
      technical.ma?.ma20
    )
  ){

    score += 20;

    reasons.push(
      "股價站上MA20"
    );

  }


  /*
   * 成交量
   */

  if(
    isVolumeExpanded(
      technical
    )
  ){

    score += 15;

    reasons.push(
      "量能放大"
    );

  }


  /*
   * 當日漲幅
   */

  const pct =
    numberValue(
      stock.changePct
    );


  if(
    pct !== null &&
    pct > 0
  ){

    score += 15;

    reasons.push(
      "當日上漲"
    );

  }


  return {

    isBullish:
      score >= 55,

    score:
      Math.min(
        100,
        score
      ),

    reasons

  };

}


/* =========================================================
   綜合技術分析
========================================================= */

function analyzeTechnical(
  stock,
  technical
){

  const breakout =
    breakoutModel(
      stock,
      technical
    );


  const ready =
    readyBreakoutModel(
      stock,
      technical
    );


  const bullish =
    bullishModel(
      stock,
      technical
    );


  const trade =
    buildTradeLevels(
      technical,
      stock?.price
    );


  let signal =
    "觀察";


  if(
    breakout.isBreakout
  ){

    signal =
      "確認突破";

  }else if(
    ready.isReady
  ){

    signal =
      "準備突破";

  }else if(
    bullish.isBullish
  ){

    signal =
      "多頭";

  }


  return {

    breakout,

    ready,

    bullish,

    trade,

    signal,

    score:
      Math.max(
        breakout.score,
        ready.score,
        bullish.score
      )

  };

}


/* =========================================================
   分析摘要文字
========================================================= */

function buildAnalysisText(
  analysis
){

  if(!analysis){

    return "目前無法建立技術分析";

  }


  const parts = [];


  if(
    analysis.signal
  ){

    parts.push(
      `訊號：${analysis.signal}`
    );

  }


  if(
    analysis.breakout?.reasons?.length
  ){

    parts.push(
      analysis.breakout
        .reasons
        .join("、")
    );

  }


  if(
    analysis.ready?.reasons?.length &&
    !analysis.breakout?.isBreakout
  ){

    parts.push(
      analysis.ready
        .reasons
        .join("、")
    );

  }


  if(
    analysis.bullish?.reasons?.length &&
    !analysis.breakout?.isBreakout &&
    !analysis.ready?.isReady
  ){

    parts.push(
      analysis.bullish
        .reasons
        .join("、")
    );

  }


  return parts.length
    ? parts.join("｜")
    : "技術條件資料不足";

}

async function getRealtimeQuote(code){

  const clean =

  /*
   * 先使用快取
   */

  if(
    state.quoteCache.has(clean)
  ){

    const cached =
      state.quoteCache.get(clean);

    /*
     * 10 秒內直接使用
     */

    if(
      Date.now() -
      cached.time <
      10000
    ){

      return cached.data;

    }

  }


  /*
   * TWSE MIS
   */

  const url =
    `${API.quote}?ex_ch=tse_${encodeURIComponent(clean)}.tw`;


  try{

    const payload =
      await fetchJSON(
        url,
        {
          timeout:8000
        }
      );


    const msgArray =
      Array.isArray(
        payload?.msgArray
      )
        ? payload.msgArray
        : [];


    const row =
      msgArray.find(

          normalizeCode(

      );

      state.quoteCache.set(

  }catch(error){

  /*

/* =========================================================
   法人數值
========================================================= */

function normalizeInstitutionNumber(
  value
){

  if(
    value === null ||
    value === undefined
  ){

    return null;

  }


  const text =
    String(value)
      .trim()
      .replace(/,/g,"");


  if(
    text === "" ||
    text === "--" ||
    text === "---" ||
    text === "N/A"
  ){

    return null;

  }


  const n =
    Number(text);


  return Number.isFinite(n)
    ? n
    : null;

}


/* =========================================================
   找欄位
========================================================= */

function findInstitutionField(
  row,
  names
){

  if(!row || typeof row !== "object"){

    return null;

  }


  const keys =
    Object.keys(row);


  for(
    const target
    of names
  ){

    const normalizedTarget =
      String(target)
        .replace(/\s/g,"")
        .toLowerCase();


    const key =
      keys.find(
        k =>
          String(k)
            .replace(/\s/g,"")
            .toLowerCase()
            === normalizedTarget
      );


    if(key){

      return row[key];

    }

  }


  /*
   * 模糊欄位名稱
   */

  for(
    const key
    of keys
  ){

    const k =
      String(key)
        .replace(/\s/g,"")
        .toLowerCase();


    for(
      const target
      of names
    ){

      const t =
        String(target)
          .replace(/\s/g,"")
          .toLowerCase();


      if(
        k.includes(t)
      ){

        return row[key];

      }

    }

  }


  return null;

}

        row,
        [
          "自營商買進股數",
          "自營商買進"
        ]
      )
    );


  const dealerSell =
    normalizeInstitutionNumber(
      findInstitutionField(
        row,
        [
          "自營商賣出股數",
          "自營商賣出"
        ]
      )
    );


  /*
   * TWSE T86 的股數是「股」，
   * 畫面統一轉成「張」。
   */

  const foreignNet =
    foreign !== null &&
    foreignSell !== null
      ? (
          foreign -
          foreignSell
        ) / 1000
      : null;


  const trustNet =
    trustBuy !== null &&
    trustSell !== null
      ? (
          trustBuy -
          trustSell
        ) / 1000
      : null;


  const dealerNet =
    dealerBuy !== null &&
    dealerSell !== null
      ? (
          dealerBuy -
          dealerSell
        ) / 1000
      : null;


  const total =
    foreignNet !== null ||
    trustNet !== null ||
    dealerNet !== null
      ? (
          (foreignNet || 0) +
          (trustNet || 0) +
          (dealerNet || 0)
        )
      : null;


  return {

    code,

    foreign:
      foreignNet,

    trust:
      trustNet,

    dealer:
      dealerNet,

    total

  };

}


/* =========================================================
   取得三大法人
========================================================= */

async function getInstitutionData(
  code
){

  const clean =
    normalizeCode(code);


  if(!clean){

    return emptyInstitutionData();

  }


  /*
   * 快取 60 秒
   */

  const cached =
    state.institutionCache.get(
      clean
    );


  if(
    cached &&
    Date.now() -
    cached.time <
    60000
  ){

    return cached.data;

  }


  /*
   * 取得目前日期
   */

  const now =
    new Date();


  const yyyy =
    now.getFullYear();


  const mm =
    String(
      now.getMonth()+1
    ).padStart(2,"0");


  const dd =
    String(
      now.getDate()
    ).padStart(2,"0");


  const date =
    `${yyyy}${mm}${dd}`;


  const url =
    `${API.institution}?date=${date}&selectType=ALL`;


  try{

    const payload =
      await fetchJSON(
        url,
        {
          timeout:10000
        }
      );


    /*
     * T86 不同版本可能把資料
     * 放在 data / aaData。
     */

    let rows = [];


    if(
      Array.isArray(
        payload?.data
      )
    ){

      rows =
        payload.data;

    }else if(
      Array.isArray(
        payload?.aaData
      )
    ){

      rows =
        payload.aaData;

    }


    /*
     * 若 API 回傳的是表格陣列，
     * 嘗試取得標題並轉成物件。
     */

    if(
      Array.isArray(rows) &&
      rows.length &&
      Array.isArray(rows[0])
    ){

      const fields =
        Array.isArray(
          payload?.fields
        )
          ? payload.fields
          : Array.isArray(
              payload?.title
            )
              ? payload.title
              : [];


      if(fields.length){

        rows =
          rows.map(
            row => {

              const obj = {};

              fields.forEach(
                (field,index)=>{
                  obj[field] =
                    row[index];
                }
              );

              return obj;

            }
          );

      }else{

        /*
         * 沒有可靠欄位名稱時，
         * 不猜位置。
         */

        rows = [];

      }

    }


    const target =
      rows.find(
        row =>
          normalizeCode(
            findInstitutionField(
              row,
              [
                "證券代號",
                "股票代號",
                "公司代號",
                "Code"
              ]
            )
          ) === clean
      );


    if(target){

      const parsed =
        parseInstitutionRow(
          target
        );


      if(parsed){

        const result = {

          foreign:
            parsed.foreign,

          trust:
            parsed.trust,

          dealer:
            parsed.dealer,

          total:
            parsed.total,

          date

        };


        state.institutionCache.set(
          clean,
          {
            time:Date.now(),
            data:result
          }
        );


        return result;

      }

    }

  }catch(error){

    console.warn(
      "Institution API error:",
      clean,
      error
    );

  }


  /*
   * 找不到可靠欄位時，
   * 回傳空資料。
   *
   * ❗不猜數字。
   */

  return emptyInstitutionData();

}

async function loadStockData(

){

  const found =

    );

    await getRealtimeQuote(
      code
    );


  /*
   * 市場資料
   */

  const market =
    getMarketStock(
      code
    );


  const base = {

    ...found,

    ...(market || {}),

    ...(quote || {}),

    code,

    name:
      quote?.name ||
      market?.name ||
      found?.name ||
      KNOWN[code] ||
      code

  };


  /*

      base
    );


  /*

   */

  const institution =
    await getInstitutionData(
      code
    );


  data.institution =
    institution;


  return data;

}

      );

    }


    /*

    await sleep(60);

  }


  return output;

async function getDynamicTechnicalCandidates(){

    await getMarketToday(true);


  const candidates =
    market
      .filter(

          row &&
          row.code
      )
      .sort(
        (a,b)=>{

            numberValue(
              a.tradeValue
            ) || 0;


          const bv =
            numberValue(
              b.tradeValue
            ) || 0;


          if(av !== bv){

            return bv-av;

          }


          const ap =
            Math.abs(
              numberValue(
                a.changePct
              ) || 0
            );


          const bp =
            Math.abs(
              numberValue(
                b.changePct
              ) || 0
            );


          return bp-ap;

        }
      );


  return candidates.slice(
    0,
    DYNAMIC_LIMITS.CANDIDATE_POOL
  );

}

/* =========================================================
   基本工具
   ========================================================= */

function $(id){
  return document.getElementById(id);
}

function clean(value){
  return String(value ?? "").trim();
}

function n(value){
  if(value == null || value === "") return null;

  const v = Number(
    String(value)
      .replace(/,/g,"")
      .trim()
  );

  return Number.isFinite(v) ? v : null;
}

function esc(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#39;");
}

function money(value){
  const v = n(value);

  if(v == null){
    return "—";
  }

  return v.toFixed(2);
}

function integer(value){
  const v = n(value);

  if(v == null){
    return "—";
  }

  return Math.round(v).toLocaleString("zh-TW");
}

function pct(value){
  const v = n(value);

  if(v == null){
    return "—";
  }

  return `${v >= 0 ? "+" : ""}${v.toFixed(2)}%`;
}

function pctChange(a,b){

  const x = n(a);
  const y = n(b);

  if(x == null || y == null || x === 0){
    return "—";
  }

  return pct((y-x)/x*100);
}

function priceText(value){
  const v = n(value);

  return v == null
    ? "—"
    : v.toFixed(2);
}

function percentText(value){
  const v = n(value);

  return v == null
    ? "—"
    : `${v.toFixed(2)}%`;
}

function distanceText(price,level){

  const p = n(price);
  const l = n(level);

  if(p == null || l == null || p === 0){
    return "—";
  }

  const d = (l-p)/p*100;

  return `${d >= 0 ? "+" : ""}${d.toFixed(2)}%`;
}

/* =========================================================
   日期工具
   ========================================================= */

function pad2(v){

  return String(v).padStart(2,"0");

}

function dateText(date){

  const y = date.getFullYear();
  const m = pad2(date.getMonth()+1);
  const d = pad2(date.getDate());

  return `${y}-${m}-${d}`;

}

function today(){

  return dateText(new Date());

}

function dateShift(days){

  const d = new Date();

  d.setDate(
    d.getDate()+days
  );

  return dateText(d);

}


/* =========================================================
   API JSON
   ========================================================= */

async function fetchJSON(url,options={}){

  const response =
    await fetch(
      url,
      {
        ...options,
        cache:"no-store"
      }
    );

  if(!response.ok){

    throw new Error(
      `HTTP ${response.status}`
    );

  }

  return response.json();

}


/* =========================================================
   FinMind
   ========================================================= */

async function finmind(dataset,params={}){

  const query = new URLSearchParams();

  query.set(
    "dataset",
    dataset
  );

  Object.entries(params).forEach(
    ([key,value])=>{

      if(
        value != null &&
        value !== ""
      ){

        query.set(
          key,
          value
        );

      }

    }
  );

  const url =
    `${FINMIND}?${query.toString()}`;

  return fetchJSON(url);

}


/* =========================================================

function firstNumber(...values){

  for(const value of values){

    }

  }

  return null;

}

function normalizeHistoryRow(row){

  const date =
    row.date ||
    row.Date ||
    row.datetime ||
    row.timestamp;

  const close =
    firstNumber(
      row.close,
      row.Close,
      row.ClosePrice
    );

  const open =
    firstNumber(
      row.open,
      row.Open,
      row.OpenPrice
    );

  const high =
    firstNumber(
      row.max,
      row.high,
      row.High,
      row.HighPrice
    );

  const low =
    firstNumber(
      row.min,
      row.low,
      row.Low,
      row.LowPrice
    );

  const volume =
    firstNumber(
      row.Trading_Volume,
      row.volume,
      row.Volume
    );

  if(!date || close == null){

    return null;

  }

  return {

    date:String(date),

    open,

    high:high ?? close,

    low:low ?? close,

    close,

    volume:volume ?? 0

  };

}

/* =========================================================
   收盤價
   ========================================================= */

function closes(rows){

  return rows
    .map(r=>n(r.close))
    .filter(v=>v!=null);

}


/* =========================================================
   移動平均
   ========================================================= */

function sma(rows,period){

  const arr =
    closes(rows);

  if(arr.length < period){

    return null;

  }

  const part =
    arr.slice(-period);

  return (
    part.reduce(
      (sum,v)=>sum+v,
      0
    ) / part.length
  );

}


/* =========================================================
   均量
   ========================================================= */

function avgVolume(rows,period=20){

  const arr =
    rows
      .slice(-period)
      .map(r=>n(r.volume))
      .filter(v=>v!=null);

  if(!arr.length){

    return null;

  }

  return (
    arr.reduce(
      (sum,v)=>sum+v,
      0
    ) / arr.length
  );

}


/* =========================================================
   斜率
   ========================================================= */

function slope(rows,period=20){

  const arr =
    closes(rows)
      .slice(-period);

  if(arr.length < 5){

    return null;

  }

  const first =
    arr[0];

  const last =
    arr[arr.length-1];

  if(first === 0){

    return null;

  }

  return (
    (last-first) /
    first *
    100
  );

}


/* =========================================================
   Bias
   ========================================================= */

function bias(price,ma){

  const p=n(price);
  const m=n(ma);

  if(p==null || m==null || m===0){

    return null;

  }

  return (
    (p-m)/m*100
  );

}

  return {

    high:
      highs.length

        : null,

    low:
      lows.length
        ? Math.min(...lows)
        : null

  };

}

/* =========================================================
   平均值
   ========================================================= */

function avg(arr){

  const values =
    (arr || [])
      .map(n)
      .filter(v=>v!=null);

  if(!values.length){
    return null;
  }

  return values.reduce(
    (sum,v)=>sum+v,
    0
  ) / values.length;

}


/* =========================================================
   標準差
   ========================================================= */

function stdev(arr){

  const values =
    (arr || [])
      .map(n)
      .filter(v=>v!=null);

  if(values.length < 2){
    return null;
  }

  const mean =
    avg(values);

  const variance =
    avg(
      values.map(
        v=>Math.pow(v-mean,2)
      )
    );

  return Math.sqrt(
    variance
  );

}


/* =========================================================
   ATR
   使用實際高低價計算
   ========================================================= */

function atr(rows,period=14){

  if(!Array.isArray(rows) || rows.length < 2){
    return null;
  }

  const sortedRows =
    sorted(rows);

  const trs=[];

  for(let i=1;i<sortedRows.length;i++){

    const current =
      sortedRows[i];

    const previous =
      sortedRows[i-1];

    const high =
      n(current.high);

    const low =
      n(current.low);

    const prevClose =
      n(previous.close);

    if(
      high==null ||
      low==null ||
      prevClose==null
    ){
      continue;
    }

    const tr =
      Math.max(
        high-low,
        Math.abs(high-prevClose),
        Math.abs(low-prevClose)
      );

    if(Number.isFinite(tr)){
      trs.push(tr);
    }

  }

  if(trs.length < period){
    return null;
  }

  return avg(
    trs.slice(-period)
  );

}


/* =========================================================
   最近價格區間
   ========================================================= */

function recentRange(rows,period=60){

  const data =
    sorted(rows)
      .slice(-period);

  if(!data.length){

    return {
      high:null,
      low:null,
      range:null
    };

  }

  const highs =
    data
      .map(r=>n(r.high))
      .filter(v=>v!=null);

  const lows =
    data
      .map(r=>n(r.low))
      .filter(v=>v!=null);

  if(!highs.length || !lows.length){

    return {
      high:null,
      low:null,
      range:null
    };

  }

  const high =
    Math.max(...highs);

  const low =
    Math.min(...lows);

  return {

    high,

    low,

    range:
      high-low

  };

}


/* =========================================================
   局部高低點
   找實際歷史價格的轉折
   ========================================================= */

function localExtremes(rows,lookback=2){

  const data =
    sorted(rows);

  const highs=[];
  const lows=[];

  if(data.length < lookback*2+1){

    return {
      highs,
      lows
    };

  }

  for(
    let i=lookback;
    i<data.length-lookback;
    i++
  ){

    const current =
      data[i];

    const high =
      n(current.high);

    const low =
      n(current.low);

    if(high==null || low==null){
      continue;
    }

    let isHigh=true;
    let isLow=true;

    for(
      let j=1;
      j<=lookback;
      j++
    ){

      const left =
        data[i-j];

      const right =
        data[i+j];

      const leftHigh =
        n(left.high);

      const rightHigh =
        n(right.high);

      const leftLow =
        n(left.low);

      const rightLow =
        n(right.low);

      if(
        leftHigh!=null &&
        high < leftHigh
      ){
        isHigh=false;
      }

      if(
        rightHigh!=null &&
        high < rightHigh
      ){
        isHigh=false;
      }

      if(
        leftLow!=null &&
        low > leftLow
      ){
        isLow=false;
      }

      if(
        rightLow!=null &&
        low > rightLow
      ){
        isLow=false;
      }

    }

    if(isHigh){

      highs.push({
        price:high,
        date:current.date,
        volume:n(current.volume) || 0
      });

    }

    if(isLow){

      lows.push({
        price:low,
        date:current.date,
        volume:n(current.volume) || 0
      });

    }

  }

  return {
    highs,
    lows
  };

}


/* =========================================================
   量價密集區
   不使用固定價格
   ========================================================= */

function volumeProfile(rows,bins=24){

  const data =
    sorted(rows)
      .slice(-120);

  const values =
    data
      .map(r=>({
        high:n(r.high),
        low:n(r.low),
        close:n(r.close),
        volume:n(r.volume)||0
      }))
      .filter(
        r=>
          r.high!=null &&
          r.low!=null &&
          r.close!=null
      );

  if(!values.length){

    return [];

  }

  const highs =
    values.map(r=>r.high);

  const lows =
    values.map(r=>r.low);

  const maxPrice =
    Math.max(...highs);

  const minPrice =
    Math.min(...lows);

  if(
    !Number.isFinite(maxPrice) ||
    !Number.isFinite(minPrice) ||
    maxPrice<=minPrice
  ){

    return [];

  }

  const width =
    (maxPrice-minPrice)/bins;

  if(width<=0){

    return [];

  }

  const buckets =
    Array.from(
      {length:bins},
      ()=>({
        volume:0,
        count:0,
        prices:[]
      })
    );

  values.forEach(row=>{

    const index =
      clamp(
        Math.floor(
          (row.close-minPrice)/width
        ),
        0,
        bins-1
      );

    buckets[index].volume +=
      row.volume;

    buckets[index].count += 1;

    buckets[index].prices.push(
      row.close
    );

  });

  return buckets
    .map(
      (bucket,index)=>({

        price:
          minPrice+
          width*(index+0.5),

        volume:
          bucket.volume,

        count:
          bucket.count,

        low:
          minPrice+
          width*index,

        high:
          minPrice+
          width*(index+1)

      })
    )
    .filter(
      x=>x.count>0
    )
    .sort(
      (a,b)=>
        b.volume-a.volume
    );

}


/* =========================================================
   均線趨勢
   ========================================================= */

function movingAverageStructure(
  rows,
  price
){

  const ma5 =
    sma(rows,5);

  const ma20 =
    sma(rows,20);

  const ma60 =
    sma(rows,60);

  const ma120 =
    sma(rows,120);

  let score=0;

  if(price!=null && ma5!=null){

    score +=
      price>ma5 ? 1 : -1;

  }

  if(price!=null && ma20!=null){

    score +=
      price>ma20 ? 2 : -2;

  }

  if(
    ma5!=null &&
    ma20!=null
  ){

    score +=
      ma5>ma20 ? 2 : -2;

  }

  if(
    ma20!=null &&
    ma60!=null
  ){

    score +=
      ma20>ma60 ? 2 : -2;

  }

  if(
    ma60!=null &&
    ma120!=null
  ){

    score +=
      ma60>ma120 ? 1 : -1;

  }

  let trend="盤整";

  if(score>=5){

    trend="偏多";

  }else if(score<=-5){

    trend="偏空";

  }

  return {

    ma5,
    ma20,
    ma60,
    ma120,
    score,
    trend

  };

}


/* =========================================================
   60日位置
   ========================================================= */

function pricePosition(
  price,
  range
){

  if(
    price==null ||
    range?.low==null ||
    range?.high==null ||
    range.high<=range.low
  ){

    return null;

  }

  return clamp(
    (
      price-range.low
    ) /
    (
      range.high-range.low
    ),
    0,
    1
  );

}


/* =========================================================
   技術資料主函式
   ========================================================= */

function technical(rows,price){

  const data =
    sorted(rows);

  const latestRow =
    latest(data);

  const ma =
    movingAverageStructure(
      data,
      price
    );

  const range60 =
    recentRange(
      data,
      60
    );

  const range20 =
    recentRange(
      data,
      20
    );

  const atrValue =
    atr(
      data,
      14
    );

  const avgVol20 =
    avgVolume(
      data,
      20
    );

  const avgVol5 =
    avgVolume(
      data,
      5
    );

  const volToday =
    n(
      latestRow?.volume
    );

  const volRatio =
    volToday!=null &&
    avgVol20!=null &&
    avgVol20>0
      ? volToday/avgVol20
      : null;

  const slope20 =
    slope(
      data,
      20
    );

  const slope60 =
    slope(
      data,
      60
    );

  const bias20 =
    bias(
      price,
      ma.ma20
    );

  const bias60 =
    bias(
      price,
      ma.ma60
    );

  const pos =
    pricePosition(
      price,
      range60
    );

  let trend =
    ma.trend;

  /*
   * 再加入實際斜率，
   * 避免單純依均線排列判斷。
   */

  if(
    trend==="偏多" &&
    slope20!=null &&
    slope20<0
  ){

    trend="盤整";

  }

  if(
    trend==="偏空" &&
    slope20!=null &&
    slope20>0
  ){

    trend="盤整";

  }

  /*
   * 趨勢分數
   */

  let trendScore =
    ma.score;

  if(
    slope20!=null
  ){

    if(slope20>5){

      trendScore += 2;

    }else if(slope20>0){

      trendScore += 1;

    }else if(slope20<-5){

      trendScore -= 2;

    }else if(slope20<0){

      trendScore -= 1;

    }

  }

  /*
   * 成交量趨勢
   */

  let volumeState =
    "正常";

  if(volRatio==null){

    volumeState="資料不足";

  }else if(volRatio>=2){

    volumeState="明顯放量";

  }else if(volRatio>=1.25){

    volumeState="量能偏強";

  }else if(volRatio<=0.65){

    volumeState="量縮";

  }

  return {

    price,

    ma5:ma.ma5,

    ma20:ma.ma20,

    ma60:ma.ma60,

    ma120:ma.ma120,

    trend,

    trendScore,

    slope20,

    slope60,

    bias20,

    bias60,

    atr:atrValue,

    range20,

    range60,

    pos,

    avgVol5,

    avgVol20,

    volToday,

    volRatio,

    volumeState

  };

}

    if(!exists){

      result.push({
        ...item,
        price
      });

    }

  }

  return result;

}


/* =========================================================
   價格候選排序
   ========================================================= */

function sortCandidates(
  list,
  currentPrice,
  direction
){

  return [...list]
    .filter(
      x=>
        x &&
        x.price!=null &&
        (
          direction==="support"
            ? x.price<currentPrice
            : x.price>currentPrice
        )
    )
    .sort(
      (a,b)=>
        direction==="support"
          ? b.price-a.price
          : a.price-b.price
    );

}


/* =========================================================
   動態波動容許範圍
   不使用固定百分比
   ========================================================= */

function levelTolerance(
  rows,
  price
){

  const atrValue =
    atr(
      rows,
      14
    );

  const closesArr =
    closes(rows)
      .slice(-60);

  const deviation =
    stdev(
      closesArr
    );

  const values=[
    atrValue!=null
      ? atrValue*0.45
      : null,

    deviation!=null
      ? deviation*0.18
      : null
  ].filter(
    v=>v!=null && v>0
  );

  if(!values.length){

    return Math.max(
      Math.abs(price||0)*0.01,
      0.01
    );

  }

  return Math.max(
    ...values
  );

}


/* =========================================================
   支撐／壓力候選
   ========================================================= */

function buildLevelCandidates(
  rows,
  price
){

  const data =
    sorted(rows);

  const result=[];

  /*
   * 1. 局部高低點
   */

  const extremes =
    localExtremes(
      data,
      2
    );

  extremes.lows.forEach(x=>{

    result.push({

      price:x.price,

      type:"support",

      source:"局部低點",

      date:x.date,

      volume:x.volume

    });

  });

  extremes.highs.forEach(x=>{

    result.push({

      price:x.price,

      type:"resistance",

      source:"局部高點",

      date:x.date,

      volume:x.volume

    });

  });


  /*
   * 2. 均線
   */

  const ma5 =
    sma(data,5);

  const ma20 =
    sma(data,20);

  const ma60 =
    sma(data,60);

  const ma120 =
    sma(data,120);

  [
    {
      price:ma5,
      source:"MA5"
    },
    {
      price:ma20,
      source:"MA20"
    },
    {
      price:ma60,
      source:"MA60"
    },
    {
      price:ma120,
      source:"MA120"
    }
  ].forEach(x=>{

    if(x.price==null){
      return;
    }

    result.push({

      price:x.price,

      type:
        x.price<price
          ? "support"
          : "resistance",

      source:x.source,

      date:null,

      volume:0

    });

  });


  /*
   * 3. 60日高低
   */

  const range60 =
    recentRange(
      data,
      60
    );

  if(range60.low!=null){

    result.push({

      price:range60.low,

      type:"support",

      source:"60日區間低點",

      date:null,

      volume:0

    });

  }

  if(range60.high!=null){

    result.push({

      price:range60.high,

      type:"resistance",

      source:"60日區間高點",

      date:null,

      volume:0

    });

  }


  /*
   * 4. 量價密集區
   */

  const profile =
    volumeProfile(
      data,
      24
    );

  profile
    .slice(0,8)
    .forEach(x=>{

      if(x.price==null){
        return;
      }

      result.push({

        price:x.price,

        type:
          x.price<price
            ? "support"
            : "resistance",

        source:"量價密集區",

        date:null,

        volume:x.volume,

        profileLow:x.low,

        profileHigh:x.high

      });

    });


  return uniquePriceCandidates(
    result
  );

}


/* =========================================================
   候選點位聚類
   將非常接近的實際價位合併
   ========================================================= */

function clusterLevels(
  candidates,
  tolerance
){

  const list =
    [...candidates]
      .filter(
        x=>
          x &&
          x.price!=null
      )
      .sort(
        (a,b)=>
          a.price-b.price
      );

  const groups=[];

  for(const candidate of list){

    let group =
      groups.find(
        g=>
          Math.abs(
            candidate.price-g.center
          )
          <= tolerance
      );

    if(!group){

      group={
        items:[],
        center:candidate.price
      };

      groups.push(group);

    }

    group.items.push(
      candidate
    );

    group.center =
      avg(
        group.items.map(
          x=>x.price
        )
      );

  }


  return groups.map(
    group=>{

      const items =
        group.items;

      const sources =
        [
          ...new Set(
            items.map(
              x=>x.source
            )
          )
        ];

      const dates =
        items
          .map(x=>x.date)
          .filter(Boolean);

      const volume =
        items.reduce(
          (sum,x)=>
            sum+
            (
              n(x.volume)||0
            ),
          0
        );

      /*
       * 同一價格附近出現越多不同結構，
       * 支撐／壓力可信度越高。
       */

      let strength =
        items.length*2;

      if(
        sources.includes(
          "量價密集區"
        )
      ){

        strength+=2;

      }

      if(
        sources.includes(
          "局部低點"
        ) ||
        sources.includes(
          "局部高點"
        )
      ){

        strength+=2;

      }

      if(
        sources.some(
          x=>
            /^MA/.test(x)
        )
      ){

        strength+=1;

      }

      return {

        price:
          group.center,

        items,

        sources,

        dates,

        volume,

        strength

      };

    }
  );

}


/* =========================================================
   點位原因
   ========================================================= */

function levelReason(
  group,
  type
){

  if(!group){

    return "資料不足";

  }

  const source =
    group.sources || [];

  const reasons=[];

  if(
    source.includes(
      type==="support"
        ? "局部低點"
        : "局部高點"
    )
  ){

    reasons.push(
      type==="support"
        ? "近期實際低點"
        : "近期實際高點"
    );

  }

  if(
    source.includes(
      "量價密集區"
    )
  ){

    reasons.push(
      "量價密集區"
    );

  }

  const maSources =
    source.filter(
      x=>/^MA/.test(x)
    );

  if(maSources.length){

    reasons.push(
      maSources.join("／")
    );

  }

  if(
    source.includes(
      type==="support"
        ? "60日區間低點"
        : "60日區間高點"
    )
  ){

    reasons.push(
      type==="support"
        ? "60日區間低點"
        : "60日區間高點"
    );

  }

  if(!reasons.length){

    reasons.push(
      "實際歷史價格結構"
    );

  }

  return reasons.join("＋");

}


/* =========================================================
   建立點位區間
   ========================================================= */

function makeLevelBand(
  group,
  rows,
  type,
  price
){

  if(!group){

    return null;

  }

  const tolerance =
    levelTolerance(
      rows,
      price
    );

  /*
   * 區間不直接使用固定百分比。
   * 由 ATR、歷史波動與聚類結構決定。
   */

  const half =
    Math.max(
      tolerance,
      (
        group.items
          .map(
            x=>
              Math.abs(
                n(x.profileHigh)-
                n(x.profileLow)
              )||0
          )
          .filter(
            v=>v>0
          )[0] || 0
      )/2
    );

  const low =
    Math.max(
      0,
      group.price-half
    );

  const high =
    group.price+half;

  return {

    point:
      group.price,

    low,

    high,

    strength:
      group.strength,

    reason:
      levelReason(
        group,
        type
      ),

    sources:
      group.sources,

    distance:
      distanceText(
        price,
        group.price
      )

  };

}


/* =========================================================
   動態四大關卡
   ========================================================= */

function dynamicLevels(
  rows,
  price
){

  const current =
    n(price);

  if(
    current==null ||
    !Array.isArray(rows) ||
    rows.length<5
  ){

    return {

      s1:null,
      s2:null,
      r1:null,
      r2:null

    };

  }


  const candidates =
    buildLevelCandidates(
      rows,
      current
    );

  const tolerance =
    levelTolerance(
      rows,
      current
    );


  /*
   * 支撐候選
   */

  const supportCandidates =
    candidates.filter(
      x=>
        x.type==="support" &&
        x.price<current
    );

  /*
   * 壓力候選
   */

  const resistanceCandidates =
    candidates.filter(
      x=>
        x.type==="resistance" &&
        x.price>current
    );


  /*
   * 聚類
   */

  const supportGroups =
    clusterLevels(
      supportCandidates,
      tolerance
    )
    .sort(
      (a,b)=>
        b.price-a.price
    );

  const resistanceGroups =
    clusterLevels(
      resistanceCandidates,
      tolerance
    )
    .sort(
      (a,b)=>
        a.price-b.price
    );


  /*
   * 第一支撐
   */

  const s1Group =
    supportGroups[0] || null;

  /*
   * 第二支撐
   */

  const s2Group =
    supportGroups[1] || null;

  /*
   * 第一壓力
   */

  const r1Group =
    resistanceGroups[0] || null;

  /*
   * 第二壓力
   */

  const r2Group =
    resistanceGroups[1] || null;


  return {

    s1:
      makeLevelBand(
        s1Group,
        rows,
        "support",
        current
      ),

    s2:
      makeLevelBand(
        s2Group,
        rows,
        "support",
        current
      ),

    r1:
      makeLevelBand(
        r1Group,
        rows,
        "resistance",
        current
      ),

    r2:
      makeLevelBand(
        r2Group,
        rows,
        "resistance",
        current
      )

  };

}


/* =========================================================
   回踩模型
   ========================================================= */

function retestModel(
  rows,
  price,
  levels
){

  const current =
    n(price);

  const r1 =
    levels?.r1;

  const s1 =
    levels?.s1;

  if(
    current==null
  ){

    return {

      state:"資料不足",

      detail:
        "沒有目前價格"

    };

  }

  /*
   * 已經接近第一壓力
   */

  if(
    r1 &&
    current>=r1.low &&
    current<=r1.high
  ){

    return {

      state:"壓力測試中",

      detail:
        "現價正在測試第一壓力區"

    };

  }


  /*
   * 突破後回到第一壓力附近
   */

  if(
    r1 &&
    current>r1.high &&
    current<=
      r1.high+
      levelTolerance(
        rows,
        current
      )
  ){

    return {

      state:"突破後回踩",

      detail:
        "價格位於第一壓力上方，正在測試突破有效性"

    };

  }


  /*
   * 接近第一支撐
   */

  if(
    s1 &&
    current>=s1.low &&
    current<=s1.high
  ){

    return {

      state:"支撐測試中",

      detail:
        "現價正在測試第一支撐區"

    };

  }


  return {

    state:"等待回踩",

    detail:
      "目前沒有進入主要支撐／壓力測試區"

  };

}


/* =========================================================
   突破模型
   ========================================================= */

function breakoutModel(
  rows,
  price,
  tech,
  levels
){

  const current =
    n(price);

  const r1 =
    levels?.r1;

  const latestRow =
    latest(rows);

  const todayHigh =
    n(latestRow?.high);

  const volume =
    volumeSignal(
      tech
    );

  const checks=[];


  /*
   * 壓力位置
   */

  const above =
    Boolean(
      r1 &&
      current>r1.high
    );

  const near =
    Boolean(
      r1 &&
      current>=r1.low &&
      current<=r1.high
    );


  checks.push({

    ok:above,

    text:
      r1
        ? above
          ? "現價已站上第一壓力區"
          : near
            ? "現價正在測試第一壓力區"
            : "尚未站上第一壓力區"
        : "第一壓力資料不足"

  });


  /*
   * 成交量
   */

  const volumeOK =
    Boolean(
      volume.ratio!=null &&
      volume.ratio>=1.2
    );

  checks.push({

    ok:volumeOK,

    text:
      volume.ratio==null
        ? "成交量資料不足"
        : volumeOK
          ? `量能 ${volume.ratio.toFixed(2)} 倍`
          : `量能 ${volume.ratio.toFixed(2)} 倍，尚未明顯放量`

  });


  /*
   * 收盤是否靠近當日高點
   */

  const closeNearHigh =
    Boolean(
      todayHigh!=null &&
      current!=null &&
      todayHigh>0 &&
      (
        (todayHigh-current) /
        todayHigh
      ) <= 0.015
    );

  checks.push({

    ok:closeNearHigh,

    text:
      closeNearHigh
        ? "價格位於當日高點附近"
        : "尚未明顯靠近當日高點"

  });


  /*
   * 趨勢
   */

  const trendOK =
    tech?.trend==="偏多";

  checks.push({

    ok:trendOK,

    text:
      trendOK
        ? "均線結構偏多"
        : `均線結構：${tech?.trend||"資料不足"}`

  });


  let stateText =
    "觀察";

  if(
    above &&
    volumeOK &&
    closeNearHigh &&
    trendOK
  ){

    stateText =
      "突破確認中";

  }else if(
    near &&
    (
      volumeOK ||
      trendOK
    )
  ){

    stateText =
      "突破前觀察";

  }else if(
    above
  ){

    stateText =
      "已越過壓力";

  }


  const confirmed =
    Boolean(
      above &&
      volumeOK
    );

  const ready =
    Boolean(
      !confirmed &&
      near &&
      (
        volumeOK ||
        trendOK
      )
    );


  return {

    state:
      stateText,

    checks,

    confirmed,

    ready

  };

}


/* =========================================================
   異常模型
   ========================================================= */

function anomalyModel(
  rows,
  tech,
  price
){

  const items=[];

  const ratio =
    tech?.volRatio;

  const slope20 =
    tech?.slope20;

  const bias20 =
    tech?.bias20;

  /*
   * 異常放量
   */

  if(
    ratio!=null &&
    ratio>=2
  ){

    items.push(
      `成交量約為20日均量 ${ratio.toFixed(2)} 倍`
    );

  }


  /*
   * 價量背離提醒
   */

  if(
    ratio!=null &&
    ratio<=0.55 &&
    slope20!=null &&
    slope20>2
  ){

    items.push(
      "價格上行但成交量明顯量縮"
    );

  }


  /*
   * 價格偏離 MA20
   */

  if(
    bias20!=null &&
    Math.abs(bias20)>=8
  ){

    items.push(
      `現價與MA20偏離 ${bias20.toFixed(2)}%`
    );

  }


  /*
   * 單日大波動
   */

  const last =
    latest(rows);

  const previous =
    rows?.length>=2
      ? rows[rows.length-2]
      : null;

  const lastClose =
    n(last?.close);

  const prevClose =
    n(previous?.close);

  if(
    lastClose!=null &&
    prevClose!=null &&
    prevClose!==0
  ){

    const dailyChange =
      (
        lastClose-prevClose
      ) /
      prevClose*100;

    if(
      Math.abs(dailyChange)>=7
    ){

      items.push(
        `單日價格變動 ${dailyChange>=0?"+":""}${dailyChange.toFixed(2)}%`
      );

    }

  }


  return {

    abnormal:
      items.length>0,

    items,

    label:
      items.length
        ? "偵測到異常"
        : "正常",

    reason:
      items.length
        ? items.join("；")
        : "目前未偵測到明顯異常"

  };

}


/* =========================================================
   進場／防守／止盈模型
   ========================================================= */

function entryModel(
  price,
  tech,
  levels,
  retest
){

  const current =
    n(price);

  const s1 =
    levels?.s1;

  const s2 =
    levels?.s2;

  const r1 =
    levels?.r1;

  const r2 =
    levels?.r2;


  let type =
    "等待結構";

  let entry =
    null;

  let defense =
    null;

  let tp1 =
    r1?.point ?? null;

  let tp2 =
    r2?.point ?? null;

  let note =
    "目前資料不足以形成明確進場結構";


  /*
   * 突破後回踩
   */

  if(
    retest?.state==="突破後回踩" &&
    s1
  ){

    type =
      "突破後回踩";

    entry =
      s1.point;

    defense =
      s1.low;

    note =
      "以實際支撐結構觀察回踩是否守住";

  }


  /*
   * 支撐測試
   */

  else if(
    retest?.state==="支撐測試中" &&
    s1
  ){

    type =
      "支撐區觀察";

    entry =
      s1.point;

    defense =
      s1.low;

    note =
      "等待支撐區出現止跌與量價確認";

  }


  /*
   * 突破前觀察
   */

  else if(
    r1 &&
    current!=null &&
    current>=r1.low &&
    current<=r1.high
  ){

    type =
      "壓力突破觀察";

    entry =
      r1.high;

    defense =
      r1.point;

    note =
      "等待實際壓力區被有效突破";

  }


  /*
   * 價格位於第一支撐與第一壓力之間
   */

  else if(
    s1 &&
    r1
  ){

    type =
      "區間等待";

    entry =
      s1.point;

    defense =
      s1.low;

    note =
      "目前位於支撐與壓力之間，等待更好的價格結構";

  }


  /*
   * 如果第一支撐不存在，
   * 使用第二支撐作為結構參考。
   */

  else if(
    s2
  ){

    type =
      "支撐觀察";

    entry =
      s2.point;

    defense =
      s2.low;

    note =
      "第一支撐資料不足，改以第二支撐結構觀察";

  }


  /*
   * 止盈沒有第一壓力時，
   * 不用固定百分比補數字。
   */

  if(
    tp1==null &&
    r2
  ){

    tp1 =
      r2.point;

  }

  if(
    tp2==null
  ){

    tp2 =
      null;

  }


  return {

    type,

    entry,

    defense,

    tp1,

    tp2,

    note

  };

      ]);

      seq !== state.searchSeq
    ){

      return;

    }


    /*
     * 歷史行情不足
     */

    if(
      !Array.isArray(rows) ||
      !rows.length
    ){

      throw new Error(
        "歷史行情取得失敗"
      );

    }


    /*
     * 即時價格優先。
     * 如果即時行情沒有價格，
     * 才使用最新歷史收盤價。
     */

    const latestRow =
      latest(rows);

    const price =
      rt?.price ??
      latestRow?.close ??
      null;


    if(price==null){

      throw new Error(
        "目前沒有可用價格"
      );

    }


    /*
     * 建立完整分析資料
     */

    const data =
      buildData(
        info.code,
        info.name,
        price,
        rows,
        rt,
        law,
        val
      );


    /*
     * 儲存目前標的
     */

    state.currentStock =
      info;

    state.currentData =
      data;


    /*
     * 搜尋框同步
     */

    if(input){

      input.value =
        info.code;

    }


    /*
     * 清除候選
     */

    const searchResults =
      $("searchResults");

    if(searchResults){

      searchResults.innerHTML =
        "";

    }


    /*
     * 渲染
     */

    renderData(
      data
    );


    setStatus(
      `已更新 ${info.code} ${info.name}`
    );


    /*
     * 啟動即時價格更新
     */

    if(state.refreshTimer){

      clearInterval(
        state.refreshTimer
      );

    }

    state.refreshTimer =
      setInterval(
        refreshPrice,
        30000
      );


    /*
     * 自動移動到分析結果
     */

    if(result){

      setTimeout(
        ()=>{
          result.scrollIntoView({
            behavior:"smooth",
            block:"start"
          });
        },
        80
      );

    }


  }catch(error){

    console.error(
      "searchStock error:",
      error
    );


    setStatus(
      `載入失敗：${error.message || "未知錯誤"}`
    );


    if(result){

      result.innerHTML = `
        <div class="card notice">
          <b>目前無法取得完整行情資料。</b>
          <br><br>
          原因：
          ${esc(
            error.message ||
            "行情服務暫時無法使用"
          )}
          <br><br>
          請稍後重新搜尋。
          <br>
          程式不會使用固定價格冒充實際行情。
        </div>
      `;

    }

  }

}


/* =========================================================
   即時價格更新
   ========================================================= */

async function refreshPrice(){

  const current =
    state.currentData;

  if(!current){

    return;

  }


  try{

    const rt =
      await getRealtime(
        current.code
      );


    /*
     * 即時 API 暫時沒有資料，
     * 保留原分析，不清除畫面。
     */

    if(
      !rt ||
      rt.price==null
    ){

      return;

    }


    const price =
      rt.price;


    /*
     * 使用原本已取得的歷史資料，
     * 重新計算動態點位。
     */

    const rebuilt =
      buildData(
        current.code,
        current.name,
        price,
        current.rows,
        rt,
        current.law,
        current.val
      );


    state.currentData =
      rebuilt;


    /*
     * false：
     * 不重新觸發頁面捲動。
     */

    renderData(
      rebuilt,
      false
    );


    setStatus(
      `即時更新 ${current.code} ${current.name}`
    );


  }catch(error){

    /*
     * 即時更新失敗不清空原畫面。
     */

    console.warn(
      "refreshPrice error:",
      error
    );

  }

}


/* =========================================================
   單一股票掃描
   給突破掃描與推薦功能使用
   ========================================================= */

async function scanOne(code){

  try{

    const info =
      await loadStockInfo(
        code
      );


    const [
      rows,
      rt
    ] =
      await Promise.all([
        getPrices(code),
        getRealtime(code)
      ]);


    if(
      !Array.isArray(rows) ||
      !rows.length
    ){

      return null;

    }


    const latestRow =
      latest(rows);


    const price =
      rt?.price ??
      latestRow?.close ??
      null;


    if(price==null){

      return null;

    }


    /*
     * 技術分析
     */

    const tech =
      technical(
        rows,
        price
      );


    /*
     * 四大動態點位
     */

    const levels =
      dynamicLevels(
        rows,
        price
      );


    if(!levels){

      return null;

    }


    /*
     * 回踩
     */

    const retest =
      retestModel(
        rows,
        price,
        levels
      );


    /*
     * 突破
     */

    const breakout =
      breakoutModel(
        rows,
        price,
        tech,
        levels
      );


    /*
     * 量能
     */

    const volume =
      volumeSignal(
        tech
      );


    /*
     * 突破評分
     *
     * 這裡只是掃描條件分數，
     * 不是股票投資評級。
     */

    let score=0;


    if(
      breakout.confirmed
    ){

      score+=45;

    }else if(
      breakout.ready
    ){

      score+=30;

    }


    if(
      tech.trend==="偏多"
    ){

      score+=15;

    }


    if(
      volume.ratio!=null &&
      volume.ratio>=2
    ){

      score+=20;

    }else if(
      volume.ratio!=null &&
      volume.ratio>=1.25
    ){

      score+=12;

    }


    if(
      retest.state==="突破後回踩"
    ){

      score+=15;

    }


    /*
     * 距離第一壓力
     */

    let pressureDistance =
      null;

    if(
      levels.r1
    ){

      pressureDistance =
        Math.abs(
          price-
          levels.r1.point
        );

    }


    return {

      code,

      name:
        info.name,

      price,

      score,

      level:
        levels.r1?.point ??
        null,

      levels,

      tech,

      breakout,

      retest,

      volume,

      pressureDistance

    };


  }catch(error){

    console.warn(
      "scanOne error:",
      code,
      error
    );

    return null;

  }

}


/* =========================================================
   突破掃描
   ========================================================= */

async function scanBreakout(){

  const seq =
    ++state.scanSeq;

  const box =
    $("scanResult");

  const button =
    $("breakScanBtn");


  if(!box){

    return;

  }


  if(button){

    button.disabled=true;

    button.innerHTML=
      "⏳ 掃描中…";

  }


  box.innerHTML = `
    <div class="loadingBox">
      正在掃描實際行情…
      <div class="progress">
        <i></i>
      </div>
    </div>
  `;


  try{

    const output=[];


    for(
      const code of SCAN_CODES
    ){

      /*
       * 如果使用者已經開始
       * 新一輪掃描，
       * 取消舊掃描。
       */

      if(
        seq !== state.scanSeq
      ){

        return;

      }


      const data =
        await scanOne(
          code
        );


      if(data){

        /*
         * 只保留：
         *
         * 突破
         * 接近突破
         * 偏多＋量能
         */

        const shouldShow =
          data.breakout?.confirmed ||
          data.breakout?.ready ||
          (
            data.tech?.trend==="偏多" &&
            (
              data.volume?.status==="明顯放量" ||
              data.volume?.status==="量能偏強"
            )
          );


        if(shouldShow){

          output.push(
            data
          );

        }

      }

    }


    /*
     * 依掃描分數排序。
     * 這只是程式內部排列，
     * 不代表投資排名。
     */

    output.sort(
      (a,b)=>
        b.score-a.score
    );


    if(!output.length){

      box.innerHTML = `
        <div class="notice">
          目前掃描清單中，
          沒有符合目前突破條件的標的。
          <br><br>
          可以稍後重新掃描。
        </div>
      `;

      return;

    }


    box.innerHTML =
      output
        .slice(0,8)
        .map(
          data=>{

            const stateText =
              data.breakout?.state ||
              "觀察";

            const volumeText =
              data.volume?.ratio==null
                ? "量比 —"
                : `量比 ${data.volume.ratio.toFixed(2)}x`;

            return `
              <button
                class="searchResult"
                data-scan-code="${esc(data.code)}"
              >
                <b>
                  ${esc(data.code)}
                  ${esc(data.name)}
                </b>

                <span>
                  ${esc(stateText)}
                  ｜${volumeText}
                  ｜現價 ${money(data.price)}
                </span>
              </button>
            `;

          }
        )
        .join("");


    /*
     * 點掃描結果直接進入完整分析。
     */

    box
      .querySelectorAll(
        "[data-scan-code]"
      )
      .forEach(button=>{

        button.addEventListener(
          "click",
          ()=>{

            const code =
              button.dataset.scanCode;

            const input =
              $("searchInput");

            if(input){

              input.value =
                code;

            }

            searchStock(
              code
            );

          }
        );

      });


  }catch(error){

    console.error(
      "scanBreakout error:",
      error
    );


    box.innerHTML = `
      <div class="notice">
        突破掃描暫時無法完成。
        <br><br>
        ${esc(
          error.message ||
          "行情服務暫時無法使用"
        )}
      </div>
    `;


  }finally{

    if(button){

      button.disabled=false;

      button.innerHTML=
        "🔎 開始動態掃描";

    }

  }

}

/* =========================================================
   功能按鈕
   ========================================================= */

async function runFeature(action){

  const table =
    $("recommendTable");

  if(!table){
    return;
  }

  table.innerHTML = `
    <div class="loadingBox">
      正在分析資料……
    </div>
  `;

  setStatus("正在分析…");

  try{

    const list = [];

    for(const code of SCAN_CODES){

      try{

        const d =
          await scanOne(code);

        if(d){
          list.push(d);
        }

      }catch(e){
        console.warn(
          "feature scan error",
          code,
          e
        );
      }
    }


    if(!list.length){

      table.innerHTML = `
        <div class="empty">
          暫時沒有取得可分析資料。
        </div>
      `;

      setStatus("資料取得失敗");
      return;
    }


    let data = list.slice();


    /* ---------- 最近 ---------- */

    if(action === "recent"){

      data.sort(function(a,b){

        const ta =
          a.updateTime || "";

        const tb =
          b.updateTime || "";

        return tb.localeCompare(ta);

      });

    }


    /* ---------- 長期 ---------- */

    else if(action === "long"){

      data.sort(function(a,b){

        const pa =
          n(a.tech && a.tech.ma20Bias) || 0;

        const pb =
          n(b.tech && b.tech.ma20Bias) || 0;

        return pb - pa;

      });

    }


    /* ---------- 熱門 ---------- */

    else if(action === "popular"){

      data.sort(function(a,b){

        const va =
          n(a.volumeSignal && a.volumeSignal.ratio)
          || 0;

        const vb =
          n(b.volumeSignal && b.volumeSignal.ratio)
          || 0;

        return vb - va;

      });

    }


    /* ---------- 法人 ---------- */

    else if(action === "institution"){

      data.sort(function(a,b){

        const getNet = function(x){

          const law =
            x.law || {};

          const f =
            law.foreign;

          const t =
            law.trust;

          const d =
            law.dealer;

          return (
            n(f && f.net) || 0
          ) + (
            n(t && t.net) || 0
          ) + (
            n(d && d.net) || 0
          );
        };

        return getNet(b) - getNet(a);

      });

    }


    /* ---------- 壓力 ---------- */

    else if(action === "pressure"){

      data.sort(function(a,b){

        const pa =
          n(
            a.levels &&
            a.levels.r1 &&
            a.levels.r1.distance
          );

        const pb =
          n(
            b.levels &&
            b.levels.r1 &&
            b.levels.r1.distance
          );

        return (
          (pa == null ? 999 : pa) -
          (pb == null ? 999 : pb)
        );

      });

    }


    /* ---------- 綜合分析 ---------- */

    else if(action === "analysis"){

      data.sort(function(a,b){

        const score = function(x){

          const t =
            x.tech || {};

          const bo =
            x.breakout || {};

          const vs =
            x.volumeSignal || {};

          let s =
            n(t.trendScore) || 0;

          if(bo.state === "已突破"){
            s += 20;
          }

          if(vs.state === "放量"){
            s += 10;
          }

          return s;
        };

        return score(b) - score(a);

      });

    }


    table.innerHTML = `

      <div class="recHead">

        <div>
          股票
        </div>

        <div>
          現價
        </div>

        <div>
          結構
        </div>

      </div>

      ${
        data
          .slice(0,10)
          .map(function(x){

            const trend =
              x.tech &&
              x.tech.trend
              ? x.tech.trend
              : "—";

            const price =
              x.price == null
                ? "—"
                : money(x.price);

            const breakout =
              x.breakout &&
              x.breakout.state
              ? x.breakout.state
              : "—";

            return `

              <div
                class="row"
                data-code="${esc(x.code)}"
              >

                <div class="recName">

                  ${esc(x.name)}

                  <div class="recSmall">
                    ${esc(x.code)}
                  </div>

                </div>

                <div>
                  ${price}
                </div>

                <div>

                  ${esc(trend)}

                  <div class="recSmall">
                    ${esc(breakout)}
                  </div>

                </div>

                <div class="arrow">
                  ›
                </div>

              </div>

            `;

          })
          .join("")
      }

    `;


    table
      .querySelectorAll("[data-code]")
      .forEach(function(el){

        el.addEventListener(
          "click",
          async function(){

            const code =
              el.dataset.code;

            await searchStock(code);

          }
        );

      });


    setStatus(
      `完成分析 ${data.length} 檔`
    );

  }catch(e){

    console.error(e);

    table.innerHTML = `
      <div class="empty">
        分析失敗，請稍後再試。
      </div>
    `;

    setStatus("分析失敗");
  }
}

function navAction(name){

  if(name === "home"){

    $("home")?.scrollIntoView({
      behavior:"smooth",
      block:"start"
    });

    return;
  }


  if(name === "watch"){

    $("recommendTable")?.scrollIntoView({
      behavior:"smooth",
      block:"start"
    });

    return;
  }


  if(name === "chip"){

    $("result")?.scrollIntoView({
      behavior:"smooth",
      block:"start"
    });

    return;
  }


  if(name === "industry"){

    $("recommendTable")?.scrollIntoView({
      behavior:"smooth",
      block:"start"
    });

    return;
  }


  if(name === "setting"){

    window.scrollTo({
      top:document.body.scrollHeight,
      behavior:"smooth"
    });

  }

}


/* =========================================================
   事件綁定
   ========================================================= */

let eventsBound = false;

function bindEvents(){

  if(eventsBound){
    return;
  }

  eventsBound = true;


  /* ---------- 搜尋 ---------- */

  const searchBtn =
    $("searchBtn");

  const searchInput =
    $("searchInput");


  if(searchBtn){

    searchBtn.addEventListener(
      "click",
      function(){

        const keyword =
          clean(
            searchInput
              ? searchInput.value
              : ""
          );

        if(keyword){
          searchStock(keyword);
        }

      }
    );

  }


  if(searchInput){

    searchInput.addEventListener(
      "keydown",
      function(e){

        if(e.key === "Enter"){

          e.preventDefault();

          const keyword =
            clean(
              searchInput.value
            );

          if(keyword){
            searchStock(keyword);
          }

        }

      }
    );


    searchInput.addEventListener(
      "input",
      function(){

        showSearchCandidates(
          searchInput.value
        );

      }
    );

  }


  /* ---------- 快速股票 ---------- */

  document
    .querySelectorAll("[data-code]")
    .forEach(function(btn){

      btn.addEventListener(
        "click",
        function(){

          const code =
            btn.dataset.code;

          if(code){
            searchStock(code);
          }

        }
      );

    });


  /* ---------- 功能 ---------- */

  document
    .querySelectorAll("[data-action]")
    .forEach(function(btn){

      btn.addEventListener(
        "click",
        function(){

          const action =
            btn.dataset.action;

          if(action){
            runFeature(action);
          }

        }
      );

    });


  /* ---------- 突破掃描 ---------- */

  const breakBtn =
    $("breakScanBtn");

  if(breakBtn){

    breakBtn.addEventListener(
      "click",
      function(){

        runBreakoutScan();

      }
    );

  }


  /* ---------- 底部導覽 ---------- */

  document
    .querySelectorAll("[data-nav]")
    .forEach(function(btn){

      btn.addEventListener(
        "click",
        function(){

          const nav =
            btn.dataset.nav;

          navAction(nav);

        }
      );

    });

}

let booted = false;

async function boot(){

  if(booted){
    return;
  }

  booted = true;

  bindEvents();

  setStatus(
    "V1491 已啟動｜等待搜尋股票"
  );

}

if(

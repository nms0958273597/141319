<script>
"use strict";

const MIS="https://mis.twse.com.tw/stock/api/getStockInfo.jsp";
const FINMIND="https://api.finmindtrade.com/api/v4/data";

const QUICK_STOCKS=[
{code:"2330",name:"台積電"},
{code:"2303",name:"聯電"},
{code:"2313",name:"華通"},
{code:"2367",name:"燿華"},
{code:"3481",name:"群創"},
{code:"2409",name:"友達"},
{code:"1326",name:"台化"},
{code:"2603",name:"長榮"},
{code:"2618",name:"長榮航"},
{code:"3324",name:"雙鴻"},
{code:"3491",name:"昇達科"},
{code:"8046",name:"南電"},
{code:"0050",name:"元大台灣50"},
{code:"0056",name:"元大高股息"},
{code:"00878",name:"國泰永續高股息"},
{code:"00919",name:"群益台灣精選高息"}
];

const KNOWN={
"2330":"台積電",
"2303":"聯電",
"2313":"華通",
"2367":"燿華",
"3481":"群創",
"2409":"友達",
"1326":"台化",
"2603":"長榮",
"2618":"長榮航",
"3324":"雙鴻",
"3491":"昇達科",
"8046":"南電",
"2308":"台達電",
"3711":"日月光投控",
"6244":"茂迪",
"6770":"力積電",
"0050":"元大台灣50",
"0056":"元大高股息",
"00878":"國泰永續高股息",
"00919":"群益台灣精選高息",
"00631L":"元大台灣50正2",
"00632R":"元大台灣50反1",
"00685L":"群益臺灣加權正2",
"00981A":"主動野村臺灣優選"
};

const ALIAS={
"台積":"2330",
"台積電":"2330",
"聯電":"2303",
"華通":"2313",
"燿華":"2367",
"群創":"3481",
"友達":"2409",
"台化":"1326",
"長榮":"2603",
"長榮航":"2618",
"雙鴻":"3324",
"昇達科":"3491",
"南電":"8046",
"台達":"2308",
"台達電":"2308",
"日月光":"3711",
"日月光投控":"3711",
"茂迪":"6244",
"力積電":"6770",
"元大台灣50":"0050",
"0050":"0050",
"元大高股息":"0056",
"0056":"0056",
"國泰永續高股息":"00878",
"00878":"00878",
"群益台灣精選高息":"00919",
"00919":"00919"
};

let currentCode="2330";
let currentData=null;
let autoTimer=null;

function $(id){
return document.getElementById(id);
}

function n(v){
const x=Number(v);
return Number.isFinite(x)?x:null;
}

function money(v,digits=2){
const x=n(v);
if(x===null)return"--";
return x.toLocaleString("zh-TW",{
minimumFractionDigits:digits,
maximumFractionDigits:digits
});
}

function integer(v){
const x=n(v);
if(x===null)return"--";
return Math.round(x).toLocaleString("zh-TW");
}

function pct(v,digits=2){
const x=n(v);
if(x===null)return"--";
return x.toFixed(digits)+"%";
}

function esc(v){
return String(v??"")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");
}

function setStatus(text,type=""){
const el=$("systemStatus");
if(!el)return;
el.textContent=text;
el.className="status"+(type?" "+type:"");
}

function normalizeCode(input){
let s=String(input??"")
.trim()
.toUpperCase();

if(ALIAS[s])return ALIAS[s];
if(KNOWN[s])return s;

s=s.replace(/\s+/g,"");

if(ALIAS[s])return ALIAS[s];

return s;
}

function stockName(code){
return KNOWN[code]||code;
}

function isETF(code){
return /^00\d{3,4}[A-Z]?$/.test(code);
}

function sleep(ms){
return new Promise(resolve=>setTimeout(resolve,ms));
}

async function fetchJSON(url,options={}){
const timeout=options.timeout||8000;
const controller=
typeof AbortController!=="undefined"
?new AbortController()
:null;

let timer=null;

try{
if(controller){
timer=setTimeout(
()=>controller.abort(),
timeout
);
}

const response=await fetch(
url,
{
cache:"no-store",
signal:controller?.signal
}
);

if(!response.ok){
throw new Error("HTTP "+response.status);
}

return await response.json();

}finally{
if(timer)clearTimeout(timer);
}
}

function parseNumber(v){
if(v===null||v===undefined||v==="")return null;

const s=String(v)
.replace(/,/g,"")
.replace(/--/g,"")
.trim();

if(!s)return null;

const x=Number(s);
return Number.isFinite(x)?x:null;
}

function parseRealtime(item){
if(!item)return null;

const price=
parseNumber(item.z)??parseNumber(item.p);

const open=parseNumber(item.o);
const high=parseNumber(item.h);
const low=parseNumber(item.l);
const yesterday=parseNumber(item.y);
const volume=parseNumber(item.v);

let change=null;

if(price!==null&&yesterday!==null){
change=price-yesterday;
}

let changePct=null;

if(
change!==null&&
yesterday!==null&&
yesterday!==0
){
changePct=change/yesterday*100;
}

return{
code:item.c||"",
name:item.n||"",
price,
open,
high,
low,
yesterday,
volume,
change,
changePct,
time:item.t||"",
market:item.ex||""
};
}

async function getRealtime(code){

const exchanges=isETF(code)
?["tse","otc"]
:["tse","otc"];

for(let i=0;i<exchanges.length;i++){

const exchange=exchanges[i];

const urls=[
MIS+"?ex_ch="+
encodeURIComponent(exchange+"_"+code+".tw")+
"&json=1&delay=0",

MIS+"?ex_ch="+
encodeURIComponent(exchange+"_"+code)+
"&json=1&delay=0"
];

for(let j=0;j<urls.length;j++){

try{

const result=
await fetchJSON(
urls[j],
{timeout:5000}
);

if(
result&&
Array.isArray(result.msgArray)&&
result.msgArray[0]
){

const parsed=
parseRealtime(
result.msgArray[0]
);

if(parsed){
parsed.marketState=result.ch||"";
return parsed;
}
}

}catch(error){
console.warn(
"realtime fetch failed",
code,
error
);
}

}
}

return null;
}

function dateObj(offsetDays=0){
const d=new Date();
d.setDate(d.getDate()-offsetDays);
return d;
}

function dateString(d){

const y=d.getFullYear();

const m=String(
d.getMonth()+1
).padStart(2,"0");

const day=String(
d.getDate()
).padStart(2,"0");

return`${y}-${m}-${day}`;
}

function getToday(){
return dateString(new Date());
}

function getStartDate(days){
return dateString(dateObj(days));
}

function rowDate(row){
return row.date||
row.Date||
row.TradeDate||
row.trade_date||
"";
}

function rowClose(row){
return parseNumber(
row.close??
row.Close??
row.close_price
);
}

function rowOpen(row){
return parseNumber(
row.open??
row.Open??
row.open_price
);
}

function rowHigh(row){
return parseNumber(
row.max??
row.high??
row.High??
row.high_price
);
}

function rowLow(row){
return parseNumber(
row.min??
row.low??
row.Low??
row.low_price
);
}

function rowVolume(row){
return parseNumber(
row.Trading_Volume??
row.volume??
row.Volume
);
}

function cleanRows(rows){

return rows
.map(row=>({
date:rowDate(row),
open:rowOpen(row),
high:rowHigh(row),
low:rowLow(row),
close:rowClose(row),
volume:rowVolume(row)
}))
.filter(r=>
r.date&&
r.close!==null
)
.sort(
(a,b)=>a.date.localeCompare(b.date)
);
}

function avg(values){

const arr=values.filter(
x=>x!==null&&Number.isFinite(x)
);

if(!arr.length)return null;

return arr.reduce(
(a,b)=>a+b,0
)/arr.length;
}

function sma(rows,period){

if(
!Array.isArray(rows)||
rows.length<period
)return null;

return avg(
rows.slice(-period).map(r=>r.close)
);
}

function highest(rows,period){

const arr=rows
.slice(-period)
.map(r=>r.high)
.filter(x=>x!==null);

return arr.length?Math.max(...arr):null;
}

function lowest(rows,period){

const arr=rows
.slice(-period)
.map(r=>r.low)
.filter(x=>x!==null);

return arr.length?Math.min(...arr):null;
}

function stddev(values){

const arr=values.filter(
x=>x!==null&&Number.isFinite(x)
);

if(arr.length<2)return null;

const mean=
arr.reduce((a,b)=>a+b,0)/arr.length;

const variance=
arr.reduce(
(sum,x)=>sum+Math.pow(x-mean,2),
0
)/arr.length;

return Math.sqrt(variance);
}

function rsi(rows,period=14){

if(rows.length<period+1)return null;

const closes=
rows.slice(-(period+1))
.map(r=>r.close);

let gain=0;
let loss=0;

for(let i=1;i<closes.length;i++){

const diff=closes[i]-closes[i-1];

if(diff>0)gain+=diff;
else loss+=Math.abs(diff);

}

gain/=period;
loss/=period;

if(loss===0)return 100;

const rs=gain/loss;

return 100-(100/(1+rs));
}

function macd(rows){

const closes=rows.map(r=>r.close);

if(closes.length<35){
return{
dif:null,
dea:null,
hist:null
};
}

function ema(arr,period){

if(arr.length<period)return null;

let e=avg(arr.slice(0,period));

const k=2/(period+1);

for(let i=period;i<arr.length;i++){
e=arr[i]*k+e*(1-k);
}

return e;
}

const ema12=ema(closes,12);
const ema26=ema(closes,26);

function pickTwo(list){

x.price-out[out.length-1].price
)/
out[out.length-1].price
>.015

}

});

return out.slice(0,2);
}

const sZones=

)

);

if(resistance2===null){

function foreignInsight(inst){

if(
!Array.isArray(inst)||
!inst.length
){

return{
foreign:0,
trust:0,
dealer:0,
total:0
};

}

const latest=
inst
.slice()
.sort(
(a,b)=>
String(
a.date||
a.TradeDate||
""
).localeCompare(
String(
b.date||
b.TradeDate||
""
)
)
);

const lastDate=
latest.at(-1)?.date||
latest.at(-1)?.TradeDate||
"";

const dayRows=
latest.filter(
x=>
(x.date||
x.TradeDate||
"")===lastDate
);

let foreign=0;
let trust=0;
let dealer=0;

dayRows.forEach(row=>{

String(
row.name||
row.InvestorType||
row.investor_type||
""
);

row.buy||
row.Buy||
row.buy_amount
)||0;

parseNumber(
row.sell||
row.Sell||
row.sell_amount
)||0;

const net=
parseNumber(
row.net||
row.Net
)??(
buy-sell
);

if(
name.includes("外資")||
name.includes("Foreign")
){

foreign+=net;

}else if(
name.includes("投信")||
name.includes("Investment")
){

trust+=net;

}else if(
name.includes("自營")||
name.includes("Dealer")
){

dealer+=net;

}

});

return{

foreign,
trust,
dealer,

total:
foreign+
trust+
dealer

};

}

""
);

row.Buy||
row.buy_amount
)||0;

parseNumber(
row.sell||
row.Sell||
row.sell_amount
)||0;

parseNumber(
row.net||
row.Net
)??(
buy-sell
);

if(

){

days[date].foreign+=net;

.sort(

);

}else if(

){

score+=10;

}else if(

score-=10;

){

score-=20;

if(
tech.rsi!==null
){

if(
tech.rsi>=55&&
tech.rsi<70
){

score+=8;

}

if(
tech.rsi>=75
){

score-=8;

}

if(
tech.rsi<35
){

score+=2;

}

if(
tech.rsi<45
){

score-=5;

}

}

if(
tech.macd.hist!==null
){

score+=
tech.macd.hist>0
?7
:-7;

}

if(
vol.ratio!==null
){

if(vol.ratio>=1.3){
score+=5;
}

if(vol.ratio>=2){
score-=4;
}

}

if(
inst.total>0
){

score+=5;

}else if(
inst.total<0
){

score-=5;

}

score=
Math.max(
0,
Math.min(
100,
score
)
);

let type="neutral";
let title="中性／觀察";

if(score>=70){

type="buy";
title="偏多";

}else if(score<=35){

type="risk";
title="偏弱";

}else if(score<50){

type="wait";
title="偏保守";

}

return{
score,
type,
title
};

}

);

:score>=55

:"neutral",

function pressureModel(
rows,
price,
inst,
realtime
){

const tech=
technical(
rows||[],
price,
realtime
);

const high=
realtime?.high??
tech.recentHigh;

const low=
realtime?.low??
tech.recentLow;

let pressure=50;

if(
price!==null&&
high!==null&&
high>price
){

const d=
(high-price)/
price*100;

if(d<2){

pressure+=20;

}else if(d<5){

pressure+=10;

}

}

if(
price!==null&&
low!==null&&
low<price
){

const d=
(price-low)/
price*100;

if(d<2){

pressure-=10;

}

}

const instScore=
inst?.total>0
?10
:inst?.total<0
?-10
:0;

pressure+=instScore;

pressure=
Math.max(
0,
Math.min(
100,
pressure
)
);

return{

score:pressure,

high,
low,

title:
pressure>=70
?"上方壓力明顯"
:pressure<=35
?"下方支撐較近"
:"壓力支撐均衡"

};

}

async function loadStockInfo(
  code=currentCode
){

  currentCode=
    normalizeCode(code);

  setStatus(
    `正在分析 ${currentCode}…`
  );

  const[
    realtime,
    priceRows,
    instRows,
    financialRows
  ]=
    await Promise.all([
      getRealtime(currentCode),
      getPrices(currentCode),
      getInstitutional(currentCode),
      getFinancial(currentCode)
    ]);

  const data=
    buildData(
      currentCode,
      realtime,
      priceRows,
      instRows,
      financialRows
    );

  renderData(data);

  return data;
}

async function searchStock(
  input
){

  const code=
    normalizeCode(input);

  if(!code){
    setStatus(
      "請輸入股票代號或名稱",
      "error"
    );
    return;
  }

  currentCode=code;

  try{

    await loadStockInfo(code);

  }catch(error){

    console.error(error);

    setStatus(
      "載入失敗："+error.message,
      "error"
    );

    const main=$("mainResult");

    if(main){

      main.innerHTML=`

<section class="card">

<div class="empty">

❌ 無法載入 ${esc(code)}

<div class="note" style="margin-top:8px">

請確認股票代號／ETF 代號，
或稍後重新整理。

</div>

</div>

</section>

`;

    }

  }
}

async function refreshCurrent(){

  if(!currentCode){

  try{

  }catch(error){

    setStatus(
      "更新失敗",
      "error"
    );

  }

}

async function scanBreakout(){

  const target=
    QUICK_STOCKS;

  const result=[];

  setStatus(
    "正在進行突破掃描…"
  );

  $("scanResult").innerHTML=`

<section class="card">

<div class="empty">
🚀 正在掃描 ${target.length} 檔…
</div>

</section>

`;

  for(
    let i=0;
    i<target.length;
    i++
  ){

    const item=target[i];

    try{

      const[
        realtime,
        priceRows
      ]=
      await Promise.all([
        getRealtime(item.code),
        getPrices(item.code)
      ]);

      const rows=
        cleanRows(
          priceRows
        );

      const price=
        realtime?.price??
        rows.at(-1)?.close??
        null;

      const tech=
        technical(
          rows,
          price,
          realtime
        );

      const lv=
        levels(
          price,
          tech,
          realtime
        );

      const vol=
        volumeInsight(
          rows,
          realtime
        );

      const model=
        breakoutModel(
          price,
          tech,
          lv,
          vol
        );

      result.push({

        ...item,

        price,

        score:
          model.score,

        title:
          model.title,

        type:
          model.type,

        breakout:
          lv.breakout

      });

    }catch(error){

      console.warn(
        "scan failed",
        item.code,
        error
      );

    }

  }

  result.sort(
    (a,b)=>
      b.score-a.score
  );

  $("scanResult").innerHTML=`

<section class="card">

<div class="cardTitle">

<h2>
🚀 突破掃描結果
</h2>

<span>
${result.length} 檔
</span>

</div>

<div class="scanGrid">

${
result.map(item=>`

<div
class="scanItem"
data-scan-code="${esc(item.code)}"
>

<div class="scanCode">

${esc(item.code)}
｜
${esc(item.name)}

</div>

<div class="scanPrice">

${money(item.price)}

</div>

<div class="scanScore">

突破分數：
<b>${Math.round(item.score)}</b>

</div>

<div class="small">

${esc(item.title)}

</div>

</div>

`).join("")
}

</div>

</section>

`;

  document
    .querySelectorAll(
      "[data-scan-code]"
    )
    .forEach(el=>{

      el.addEventListener(
        "click",
        ()=>{

          searchStock(
            el.dataset.scanCode
          );

          window.scrollTo({
            top:0,
            behavior:"smooth"
          });

        }
      );

      el.style.cursor="pointer";

    });

  setStatus(
    `突破掃描完成｜${result.length} 檔`,
    "ok"
  );

}

function bindEvents(){

  const input=
    $("stockSearch");

  const button=
    $("searchBtn");

  if(input){

    input.addEventListener(
      "keydown",
      event=>{

        if(event.key==="Enter"){

          event.preventDefault();

          searchStock(
            input.value
          );

        }

      }
    );

  }

  if(button){

    button.addEventListener(
      "click",
      ()=>{

        searchStock(
          input?.value||
          currentCode
        );

      }
    );

  }

  document
  .querySelectorAll(
    "[data-action]"
  )
  .forEach(button=>{

    button.addEventListener(
      "click",
      async()=>{

        const action=
          button.dataset.action;

        try{

          if(action==="refresh"){

            await refreshCurrent();

          }else if(action==="scan"){

            await scanBreakout();

          }else if(action==="structure"){

            document
            .getElementById(
              "structure"
            )
            ?.scrollIntoView({
              behavior:"smooth"
            });

          }else if(action==="institution"){

            document
            .getElementById(
              "institution"
            )
            ?.scrollIntoView({
              behavior:"smooth"
            });

          }else if(action==="fundamental"){

            document
            .getElementById(
              "fundamental"
            )
            ?.scrollIntoView({
              behavior:"smooth"
            });

          }else if(action==="risk"){

            document
            .getElementById(
              "risk"
            )
            ?.scrollIntoView({
              behavior:"smooth"
            });

          }

        }catch(error){

          console.error(
            error
          );

          setStatus(
            "操作失敗："+error.message,
            "error"
          );

        }

      }
    );

  });

  document
  .querySelectorAll(
    "[data-nav]"
  )
  .forEach(button=>{

    button.addEventListener(
      "click",
      ()=>{

        const target=
          button.dataset.nav;

        document
        .getElementById(
          target
        )
        ?.scrollIntoView({
          behavior:"smooth",
          block:"start"
        });

      }
    );

  });

}

async function updateMarket(){

  /*
    保留為獨立更新流程，
    避免市場狀態失敗影響主分析。
  */

  try{

    const rt=
      await getRealtime(
        currentCode
      );

    if(
      currentData&&
      rt
    ){

      currentData.realtime=
        rt;

      currentData.price=
        rt.price;

      const rows=
        currentData.rows||[];

      currentData.tech=
        technical(
          rows,
          rt.price,
          rt
        );

      currentData.levels=
        levels(
          rt.price,
          currentData.tech,
          rt
        );

      currentData.volume=
        volumeInsight(
          rows,
          rt
        );

      currentData.pressure=
        pressureModel(
          rows,
          rt.price,
          currentData.inst20,
          rt
        );

      renderData(
        currentData
      );

    }

  }catch(error){

    console.warn(
      "market update failed",
      error
    );

  }

}

function startAutoRefresh(){

  if(autoTimer){
    clearInterval(
      autoTimer
    );
  }

  /*
    每 60 秒更新一次，
    不使用過度頻繁的請求。
  */

  autoTimer=
    setInterval(
      ()=>{
        updateMarket();
      },
      60000
    );

}

function featureAction(
  action
){

  if(action==="refresh"){
    return refreshCurrent();
  }

  if(action==="scan"){
    return scanBreakout();
  }

  if(
    action==="structure"||
    action==="institution"||
    action==="fundamental"||
    action==="risk"
  ){

    document
      .getElementById(
        action
      )
      ?.scrollIntoView({
        behavior:"smooth"
      });

  }

}

function navClick(
  target
){

  document
    .getElementById(
      target
    )
    ?.scrollIntoView({
      behavior:"smooth"
    });

}

async function boot(){

  try{

    setStatus(
      "V1491 系統就緒",
      "ok"
    );

    updateQuickStocks();

    bindEvents();

    if(
      QUICK_STOCKS.length
    ){

      /*
        啟動時預設載入第一檔
        台積電。
      */

      await searchStock(
        QUICK_STOCKS[0].code
      );

    }

    updateMarket()
      .catch(
        error=>
          console.error(error)
      );

    startAutoRefresh();

  }catch(error){

    console.error(
      "V1491 boot error:",
      error
    );

    setStatus(
      "V1491 初始化異常",
      "error"
    );

    const main=
      $("mainResult");

    if(main){

      main.innerHTML=`

<section class="card">

<div class="empty">

❌ V1491 初始化失敗

<div
class="note"
style="margin-top:10px"
>

${esc(
  error?.message||
  String(error)
)}

</div>

</div>

</section>

`;

    }

  }

}

/*
  全域錯誤捕捉。

  如果 GitHub Pages、
  API 或瀏覽器環境發生錯誤，
  不會再無限停留在
  「系統初始化中」。
*/

window.addEventListener(
  "error",
  event=>{

    console.error(
      "V1491 global error:",
      event.error||event.message
    );

    const message=
      event.error?.message||
      event.message||
      "未知錯誤";

    setStatus(
      "V1491 發生錯誤",
      "error"
    );

    const box=
      $("mainResult");

    if(
      box&&
      !currentData
    ){

      box.innerHTML=`

<section class="card">

<div class="empty">

⚠️ V1491 執行錯誤

<div
class="note"
style="margin-top:8px"
>

${esc(message)}

</div>

</div>

</section>

`;

    }

  }
);

window.addEventListener(
  "unhandledrejection",
  event=>{

    console.error(
      "V1491 unhandled rejection:",
      event.reason
    );

    if(!currentData){

      setStatus(
        "V1491 載入異常",
        "error"
      );

    }

  }
);

/*
  啟動方式：

  1. DOM 尚未完成
     → 等待 DOMContentLoaded

  2. DOM 已經完成
     → 立即啟動

  避免 boot 沒有被執行。
*/

if(
  document.readyState==="loading"
){

  document.addEventListener(
    "DOMContentLoaded",
    boot,
    {once:true}
  );

}else{

  boot();

}

</script>

/* =========================================================
   基本工具
   ========================================================= */

const $ = id => document.getElementById(id);

function clean(v){
  return String(v ?? "")
    .trim()
    .replace(/\s+/g," ");
}

function n(v){
  if(v === null || v === undefined || v === "") return null;

  const x = Number(
    String(v)
      .replace(/,/g,"")
      .replace(/%/g,"")
      .trim()
  );

  return Number.isFinite(x) ? x : null;
}

function esc(v){
  return String(v ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function money(v,d=2){
  const x=n(v);
  if(x===null) return "—";

  return x.toLocaleString("zh-TW",{
    minimumFractionDigits:d,
    maximumFractionDigits:d
  });
}

function integer(v){
  const x=n(v);
  if(x===null) return "—";

  return Math.round(x).toLocaleString("zh-TW");
}

function pct(v,d=1){
  const x=n(v);
  if(x===null) return "—";
  return `${x.toFixed(d)}%`;
}

function pctChange(now,old){
  const a=n(now);
  const b=n(old);

  if(a===null || b===null || b===0) return null;

  return (a-b)/Math.abs(b)*100;
}

function priceText(v){
  const x=n(v);
  return x===null ? "—" : money(x,2);
}

function percentText(v){
  const x=n(v);
  return x===null ? "—" : `${x.toFixed(2)}%`;
}

function distanceText(level,price){
  const a=n(level);
  const b=n(price);

  if(a===null || b===null || b===0) return "—";

  const diff=a-b;
  const p=diff/Math.abs(b)*100;

  if(Math.abs(p)<0.01) return "現價附近";

  return `${diff>0?"+":""}${p.toFixed(2)}%`;
}

/* =========================================================
   日期
   ========================================================= */

function pad2(v){
  return String(v).padStart(2,"0");
}

function dateText(date){

  const d=date instanceof Date
    ? date
    : new Date(date);

  if(Number.isNaN(d.getTime())) return "";

  return [
    d.getFullYear(),
    pad2(d.getMonth()+1),
    pad2(d.getDate())
  ].join("-");

}

function today(){
  return dateText(new Date());
}

function dateShift(days){

  const d=new Date();

  d.setDate(d.getDate()+days);

  return dateText(d);

}


/* =========================================================
   HTTP
   ========================================================= */

async function fetchJSON(url,options={}){

  const controller =
    typeof AbortController !== "undefined"
      ? new AbortController()
      : null;

  let timer=null;

  if(controller){

    timer=setTimeout(()=>{
      controller.abort();
    },15000);

  }

  try{

    const response=await fetch(
      url,
      {
        ...options,
        signal:controller
          ? controller.signal
          : options.signal
      }
    );

    if(!response.ok){
      throw new Error(
        `HTTP ${response.status}`
      );
    }

    return await response.json();

  }catch(err){

    if(err?.name==="AbortError"){
      throw new Error("行情服務逾時");
    }

    throw err;

  }finally{

    if(timer) clearTimeout(timer);

  }

}


/* =========================================================
   FinMind
   ========================================================= */

async function finmind(dataset,params={}){

  const query=new URLSearchParams({

    dataset,

    ...params

  });

  const direct=
    `${FINMIND}?${query.toString()}`;

  const urls=[direct];

  PROXIES.forEach(proxy=>{

    urls.push(
      proxy+
      encodeURIComponent(direct)
    );

  });

  let lastError=null;

  for(const url of urls){

    try{

      const json=await fetchJSON(url);

      if(json?.data){

        return json.data;

      }

      if(Array.isArray(json)){

        return json;

      }

      if(json?.status===200){

        return json.data || [];

      }

    }catch(err){

      lastError=err;

    }

  }

  throw lastError ||
    new Error("FinMind 無資料");

}

function normalizeHistoryRow(row){

  if(!row) return null;

  const date=
    row.date ||
    row.Date ||
    row.datetime ||
    row.time ||
    "";

  const open=
    firstNumber(
      row.open,
      row.Open,
      row.open_price
    );

  const high=
    firstNumber(
      row.max,
      row.high,
      row.High,
      row.max_price
    );

  const low=
    firstNumber(
      row.min,
      row.low,
      row.Low,
      row.min_price
    );

  const close=
    firstNumber(
      row.close,
      row.Close,
      row.close_price
    );

  const volume=
    firstNumber(
      row.Trading_Volume,
      row.volume,
      row.Volume,
      row.trade_volume
    );

  if(!date && close===null){
    return null;
  }

  return {

    date:String(date).slice(0,10),

    open,
    high,
    low,
    close,
    volume,

    raw:row

  };

}

}/* =========================================================
   基礎資料處理
   ========================================================= */

function sorted(rows){

  return (rows || [])
    .filter(Boolean)
    .slice()
    .sort((a,b)=>
      String(a.date).localeCompare(String(b.date))
    );

}

function latest(rows){

  const arr=sorted(rows);

  return arr.length
    ? arr[arr.length-1]
    : null;

}

function closes(rows){

  return sorted(rows)
    .map(r=>n(r.close))
    .filter(v=>v!==null);

}

function sma(rows,period){

  const arr=closes(rows);

  if(arr.length<period) return null;

  const part=arr.slice(-period);

  return avg(part);

}

function avg(values){

  const arr=(values || [])
    .map(n)
    .filter(v=>v!==null);

  if(!arr.length) return null;

  return arr.reduce((a,b)=>a+b,0)/arr.length;

}

function avgVolume(rows,period=20){

  const arr=sorted(rows)
    .map(r=>n(r.volume))
    .filter(v=>v!==null);

  if(!arr.length) return null;

  return avg(arr.slice(-period));

}

function slope(values){

  const arr=(values || [])
    .map(n)
    .filter(v=>v!==null);

  if(arr.length<2) return null;

  const m=arr.length;
  const xAvg=(m-1)/2;
  const yAvg=avg(arr);

  let numerator=0;
  let denominator=0;

  arr.forEach((y,i)=>{

    const dx=i-xAvg;

    numerator+=dx*(y-yAvg);
    denominator+=dx*dx;

  });

  if(!denominator) return null;

  return numerator/denominator;

}

function bias(price,average){

  const p=n(price);
  const a=n(average);

  if(p===null || a===null || a===0) return null;

  return (p-a)/Math.abs(a)*100;

}

function rangeOf(values){

  const arr=(values || [])
    .map(n)
    .filter(v=>v!==null);

  if(!arr.length) return null;

  return {

    min:Math.min(...arr),

    max:Math.max(...arr)

  };

}

function clamp(v,min,max){

  return Math.min(
    max,
    Math.max(min,v)
  );

}

/* =========================================================
   統計
   ========================================================= */

function stdev(values){

  const arr=(values || [])
    .map(n)
    .filter(v=>v!==null);

  if(arr.length<2) return null;

  const mean=avg(arr);

  const variance=
    arr.reduce(
      (sum,v)=>
        sum+Math.pow(v-mean,2),
      0
    )/(arr.length-1);

  return Math.sqrt(variance);

}


/* =========================================================
   ATR
   ========================================================= */

function atr(rows,period=14){

  const arr=sorted(rows);

  if(arr.length<2) return null;

  const tr=[];

  for(let i=1;i<arr.length;i++){

    const cur=arr[i];
    const prev=arr[i-1];

    const high=n(cur.high);
    const low=n(cur.low);
    const prevClose=n(prev.close);

    if(
      high===null ||
      low===null ||
      prevClose===null
    ) continue;

    tr.push(
      Math.max(
        high-low,
        Math.abs(high-prevClose),
        Math.abs(low-prevClose)
      )
    );

  }

  if(!tr.length) return null;

  return avg(
    tr.slice(-period)
  );

}

function dailyRangeBaseline(rows,period=20){

    const high=n(r.high);
    const low=n(r.low);

    if(
      high!==null &&

  });

}


/* =========================================================
   近期高低點
   ========================================================= */

function recentRange(rows,period=60){

  const arr=sorted(rows)
    .slice(-period);

  const highs=arr
    .map(r=>n(r.high))
    .filter(v=>v!==null);

  const lows=arr
    .map(r=>n(r.low))
    .filter(v=>v!==null);

  if(!highs.length || !lows.length){

    return {

      high:null,
      low:null

    };

  }

  return {

    high:Math.max(...highs),

    low:Math.min(...lows)

  };

}


/* =========================================================
   區域性高低點
   ========================================================= */

function localExtremes(rows,lookback=3){

  const arr=sorted(rows);

  const supports=[];
  const resistances=[];

  for(
    let i=lookback;
    i<arr.length-lookback;
    i++
  ){

    const current=arr[i];

    const high=n(current.high);
    const low=n(current.low);

    if(high===null && low===null) continue;

    let localHigh=true;
    let localLow=true;

    for(
      let j=1;
      j<=lookback;
      j++
    ){

      const left=arr[i-j];
      const right=arr[i+j];

      if(
        high!==null &&
        (
          n(left.high)!==null &&
          n(left.high)>=high ||
          n(right.high)!==null &&
          n(right.high)>=high
        )
      ){

        localHigh=false;

      }

      if(
        low!==null &&
        (
          n(left.low)!==null &&
          n(left.low)<=low ||
          n(right.low)!==null &&
          n(right.low)<=low
        )
      ){

        localLow=false;

      }

    }

    if(localHigh){

      resistances.push({

        price:high,

        date:current.date,

        type:"localHigh"

      });

    }

    if(localLow){

      supports.push({

        price:low,

        date:current.date,

        type:"localLow"

      });

    }

  }

  return {

    supports,

    resistances

  };

}


/* =========================================================
   成交量價格密集區
   ========================================================= */

function volumeProfile(rows,period=60,bins=18){

  const arr=sorted(rows)
    .slice(-period);

  const prices=[];

  arr.forEach(r=>{

    const high=n(r.high);
    const low=n(r.low);
    const close=n(r.close);
    const volume=n(r.volume);

    if(
      close===null ||
      volume===null
    ) return;

    const base=
      high!==null &&
      low!==null
        ? (high+low+close)/3
        : close;

    prices.push({

      price:base,

      volume

    });

  });

  if(!prices.length) return [];

  const min=Math.min(
    ...prices.map(x=>x.price)
  );

  const max=Math.max(
    ...prices.map(x=>x.price)
  );

  if(min===max){

    return [{
      price:min,
      volume:avg(
        prices.map(x=>x.volume)
      )
    }];

  }

  const step=(max-min)/bins;

  const bucket=
    Array.from(
      {length:bins},
      ()=>({
        volume:0,
        count:0
      })
    );

  prices.forEach(item=>{

    let index=
      Math.floor(
        (item.price-min)/step
      );

    index=clamp(
      index,
      0,
      bins-1
    );

    bucket[index].volume+=item.volume;

    bucket[index].count++;

  });

  return bucket
    .map((b,i)=>({

      price:
        min+
        step*(i+.5),

      volume:b.volume,

      count:b.count

    }))
    .filter(x=>x.count>0);

}


/* =========================================================
   均線結構
   ========================================================= */

function movingAverageStructure(rows){

  const price=latest(rows)?.close ?? null;

  const ma5=sma(rows,5);
  const ma20=sma(rows,20);
  const ma60=sma(rows,60);
  const ma120=sma(rows,120);

  return {

    price,

    ma5,
    ma20,
    ma60,
    ma120,

    bias5:bias(price,ma5),
    bias20:bias(price,ma20),
    bias60:bias(price,ma60),
    bias120:bias(price,ma120),

    ma5Slope:slope(
      closes(rows).slice(-12)
    ),

    ma20Slope:slope(
      closes(rows).slice(-30)
    )

  };

}


/* =========================================================
   現價位置
   ========================================================= */

function pricePosition(rows,price){

  const range=recentRange(rows,60);

  if(
    range.high===null ||
    range.low===null ||
    n(price)===null ||
    range.high===range.low
  ){

    return {

      ratio:null,

      label:"資料不足"

    };

  }

  const ratio=
    (
      n(price)-range.low
    )/
    (
      range.high-range.low
    );

  const r=clamp(ratio,0,1);

  let label="中間區";

  if(r>=.8){
    label="高位區";
  }else if(r>=.6){
    label="偏高區";
  }else if(r<=.2){
    label="低位區";
  }else if(r<=.4){
    label="偏低區";
  }

  return {

    ratio:r,

    label

  };

}


/* =========================================================
   技術面
   ========================================================= */

function technical(rows,price){

  const ma=
    movingAverageStructure(rows);

  const pos=
    pricePosition(rows,price);

  const s20=ma.ma20Slope;
  const s60=slope(
    closes(rows).slice(-60)
  );

  let trend="震盪";

  if(
    ma.ma5!==null &&
    ma.ma20!==null &&
    ma.ma60!==null
  ){

    if(
      price>ma.ma20 &&
      ma.ma20>ma.ma60 &&
      (s20===null || s20>=0)
    ){

      trend="偏多";

    }else if(
      price<ma.ma20 &&
      ma.ma20<ma.ma60 &&
      (s20===null || s20<=0)
    ){

      trend="偏空";

    }

  }

  if(
    s60!==null &&
    ma.ma20!==null &&
    ma.ma60!==null
  ){

    if(
      s60>0 &&
      ma.ma20>=ma.ma60
    ){

      trend="偏多";

    }

    if(
      s60<0 &&
      ma.ma20<=ma.ma60
    ){

      trend="偏空";

    }

  }

  return {

    ...ma,

    position:pos,

    trend,

    longSlope:s60

  };

}


/* =========================================================
   成交量訊號
   ========================================================= */

function volumeSignal(rows){

  const arr=sorted(rows);

  const latestRow=
    latest(arr);

  if(!latestRow){

    return {

      current:null,

      average:null,

      ratio:null,

      state:"資料不足"

    };

  }

  const current=
    n(latestRow.volume);

  const average=
    avgVolume(arr,20);

  if(
    current===null ||
    average===null ||
    average===0
  ){

    return {

      current,

      average,

      ratio:null,

      state:"資料不足"

    };

  }

  const ratio=
    current/average;

  let state="正常";

  if(ratio>=2){
    state="明顯放量";
  }else if(ratio>=1.3){
    state="溫和放量";
  }else if(ratio<=.6){
    state="明顯縮量";
  }else if(ratio<=.85){
    state="偏縮量";
  }

  return {

    current,

    average,

    ratio,

    state

  };

}


/* =========================================================
   位置標籤
   ========================================================= */

function positionLabel(price,level,type){

  const p=n(price);
  const l=n(level);

  if(p===null || l===null){

    return "—";

  }

  if(type==="support"){

    if(p>l) return "現價上方支撐";
    if(Math.abs(p-l)<0.000001) return "現價附近";
    return "已跌破參考";

  }

  if(type==="resistance"){

    if(p<l) return "現價上方壓力";
    if(Math.abs(p-l)<0.000001) return "現價附近";
    return "已站上參考";

  }

  return "—";

}/* =========================================================
   動態點位引擎
   ========================================================= */

function uniquePriceCandidates(items){

  const map=new Map();

  (items || []).forEach(item=>{

    const price=n(item?.price);

    if(price===null || price<=0) return;

    const key=price.toFixed(6);

    if(!map.has(key)){

      map.set(key,{
        ...item,
        price
      });

    }

  });

  return [...map.values()];

}


/* =========================================================
   候選點位排序
   ========================================================= */

function sortCandidates(items,price,type){

  const p=n(price);

  if(p===null) return [];

  return uniquePriceCandidates(items)
    .filter(item=>{

      const x=n(item.price);

      if(x===null) return false;

      if(type==="support"){
        return x<p;
      }

      if(type==="resistance"){
        return x>p;
      }

      return true;

    })
    .sort((a,b)=>{

      if(type==="support"){

        return b.price-a.price;

      }

      if(type==="resistance"){

        return a.price-b.price;

      }

      return Math.abs(a.price-p)-
             Math.abs(b.price-p);

    });

}


/* =========================================================
   動態點位容許區間
   不使用固定股價百分比
   ========================================================= */

function levelTolerance(rows,price){

  const a=atr(rows,14);

  const d=
    dailyRangeBaseline(rows,20);

  const sd=
    stdev(
      closes(rows).slice(-60)
    );

  const values=[
    a!==null ? a*.45 : null,
    d!==null ? d*.55 : null,
    sd!==null ? sd*.18 : null
  ]
  .filter(v=>
    v!==null &&
    Number.isFinite(v) &&
    v>0
  );

  if(values.length){

    return Math.max(...values);

  }

  return null;

}


/* =========================================================
   建立動態候選支撐／壓力
   ========================================================= */

function buildLevelCandidates(rows,price){

  const arr=sorted(rows);

  const p=n(price);

  if(p===null || !arr.length){

    return {

      supports:[],
      resistances:[]

    };

  }

  const supports=[];
  const resistances=[];

  const ext=
    localExtremes(
      arr,
      3
    );

  ext.supports.forEach(x=>{

    supports.push({

      price:x.price,

      source:"近期局部低點",

      date:x.date,

      weight:3

    });

  });

  ext.resistances.forEach(x=>{

    resistances.push({

      price:x.price,

      source:"近期局部高點",

      date:x.date,

      weight:3

    });

  });


  /* -------------------------------------------------------
     均線
     ------------------------------------------------------- */

  const ma20=sma(arr,20);
  const ma60=sma(arr,60);
  const ma120=sma(arr,120);

  if(ma20!==null){

    if(ma20<p){

      supports.push({

        price:ma20,

        source:"20日均線",

        weight:2

      });

    }else if(ma20>p){

      resistances.push({

        price:ma20,

        source:"20日均線",

        weight:2

      });

    }

  }

  if(ma60!==null){

    if(ma60<p){

      supports.push({

        price:ma60,

        source:"60日均線",

        weight:2

      });

    }else if(ma60>p){

      resistances.push({

        price:ma60,

        source:"60日均線",

        weight:2

      });

    }

  }

  if(ma120!==null){

    if(ma120<p){

      supports.push({

        price:ma120,

        source:"120日均線",

        weight:1

      });

    }else if(ma120>p){

      resistances.push({

        price:ma120,

        source:"120日均線",

        weight:1

      });

    }

  }


  /* -------------------------------------------------------
     近期 60 日高低點
     ------------------------------------------------------- */

  const rr=
    recentRange(
      arr,
      60
    );

  if(rr.low!==null && rr.low<p){

    supports.push({

      price:rr.low,

      source:"60日低點",

      weight:4

    });

  }

  if(rr.high!==null && rr.high>p){

    resistances.push({

      price:rr.high,

      source:"60日高點",

      weight:4

    });

  }


  /* -------------------------------------------------------
     成交量價格密集區
     ------------------------------------------------------- */

  const profile=
    volumeProfile(
      arr,
      60,
      18
    );

  if(profile.length){

    const maxVol=
      Math.max(
        ...profile.map(x=>x.volume)
      );

    profile
      .filter(x=>
        maxVol>0 &&
        x.volume>=maxVol*.45
      )
      .forEach(x=>{

        if(x.price<p){

          supports.push({

            price:x.price,

            source:"成交量密集區",

            weight:2,

            volume:x.volume

          });

        }

        if(x.price>p){

          resistances.push({

            price:x.price,

            source:"成交量密集區",

            weight:2,

            volume:x.volume

          });

        }

      });

  }

  return {

    supports:
      uniquePriceCandidates(supports),

    resistances:
      uniquePriceCandidates(resistances)

  };

}


/* =========================================================
   點位群聚
   ========================================================= */

function clusterLevels(items,tolerance){

  const arr=
    uniquePriceCandidates(items)
      .sort((a,b)=>
        a.price-b.price
      );

  if(!arr.length){

    return [];

  }

  const groups=[];

  arr.forEach(item=>{

    const last=
      groups[groups.length-1];

    if(
      !last ||
      Math.abs(
        item.price-
        last.center
      )>tolerance
    ){

      groups.push({

        center:item.price,

        items:[item],

        weight:n(item.weight) || 1

      });

    }else{

      last.items.push(item);

      last.weight+=
        n(item.weight) || 1;

      const weighted=
        last.items.reduce(
          (sum,x)=>
            sum+
            x.price*
            (n(x.weight)||1),
          0
        );

      const total=
        last.items.reduce(
          (sum,x)=>
            sum+
            (n(x.weight)||1),
          0
        );

      last.center=
        total
          ? weighted/total
          : last.center;

    }

  });

  return groups
    .map(group=>{

      const prices=
        group.items
          .map(x=>x.price);

      return {

        center:group.center,

        low:Math.min(...prices),

        high:Math.max(...prices),

        weight:group.weight,

        items:group.items

      };

    });

}


/* =========================================================
   動態點位原因
   ========================================================= */

function levelReason(group,type){

  if(!group || !group.items?.length){

    return type==="support"
      ? "近期資料不足"
      : "近期資料不足";

  }

  const sources=
    [...new Set(
      group.items
        .map(x=>x.source)
        .filter(Boolean)
    )];

  if(sources.length>=2){

    return type==="support"
      ? `多項支撐重疊：${sources.slice(0,3).join("、")}`
      : `多項壓力重疊：${sources.slice(0,3).join("、")}`;

  }

  return sources[0] ||
    (
      type==="support"
        ? "近期價格結構"
        : "近期價格結構"
    );

}


/* =========================================================
   點位區間
   ========================================================= */

function makeLevelBand(group,tolerance,type){

  if(!group) return null;

  const center=n(group.center);

  if(center===null) return null;

  const low=
    Math.max(
      0,
      Math.min(
        n(group.low) ?? center,
        n(group.high) ?? center
      )-
      tolerance
    );

  const high=
    Math.max(
      n(group.low) ?? center,
      n(group.high) ?? center
    )+
    tolerance;

  return {

    type,

    price:center,

    low,

    high,

    reason:
      levelReason(
        group,
        type
      ),

    strength:
      group.weight || 1

  };

}


/* =========================================================
   四大動態點位
   ========================================================= */

function dynamicLevels(rows,price){

  const p=n(price);

  if(p===null){

    return {

      s1:null,
      s2:null,
      r1:null,
      r2:null,

      candidates:{
        supports:[],
        resistances:[]
      }

    };

  }

  const candidates=
    buildLevelCandidates(
      rows,
      p
    );

  const tolerance=
    levelTolerance(
      rows,
      p
    );

  if(tolerance===null){

    return {

      s1:null,
      s2:null,
      r1:null,
      r2:null,

      candidates

    };

  }

  const supportGroups=
    clusterLevels(
      candidates.supports,
      tolerance
    );

  const resistanceGroups=
    clusterLevels(
      candidates.resistances,
      tolerance
    );

  const supports=
    supportGroups
      .filter(g=>g.center<p)
      .sort((a,b)=>
        b.center-a.center
      );

  const resistances=
    resistanceGroups
      .filter(g=>g.center>p)
      .sort((a,b)=>
        a.center-b.center
      );

  const s1=
    makeLevelBand(
      supports[0],
      tolerance,
      "support"
    );

  const s2=
    makeLevelBand(
      supports[1],
      tolerance,
      "support"
    );

  const r1=
    makeLevelBand(
      resistances[0],
      tolerance,
      "resistance"
    );

  const r2=
    makeLevelBand(
      resistances[1],
      tolerance,
      "resistance"
    );

  return {

    s1,
    s2,
    r1,
    r2,

    tolerance,

    candidates

  };

}


/* =========================================================
   回踩模型
   ========================================================= */

function retestModel(rows,price,levels,volume){

  const p=n(price);

  if(p===null){

    return {

      state:"資料不足",

      detail:"沒有可用價格資料"

    };

  }

  const s1=
    levels?.s1?.price ?? null;

  const r1=
    levels?.r1?.price ?? null;

  const vr=
    volume?.ratio ?? null;

  if(
    s1!==null &&
    p>s1 &&
    vr!==null &&
    vr>=1
  ){

    return {

      state:"可觀察回踩",

      detail:
        "現價仍位於第一支撐上方，若量縮回測支撐後重新放量，可觀察承接。"

    };

  }

  if(
    r1!==null &&
    p<r1
  ){

    return {

      state:"等待突破後回踩",

      detail:
        "目前仍在第一壓力下方，突破後若回踩不破，可觀察結構確認。"

    };

  }

  return {

    state:"觀察",

    detail:
      "等待價格與成交量進一步確認。"

  };

}


/* =========================================================
   突破模型
   ========================================================= */

function breakoutModel(
  rows,
  price,
  levels,
  volume
){

  const p=n(price);

  const r1=
    levels?.r1?.price ?? null;

  const r2=
    levels?.r2?.price ?? null;

  const vr=
    volume?.ratio ?? null;

  const latestRow=
    latest(rows);

  const close=
    n(latestRow?.close);

  const high=
    n(latestRow?.high);

  if(
    p===null ||
    r1===null
  ){

    return {

      state:"資料不足",

      score:0,

      detail:"缺少有效壓力資料"

    };

  }

  const aboveR1=
    p>=r1;

  const nearHigh=
    high!==null &&
    close!==null &&
    high>=close;

  let score=0;

  const checks=[];

  if(aboveR1){

    score+=50;

    checks.push({
      label:"站上第一壓力",
      ok:true
    });

  }else{

    checks.push({
      label:"站上第一壓力",
      ok:false
    });

  }

  if(
    vr!==null &&
    vr>=1
  ){

    score+=25;

    checks.push({
      label:"成交量配合",
      ok:true
    });

  }else{

    checks.push({
      label:"成交量配合",
      ok:false
    });

  }

  if(nearHigh){

    score+=15;

    checks.push({
      label:"收盤接近當日高位",
      ok:true
    });

  }else{

    checks.push({
      label:"收盤接近當日高位",
      ok:false
    });

  }

  if(
    r2!==null &&
    p>=r2
  ){

    score+=10;

  }

  let state="等待突破";

  if(score>=75){

    state="突破確認";

  }else if(score>=50){

    state="接近突破";

  }else if(score>=25){

    state="突破觀察";

  }

  return {

    state,

    score,

    checks,

    detail:
      state==="突破確認"
        ? "價格已突破主要壓力結構，並有量價條件配合。"
        : "目前仍需觀察壓力突破與成交量確認。"

  };

}


/* =========================================================
   異常波動
   ========================================================= */

function anomalyModel(rows,price){

  const arr=sorted(rows);

  if(arr.length<10){

    return {

      state:"資料不足",

      detail:"歷史資料不足以判斷異常波動"

    };

  }

  const recent=arr.slice(-10);

  const changes=[];

  recent.forEach((r,i)=>{

    if(i===0) return;

    const prev=n(
      recent[i-1].close
    );

    const cur=n(r.close);

    if(
      prev!==null &&
      cur!==null &&
      prev!==0
    ){

      changes.push(
        Math.abs(
          (cur-prev)/prev*100
        )
      );

    }

  });

  const mean=avg(changes);

  const sd=stdev(changes);

  if(
    mean===null ||
    sd===null
  ){

    return {

      state:"正常觀察",

      detail:"波動資料不足"

    };

  }

  const latestChange=
    changes[changes.length-1] ?? null;

  if(
    latestChange!==null &&
    latestChange>mean+sd*2
  ){

    return {

      state:"波動放大",

      detail:
        "近期單日波動明顯高於自身近期平均，需留意風險。"

    };

  }

  return {

    state:"正常波動",

    detail:
      "近期價格波動仍在自身歷史範圍內。"

  };

}


/* =========================================================
   進場模型
   ========================================================= */

function entryModel(
  rows,
  price,
  levels,
  technicalData,
  volume
){

  const p=n(price);

  if(p===null){

    return {

      zone:null,

      entry:null,

      breakout:null,

      defense:null,

      tp1:null,

      tp2:null,

      state:"資料不足"

    };

  }

  const s1=
    levels?.s1?.price ?? null;

  const s2=
    levels?.s2?.price ?? null;

  const r1=
    levels?.r1?.price ?? null;

  const r2=
    levels?.r2?.price ?? null;

  const zoneLow=
    s2!==null
      ? s2
      : s1;

  const zoneHigh=
    s1!==null
      ? s1
      : null;

  let state="觀察";

  if(
    zoneLow!==null &&
    zoneHigh!==null &&
    p>=zoneLow &&
    p<=zoneHigh
  ){

    state="支撐區附近";

  }else if(
    r1!==null &&
    p<r1
  ){

    state="壓力前觀察";

  }else if(
    r1!==null &&
    p>=r1
  ){

    state="突破後觀察";

  }

  const entry=
    s1!==null
      ? s1
      : zoneLow;

  const defense=
    s2!==null
      ? s2
      : null;

  const tp1=
    r1!==null
      ? r1
      : null;

  const tp2=
    r2!==null
      ? r2
      : null;

  const breakout=
    r1!==null
      ? r1
      : null;

  return {

    state,

    zone:{
      low:zoneLow,
      high:zoneHigh
    },

    entry,

    breakout,

    defense,

    tp1,

    tp2,

    volumeRatio:
      volume?.ratio ?? null,

    trend:
      technicalData?.trend ??
      "資料不足"

  };

/* =========================================================
   法人資料標準化
   ========================================================= */

function normalizeInvestor(row){

  if(!row) return null;

  const name=
    String(
      row.name ||
      row.InvestorName ||
      row.investor_name ||
      row.investor ||
      ""
    ).trim();

  const buy=
    firstNumber(
      row.buy,
      row.Buy,
      row.buy_shares,
      row.BuyShares,
      row.BuyVolume
    );

  const sell=
    firstNumber(
      row.sell,
      row.Sell,
      row.sell_shares,
      row.SellShares,
      row.SellVolume
    );

  let net=
    firstNumber(
      row.net,
      row.Net,
      row.net_buy_sell,
      row.NetBuySell
    );

  if(
    net===null &&
    buy!==null &&
    sell!==null
  ){

    net=buy-sell;

  }

  return {

    name,

    buy,

    sell,

    net,

    date:
      row.date ||
      row.Date ||
      null,

    raw:row

  };

}


/* =========================================================
   法人單日資料
   ========================================================= */

function sumInstitutionDay(rows){

  const result=
    institutionBlank();

  if(!rows?.length){

    return result;

  }

  const investors=
    rows
      .map(normalizeInvestor)
      .filter(Boolean);

  const classify=(name)=>{

    const s=String(name || "");

    if(
      s.includes("外資") ||
      s.includes("Foreign")
    ){

      return "foreign";

    }

    if(
      s.includes("投信") ||
      s.includes("Investment")
    ){

      return "trust";

    }

    if(
      s.includes("自營商") ||
      s.includes("Dealer")
    ){

      return "dealer";

    }

    return null;

  };

  investors.forEach(item=>{

    const type=
      classify(item.name);

    if(!type) return;

    result[type]={

      buy:item.buy,

      sell:item.sell,

      net:item.net

    };

    result.hasData=true;

    if(item.date){

      result.date=item.date;

    }

  });

  const types=[
    "foreign",
    "trust",
    "dealer"
  ];

  const values=
    types
      .map(type=>result[type])
      .filter(x=>
        x &&
        (
          x.buy!==null ||
          x.sell!==null ||
          x.net!==null
        )
      );

  if(values.length){

    result.total={

      buy:
        values.every(x=>x.buy===null)
          ? null
          : values.reduce(
              (sum,x)=>
                sum+(x.buy ?? 0),
              0
            ),

      sell:
        values.every(x=>x.sell===null)
          ? null
          : values.reduce(
              (sum,x)=>
                sum+(x.sell ?? 0),
              0
            ),

      net:
        values.every(x=>x.net===null)
          ? null
          : values.reduce(
              (sum,x)=>
                sum+(x.net ?? 0),
              0
            )

    };

  }

  return result;

}


/* =========================================================
   取得三大法人
   ========================================================= */

async function getInstitution(code){

  const result=
    institutionBlank();

  try{

    const start=
      dateShift(-45);

    const data=
      await finmind(
        "TaiwanStockInstitutionalInvestorsBuySell",
        {
          data_id:code,
          start_date:start,
          end_date:today()
        }
      );

    if(!Array.isArray(data) || !data.length){

      return result;

    }

    const rows=
      data
        .map(normalizeInvestor)
        .filter(Boolean);

    if(!rows.length){

      return result;

    }

    const dates=
      [...new Set(
        rows
          .map(x=>x.date)
          .filter(Boolean)
      )]
      .sort();

    const latestDate=
      dates[dates.length-1];

    const latestRows=
      rows.filter(x=>
        !latestDate ||
        x.date===latestDate
      );

    return sumInstitutionDay(
      latestRows
    );

  }catch(err){

    return result;

  }

}

function institutionTrend(law){

  if(!institutionHasData(law)){

    return {

      state:"資料不足",

      detail:"目前沒有可用的三大法人資料"

    };

  }

  const values=[
    law.foreign?.net,
    law.trust?.net,
    law.dealer?.net
  ]
  .map(n)
  .filter(v=>v!==null);

  if(!values.length){

    return {

      state:"資料不足",

      detail:"法人資料沒有有效買賣超數值"

    };

  }

  const positive=
    values.filter(v=>v>0).length;

  const negative=
    values.filter(v=>v<0).length;

  if(positive>negative){

    return {

      state:"偏多",

      detail:
        `${positive} 類法人呈現淨買超`

    };

  }

  if(negative>positive){

    return {

      state:"偏空",

      detail:
        `${negative} 類法人呈現淨賣超`

    };

  }

  return {

    state:"分歧",

    detail:
      "三大法人買賣方向沒有形成一致結構"

  };

}


/* =========================================================
   建立完整分析資料
   ========================================================= */

function buildData(
  code,
  name,
  price,
  rows,
  rt,
  law,
  val
){

  const history=
    sorted(rows);

  const actualPrice=
    n(price) ??
    latest(history)?.close ??
    null;

  const tech=
    technical(
      history,
      actualPrice
    );

  const levels=
    dynamicLevels(
      history,
      actualPrice
    );

  const volume=
    volumeSignal(
      history
    );

  const retest=
    retestModel(
      history,
      actualPrice,
      levels,
      volume
    );

  const breakout=
    breakoutModel(
      history,
      actualPrice,
      levels,
      volume
    );

  const anomaly=
    anomalyModel(
      history,
      actualPrice
    );

  const entry=
    entryModel(
      history,
      actualPrice,
      levels,
      tech,
      volume
    );

  const lawTrend=
    institutionTrend(
      law
    );

  const range=
    recentRange(
      history,
      60
    );

  return {

    code,

    name,

    price:actualPrice,

    rows:history,

    realtime:rt,

    rt,

    law,

    valuation:val,

    val,

    tech,

    levels,

    lv:levels,

    volumeSignal:volume,

    volume,

    retest,

    breakout,

    anomaly,

    entry,

    lawTrend,

    range,

    updatedAt:
      new Date().toISOString()

  };

}


/* =========================================================
   載入股票資料
   ========================================================= */

async function loadStockInfo(code,name){

  const historicalPromise=
    getPrices(code);

  const realtimePromise=
    getRealtime(code);

  const institutionPromise=
    getInstitution(code);

  const valuationPromise=
    getValuation(code);

  const results=
    await Promise.allSettled([

      historicalPromise,

      realtimePromise,

      institutionPromise,

      valuationPromise

    ]);

  const rows=
    results[0].status==="fulfilled"
      ? results[0].value
      : [];

  const rt=
    results[1].status==="fulfilled"
      ? results[1].value
      : null;

  const law=
    results[2].status==="fulfilled"
      ? results[2].value
      : institutionBlank();

  const val=
    results[3].status==="fulfilled"
      ? results[3].value
      : {
          pe:null,
          pb:null,
          dividendYield:null,
          eps:null,
          roe:null,
          hasData:false
        };

  const price=
    rt?.price ??
    latest(rows)?.close ??
    null;

  if(!rows.length && price===null){

    throw new Error(
      "目前沒有取得有效行情資料"
    );

  }

  return buildData(
    code,
    name,
    price,
    rows,
    rt,
    law,
    val
  );

}


/* =========================================================
   找股票
   ========================================================= */

function findStock(query){

  const q=
    clean(query)
      .toLowerCase();

  if(!q) return null;

  if(ALIAS[q]){

    const code=ALIAS[q];

    return {

      code,

      name:
        KNOWN[code]?.name ||
        code

    };

  }

  const found=
    Object.entries(KNOWN)
      .find(([code,item])=>{

        const text=[
          code,
          item.name,
          ...(item.aliases || [])
        ]
        .join(" ")
        .toLowerCase();

        return text.includes(q);

      });

  if(!found) return null;

  return {

    code:found[0],

    name:
      found[1]?.name ||
      found[0]

  };

}/* =========================================================
   搜尋股票並分析
   ========================================================= */

async function searchStock(query){

  const found=findStock(query);

  if(!found){

    setStatus(
      `找不到「${esc(query)}」，請輸入正確的股票代號或名稱。`,
      "error"
    );

    return;

  }

  const code=found.code;
  const name=found.name;

  state.currentCode=code;
  state.loading=true;

  const result=$("result");

  if(result){

    result.innerHTML=`
      <section class="card loadingBox">

        <div>
          正在取得
          <b>${esc(code)} ${esc(name)}</b>
          的最新資料…
        </div>

        <div class="progress">
          <i></i>
        </div>

      </section>
    `;

  }

  setStatus(
    `<span class="dot"></span>正在分析 ${esc(code)} ${esc(name)}…`
  );

  try{

    const data=
      await loadStockInfo(
        code,
        name
      );

    state.currentData=data;

    renderData(data);

    setStatus(
      `<span class="dot"></span>${esc(code)} ${esc(name)} 分析完成`,
      "success"
    );

  }catch(err){

    console.error(err);

    state.currentData=null;

      result.innerHTML=`
        <section class="card">

          <div class="title">
            ⚠️ 資料取得失敗

            )}

          </div>

        </section>
      `;

    }

    setStatus(
      "行情資料取得失敗，請稍後再試。",
      "error"
    );

  }finally{

    state.loading=false;

  }

}


/* =========================================================
   即時價格更新
   ========================================================= */

async function refreshPrice(){

  const code=
    state.currentCode;

  if(!code) return;

  try{

    const rt=
      await getRealtime(code);

    if(!rt) return;

    const data=
      state.currentData;

    if(!data) return;

    const oldPrice=
      n(data.price);

    data.realtime=rt;
    data.rt=rt;
    data.price=
      n(rt.price) ??
      oldPrice;

    renderData(data);

  }catch(err){

    console.warn(
      "即時價格更新失敗",
      err
    );

  }

}


/* =========================================================
   單一股票掃描
   ========================================================= */

async function scanOne(code){

  const item=
    KNOWN[code];

  const name=
    item?.name ||
    code;

  try{

    const data=
      await loadStockInfo(
        code,
        name
      );

    if(
      !data ||
      data.price===null
    ){

      return {

        code,

        name,

        failed:true,

        reason:"沒有有效價格"

      };

    }

    const breakout=
      data.breakout || {};

    const volume=
      data.volumeSignal || {};

    const levels=
      data.levels || {};

    return {

      code,

      name,

      price:data.price,

      trend:
        data.tech?.trend ||
        "資料不足",

      breakout,

      volume,

      levels,

      entry:data.entry,

      retest:data.retest,

      score:
        n(breakout.score) ?? 0,

      failed:false

    };

  }catch(err){

    return {

      code,

      name,

      failed:true,

      reason:
        err?.message ||
        "行情資料取得失敗"

    };

  }

}


/* =========================================================
   動態突破掃描
   ========================================================= */

async function scanBreakout(){

  const button=
    $("breakScanBtn");

  const box=
    $("scanResult");

  if(!button || !box) return;

  if(state.loading){

    return;

  }

  state.loading=true;

  button.disabled=true;

  button.textContent=
    "⏳ 動態掃描中…";

  box.innerHTML=`
    <div class="loadingBox" style="grid-column:1/-1">

      正在逐批取得行情資料…

      <div class="progress">
        <i></i>
      </div>

    </div>
  `;

  setStatus(
    `<span class="dot"></span>正在掃描 ${SCAN_CODES.length} 檔標的…`
  );

  const results=[];
  const failed=[];

  try{

    /*
      每批 3 檔，避免一次送出大量請求。
    */

    for(
      let i=0;
      i<SCAN_CODES.length;
      i+=3
    ){

      const batch=
        SCAN_CODES.slice(
          i,
          i+3
        );

      const batchResults=
        await Promise.all(
          batch.map(code=>
            scanOne(code)
          )
        );

      batchResults.forEach(item=>{

        if(item?.failed){

          failed.push(item);

        }else if(item){

          results.push(item);

        }

      });

      box.innerHTML=`
        <div
          class="loadingBox"
          style="grid-column:1/-1"
        >
          已取得
          ${results.length}
          檔，失敗
          ${failed.length}
          檔

          <div class="progress">
            <i></i>
          </div>
        </div>
      `;

    }


    /* -------------------------------------------------------
       依突破分數排序
       注意：這只是掃描結果排序，
       不是投資推薦排名。
       ------------------------------------------------------- */

    results.sort((a,b)=>
      (b.score||0)-
      (a.score||0)
    );


    if(!results.length){

      const detail=
        failed
          .slice(0,6)
          .map(x=>
            `${esc(x.code)}：${esc(x.reason)}`
          )
          .join("<br>");

      box.innerHTML=`
        <div
          class="notice"

      setStatus(
        `掃描完成，但沒有成功取得有效行情資料。`,
        "error"
      );

    }


    /* -------------------------------------------------------
       顯示所有成功取得的動態結果
       ------------------------------------------------------- */

    box.innerHTML=
      results
        .slice(0,12)
        .map(item=>{

          const lv=
            item.levels || {};

          const entry=
            item.entry || {};

          const breakout=
            item.breakout || {};

          const volume=
            item.volume || {};

          const s1=
            lv.s1?.price;

          const s2=
            lv.s2?.price;

          const r1=
            lv.r1?.price;

          const r2=
            lv.r2?.price;

          const breakoutState=
            breakout.state ||
            "等待觀察";

          return `

            <button
              class="scanCard"
              data-code="${esc(item.code)}"
            >

              <div class="scanHead">

                <div>

                  <div class="scanName">
                    ${esc(item.name)}
                  </div>

                  <div class="scanCode">
                    ${esc(item.code)}
                  </div>

                </div>

                <div class="scanState">
                  ${esc(breakoutState)}
                </div>

              </div>


              <div class="scanPrice">
                ${priceText(item.price)}
              </div>


              <div class="scanLevels">

                <div class="scanLevel">

                  <div class="scanLevelLabel">
                    第一支撐
                  </div>

                  <div class="scanLevelValue green">
                    ${priceText(s1)}
                  </div>

                  <div class="scanMeta">
                    ${distanceText(
                      s1,

                    )}

                    第一壓力
                  </div>

                  <div class="scanLevelValue red">
                    ${priceText(r1)}
                  </div>

                  <div class="scanMeta">
                    ${distanceText(
                      r1,
                      item.price
                    )}
                  </div>

                </div>


                <div class="scanLevel">

                  <div class="scanLevelLabel">
                    第二壓力
                  </div>

                  <div class="scanLevelValue red">
                    ${priceText(r2)}
                  </div>

                  <div class="scanMeta">
                    ${distanceText(
                      r2,
                      item.price
                    )}
                  </div>

                </div>

              </div>


              <div class="scanMeta">

                趨勢：

/* =========================================================
   功能按鈕
   ========================================================= */

async function runFeature(action){

  state.featureMode=action;

  const result=$("recommendTable");

  if(!result) return;

  result.innerHTML=`
    <div class="loadingBox">
      正在取得動態資料…
      <div class="progress">
        <i></i>
      </div>
    </div>
  `;

  setStatus(
    `<span class="dot"></span>正在執行${esc(action)}分析…`
  );

  try{

    let codes=
      SCAN_CODES.slice();

    if(action==="popular"){

      codes=[
        "2330",
        "2317",
        "2308",
        "2303",
        "1326",
        "2606",
        "0050",
        "00919"
      ];

    }

    if(action==="long"){

      codes=[
        "2330",
        "2308",
        "2317",
        "0050",
        "0056",
        "00919"
      ];

    }

    if(action==="institution"){

      codes=[
        "2330",
        "2317",
        "2308",
        "2303",
        "1326",
        "2606",
        "2618",
        "2891"
      ];

    }

    if(action==="pressure"){

      codes=[
        "2330",
        "2317",
        "2308",
        "2303",
        "1326",
        "3481",
        "6770",
        "8046"
      ];

    }

    if(action==="analysis"){

      codes=[
        "2330",
        "2317",
        "2308",
        "2303",
        "1326",
        "2606",
        "2618",
        "3324"
      ];

    }

    const results=[];

    for(
      let i=0;
      i<codes.length;
      i+=3
    ){

      const batch=
        codes.slice(i,i+3);

      const data=
        await Promise.all(
          batch.map(code=>
            scanOne(code)
          )
        );

      data.forEach(item=>{

        if(
          item &&
          !item.failed
        ){

          results.push(item);

        }

      });

    }


    /* -------------------------------------------------------
       依功能調整顯示順序
       ------------------------------------------------------- */

    if(action==="pressure"){

      results.sort((a,b)=>{

        const ar1=
          a.levels?.r1?.price;

        const br1=
          b.levels?.r1?.price;

        if(
          ar1===null ||
          ar1===undefined
        ) return 1;

        if(
          br1===null ||
          br1===undefined
        ) return -1;

        return (
          Math.abs(
            ar1-a.price
          )-
          Math.abs(
            br1-b.price
          )
        );

      });

    }else if(action==="institution"){

      results.sort((a,b)=>{

        const an=
          n(a?.levels?.s1);

        const bn=
          n(b?.levels?.s1);

        return (
          (b.score||0)-
          (a.score||0)
        );

      });

    }else{

      results.sort((a,b)=>
        (b.score||0)-
        (a.score||0)
      );

    }


    if(!results.length){

      result.innerHTML=`
        <div class="empty">
          目前沒有成功取得資料。
        </div>
      `;

      setStatus(
        "功能分析沒有取得有效資料。",
        "error"
      );

      return;

    }


    result.innerHTML=`

      <div class="recHead">

        <div>標的</div>
        <div>現價</div>
        <div>第一壓力</div>
        <div>突破</div>

      </div>

      ${
        results
          .slice(0,12)
          .map(item=>{

            const r1=
              item.levels?.r1?.price;

            const breakoutState=
              item.breakout?.state ||
              "—";

            return `

              <button
                class="row"
                data-code="${esc(item.code)}"
              >

                <div>

                  <div class="recName">
                    ${esc(item.name)}
                  </div>

                  <div class="recSmall">
                    ${esc(item.code)}
                  </div>

                </div>

                <div>
                  ${priceText(item.price)}
                </div>

                <div class="red">
                  ${priceText(r1)}
                </div>

                <div class="arrow">
                  ${
                    breakoutState==="突破確認"
                      ? "✓"
                      : "→"
                  }
                </div>

              </button>

            `;

          })
          .join("")
      }

    `;

    setStatus(
      `分析完成：取得 ${results.length} 檔有效資料。`,
      "success"
    );

  }catch(err){

    console.error(err);

    result.innerHTML=`
      <div class="empty">
        ${esc(
          err?.message ||
          "資料取得失敗"
        )}
      </div>
    `;

    setStatus(
      "功能分析失敗。",
      "error"
    );

  }

}

/* =========================================================
   事件綁定
   ========================================================= */

let eventsBound=false;

function bindEvents(){

  if(eventsBound) return;

  eventsBound=true;


  /* -------------------------------------------------------
     搜尋按鈕
     ------------------------------------------------------- */

  const searchBtn=
    $("searchBtn");

  const searchInput=
    $("searchInput");

  if(searchBtn){

    searchBtn.addEventListener(
      "click",
      ()=>{

        searchStock(
          searchInput?.value || ""
        );

      }
    );

  }


  /* -------------------------------------------------------
     Enter 搜尋
     ------------------------------------------------------- */

  if(searchInput){

    searchInput.addEventListener(
      "keydown",
      event=>{

        if(event.key==="Enter"){

          event.preventDefault();

          searchStock(
            searchInput.value
          );

        }

      }
    );


    searchInput.addEventListener(
      "input",
      ()=>{

        clearTimeout(
          state.searchTimer
        );

        state.searchTimer=
          setTimeout(()=>{

            showSearchCandidates(
              searchInput.value
            );

          },120);

      }
    );

  }


  /* -------------------------------------------------------
     搜尋候選／股票按鈕
     ------------------------------------------------------- */

  document.addEventListener(
    "click",
    event=>{

      const codeButton=
        event.target.closest(
          "[data-code]"
        );

      if(codeButton){

        const code=
          codeButton.dataset.code;

        const item=
          KNOWN[code];

        if(searchInput){

          searchInput.value=
            code;

        }

        const results=
          $("searchResults");

        if(results){

          results.innerHTML="";

        }

        searchStock(
          code
        );

        return;

      }


      const actionButton=
        event.target.closest(
          "[data-action]"
        );

      if(actionButton){

        runFeature(
          actionButton.dataset.action
        );

        return;

      }


      const navButton=
        event.target.closest(
          "[data-nav]"
        );

      if(navButton){

        document
          .querySelectorAll(
            ".navBtn"
          )
          .forEach(btn=>
            btn.classList.remove(
              "active"
            )
          );

        navButton.classList.add(
          "active"
        );

        const nav=
          navButton.dataset.nav;

        if(nav==="home"){

          $("home")?.scrollIntoView({
            behavior:"smooth"
          });

        }else if(nav==="watch"){

          $("recommendTable")?.scrollIntoView({
            behavior:"smooth"
          });

        }else if(nav==="chip"){

          const current=
            $("result");

          current?.scrollIntoView({
            behavior:"smooth"
          });

        }else if(nav==="industry"){

          $("recommendTable")?.scrollIntoView({
            behavior:"smooth"
          });

        }else if(nav==="setting"){

          setStatus(
            "目前 V1491 使用動態行情計算，不設定固定股票價格。"
          );

        }

      }


      if(
        event.target.closest(
          "#breakScanBtn"
        )
      ){

        scanBreakout();

      }

    });


  /* -------------------------------------------------------
     突破掃描按鈕
     ------------------------------------------------------- */

  const scanButton=
    $("breakScanBtn");

  if(scanButton){

    scanButton.addEventListener(
      "click",
      event=>{

        event.preventDefault();

        scanBreakout();

      }
    );

  }

}


/* =========================================================

   ========================================================= */

boot();

</script>
